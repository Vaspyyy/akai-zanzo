    cast: [kubo]
    dialogue:
    - kubo: WHAT LABOR?

- page: 30
  title: After two
  location: harbor-station-night
  time: Sunday 10 p.m., then 2:30 a.m.
  continue_from: 29
  guards:
  - *station_dai
  - "Kubo (late 50s): grey work cap, grey work shirt BUTTONED UP."
