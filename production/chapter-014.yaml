# ================================================================== the father (memory)
- page: 43
  title: Silver balls
  location: hayama-genkan
  time: a night in 1985, memory, warm lamplight
  guards:
  - "These are MEMORY panels, years ago: soft grey borders, slightly softer screentone."
  - "The FATHER's FACE is NEVER shown: only his back, shoulders, hands, trouser legs and shoes, or a frame cropped at the chin."
  panels:
  - pos: top, large (more than half the page)
    action: "Memory, BIG: the same genkan years ago at night: a tall man in a rumpled light suit sitting on the genkan step with his BACK to us, taking his shoes off, shoulders shaking with laughter; standing up, three or four shiny silver steel balls spill from the turn-ups of his trousers and roll across the concrete into the corners by the door."
    cast: [{id: father, note: "from BEHIND, face never shown"}]
    captions:
    - OUR GENKAN. THE SAME CONCRETE AS NOW. MY FATHER SITTING ON THE STEP AT NIGHT TO TAKE HIS SHOES OFF, LAUGHING AT SOMETHING,
    - AND WHEN HE STOOD UP, SILVER BALLS CAME OUT OF THE TURN-UPS OF HIS TROUSERS AND RAN INTO THE CORNERS BY THE DOOR.
  - pos: middle-right
    action: "Memory: a small thin boy with long messy hair and a girl with a bob on hands and knees on the concrete, reaching into the corners after the rolling balls; the man's trouser legs and socks at the edge."
    cast: [{id: young_dai, note: "a little younger, about six"}, young_aya, {id: father, note: "only his trouser legs and socks"}]
    captions:
    - AYA AND I WENT AFTER THEM ON OUR HANDS AND KNEES.
  - pos: middle-left
    action: "Memory close: a small boy's palm holding three shiny silver pachinko balls."
    cast: [{id: young_dai, note: "only his small hand"}]
    captions:
    - THEY WERE HEAVIER THAN THEY LOOKED, AND COLD. HE'D LAUGH MORE WHEN WE FOUND THEM.
  - pos: bottom, wide
    location: hayama-apartment
    action: "Memory: under the kitchen sink, a cupboard door open, a glass jam jar half full of silver balls; a small boy's hand dropping one more in."
    cast: [{id: young_dai, note: "only his hand"}]
    sfx: [{text: karan, note: small}]
    captions:
    - I KEPT THEM IN A JAM JAR UNDER THE SINK, AND BY THE TIME I WAS EIGHT THERE WERE ENOUGH TO RATTLE.

- page: 44
  title: Good shoes
  location: hayama-genkan
  time: memory, evening in 1987, then the present at about 2:30 a.m.
  guards:
  - "Memory panels: soft grey borders. The father does not appear on this page."
  - *dry_night
  panels:
  - pos: top, wide
    action: "Memory: the steel door open only as far as its chain; through the gap two men in dark well-cut suits on the landing, polite; inside, a younger tired woman (hair still black, low bun) holding the door, and behind her the thin nine-year-old boy with long messy hair peering round the kitchen frame."
    cast: [{id: michiko, outfit: "a plain cardigan and skirt", note: "eight years younger, her hair all black"}, young_dai, debt_man]
    captions:
    - WHEN I WAS NINE THERE WERE TWO MEN AT THAT DOOR, IN GOOD SHOES. THEY WERE VERY POLITE. THEY ASKED FOR HIM BY HIS WHOLE NAME.
  - pos: middle-right
    action: "Memory close, low: two pairs of very polished black shoes on the concrete landing, seen through the chained gap of the door."
    captions:
    - {text: "MOM KEPT THE CHAIN ON AND SAID HE WASN'T HERE. ONE OF THEM SAID THAT WAS ALL RIGHT, THEY'D COME AGAIN.", box: [488, 500, 330, 160], draw: true}
    - {text: "THEY DID.", box: [800, 776, 200, 84], draw: true}
  - pos: middle-left
    action: "Memory: the cupboard under the kitchen sink, open and empty, dark. Silent."
    captions:
    - I DON'T KNOW WHAT HAPPENED TO THE JAR.
  - pos: lower, wide
    action: "Present, night, no moon: Dai small crossing a single freight rail track on a low hump of the harbor road under the lone crossing light; off to one side a dark lane ending at a pale fence."
    cast: [{<<: *dai_night, note: "small"}]
    captions:
    - I WENT OVER THE RAILS AND PAST THE END OF TANABE-SAN'S LANE, WHICH WAS DARK, THE FENCE AT THE BOTTOM JUST A PALER DARK.
  - pos: bottom, wide
    action: "Night, between tall dark grain silos: close on Dai's taped sneaker stepping on a shard of black plastic on the dark road."
    cast: [{<<: *dai_night, note: "only his foot"}]
    sfx: [{text: paki, note: small}]
    captions:
    - BETWEEN THE SILOS SOMETHING CRUNCHED UNDER MY SHOE. PLASTIC, OFF THE CORNER OF HIS BUMPER, I THOUGHT.

- page: 45
  title: Rubber in the cold
  location: silo-sbend-night
  time: Sunday about 2:40 a.m., no moon
  guards:
  - *night_dai
  - *dry_night
  panels:
  - pos: top, wide
    action: "Dai standing alone in the dark S-bend between the towering silos, a faint haze hanging in the air under one lamp."
    cast: [{<<: *dai_night, note: "small"}]
    captions:
    - TOO DARK TO SEE THE ROAD, BUT I COULD SMELL IT, RUBBER, STILL HANGING THERE IN THE COLD. I STOOD IN IT FOR A WHILE.
  - pos: middle-right
    action: "Close on Dai's face in the dark, unsure."
    cast: [*dai_night]
    captions:
    - IT DIDN'T TELL ME ANYTHING. IT COULD HAVE BEEN THE BACK TIRE. OR HIS FOOT, OR DIESEL OFF A FISH TRUCK, OR THE STARLET'S LIGHTS IN HIS MIRROR.
  - pos: middle-left
    action: "Dai looking down at his own feet on the dark asphalt."
    cast: [*dai_night]
    captions:
    - I'D ONLY SEEN THE FRONT.
  - pos: lower, wide
    location: bypass-footpath-night
    action: "Dai walking along the empty footpath beside the deserted elevated bypass under orange lamps."
    cast: [{<<: *dai_night, note: "small, from behind"}]
    captions:
    - UP ONTO THE FOOTPATH ALONG THE BYPASS, WHERE THE TRUCKS GO BY AT YOUR ELBOW IN THE DAYTIME AND NOTHING WENT BY NOW.
  - pos: bottom, wide
    location: bypass-overpass-night
    action: "The empty pedestrian overpass over the bypass curve at night, nobody on it."
    captions:
    - THE OVERPASS WAS EMPTY.

# ================================================================== the overpass, 5:30 a.m.
- page: 46
  title: Where I stand
  location: bypass-overpass-night
  time: Sunday nearly 3 a.m. (top), then 5:30 a.m. dawn (bottom)
  guards:
  - *night_dai
  - *dry_night
  panels:
  - pos: top, wide
    action: "Close on the overpass deck by the railing: eight or nine cigarette ends and a scatter of ash."
    captions:
    - BY THE RAILING OVER THE MIDDLE OF THE CURVE THERE WERE CIGARETTE ENDS, EIGHT OR NINE, AND ASH. THE LOOKOUT'S. HE'D BEEN STANDING WHERE I STAND.
  - pos: middle-right
    action: "Dai sitting on the walkway with his back against the tall railing, knees up, jacket zipped, one hand in the jacket pocket and the other in his jeans pocket."
    cast: [*dai_night]
    captions:
    - IT WAS NEARLY THREE. I SAT WITH MY BACK AGAINST THE RAILING, ONE HAND ON THE GLOVES AND THE OTHER ON THE MONEY.
  - pos: middle-left
