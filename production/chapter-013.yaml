chapter: 13
title: Twenty Yen
lettering: empty

# Reusable cast entries (YAML anchors). Free-text outfits use the character's default sheet.
x-cast:
  dai_home: &dai_home {id: dai_cut, outfit: "an old faded white long-sleeved T-shirt, worn jeans, white socks indoors"}
  dai_cap: &dai_cap {id: dai_cut, outfit: "grey zip-up gas-station work jacket half zipped over a black T-shirt, a small white NAME TAG on the chest, worn jeans, white canvas sneakers, and a NAVY work CAP with a small plain round emblem on the front (no letters)"}
  dai_bare: &dai_bare {id: dai_cut, outfit: "grey zip-up gas-station work jacket half zipped over a black T-shirt, a small white NAME TAG on the chest with HAYAMA handwritten on it in black marker, worn jeans, white canvas sneakers; BAREHEADED, no cap"}
  dai_jacket: &dai_jacket {id: dai_cut, outfit: "grey zip-up jacket half zipped over an old faded white T-shirt, worn jeans, beat-up white canvas sneakers, the right one held together with silver tape"}
  dai_gloves: &dai_gloves {id: dai_cut, outfit: "grey zip-up jacket zipped up over an old white T-shirt, worn jeans, white cotton work gloves, beat-up white canvas sneakers with FAT rubber soles, the right one wrapped in silver tape, the left one splitting at the toe"}
  dai_gak: &dai_gak {id: dai_cut, outfit: "black gakuran winter school uniform (stand collar open, worn carelessly), black trousers, white canvas sneakers"}
  sota_home: &sota_home {id: sota, outfit: "a long-sleeved striped T-shirt and shorts, socks, round glasses"}
  sota_out: &sota_out {id: sota, outfit: "a grey hooded sweatshirt, shorts, white socks, sneakers, round glasses"}
  mom: &mom {id: michiko, outfit: home}
  kazue: &kazue {id: ward_mother, outfit: cardigan}
  nobu_gak: &nobu_gak {id: nobu, outfit: "black gakuran winter school uniform, a little tight over his belly, the collar hook open, black trousers, a worn canvas shoulder bag"}
  aya_coat: &aya_coat {id: aya, outfit: "a plain light coat over her work blouse and dark trousers, a shoulder bag"}
  wreck_note: &wreck_note "The blue wreck's marks: faded grey paint, WHITE left front fender, matte primer hood, RIGHT pop-up headlight stuck half up, crushed rear with the trunk lid peaked, the old grey soft top torn above the LEFT (passenger) seat; it now stands level on plain rusty STEEL wheels with used tires. Right-hand drive."
  station_dai: &station_dai "Dai: SHORT black hair (forehead uncovered), grey station jacket with a small white name tag; his navy work cap ON."

defaults:
  orientation: portrait
  time: October 1995
  notes:
  - Right-to-left panel order. One speaker per panel. All cars are Japanese models sold by October 1995, right-hand drive.
  - No brand logos, no stickers, no readable signs or printed words anywhere unless a panel asks for them. No Japanese characters. No banknotes unless a panel asks for them.
  - Roomy panels with breathing space; vary shot sizes and poses; no two panels on the page may look alike.

pages:

# ================================================================== Thursday 19 Oct, evening: the kitchen
- page: 1
  title: Less than a can of coffee
  location: hayama-apartment
  time: Thursday evening in late October, about 7 p.m., dark outside, the kitchen tube light on
  guards:
  - "The toy car: a small BLUE Mini 4WD with a CLEAR plastic body and a pale lightning bolt, four flat WHITE rollers at the corners (see its sheet). It is a TOY, about as long as a hand."
  - "Dai: SHORT black hair, faded white long-sleeved T-shirt."
  panels:
  - pos: top, wide
    action: "Establishing: an aging 1970s concrete danchi apartment block at night, rows of identical balconies with laundry poles, a few lit kitchen windows, a streetlamp below."
    captions:
    - SOTA'S CAR WEIGHED LESS THAN A CAN OF COFFEE.
  - pos: upper-right
    action: "Close on an old round dial kitchen scale on the counter with the little blue toy car sitting on its dish; the needle at 118."
    cast: [{id: sota_car, camera: "three-quarter from above, sitting on the scale's dish"}]
    captions:
    - HE WEIGHED IT ON MOM'S KITCHEN SCALE. 118 GRAMS, WITH THE BATTERIES IN. A CAN OF COFFEE IS 190. IT SAYS SO ON THE CAN.
  - pos: upper-left
    action: "The tiny kitchen: Mom at the gas burner frying eggs in a pan, her back to us; at the low table Sota bent over his math homework writing a number on the back of the sheet with a pencil."
    cast: [*mom, *sota_home]
  - pos: middle, wide
    action: "Close on the low table: the little blue toy car standing between a sheet of homework and a soy-sauce bottle; Dai's finger pushing one of its front tires sideways; the wheel doesn't turn."
    cast: [{<<: *dai_home, note: "only his hand"}, {id: sota_car, camera: "low side view at table height, nose pointing RIGHT"}]
    captions:
    - BLUE, ABOUT AS LONG AS MY HAND. AYA HAD BOUGHT IT FOR HIM IN JUNE, FOR HIS BIRTHDAY, AND SAID SHE'D ONLY BOUGHT IT BECAUSE IT WAS ON SALE.
    - THE FRONT TIRES POINTED STRAIGHT AHEAD. I PUSHED THEM SIDEWAYS WITH MY FINGER. THEY DIDN'T GO.
  - pos: bottom-right
    action: "Sota looking up from his homework, eager, glasses glinting."
    cast: [*sota_home]
    dialogue:
    - sota: SATURDAY. TWO O'CLOCK. AT FUJITA'S. THERE'S A RACE.
  - pos: bottom-left
    action: "Dai sitting cross-legged at the low table, chin on his hand, one eyebrow up."
    cast: [*dai_home]
    dialogue:
    - dai_cut: FUJITA'S?

- page: 2
  title: Two o'clock
  location: hayama-apartment
  time: Thursday evening, about 7 p.m., dark outside, the kitchen tube light on
  panels:
  - pos: top-right
    action: "Sota pushing the little blue toy car along the low table with one finger, its tiny gears ticking."
    cast: [*sota_home, {id: sota_car, camera: "from above at a slant, rolling along the table under his finger"}]
    dialogue:
    - sota: THE HOBBY SHOP. OVER THE SHOE SHOP, IN THE COVERED STREET.
    - sota: IT'S A HUNDRED YEN TO GO IN. KEN SAYS YOU CAN'T WIN ANYTHING WITHOUT A TUNED MOTOR. BUT YOU CAN GO IN.
    sfx: [{text: tik tik tik, note: small}]
  - pos: top-left
    action: "Sota, explaining seriously, glasses pushed up."
    cast: [*sota_home]
    dialogue:
    - sota: KEN'S FROM THE HOSPITAL. HIS SISTER HAD THE BED NEXT TO MINE. MAI-CHAN. SHE'S FIVE.
    - sota: HE KNOWS EVERYTHING ABOUT MOTORS. HE'S GOT A TACKLE BOX.
  - pos: middle, wide
    location: childrens-ward
    action: "Memory inset with a soft grey border, daytime: a children's-ward bed by the window, a little girl asleep in it with the blanket up to her chin; an empty chair beside it."
    captions:
    - I REMEMBERED THE BED BY THE WINDOW, AND THE LITTLE GIRL ASLEEP IN IT. I HADN'T SEEN A BOY.
  - pos: lower-right
    action: "Sota talking to the toy car, not looking up; behind him, out of focus, the tired mother's back at the stove (small woman, black-and-grey hair in a loose low bun, worn cardigan)."
    cast: [*sota_home]
    dialogue:
    - sota: MOM'S AT THE FACTORY TILL TWO. THEN SHE SLEEPS. AND AYA'S WORKING.
  - pos: lower-left
    action: "Close on the mother's hand in a worn cardigan sleeve turning the knob of the gas burner off under the frying pan; she does not turn round."
    captions:
    - MOM TURNED THE GAS OFF UNDER THE EGGS. SHE DIDN'T LOOK ROUND.
    sfx: [{text: kachi, note: small}]
  - pos: bottom, wide
    action: "Dai at the low table, offhand, looking at the toy car rather than at Sota; Sota's face lighting up across the table."
    cast: [*dai_home, *sota_home]
    dialogue:
    - dai_cut: TWO O'CLOCK.
    captions:
    - SATURDAY AFTER SCHOOL WAS THE ONLY PART OF MY WEEK WITH NOTHING IN IT AT ALL.

# ================================================================== Thursday night: the onigiri
- page: 3
  title: Salted plum
  location: hayama-apartment
  time: Thursday 9:15 p.m. (top), then midnight and about 2 a.m. at the gas station
  guards:
  - *station_dai
  - "The onigiri: two triangular rice balls wrapped in clear plastic film."
  panels:
  - pos: top, wide
    action: "The dim genkan by the steel front door: the low wooden shoe cabinet with two onigiri in plastic film sitting on top of it; Dai in his station jacket bending to put his sneakers on, stopping, looking at them."
    cast: [*dai_cap]
    captions:
    - MOM WENT TO THE SUPERMARKET AT HALF PAST SEVEN. AT A QUARTER PAST NINE, WHEN I WENT TO PUT MY SHOES ON, THERE WERE TWO ONIGIRI ON THE SHOE CABINET.
  - pos: upper-right
    action: "Close on the two onigiri in plastic film on the cabinet top; nothing else beside them, no note."
    captions:
    - ON THE PLACE WHERE I LEAVE HER HALF. THERE WAS NOTHING WRITTEN NEXT TO THEM.
  - pos: upper-left
    action: "Dai's hands sliding the onigiri into one pocket of the grey jacket; white cotton work gloves poke out of the other pocket."
    cast: [{<<: *dai_cap, note: "only his hands and jacket"}]
    captions:
    - I PUT THEM IN MY JACKET, IN THE OTHER POCKET FROM THE GLOVES.
  - pos: middle, wide
    location: harbor-station-night
    action: "Midnight: the small gas station from across the empty road, the canopy lights on, nobody else; Dai small, sitting on the office step eating."
    cast: [*dai_cap]
    captions:
    - I ATE THE FIRST ONE AT MIDNIGHT. SALTED PLUM.
  - pos: lower-right
    location: harbor-road-night
    action: "Night, looking down the long dark harbor road past the warehouses: very far away, two small round headlights coming."
    cast: [{id: roadster, state: headlights_up, camera: "very far, head-on, only two small headlights in the dark"}]
    captions:
    - I WAS HALFWAY THROUGH THE SECOND, BY THE PUMP ISLAND, WHEN THE POP-UPS SHOWED A LONG WAY DOWN THE HARBOR ROAD.
  - pos: lower-left
    location: harbor-station-night
    action: "Dai at the pump island putting the hand with the half onigiri behind his back, looking toward the road."
    cast: [*dai_cap]
    captions:
    - I HEARD HER CHANGE DOWN FOR THE STATION, AND I PUT MY HAND WITH THE ONIGIRI IN IT BEHIND MY BACK.

- page: 4
  title: Eat it
  location: harbor-station-night
  time: Friday about 2 a.m., night under the canopy lights
  guards:
  - *station_dai
  - "Akane only in the RIGHT-hand driver's seat of the red Roadster, seen through the open driver's window; black fingerless gloves."
  panels:
  - pos: top, wide
    action: "The red Roadster stopped at the pump under the canopy, its driver's window wound down, Akane's face in it."
    cast:
    - {id: akane, note: "in the driver's window"}
    - {id: roadster, view: front34, state: headlights_down, camera: "low front three-quarter of its RIGHT flank from the pump island, the nose toward the right of the panel"}
    dialogue:
    - akane: REGULAR. FILL IT UP.
  - pos: upper-right
    action: "Close: Dai holding the fuel nozzle in the filler on the red car's right rear quarter with one hand, the other arm behind his back; only the red rear fender shows."
    cast: [*dai_cap]
    captions:
    - 25.2 LITERS, AT 115. 2,898 YEN.
  - pos: upper-left
    action: "Dai wiping the windshield with a squeegee in one hand, the other arm still behind him; through the glass Akane's eyes on his shoulder."
    cast: [*dai_cap, {id: akane, note: "behind the windshield, eyes only"}]
    captions:
    - I DID THE WINDSHIELD ONE-HANDED. SHE LOOKED AT MY SHOULDER, WHERE THE ARM WENT ROUND THE BACK.
  - pos: middle-right
    action: "Close: Akane in the open driver's window, looking up at him, flat."
    cast: [akane]
    dialogue:
    - akane: EAT IT.
  - pos: middle-left
    action: "Close on Dai's hand coming round from behind his back with half an onigiri, the plastic film still round the bottom of it."
    cast: [{<<: *dai_cap, note: "only his hand"}]
    captions:
    - I BROUGHT IT ROUND.
  - pos: bottom, large
    action: "Under the canopy lights: Dai standing at her open driver's window eating the half onigiri; Akane sitting behind the wheel looking straight out through the windshield at the road, not at him. Seen from the front of the car, a little above."
    cast: [*dai_cap, akane, {id: roadster, view: interior, camera: "through the windshield from the front, Akane behind the wheel on the IMAGE LEFT (the car's right), Dai standing outside her window"}]
    captions:
    - I ATE IT, STANDING AT HER WINDOW UNDER THE CANOPY LIGHTS, WITH HER LOOKING OUT THROUGH THE WINDSHIELD AT THE ROAD.

- page: 5
  title: Coffee
  location: harbor-station-night
  time: Friday about 2 a.m., night under the canopy lights
  guards:
  - *station_dai
  panels:
  - pos: top-right
    action: "Dai at the window, having swallowed, a bit awkward."
    cast: [*dai_cap]
    dialogue:
    - dai_cut: IT'S DINNER. OR BREAKFAST. I DON'T KNOW WHICH IT IS AT TWO.
  - pos: top-left
    action: "Akane's profile in the driver's window, eyes on the road."
    cast: [akane]
    dialogue:
    - akane: I DON'T EAT BREAKFAST.
  - pos: middle-right
    action: "Dai, surprised, the film in his fingers."
    cast: [*dai_cap]
    dialogue:
    - dai_cut: NONE?
  - pos: middle-left
    action: "Close on Akane's face, flat, one word."
    cast: [akane]
    dialogue:
    - akane: COFFEE.
  - pos: lower, wide
    action: "The red Roadster pulling away from the canopy onto the dark harbor road, taillights glowing."
    cast: [{id: roadster, view: rear, state: headlights_up, camera: "high rear three-quarter from behind-LEFT, from the height of the office roof"}]
    captions:
    - SHE PUT THE CHANGE IN THE TRAY UNDER THE RADIO WITHOUT COUNTING IT, AND WOUND THE WINDOW UP, AND WENT.
    sfx: [WAAAN]
  - pos: bottom, wide
    action: "Dai alone under the humming canopy lights on the empty forecourt, the crumpled plastic film in his fist, looking after her."
    cast: [*dai_cap]
    captions:
    - I STOOD THERE WITH THE PLASTIC FILM IN MY FIST.
    - COFFEE.

# ================================================================== Saturday 21 Oct: Fujita's
- page: 6
  title: Up the stairs
  location: fujita-hobby
  time: Saturday about 1:50 p.m.
  guards:
  - "Dai: SHORT black hair, grey zip-up jacket over a white T-shirt, jeans. Sota (11, round glasses, bowl cut): grey hooded sweatshirt and shorts."
  panels:
  - pos: top, wide
    location: covered-street
    action: "The covered shopping street under its arched arcade roof on a Saturday: a shoe shop with racks of shoes outside and, beside its door, a steep narrow stairway going up; Dai and Sota at the foot of it looking up, Sota holding his little blue toy car in both hands."
    cast: [*dai_jacket, *sota_out]
    captions:
    - FUJITA'S WAS UP A NARROW FLIGHT OF STAIRS BESIDE THE SHOE SHOP, AND ON SATURDAY AT TEN TO TWO YOU COULD HEAR IT FROM THE STREET.
  - pos: middle-right
    location: covered-street
    action: "Looking up the steep narrow stairway: Sota climbing ahead two steps at a time; big sound-effect letters pouring down the stairs from the bright doorway above."
    cast: [{<<: *sota_out, note: "from behind, climbing"}]
    sfx: [WHIIIIIN, KARAKARAKARA]
    captions:
    - A HIGH THIN WHINING, LOTS OF IT AT ONCE, AND UNDER IT A RATTLE, PLASTIC ON PLASTIC, AND BOYS SHOUTING.
  - pos: middle-left
    action: "Close on the wooden counter at the far end: rows of little plastic bags of parts hanging on pegs, each with a handwritten price sticker reading 280, 350 or 600."
    captions:
    - ALONG THE COUNTER HUNG LITTLE BAGS OF PARTS, EACH WITH A PRICE ON A STICKER IN MARKER.
  - pos: bottom, large
    action: "The long room seen from the top of the stairs: kit boxes up the walls to the ceiling, windows painted over, the white three-lane track on short legs filling the middle, about twenty boys crowded round it and a few fathers; a balding man in an apron at the start."
    cast: [{id: fujita, note: "small, far off, at the start of the track"}]
    captions:
    - UPSTAIRS IT WAS ONE LONG ROOM WITH THE WINDOWS PAINTED OVER. MODEL KITS IN BOXES WENT UP THE WALLS TO THE CEILING.
    - THE MIDDLE OF THE FLOOR WAS THE TRACK.

- page: 7
  title: Sasaki Ken
  location: fujita-hobby
  time: Saturday about 1:55 p.m.
  guards:
  - "Ken (11): sturdy, SCALP-short clipped hair, NO glasses, navy track jacket with white stripes, a green tackle box. Sota (11): small and thin, ROUND GLASSES, bowl cut. They look nothing alike."
  panels:
  - pos: top, wide
    action: "High close on the lane-change bridge of the white plastic track: the three lanes climb a short ramp over a hump and come down the other side crossed over."
    captions:
    - HALFWAY ALONG THE NEAR STRAIGHT THE LANES WENT UP A RAMP AND OVER A HUMP, A BRIDGE, AND CAME DOWN THE OTHER SIDE SWAPPED ROUND.
  - pos: upper-right
    action: "Sota counting ten 10-yen coins out of a small black film canister into the open palm of the balding man in the apron, who holds a stopwatch in his other hand."
    cast: [*sota_out, fujita]
    captions:
    - SOTA PAID THE HUNDRED YEN HIMSELF, TEN 10-YEN COINS COUNTED OUT OF A FILM CANISTER INTO THE MAN'S HAND.
  - pos: upper-left
    action: "Across the track, a sturdy boy with scalp-short hair pushing through the crowd of kids, a green tackle box held against his chest, calling out."
    cast: [ken]
    dialogue:
    - ken: SOTA!
  - pos: middle, wide
    action: "Ken stopped right in front of us, looking us up and then down, unimpressed (seen from Dai's height, looking down at him)."
    cast: [ken]
    captions:
    - SOTA'S AGE, BIGGER, WITH HIS HAIR CUT SO SHORT YOU COULD SEE HIS SCALP.
    dialogue:
    - ken: THE ONE WHO RODE IN THE AMBULANCE.
    - ken: I'M KEN. SASAKI KEN.
  - pos: lower-right
    action: "Ken leaning in to peer at the blue toy car in Sota's hands, eyes narrowed."
    cast: [ken, {id: sota_car, camera: "three-quarter from above in a pair of small hands"}]
    dialogue:
    - ken: IS IT STILL STOCK?
  - pos: lower-left
    action: "Sota, proud, holding his car up."
    cast: [*sota_out]
    dialogue:
    - sota: I PUT THE STICKERS ON.

- page: 8
  title: Stickers aren't parts
  location: fujita-hobby
  time: Saturday about 2 p.m.
  guards:
  - "Ken (11): sturdy, SCALP-short hair, NO glasses, navy track jacket. Sota (11): small, ROUND GLASSES, bowl cut, grey hoodie."
  panels:
  - pos: top-right
    action: "Ken, flat, final."
    cast: [ken]
    dialogue:
    - ken: STICKERS AREN'T PARTS.
  - pos: top-left, large
    action: "Ken kneeling on the carpet with his green tackle box open: every little compartment full of tiny metal wheels, little motors, springs and a tiny screwdriver; his own red toy car, full of drilled holes, sitting on the lid; Sota and Dai's sneakers at the edge of the panel."
    cast: [ken, {id: ken_car, camera: "three-quarter from above, sitting on the open lid"}]
    captions:
    - HE NAMED THEM THE WAY NOBU NAMES HORSEPOWER, FAST AND HAPPILY AND TO NOBODY IN PARTICULAR. HIS OWN CAR WAS RED, WITH HOLES CUT IN IT TO MAKE IT LIGHTER.
  - pos: middle-right
    action: "Sota pointing at the little flat white roller wheels on the corners of his blue car."
    cast: [*sota_out, {id: sota_car, camera: "from above, the four flat white rollers clearly visible"}]
    dialogue:
    - sota: THOSE ARE THE ROLLERS. THEY RUN ALONG THE WALL. THAT'S HOW IT GETS ROUND.
  - pos: middle-left
    action: "Dai, frowning down at the car."
    cast: [*dai_jacket]
    dialogue:
    - dai_cut: IT CAN'T STEER.
  - pos: lower-right
    action: "Ken looking up at Dai as if at an idiot."
    cast: [ken]
    dialogue:
    - ken: NOBODY'S CAN. IT'S A MINI 4WD.
  - pos: bottom-left
    action: "Sota at the start of the track holding his car down in a lane by its body, its wheels screaming round in the air, about to let go."
    cast: [*sota_out, {id: sota_car, camera: "side view at track level, nose pointing LEFT, wheels a blur"}]
    captions:
    - BEFORE THE RACE YOU COULD RUN YOUR CAR FOR PRACTICE.
    sfx: [WIIIIIIN]

- page: 9
  title: Course-out
  location: fujita-hobby
  time: Saturday about 2 p.m.
  guards:
  - "Only ONE toy car on the track in this page: Sota's blue one."
  panels:
  - pos: top, wide
    action: "The little blue toy car rattling round the first tight curve of the white track on its white rollers, speed lines."
    cast: [{id: sota_car, camera: "low at track level on the outside of the curve, the car coming toward us and leaning"}]
    captions:
    - IT WENT MUCH FASTER THAN SOMETHING THAT SIZE HAD ANY RIGHT TO.
    sfx: [KARAKARAKARA]
  - pos: middle, large
    action: "BIG: the blue toy car at the top of the lane-change bridge, leaving the track completely, all four wheels in the air, nose up."
    cast: [{id: sota_car, camera: "side view from beside the bridge, nose pointing RIGHT and tilted UP, a gap of air under the wheels"}]
    captions:
    - AT THE TOP OF THE HUMP IT LEFT THE TRACK, ALL OF IT, NOSE UP.
  - pos: lower-right
    action: "The toy car landed on its back wheels with its nose still up, running at the next curve, its front rollers climbing over the low wall."
    cast: [{id: sota_car, camera: "from behind and above, the front rollers riding up onto the top of the lane wall"}]
    sfx: [kachi]
  - pos: lower-left
    action: "On the carpet: the toy car upside down against a grown man's brown shoe, its little wheels still spinning."
    cast: [{id: sota_car, camera: "ground level, upside down, wheels up"}]
    captions:
    - IT WENT END OVER END ACROSS THE CARPET AND STOPPED UPSIDE DOWN AGAINST A MAN'S SHOE, WITH ITS WHEELS STILL GOING.
    sfx: [GASHA]
  - pos: bottom, wide
    action: "Ken with his arms folded round his tackle box, explaining like an expert."
    cast: [ken]
    dialogue:
    - ken: COURSE-OUT. IT'S TOO FAST FOR ITS ROLLERS.

- page: 10
  title: The one after the bridge
  location: fujita-hobby
  time: Saturday about 2:10 p.m.
  guards:
  - "Mai (5): tiny girl, VERY round puffy cheeks, short bob with a clip, white gauze mask over her mouth here, pink cardigan."
  panels:
  - pos: top-right
    action: "Sota crouching to pick his toy car up from beside a man's shoe and trouser leg; the man doesn't look down."
    cast: [*sota_out]
    captions:
    - SOTA WENT AND GOT IT. THE MAN DIDN'T LOOK DOWN. IT FLEW OFF TWICE MORE BEFORE THE RACE, AT THE SAME CORNER. THE ONE AFTER THE BRIDGE.
  - pos: top-left
    action: "Across the track, a tiny girl in a white gauze mask standing on a folding stool, both fists up, yelling."
    cast: [mai]
    dialogue:
    - mai: GO!
    captions:
    - THE RACE WAS IN HEATS OF THREE. A LITTLE GIRL IN A WHITE MASK, STANDING ON A STOOL, YELLED "GO!" AFTER THE MAN, EVERY TIME.
  - pos: middle, wide
    action: "Three toy cars racing side by side out of the first curve, the blue clear one just in front."
    cast: [{id: sota_car, camera: "from above and ahead, three cars in three lanes, the blue one leading"}]
    captions:
    - SOTA'S CAR WAS IN FRONT OUT OF THE FIRST CORNER. IT WAS IN FRONT AT THE BRIDGE.
    sfx: [KARARARARA]
  - pos: lower, large
    action: "BIG: the blue toy car flying high over the wall of the curve after the bridge, the two other toy cars passing underneath it in their lanes."
    cast: [{id: sota_car, camera: "low from inside the curve looking up, the blue car in the air against the fluorescent lights"}]
    captions:
    - IT CAME OFF THE TOP NOSE-UP AND WENT OVER THE WALL, AND THE OTHER TWO WENT PAST UNDERNEATH IT WHILE IT WAS STILL IN THE AIR.
  - pos: bottom-right
    action: "Close on Sota's thumb pushing the little switch on the toy car to off."
    cast: [{<<: *sota_out, note: "only his hands"}]
    captions:
    - HE SWITCHED IT OFF. HE DIDN'T SAY ANYTHING.
    sfx: [{text: kachi, note: small}]
  - pos: bottom-left
    action: "Sota standing next to Dai (only Dai's jacket and arm at the edge), the car held in both hands against his chest, mouth shut tight, watching the next heat."
    cast: [*sota_out]
    captions:
    - HE WATCHED THE NEXT HEAT WITH HIS MOUTH SHUT TIGHT, THE SAME AS WHEN HE'S WAITING TO SEE IF A COUGH WILL STOP ON ITS OWN.

- page: 11
  title: It's the bridge
  location: fujita-hobby
  time: Saturday about 2:20 p.m.
  guards:
  - "Ken (11): sturdy, SCALP-short hair, NO glasses, navy track jacket. Dai: SHORT black hair, grey jacket."
  panels:
  - pos: top, wide
    action: "Ken's red toy car with the holes crossing the line half a lap ahead of the others; Ken at the start with a fist pumped."
    cast: [ken, {id: ken_car, camera: "low at track level, coming straight at us"}]
    captions:
    - KEN WON HIS HEAT BY HALF A LAP AND CAME OVER TO TELL US WHAT SOTA'S CAR NEEDED, AND WHAT EACH PART COST ON THE COUNTER.
  - pos: upper-right
