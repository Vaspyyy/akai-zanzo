# Cast registry: every character and car that can appear on a page.
#
# The prompt builder copies `traits` (and the chosen outfit) into the image
# prompt for ONLY the characters a page lists, and attaches ONLY their sheets.
# `tell` is the one-line "unmistakable" description used inside panels so the
# model can tell people apart (age, hair, how clothes are worn). Keep it short.
# Sheets must show ONE character each (see prompts/art-direction.md).
#
# Outfit fields: desc (what they wear), ref (sheet path), ref_note (what to
# look at on that sheet). A page can also give a free-text outfit override.

characters:
  dai:
    name: DAI
    full_name: Daisuke "Dai" Hayama
    traits: >-
      17-year-old boy, 172 cm, lean and wiry, slight slouch, often hands in
      pockets. Messy black hair, the fringe falls over his eyes, a bit long at
      the back. Narrow, sharp, guarded eyes; thin face. A small scar through
      the left eyebrow, hidden by the fringe (draw it only in big close-ups).
    tell: "the YOUNG one, 17, messy black hair falling over his eyes"
    default_outfit: casual
    outfits:
      casual:
        desc: faded plain black T-shirt, worn straight-leg blue jeans, beat-up white canvas low-top sneakers
        ref: artwork/character-sheets/dai.png
      school:
        desc: standard black gakuran school uniform with the collar open, worn carelessly
        ref: artwork/character-sheets/dai.png
        ref_note: the face and hair; the gakuran close-up is at the bottom right of the sheet
      summer_school:
        desc: >-
          summer school uniform: white short-sleeved button shirt, untucked,
          top button open, black school trousers, beat-up white canvas sneakers
        ref: artwork/character-sheets/dai.png
        ref_note: the face and hair only (the sheet shows other clothes)
      station:
        desc: >-
          gas-station uniform: grey work shirt worn OPEN and untucked over a
          black T-shirt, sleeves rolled up, small white name tag; worn jeans;
          white canvas sneakers; grey work cap (on his head or in his hand)
        ref: artwork/character-sheets/dai-uniform.png
      station_jacket:
        desc: >-
          grey zip-up gas-station work jacket (same grey as the station shirt,
          a small plain patch on the chest, no readable letters) half zipped
          over a black T-shirt, with side pockets; worn jeans; white canvas
          sneakers; no cap
        ref: artwork/character-sheets/dai-uniform.png
        ref_note: the face and hair; the jacket is like the grey work shirt but zipped
      gym_shirt:
        desc: >-
          an old, faded white school gym T-shirt with a dark round collar
          trim, worn jeans, beat-up white canvas low-top sneakers
        ref: artwork/character-sheets/dai.png
        ref_note: the face and hair only (the sheet shows other clothes)

  kubo:
    name: KUBO
    full_name: Kubo (night attendant, harbor gas station)
    traits: >-
      Man in his late 50s, thin, deeply lined weathered face, sunken cheeks,
      tired half-closed eyes, short greying hair under a grey work cap.
      Unhurried, a cigarette often tucked behind his ear.
    tell: "the OLD man, late 50s, deeply lined face, grey cap, shirt buttoned up"
    default_outfit: station
    outfits:
      station:
        desc: grey work shirt BUTTONED UP and tucked in, name tag on the chest pocket, sleeves rolled, dark work trousers with a belt, work boots, grey work cap
        ref: artwork/character-sheets/kubo.png
      own:
        desc: >-
          his own Sunday clothes: an old faded work jacket (light grey tone) open
          over a plain grey shirt BUTTONED UP, dark work trousers with a belt,
          worn work boots, his grey cap; no name tag
        ref: artwork/character-sheets/kubo.png
        ref_note: the face, cap and build; the clothes here are his own, not the station uniform

  akane:
    name: AKANE
    full_name: Akane Natsume (driver of the red Roadster)
    traits: >-
      21-year-old woman, tall. Long straight black hair, center-parted with a
      few loose strands framing her face, tied in a LOW ponytail. Calm,
      unreadable, half-lidded eyes; small earring. Looks nothing like Dai.
    tell: "the young WOMAN with long black hair in a low ponytail"
    default_outfit: casual
    outfits:
      casual:
        desc: dark bomber jacket over a white T-shirt, black jeans, black sneakers, black leather driving gloves with the knuckles cut open
        ref: artwork/character-sheets/akane.png
      nurse:
        desc: >-
          night-shift ER nurse in a 1995 Japanese city hospital: plain WHITE
          short-sleeved nurse's tunic and white trousers, white flat shoes, a
          small nurse's watch pinned upside down on the left breast, a pen in
          the breast pocket, bare hands; her long hair pinned UP in a tight bun
          (NOT a ponytail), no cap
        ref: artwork/character-sheets/akane-nurse.png
      nurse_cardigan:
        desc: >-
          the same white nurse's tunic and trousers and white flat shoes, with a
          plain NAVY knitted cardigan (dark tone) open over the tunic; hair
          still pinned UP in a tight bun
        ref: artwork/character-sheets/akane-nurse.png
        ref_note: the face and the pinned-up hair; add the navy cardigan over the uniform

  michiko:
    name: MICHIKO
    full_name: Michiko Hayama (Dai's mother, 41)
    traits: >-
      Small, tired woman of 41 who looks older. Black hair with some grey in a
      low loose bun, strands falling out. Fine lines around the eyes.
    tell: "the tired MOTHER, 41, hair in a loose low bun"
    default_outfit: factory
    outfits:
      factory:
        desc: light-blue factory smock (drawn in light grey tone) with a name tag, loose trousers, sneakers
        ref: artwork/character-sheets/michiko.png
      home:
        desc: worn cardigan over a plain top, loose trousers
        ref: artwork/character-sheets/michiko.png
      summer_home:
        desc: plain faded T-shirt, loose trousers, an apron
        ref: artwork/character-sheets/michiko.png
        ref_note: the face and hair only
      supermarket:
        desc: plain supermarket work vest (dark tone) over a T-shirt, loose trousers
        ref: artwork/character-sheets/michiko.png
        ref_note: the face and hair only
      vest:
        desc: >-
          the supermarket's GREEN work vest (drawn in mid-grey tone) over a
          plain long-sleeved top, a small blank white name tag on the vest,
          loose dark trousers, WHITE rubber shop-floor shoes, a worn shoulder
          bag; half her hair has come out of the low bun
        ref: artwork/character-sheets/michiko-vest.png

  aya:
    name: AYA
    full_name: Aya Hayama (older sister, 20)
    traits: >-
      20-year-old woman, chin-length black bob, the same sharp eyes as Dai,
      blunt and dry expression.
    tell: "the older SISTER, 20, chin-length black bob"
    default_outfit: home
    outfits:
      home:
        desc: grey tank top, long cardigan, shorts, barefoot indoors
        ref: artwork/character-sheets/aya.png
      work:
        desc: supermarket cashier vest over a blouse, dark skirt or trousers
        ref: artwork/character-sheets/aya.png
      blouse:
        desc: plain short-sleeved blouse and dark trousers
        ref: artwork/character-sheets/aya.png
        ref_note: the face and hair only
      tanktop:
        desc: grey tank top and shorts (no cardigan), barefoot, hair flat on one side from sleeping
        ref: artwork/character-sheets/aya.png
        ref_note: the face and hair only

  sota:
    name: SOTA
    full_name: Sota Hayama (younger brother, 11)
    traits: >-
      11-year-old boy, small and thin for his age, round glasses, bowl-cut
      black hair. Often holds a blue asthma inhaler.
    tell: "the little BROTHER, 11, round glasses, bowl cut"
    default_outfit: home
    outfits:
      home:
        desc: plain T-shirt, shorts, socks or sneakers
        ref: artwork/character-sheets/sota.png
      undershirt:
        desc: sleeveless white undershirt and shorts, barefoot
        ref: artwork/character-sheets/sota.png
      pajamas:
        desc: thin striped cotton summer pajamas (short sleeves, shorts), barefoot
        ref: artwork/character-sheets/sota.png
        ref_note: the face, glasses and hair only
      school:
        desc: white short-sleeved shirt, navy shorts, a yellow-covered elementary-school cap in hand, a square leather randoseru school backpack
        ref: artwork/character-sheets/sota.png
        ref_note: the face, glasses and hair only

  nobu:
    name: NOBU
    full_name: Nobuyuki "Nobu" Kawamata (classmate, ramen-shop son, 17)
    traits: >-
      17-year-old boy, about 165 cm, stocky and soft, round full face with
      chubby cheeks, very short BUZZ-CUT black hair (forehead fully visible),
      thick straight eyebrows, small bright eyes that go wide when excited,
      a big expressive mouth that is usually talking or grinning. Leans
      forward, restless. No glasses. Looks nothing like Dai.
    tell: "the round-faced, stocky boy with a BUZZ CUT"
    default_outfit: summer_school
    outfits:
      summer_school:
        desc: >-
          summer school uniform: white short-sleeved button shirt, untucked
          and a little tight over his belly, black school trousers, indoor
          shoes with the heels trodden flat; a canvas school bag
        ref: artwork/character-sheets/nobu.png
      meet:
        desc: white short-sleeved shirt buttoned to throat, track pants, oversized black kitchen sandals, canvas shoulder bag
        ref: artwork/character-sheets/nobu.png
        ref_note: face and build only; use the described meet clothes

  okabe:
    name: OKABE
    full_name: Okabe, tire-shop bookmaker
    traits: Man in his forties with a soft round face, short dark hair, reading glasses on forehead, tire-blackened finger creases and clean short nails.
    tell: the round-faced bookmaker with reading glasses on his forehead
    default_outfit: work
    outfits:
      work:
        desc: plain unmarked polo shirt and ordinary trousers
        ref: artwork/character-sheets/okabe.png
      overalls:
        desc: >-
          plain NAVY work overalls (dark grey tone) with the sleeves rolled up,
          no name or logo, reading glasses pushed up into his hair, a rag in one hand
        ref: artwork/character-sheets/okabe.png
        ref_note: the face, glasses and build; he wears navy work overalls here, not the polo shirt

  tetsu:
    name: TETSU
    full_name: Tetsu, Goto's companion
    traits: Skinny nineteen-year-old man with short dark hair and satin jacket.
    tell: the skinny young man in a satin jacket
    default_outfit: casual
    outfits:
      casual:
        desc: plain satin jacket and trousers

  chaser_driver:
    name: CHASER DRIVER
    full_name: Chaser driver
    traits: Man about twenty-two with a perm, white loafers and no socks.
    tell: the young man with a perm and white loafers
    default_outfit: casual
    outfits:
      casual:
        desc: casual shirt and trousers, white loafers, no socks

  caller:
    name: CALLER
    full_name: an unseen person at the meet
    traits: A voice in the crowd, off panel.
    tell: an unseen person
    default_outfit: casual
    outfits:
      casual:
        desc: ordinary 1995 casual clothes

  hotta:
    name: HOTTA-SENSEI
    full_name: Hotta-sensei (homeroom and English teacher)
    traits: >-
      Thin, tired male teacher in his late 40s, receding black hair, sunken
      cheeks, a white towel round his neck, fans himself with a flat paper
      fan printed with a cartoon owl.
    tell: "the thin, tired TEACHER with a towel round his neck"
    default_outfit: teacher
    outfits:
      teacher:
        desc: short-sleeved pale shirt, loosened dark tie, grey slacks, white towel round the neck
        ref: artwork/character-sheets/hotta.png
      cardigan:
        desc: >-
          autumn: a plain GREY knitted cardigan over a pale long-sleeved shirt and
          a loosened dark tie, grey slacks; NO towel round his neck
        ref: artwork/character-sheets/hotta.png
        ref_note: the face, receding hair and thin build; no towel now, a grey cardigan instead

  shop_owner:
    name: OWNER
    full_name: the bookstore owner
    traits: >-
      Small, wrinkled old man in his 70s, bald on top with white hair at the
      sides, round reading glasses, a stern little mouth. Carries a feather
      duster.
    tell: "the tiny OLD bookstore owner with a feather duster"
    default_outfit: cardigan
    outfits:
      cardigan:
        desc: a buttoned grey cardigan (in August) over a shirt, dark trousers, slippers

  goto:
    name: GOTO
    full_name: Goto (street racer, mid-20s)
    traits: >-
      Man in his mid-20s, bleached short spiky hair, thin eyebrows, a
      cigarette nearly always in his mouth, cocky expression.
    tell: "the bleached spiky-haired racer with a cigarette"
    default_outfit: tracksuit
    outfits:
      tracksuit:
        desc: shiny dark tracksuit jacket with white side stripes open over a white tank top, matching track pants, gold chain, sneakers
        ref: artwork/character-sheets/goto.png

  principal:
    name: PRINCIPAL
    full_name: the school principal
    traits: >-
      Portly man in his early 60s, thinning grey hair combed over, round
      glasses, a heavy, solemn face.
    tell: "the portly old PRINCIPAL with round glasses at the podium"
    default_outfit: suit
    outfits:
      suit:
        desc: dark grey suit, white shirt, dark tie

  okuda:
    name: OKUDA
    full_name: Okuda (classmate who sits next to Dai)
    traits: >-
      Skinny 17-year-old boy with a long face, a short neat side-parted
      haircut and a sour, undecided mouth. Looks nothing like Dai or Nobu.
    tell: "the skinny long-faced boy with a neat side part"
    default_outfit: summer_school
    outfits:
      summer_school:
        desc: white short-sleeved school shirt tucked in, black trousers

  bank_girl:
    name: GIRL
    full_name: the girl who sits in front of Dai
    traits: >-
      17-year-old schoolgirl with two short braids and a pleased, proud smile.
    tell: "the schoolgirl with two short braids"
    default_outfit: summer_school
    outfits:
      summer_school:
        desc: white short-sleeved sailor-style summer blouse with a dark collar and scarf, dark pleated skirt

  learner:
    name: LEARNER
    full_name: a learner driver at the driving school
    traits: >-
      Young woman of about 18 with a ponytail and big round glasses, panicking
      at the wheel. Clearly NOT Akane: round glasses, round soft face.
    tell: "the young learner with big round glasses"
    default_outfit: casual
    outfits:
      casual:
        desc: plain blouse

  instructor:
    name: INSTRUCTOR
    full_name: the driving-school instructor
    traits: >-
      Middle-aged man with a crew cut and a completely calm, bored face.
    tell: "the bored middle-aged INSTRUCTOR with a crew cut"
    default_outfit: uniform
    outfits:
      uniform:
        desc: pale short-sleeved uniform shirt with a dark tie, a clipboard on his knee

  officer:
    name: OFFICER
    full_name: the older police officer at Pier 3 (unnamed, recurring)
    traits: >-
      Japanese police officer in his late 40s, solid and a little heavy in the
      middle, broad calm face with a heavy jaw, patient heavy-lidded eyes,
      short black hair going GREY at the sides under his peaked cap.
      Unhurried; stands still and looks for a long time.
    tell: "the OLDER, heavy-set police officer, grey at the sides under his peaked cap"
    default_outfit: summer_uniform
    outfits:
      summer_uniform:
        desc: >-
          1995 Japanese police summer uniform: pale short-sleeved shirt with two
          buttoned breast pockets and shoulder straps, a small badge, dark
          trousers, black duty belt with a holstered revolver, peaked police cap
          with a badge, polished black shoes with the heels worn down on the
          OUTSIDE edges
        ref: artwork/character-sheets/officer.png

  officer_driver:
    name: DRIVER
    full_name: the younger police officer at the wheel of the Crown
    traits: Young Japanese police officer in his late 20s, thin face, at the wheel; seen only dimly.
    tell: "the YOUNG officer at the wheel"
    default_outfit: uniform
    outfits:
      uniform:
        desc: pale short-sleeved police shirt, peaked cap

  starter:
    name: STARTER
    full_name: the flashlight kid (race starter)
    traits: Scooter boy of about 16, helmet pushed back on his head with goggles, thin, in a striped track jacket, holding a long black flashlight.
    tell: "the scooter boy with his helmet pushed back"
    default_outfit: casual
    outfits:
      casual:
        desc: zip-up track jacket with striped cuffs, jeans, sneakers, open-face helmet pushed back on his head

  lookout:
    name: LOOKOUT
    full_name: a scooter lookout on the course with a walkie-talkie
    traits: Teenage boy of about 16 on a small 50cc scooter, open-face helmet, a walkie-talkie with a long antenna at his mouth.
    tell: "the teenage lookout on a scooter with a walkie-talkie"
    default_outfit: casual
    outfits:
      casual:
        desc: windbreaker jacket, jeans, open-face helmet

  radio:
    name: WALKIE-TALKIE
    full_name: a lookout's voice coming out of Okabe's walkie-talkie
    traits: A black handheld walkie-talkie with a long antenna; the voice of a lookout far away. Not a person.
    tell: "the walkie-talkie"
    default_outfit: none
    outfits:
      none:
        desc: none (an object)

  chaser_girl:
    name: GIRL
    full_name: the Chaser driver's girlfriend
    traits: Young woman of about 21, permed shoulder-length hair, sulky face, small earrings.
    tell: "the young woman with permed shoulder-length hair, arms crossed"
    default_outfit: casual
    outfits:
      casual:
        desc: a light blouse and a short skirt, heeled sandals

  starlet_boy:
    name: STARLET BOY
    full_name: the boy who owns the white Starlet
    traits: Thin young man of about 18-19, plain short hair, earnest stiff face, stands too straight.
    tell: "the thin, stiff young man holding banknotes"
    default_outfit: casual
    outfits:
      casual:
        desc: plain white T-shirt tucked into jeans, cheap sneakers

  civic_owner:
    name: CIVIC OWNER
    full_name: the red Civic's owner
    traits: Young man of about 22, dyed brown hair under a backwards cap, eating cup noodles with chopsticks.
    tell: "the young man in a backwards cap eating cup noodles"
    default_outfit: casual
    outfits:
      casual:
        desc: loose short-sleeved shirt, baggy trousers

  supra_girl:
    name: SUPRA GIRL
    full_name: the girl in the white jacket from the Supra
    traits: Young woman of about 20 with long dyed hair.
    tell: "the young woman in a white jacket"
    default_outfit: casual
    outfits:
      casual:
        desc: white jacket, short skirt

  # ---- added for chapter 8 (2026-11-18)
  fumie:
    name: FUMIE
    full_name: Fumie Tanabe (owner of Tanabe Auto Dismantling)
    traits: >-
      Small, square, sturdy Japanese woman over sixty. Grey hair cut as short
      as a man's, a white towel tied round her forehead. Weathered brown face,
      deep lines, a cigarette always in the corner of her mouth and her LEFT
      eye half shut against its smoke. Hands brown, thick and strong, too big
      for the rest of her; the left thumbnail black and half grown out.
    tell: "the small, square OLD WOMAN with short grey hair, a white towel round her forehead and a cigarette in her mouth"
    default_outfit: work
    outfits:
      work:
        desc: >-
          a man's navy work jacket (dark grey tone) with an orange stitched
          name patch over the breast pocket (no readable letters), the
          sleeves rolled up four times, dark work trousers, scuffed safety
          boots with the steel showing through at the toes
        ref: artwork/character-sheets/fumie.png
      gloves:
        desc: >-
          the same navy work jacket with the rolled sleeves, dark work
          trousers, scuffed safety boots, and brown LEATHER work gloves
        ref: artwork/character-sheets/fumie.png

  cat:
    name: CAT
    full_name: the scrapyard cat (nobody's)
    traits: >-
      A big brown striped tabby cat (mid-grey tone with dark stripes), heavy
      and scruffy, with HALF A TAIL (a short stump) and a notch cut out of one
      ear. Yellow-green eyes drawn pale. Unfriendly look.
    tell: "the big striped cat with half a tail and a notched ear"
    default_outfit: none
    outfits:
      none:
        desc: none (an animal)

  owner_boy:
    name: THE BOY
    full_name: the Roadster's last owner (memory)
    traits: Thin young Japanese man of about 22, short hair, wearing a white foam neck collar (cervical brace), stiff and miserable.
    tell: "the young man in a white neck collar"
    default_outfit: casual
    outfits:
      casual:
        desc: a plain short-sleeved shirt and jeans

  husband:
    name: HUSBAND
    full_name: Fumie's husband in 1958 (memory)
    traits: A lean young Japanese man of the late 1950s, short black hair, seen from behind.
    tell: "the young man on the beach, seen from behind"
    default_outfit: casual
    outfits:
      casual:
        desc: a white short-sleeved shirt and dark trousers rolled up to the knee, barefoot

  taxi_driver:
    name: TAXI DRIVER
    full_name: a taxi driver going home
    traits: Middle-aged taxi driver seen dimly through the windshield.
    tell: "the taxi driver"
    default_outfit: uniform
    outfits:
      uniform:
        desc: white shirt, dark cap

  # ---- added for chapter 9 (2026-11-18)
  dai_cut:
    name: DAI
    full_name: Daisuke "Dai" Hayama after his sister's haircut (chapter 9 on)
    traits: >-
      17-year-old boy, 172 cm, lean and wiry, slight slouch. FRESHLY CUT SHORT
      black hair: the sides short above the ears, the back off the collar, the
      bangs cut straight across a finger's width ABOVE his eyebrows, so his
      whole forehead and both eyebrows show. A short pale scar line through
      his LEFT eyebrow (on the image right when he faces us). Narrow, sharp,
      guarded eyes; thin face.
    tell: "the YOUNG one, 17, with SHORT freshly cut black hair and his forehead uncovered"
    default_outfit: summer_school
    outfits:
      interview:
        desc: >-
          crisp ironed white short-sleeved summer school shirt buttoned all the
          way to the top and tucked in, black school trousers with a crease,
          beat-up white canvas sneakers with a strip of tape on the right one
        ref: artwork/character-sheets/dai-haircut.png
      summer_school:
        desc: >-
          rumpled white short-sleeved summer school shirt with a breast pocket,
          untucked, top button open, black school trousers, white socks
          indoors (white canvas sneakers outdoors)
        ref: artwork/character-sheets/dai-haircut.png
        ref_note: the face and the short hair; the shirt is rumpled and untucked here
      station_jacket:
        desc: >-
          grey zip-up gas-station work jacket (a small plain patch on the
          chest, no readable letters) half zipped over a black T-shirt, worn
          jeans, white canvas sneakers; no cap
        ref: artwork/character-sheets/dai-haircut.png
        ref_note: the face and the short hair only (the sheet shows a school shirt)
      casual:
        desc: faded plain black T-shirt and loose grey sweatpants (sleeping clothes), barefoot
        ref: artwork/character-sheets/dai-haircut.png
        ref_note: the face and the short hair only

  sota_ng:
    name: SOTA
    full_name: Sota Hayama WITHOUT his glasses (the asthma night, chapter 9)
    traits: >-
      11-year-old boy, small and thin for his age, bowl-cut black hair, big
      dark eyes. He is NOT wearing glasses: his round glasses are OFF, folded
      beside his pillow or in his brother's shirt pocket. Bare eyes, no frames
      on his face in any panel.
    tell: "the little BROTHER, 11, bowl cut, NO glasses"
    default_outfit: pajamas
    outfits:
      pajamas:
        desc: thin striped cotton pajamas (short sleeves, shorts), barefoot; NO glasses on his face
        ref: artwork/character-sheets/sota.png
        ref_note: the face shape and bowl cut ONLY; IGNORE the glasses on the sheet, he is NOT wearing glasses now

  sugimoto:
    name: SUGIMOTO
    full_name: Sugimoto (Personnel, Sanko Brake)
    traits: >-
      Japanese office man about fifty, a little soft round the middle, neat
      side-parted black hair thinning at the crown, rimless rectangular
      glasses, a smooth careful polite face, tired eyes; clicks a ballpoint pen.
    tell: "the man in a SUIT with rimless glasses, in the middle"
    default_outfit: suit
    outfits:
      suit:
        desc: plain dark grey suit, white shirt, dark narrow tie, a small lapel pin
        ref: artwork/character-sheets/sugimoto.png

  line_worker:
    name: OLD WORKER
    full_name: an old line worker on the Sanko interview panel (unnamed)
    traits: >-
      Old Japanese factory worker about sixty, broad and heavy-shouldered,
      weathered square face with deep lines, grey stubble, grey hair cropped
      very short, small steady eyes under heavy brows; big heavy hands with
      the creases stained grey. Rough, slow voice.
    tell: "the OLD broad man in a grey work jacket with big grey-creased hands"
    default_outfit: work
    outfits:
      work:
        desc: grey zip-up factory work jacket with a small plain patch over the breast pocket (no letters), white shirt collar under it
        ref: artwork/character-sheets/line-worker.png

  young_clerk:
    name: CLERK
    full_name: the young note-taker on the Sanko interview panel
    traits: Thin Japanese man in his twenties, neat short hair, big ears, a notepad, always writing.
    tell: "the YOUNG thin man with a notepad"
    default_outfit: suit
    outfits:
      suit:
        desc: white shirt, dark tie, no jacket

  examiner:
    name: EXAMINER
    full_name: the man who gives the adding test at Sanko
    traits: Japanese man in his forties with a grey crew cut and a flat, patient face, holding a silver stopwatch.
    tell: "the crew-cut man with a STOPWATCH"
    default_outfit: work
    outfits:
      work:
        desc: grey zip-up factory work jacket over a white shirt, grey trousers

  chin_boy:
    name: BOY
    full_name: a candidate from a school across the river
    traits: Japanese high-school boy of 17 with a short haircut and a square Band-Aid on his chin.
