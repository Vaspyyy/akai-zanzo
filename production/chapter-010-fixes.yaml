# Edits for Chapter 10 (edits of the drawn art; results copied back into artwork/pages/chapter-010/ and re-lettered from chapter-010.yaml).
title: Chapter 10 fixes
output_dir: production/runs/ch10-fixes/out
lettering: empty
defaults:
  orientation: portrait
  notes:
  - No brand logos, no readable printed words, no Japanese characters.
pages:
- page: 10
  location: er-bay
  time: 2:35 a.m., a DRY clear night outside
  edit:
    source: production/runs/ch10-fixes/src/page-10.png
    change: "Two changes only. (1) It is a DRY night, not raining: in the wide middle panel and the lower-right panel, remove every rain streak and make the forecourt, road and ground outside the glass doors DRY (no wet reflections, no puddles, no rain). (2) In the lower-left panel the round wall clock must read 2:35: the minute hand pointing at the 7, the hour hand a little past halfway between the 2 and the 3."
    keep: "everything else exactly as it is: the layout, every panel border, all the people and their faces, the taxi, the payphone, the balloons and caption boxes, the shoes close-up"
  panels:
  - {pos: top-right, action: unchanged, keep: true}
  - {pos: top-left, action: unchanged, keep: true}
  - pos: middle, wide
    action: Mom running across the DRY forecourt at night; the taxi pulling away behind her. No rain.
  - pos: lower-right
    action: Mom at the glass doors, the DRY night outside.
  - pos: lower-left
    action: Mom in the corridor; the wall clock reads 2:35.
  - {pos: bottom-right, action: unchanged, keep: true}
  - {pos: bottom-left, action: unchanged, keep: true}

- page: 16
  location: hospital-night-entrance
  time: about 4:30 to 5:02 a.m., night
  edit:
    source: production/runs/ch10-fixes/src/page-16.png
    change: "Two changes only. (1) In the TOP-LEFT panel, the little boy in bed must wear a CLEAR see-through plastic nebulizer mask over his nose and mouth (thin elastic strap, a clear tube running from it to the wall), keep his round glasses on over it, and his RIGHT hand (on the image left) must lie flat on a small padded board with white tape and a thin clear drip tube; he waves with his LEFT hand. Remove the small inhaler from the table. (2) In the wide second-row panel and the wide third-row panel, the young man sitting on the bench wears WHITE CANVAS SNEAKERS with the laces undone on his feet (not socks only)."
    keep: "everything else exactly as it is: the layout, every panel border, the nurse, the floor polisher man, the vending machine, the corridor, the reflection close-up, the HOT buttons close-up, all balloons and caption boxes, the sound effect"
  panels:
  - pos: top-left
    action: The boy in bed with a clear plastic nebulizer mask and glasses, right hand taped to a board with a drip tube, waving with his left hand.
  - {pos: top-right, action: unchanged, keep: true}
  - pos: middle, wide
    action: The young man on the bench wearing white canvas sneakers.
  - pos: lower, wide
    action: The young man on the bench wearing white canvas sneakers.
  - {pos: bottom-right, action: unchanged, keep: true}
  - {pos: bottom-left, action: unchanged, keep: true}

- page: 30
  location: harbor-station-night
  time: about 2:16 a.m., night, dry
  edit:
    source: production/runs/ch10-fixes/src/page-30.png
    change: "Draw new art ONLY inside the flat grey rectangle (the bottom-RIGHT panel of the fourth row). In it: night, the dark harbor road running away from the viewer toward distant grain silos and harbor cranes, a row of streetlights along a fence; small and far in the middle of the road, the red two-seat roadster seen STRAIGHT FROM BEHIND driving AWAY from us: its two small round red TAIL LIGHTS glowing, the black soft-top roof silhouette, the glow of its raised headlights lighting the road AHEAD of it (we do NOT see its headlights or its front). Low camera from behind, slightly above the road. Keep one EMPTY white caption box across the top of the panel, inside the panel's borders only."
    keep: "every other panel exactly as it is, pixel for pixel; the panel border lines of the grey panel"
  panels:
  - {pos: top-right, action: unchanged, keep: true}
  - {pos: top-left, action: unchanged, keep: true}
  - {pos: middle-right, action: unchanged, keep: true}
  - {pos: middle-left, action: unchanged, keep: true}
  - {pos: "lower, wide", action: unchanged, keep: true}
  - pos: bottom-right
    action: The red roadster small and far, seen from behind driving away down the dark harbor road, tail lights glowing.
    cast:
    - {id: roadster, view: rear, state: headlights_up, camera: "low and far behind the car, straight from behind as it drives away toward the top of the panel; only the tail lights, rear bumper and soft-top silhouette show"}
  - {pos: bottom-center, action: unchanged, keep: true}
  - {pos: bottom-left, action: unchanged, keep: true}
  - {pos: "bottom, large", action: unchanged, keep: true}
