        action: Dai at the gate, guarded, eyes hard, not looking at him.
        cast: [dai:summer_school]
        dialogue:
          - dai: "IT WASN'T REFORM SCHOOL. IT WAS A PLACE."

  - page: 14
    title: Call me Nobu
    location: school-gate
    time: noon, hot August sun
    continue_from: 13
    panels:
      - pos: top-right
        action: Nobu, sincere, a small bow of the head.
        cast: [nobu]
        dialogue:
          - nobu: "SORRY."
      - pos: top-left
        action: Nobu brightening at once, holding up his test paper with a big red 71 on it.
        cast: [nobu]
        dialogue:
