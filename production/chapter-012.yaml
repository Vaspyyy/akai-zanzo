chapter: 12
title: Timing Belt
lettering: empty

# Reusable cast entries (YAML anchors). Free-text outfits use the character's default sheet.
x-cast:
  dai_yard: &dai_yard {id: dai_cut, outfit: "grey zip-up jacket half zipped over an old faded white gym T-shirt, worn jeans, beat-up white canvas sneakers; BARE hands with black grime in the knuckle creases"}
  dai_tee: &dai_tee {id: dai_cut, outfit: "old faded white gym T-shirt (no jacket), worn jeans, white socks indoors"}
  dai_night: &dai_night {id: dai_cut, outfit: "faded plain black T-shirt and loose grey sweatpants, barefoot"}
  dai_gak: &dai_gak {id: dai_cut, outfit: "black gakuran winter school uniform (stand collar open, worn carelessly), black trousers"}
  kubo_own: &kubo_own {id: kubo, outfit: own}
  sota_home: &sota_home {id: sota, outfit: "a long-sleeved striped T-shirt and shorts, socks, round glasses"}
  sota_pj: &sota_pj {id: sota, outfit: "long-sleeved striped cotton pajamas, round glasses"}
  aya_coat: &aya_coat {id: aya, outfit: "a plain light coat over her plain work blouse and dark trousers, a shoulder bag"}
  wreck_note: &wreck_note "The blue wreck's marks: faded grey paint chalky on top, WHITE left front fender, matte primer hood, RIGHT pop-up headlight stuck half up, crushed rear with the trunk lid peaked, soft top torn above the LEFT (passenger) seat. Right-hand drive."

defaults:
  orientation: portrait
  time: October 1995
  notes:
  - Right-to-left panel order. One speaker per panel. All cars are Japanese models sold by October 1995, right-hand drive.
  - No brand logos, no stickers, no readable signs or printed words anywhere unless a panel asks for them. No Japanese characters. No banknotes unless a panel asks for them.
  - Vary shot sizes and poses; no two panels on the page may look alike.

pages:

# ------------------------------------------------------------------ Sunday 8 Oct, 3:10 p.m.: Kubo at the gate
- page: 1
  title: Older than me
  location: tanabe-yard
  time: Sunday 3:10 p.m. in October, clear afternoon, the sun already lower in the west
  guards:
  - "Kubo (late 50s, grey cap) in his own clothes: an old faded light work jacket over a buttoned grey shirt, NOT the station uniform."
  - "Dai: SHORT black hair (forehead uncovered), grey zip-up jacket over a white gym T-shirt, jeans."
  panels:
  - pos: top, wide
    action: "The open gate of the scrapyard (corrugated fence, the grey prefab office to the left): Kubo riding in slowly on a small old green step-through motorbike with a battered red steel toolbox roped onto the rear rack behind him."
    cast:
    - *kubo_own
    captions:
    - KUBO-SAN CAME THROUGH TANABE-SAN'S GATE AT TEN PAST THREE ON SUNDAY AFTERNOON, ON A GREEN SUPER CUB.
  - pos: upper-right
    action: "Close on the battered red steel toolbox roped to the rack: the carry handle's paint worn away to bare grey metal in the shape of fingers."
    cast: [{id: supercub, camera: "extreme close-up of the toolbox handle on the rear rack from above"}]
    captions:
    - THE TOOLBOX WAS OLDER THAN ME. YOU COULD TELL FROM THE HANDLE.
  - pos: upper-left
    action: Dai standing by the big boxy car crusher with a broom in both hands, stopped mid-sweep, looking toward the gate.
    cast: [*dai_yard]
    captions:
    - I WAS SWEEPING ROUND THE PRESS. I STOPPED.
  - pos: middle-right
    location: harbor-station-night
    action: "Memory inset with a soft dark border, night: inside the lit station office booth, Kubo seated behind the counter with an open newspaper; through the window behind him a big white fish truck going past in the dark."
    cast: [kubo]
    dialogue:
    - kubo: WHAT DID IT DO?
    captions:
    - I'D TOLD HIM ON THURSDAY NIGHT, AT ABOUT FOUR, BETWEEN TWO FISH TRUCKS. NOT ALL OF IT.
  - pos: middle-left
    location: harbor-station-night
    action: "Memory inset, night: Dai in the grey station jacket standing in the office doorway, hands in his pockets, telling it flatly."
    cast: [dai_cut:station_jacket]
    dialogue:
    - dai_cut: DIED AT A RED LIGHT. IN MARCH. THE MAN SAT THERE TURNING THE KEY, AND A FISH TRUCK WENT INTO THE BACK OF HIM.
  - pos: lower-right
    location: harbor-station-night
    action: "Memory inset, night: close on Kubo's old hands turning a page of the newspaper, his face hidden behind it."
    cast: [{id: kubo, note: "only his hands and the newspaper"}]
    captions:
    - HE'D TURNED A PAGE OF HIS NEWSPAPER AND SAID NOTHING ELSE ALL NIGHT.
  - pos: lower-left
    action: "Daylight again: close on Dai's dirty hands dropping rusty bolts into a row of old coffee tins on a pallet."
    cast: [{<<: *dai_yard, note: "only his hands"}]
    captions:
    - THAT MORNING I'D STALLED FOUR TIMES INSTEAD OF ELEVEN. THEN I'D SWEPT, AND SORTED BOLTS, AND SWEPT AGAIN.
  - pos: bottom, wide
    action: "Kubo putting the green motorbike up on its stand beside the grey prefab office and getting off it slowly, one hand on the seat, his bad knee stiff."
    cast:
    - {id: supercub, camera: "side view of the bike's LEFT side at eye level, middle distance, its front pointing LEFT, parked by the office stair"}
    - *kubo_own
    captions:
    - I HADN'T EXPECTED ANYTHING ELSE FROM THE DAY.

# ------------------------------------------------------------------ Fumie on the step
- page: 2
  title: Still alive
  location: tanabe-yard
  time: Sunday about 3:15 p.m., clear afternoon sun from the west
  guards:
  - "Fumie (over sixty): short grey hair, white towel round her forehead, cigarette in the corner of her mouth, LEFT eye half shut, navy jacket with rolled sleeves. She stands on the office step."
  - "Kubo (late 50s, grey cap) in his own clothes, NOT the station uniform."
  panels:
  - pos: top-right
    action: Fumie standing on the step of the grey prefab office with her cigarette, arms folded, squinting at Kubo.
    cast: [fumie]
    dialogue:
    - fumie: KUBO.
    - fumie: STILL ALIVE.
  - pos: top-left
    action: Kubo standing by his parked motorbike, touching the peak of his cap, deadpan.
    cast: [*kubo_own]
    dialogue:
    - kubo: TANABE-SAN.
  - pos: middle-right
    action: Fumie talking round the cigarette, not moving from her step.
    cast: [fumie]
    dialogue:
    - fumie: IF YOU'VE COME TO BUY, I'M SHUT.
    - fumie: IF YOU'VE COME FOR THE BOY, HE'S WORKING.
  - pos: middle-left
    action: Kubo, unhurried, untying the rope that holds the red toolbox on the rack.
    cast: [*kubo_own]
    dialogue:
    - kubo: TILL FIVE.
  - pos: lower, wide
    action: "Fumie on the step, eyes going from the red toolbox to Dai standing a little way off with his broom; through the open office door behind her a small transistor radio on the windowsill."
    cast: [fumie, *dai_yard]
    captions:
    - SHE LOOKED AT THE TOOLBOX, AND AT ME WITH THE BROOM, FOR LONG ENOUGH THAT THE RADIO INSIDE FINISHED ONE ENKA AND STARTED ANOTHER.
  - pos: bottom-right
    action: Fumie turning to go back inside, jerking her chin toward the back of the yard.
    cast: [fumie]
    dialogue:
    - fumie: BEHIND THE COROLLAS.
    - fumie: HE SWEEPS THE OFFICE AFTER.
  - pos: bottom-left
    location: tanabe-weeds
    action: "Kubo carrying the red steel toolbox himself, low in one hand, limping on a stiff knee through waist-high yellow weeds past a stack of crushed white sedans; Dai a step behind him with empty hands."
    cast: [*kubo_own, *dai_yard]
    captions:
    - HE CARRIED IT HIMSELF, WITH HIS BAD KNEE GOING STIFF ON EVERY STEP. HE DIDN'T LET ME TAKE IT.

# ------------------------------------------------------------------ the walk round, the cat, the hood
- page: 3
  title: Nothing's dripped
  location: tanabe-weeds
  time: Sunday about 3:20 p.m., clear afternoon sun from the west
  notes: [*wreck_note]
  panels:
  - pos: top, wide
    action: "BIRD'S-EYE view from high on top of the crushed-car stack: the wreck sitting in its patch of dead weeds, and small Kubo walking round it, looking only at its tires; the trunk lid standing up in its peak, the white left fender, the torn roof."
    cast:
    - *kubo_own
    - {id: wreck, view: rear, camera: "almost straight down from high above, far, the whole car small in the weeds, its nose toward the TOP of the panel"}
    captions:
    - HE WALKED ROUND THE CAR ONCE, PAST THE WHITE FENDER AND THE FOLDED-UP BACK, AND LOOKED ONLY AT THE TIRES.
  - pos: upper-right
    action: "Kubo crouched at the front of the car with one hand on the bumper, peering at the ground under the engine: the weeds there dead and dry, no dark patch."
    cast:
    - *kubo_own
    - {id: wreck, view: front34, camera: "low, ground level, just the front bumper and the shadow under the engine, from the front-RIGHT corner"}
    dialogue:
    - kubo: NOTHING'S DRIPPED.
  - pos: upper-left
    action: "Looking down through the big tear in the grey soft top: the scruffy striped cat with half a tail lying on the passenger seat in a patch of sun, staring straight up at us."
    cast: [cat]
  - pos: middle-right
    action: Close on Kubo's lined face staring back at the cat, expressionless.
    cast: [*kubo_own]
  - pos: middle-left
    action: Dai beside the driver's door, a little embarrassed.
    cast: [*dai_yard]
    dialogue:
    - dai_cut: IT CAME WITH THE CAR.
  - pos: lower-right
    action: "Close inside the old moldy footwell: Dai's hand reaching under the dashboard by his knee and pulling the hood-release lever."
    cast: [{<<: *dai_yard, note: "only his hand and sleeve"}]
    sfx: [KAKON]
  - pos: lower-left
    action: "Close on the front edge of the primer-grey hood, popped up a finger's width; Kubo's old fingers slipping under it and finding the catch without looking."
    cast: [{<<: *kubo_own, note: "only his hand"}]
  - pos: bottom, wide
    action: "Kubo lifting the primer-grey hood up and setting the thin prop rod; Dai at the white left fender looking in beside him."
    cast:
    - *kubo_own
    - *dai_yard
    - {id: wreck, view: front34, camera: "eye level, straight on from just in front of the nose, close: only the raised hood and the two men behind it, the half-up right headlight on the image LEFT"}
    captions:
    - HE LIFTED THE HOOD AND SET THE ROD, AND WE BOTH LOOKED IN.

# ------------------------------------------------------------------ dust, the dipstick, the battery
- page: 4
  title: Black, not white
  location: tanabe-weeds
  time: Sunday about 3:25 p.m., clear afternoon sun
  notes: [*wreck_note]
  panels:
  - pos: top, large
    action: "BIG: looking down into the dusty engine bay over the left fender: grey dust over everything, a drift of dry leaves in the corner by the windshield, brown cat hair on every surface, the long low engine with its ribbed cam cover across the top."
    cast: [{id: wreck, view: engine, camera: "from above the left fender looking down and forward into the bay"}]
    captions:
    - DUST. DRY LEAVES, AND CAT HAIR ON EVERYTHING, AND UNDER ALL THAT THE ENGINE, LONG AND LOW.
    - I'D NEVER OPENED IT. I HADN'T WANTED TO LOOK AT SOMETHING I DIDN'T KNOW HOW TO READ.
  - pos: middle-right
    action: Kubo drawing out the long dipstick and wiping it between his thumb and finger.
    cast: [*kubo_own]
  - pos: middle-left
    action: "Close on Kubo's fingertips rubbing a smear of black oil, held under his nose; he smells it."
    cast: [{<<: *kubo_own, note: "only his fingers and the lower half of his face"}]
    dialogue:
    - kubo: BLACK. NOT WHITE. NO WATER IN IT.
  - pos: lower-right
    action: Kubo sliding the dipstick back in, glancing round the bay.
    cast: [*kubo_own]
    dialogue:
    - kubo: BATTERY.
  - pos: lower-left
    action: Dai pointing back at the crushed trunk with his thumb.
    cast: [*dai_yard]
    dialogue:
    - dai_cut: IN THE TRUNK. THE TRUNK DOESN'T OPEN.
  - pos: bottom-right
    location: tanabe-yard
    action: "Kubo walking back from the office through the weeds carrying a car battery against his stomach in both arms; a white chalk tick on its top."
    cast: [*kubo_own]
    captions:
    - A BATTERY FROM THE SHELF BY THE OFFICE DOOR, THE ONES TANABE-SAN TAKES OUT OF WRECKS AND CHARGES.
  - pos: bottom-left
    action: "Low close by the front left wheel: the battery set down on a flattened piece of cardboard in the weeds; Kubo's hands lifting a pair of jump leads out of the toolbox drawer, wound up neat and tied with string."
    cast: [{<<: *kubo_own, note: "only his hands"}]

# ------------------------------------------------------------------ the leads, get in
- page: 5
  title: Turn it when I say
  location: tanabe-weeds
  time: Sunday about 3:30 p.m., clear afternoon sun
  notes: [*wreck_note]
  panels:
  - pos: top-right
    action: "Close in the engine bay: Kubo's index finger tracing a thick battery cable forward along the inner wing to a bolt under a red rubber cap."
    cast:
    - {<<: *kubo_own, note: "only his hand"}
    - {id: wreck, view: engine, camera: "close on the inner wing and the cable from the side"}
  - pos: top-left
    action: Close on the red clamp's teeth biting onto the bare bolt, the rubber cap folded back.
    cast: [{<<: *kubo_own, note: "only his fingers"}]
    sfx: [KACHI]
  - pos: middle-right
    action: "Close on the black clamp scratching once across a bare metal bracket on the side of the engine, then clamping on."
    cast: [{<<: *kubo_own, note: "only his hand"}]
    sfx: [GARI]
  - pos: middle-left
    action: Kubo straightening up beside the raised hood, wiping his fingers on his trousers.
    cast: [*kubo_own]
    dialogue:
    - kubo: THE OLD ONE'LL DRINK SOME OF IT. DOESN'T MATTER.
  - pos: lower, wide
    action: Kubo looking straight at Dai across the raised hood, giving orders.
    cast: [*kubo_own]
    dialogue:
    - kubo: GET IN. CLUTCH TO THE FLOOR. NEUTRAL.
    - kubo: TURN IT WHEN I SAY. STOP WHEN I SAY.
  - pos: bottom-right
    action: "Inside the car, seen from behind the seats: Dai dropping into the RIGHT (driver's) seat behind the wheel on the image RIGHT; on the image LEFT the cat standing up off the passenger seat, stretching, and climbing out through the tear in the roof above it without hurrying."
    cast:
    - *dai_yard
    - cat
    - {id: wreck, view: interior, camera: "from behind and above the two seats, looking forward at the raised hood through the windshield"}
    captions:
    - THE CAT STOOD UP, AND STRETCHED, AND WENT OUT THROUGH THE TEAR IN THE TOP WITHOUT HURRYING.
  - pos: bottom-center
    action: "Close in the footwell and console: Dai's sneaker pushing the clutch pedal to the floor; his LEFT hand on the gear lever, which wobbles loose."
    cast: [{<<: *dai_yard, note: "only his left hand on the lever and his sneaker on the clutch"}]
    captions:
    - THE LEVER WOBBLED LOOSE IN THE MIDDLE.
  - pos: bottom-left
    action: "Close on the dashboard: the key turned one click, and two small warning lamps lit, a battery shape and an oil-can shape, glowing in the dim cabin."
    cast: [{id: wreck, view: interior, camera: "close on the instrument cluster from the driver's eye line"}]
    captions:
    - TWO RED LIGHTS CAME ON IN THE DASH. THE SAME TWO AS IN HERS.

# ------------------------------------------------------------------ the starter
- page: 6
  title: Half of it isn't pushing back
  location: tanabe-weeds
  time: Sunday about 3:35 p.m., clear afternoon sun
  notes: [*wreck_note]
  panels:
  - pos: top-right
    action: Dai in the driver's seat, very still, looking down at the two lit lamps; the raised hood fills the windshield in front of him.
    cast:
    - *dai_yard
    - {id: wreck, view: interior, camera: "from the passenger seat across to Dai"}
    captions:
    - I SAT THERE AND LOOKED AT THEM.
  - pos: top-left
    action: Kubo at the front of the car beside the raised hood, one hand lifted.
    cast: [*kubo_own]
    dialogue:
    - kubo: NOW.
  - pos: middle, wide
    action: "Close on Dai's hand twisting the key hard; jagged sound effect lettering across the panel, the engine bay shuddering lightly through the gap under the raised hood."
    cast: [{<<: *dai_yard, note: "only his hand and wrist on the key"}]
    sfx: [RRR-RRRR-RR-RRRR]
    captions:
    - AT THE STATION I'D HEARD A HUNDRED CARS START. EVERY STARTER HAS A LIMP IN IT. UH, UH, UH, UH. STEADY, EVERY TIME A PISTON HAS TO COME UP AND SQUEEZE.
  - pos: lower-right
    action: "Close on the dusty engine, a blur of vibration lines, the fan pulley spinning fast."
    cast: [{id: wreck, view: engine, camera: "close on the front of the engine at fender height"}]
    captions:
    - THIS ONE LIMPED ON SOME BEATS AND SKIPPED OTHERS, TOO QUICK AND TOO LIGHT. IT SPUN LIKE IT HAD ALMOST NOTHING TO PUSH.
  - pos: lower-left
    action: Kubo's raised hand closing into a fist.
    cast: [*kubo_own]
    dialogue:
    - kubo: STOP.
  - pos: bottom-right
    action: "Silent: the tops of the crushed-car stacks against the sky, one gull gliding over them."
    captions:
    - THE QUIET CAME BACK. A GULL, SOMEWHERE OVER THE STACKS.
  - pos: bottom-center
    action: "Kubo standing at the front of the car with his head DOWN and his hands hanging at his sides, eyes on nothing, listening; sound lettering from the starter behind him."
    cast: [*kubo_own]
    dialogue:
    - kubo: AGAIN.
    sfx: [{text: RRR-RR-RRRR, note: small}]
  - pos: bottom-left
    action: "Memory inset with a soft border, summer daylight under the concrete canopy of a small old gas station by the harbor: an old boxy sedan rolling in, squeal lines from its engine; Kubo in his grey station uniform sitting on a stool, NOT turning his head."
    cast: [kubo]
    captions:
    - IN AUGUST AN OLD SEDAN HAD COME IN SQUEALING, AND HE'D SAID "BELT'S GOING" WITHOUT TURNING HIS HEAD.

# ------------------------------------------------------------------ the cam
- page: 7
  title: That's a cam
  location: tanabe-weeds
  time: Sunday about 3:40 p.m., clear afternoon sun
  notes: [*wreck_note]
  panels:
  - pos: top-right
    action: Kubo half turned toward the driver's window, waiting.
    cast: [*kubo_own]
    dialogue:
    - kubo: STOP. WHAT DO YOU HEAR?
  - pos: top-left
    action: Dai in the driver's seat, frowning, thinking hard, one hand still on the key.
    cast: [*dai_yard]
    captions:
    - I THOUGHT ABOUT IT.
  - pos: middle-right
    action: Dai leaning out of the open driver's door, sure of it.
    cast: [*dai_yard]
    dialogue:
    - dai_cut: IT'S TOO FAST.
    - dai_cut: HALF OF IT ISN'T PUSHING BACK.
  - pos: middle-left
    action: "Kubo unscrewing the round oil filler cap from the top of the cam cover; the cap set upside down on the fender. A small nod."
    cast: [*kubo_own]
    captions:
    - HE NODDED.
  - pos: lower-right
    action: Kubo holding out a heavy black flashlight to Dai, pointing at the filler hole with his chin.
    cast: [*kubo_own]
    dialogue:
    - kubo: SHINE IT DOWN THERE. TELL ME WHEN THAT MOVES.
  - pos: lower-left
    action: "Extreme close-up in the flashlight beam, down the round filler hole: under a shine of old oil a curved steel shape like the top of an egg, with one drop of oil hanging off it."
    dialogue:
    - {speaker: kubo, text: "THAT'S A CAM. WHEN THE ENGINE TURNS, THAT TURNS.", offpanel: true}
  - pos: bottom-right
    action: "Kubo getting down slowly onto a flattened cardboard box in the weeds, one knee and then the other, a long steel bar and a big socket in his hand."
    cast: [*kubo_own]
    captions:
    - HE GOT DOWN THEN. SLOWLY, ONE KNEE AND THEN THE OTHER.
  - pos: bottom-left
    action: "Low side view: Kubo on his back, sliding in under the front of the car, only his legs and boots sticking out; Dai standing at the white left fender, bent over the engine with the flashlight."
    cast:
    - *kubo_own
    - *dai_yard
    - {id: wreck, view: side, camera: "at ground level, side-on to the car's LEFT (passenger) side, only the front half of the car, its front pointing LEFT"}
    sfx: [KACHA, {text: GIIIII, note: a long creak}]

# ------------------------------------------------------------------ nothing moves; the cover comes off
- page: 8
  title: Once round
  location: tanabe-weeds
  time: Sunday about 3:45 p.m., clear afternoon sun
  notes: [*wreck_note]
  panels:
  - pos: top-right
    action: Dai bent over the filler hole with the flashlight, eyes fixed on it.
    cast: [*dai_yard]
    dialogue:
    - {speaker: kubo, text: "WELL?", offpanel: true}
  - pos: top-left
    action: "Extreme close-up of the same curved steel cam in the beam: it hasn't moved; the drop of oil still hanging, not fallen."
    dialogue:
    - {speaker: dai_cut, text: NOTHING., offpanel: true}
  - pos: middle-right
    action: Kubo's boots sticking out from under the front bumper, the toes pushing as he heaves on the bar.
    cast: [{<<: *kubo_own, note: "only his legs and boots"}]
    sfx: [GIII, GIII]
    dialogue:
    - {speaker: kubo, text: "THAT'S ONCE ROUND. DOWN HERE.", offpanel: true}
  - pos: middle-left
    action: Kubo standing again with one hand flat on the fender, waiting for his knee to let him go, face tight.
    cast: [*kubo_own]
    captions:
    - HE CAME OUT, WHICH TOOK LONGER THAN GOING IN.
  - pos: lower-right
    action: "Close on the open top drawer of the red toolbox: a rail of sockets in order; Kubo's hand coming out with the right one without looking."
    cast: [{<<: *kubo_own, note: "only his hand"}]
  - pos: lower-left
    action: "Close on the fender: small bolts laid out in a neat row in the order they came out, Kubo's thumb wiping the last one before he sets it down."
    cast: [{<<: *kubo_own, note: "only his hand"}]
    captions:
    - HE WIPED EACH ONE WITH HIS THUMB BEFORE HE PUT IT DOWN.
  - pos: bottom, large
    action: "Close on the front of the engine with the black plastic upper cover lifted away: two toothed pulleys side by side, each as big as a saucer, with NOTHING round them."
    cast:
    - {<<: *kubo_own, note: "only his hands lifting the cover away at the edge of the panel"}
    - {id: wreck, view: engine, camera: "straight at the front of the engine, close, slightly from above"}
    captions:
    - THE COVER CAME OFF. BEHIND IT WERE TWO PULLEYS WITH TEETH ROUND THE EDGE, EACH AS BIG AS A SAUCER.

# ------------------------------------------------------------------ the belt, the tooth
- page: 9
  title: There
  location: tanabe-weeds
  time: Sunday about 3:50 p.m., clear afternoon sun
  guards:
  - "Dai's LEFT palm shows a thin pink healed line across the heel of the hand under the thumb; no bandage."
  panels:
  - pos: top, wide
    action: "Close: the broken black toothed belt lying in a loose loop down past the bare pulleys into the dark behind the lower covers; one hand-long stretch stripped flat, no teeth, threads fraying out of its edges, snapped right through next to it."
    cast: [{id: wreck, view: engine, camera: "close, looking down past the pulleys into the gap behind the lower covers"}]
    captions:
    - ROUND THEM SHOULD HAVE GONE A BELT. THERE WAS NOTHING ROUND THEM.
  - pos: upper-right
    action: "Close on the inside bottom edge of the removed plastic cover: a little line of black crumbs caught along it."
    captions:
    - INSIDE THE COVER, CAUGHT ALONG ITS BOTTOM EDGE, THERE WERE BLACK CRUMBS.
  - pos: upper-left
    action: "Kubo holding one crumb up to the light between his finger and thumb: a tiny square rubber tooth."
    cast: [*kubo_own]
    dialogue:
    - kubo: THERE.
  - pos: middle, wide
    action: "Close on Dai's open LEFT palm with its thin pink healed line; Kubo's old fingers dropping the tiny square rubber tooth into it."
    cast:
    - {<<: *dai_yard, note: "only his open left hand"}
    - {<<: *kubo_own, note: "only his fingers"}
    captions:
    - A RUBBER TOOTH, SMALLER THAN MY LITTLE FINGERNAIL. IT WEIGHED NOTHING.
  - pos: lower-right
    action: Kubo pointing down with the ratchet toward the bottom pulley where his bar had been.
    cast: [*kubo_own]
    dialogue:
    - kubo: THE BOTTOM OF THE ENGINE TURNS THE TOP.
    - kubo: CRANK DOWN THERE. CAMS UP HERE.
  - pos: lower-left
    action: Close on the ratchet tip pointing up at the two bare toothed pulleys.
    cast: [{<<: *kubo_own, note: "only his hand and the ratchet"}]
    dialogue:
    - {speaker: kubo, text: "THE CAMS OPEN THE VALVES. THAT BELT HOLDS THE TWO TOGETHER.", offpanel: true}
  - pos: bottom-right
    action: Kubo's lined face, flat and certain.
    cast: [*kubo_own]
    dialogue:
    - kubo: BELT GOES, THE BOTTOM KEEPS TURNING. THE TOP STOPS.
  - pos: bottom-left
    action: Kubo turning the stripped piece of belt over to the light between finger and thumb, studying it.
    cast: [*kubo_own]
    dialogue:
    - kubo: SOMETHING'S BEEN EATING THAT BELT. PROBABLY THE TENSIONER.
    - kubo: WE'LL SEE WHEN IT'S APART.

# ------------------------------------------------------------------ March; the valves
