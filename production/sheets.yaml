# Character reference sheets made with the pipeline (kind: sheet).
# One character per sheet (prompts/art-direction.md).
title: Character sheets
output_dir: artwork/character-sheets
defaults:
  kind: sheet

pages:
  - id: nobu
    refs:
      - {path: artwork/character-sheets/akane.png, use: "an approved sheet of this manga: copy ONLY its layout (turnaround left, expression grid right, one detail panel) and its ink and screentone style; NOT her face, hair or clothes"}
    description: >-
      Character sheet for NOBUYUKI "NOBU" KAWAMATA, 17, a Japanese high-school
      boy in 1995 whose family runs a small ramen shop by the station. About
      165 cm, stocky and soft (a little belly, thick arms), round full face with
      chubby cheeks, very short BUZZ-CUT black hair so the whole forehead shows,
      thick straight eyebrows, small bright eyes, a big expressive mouth. No
      glasses, no earrings. Clothes: summer school uniform, a white short-sleeved
      button shirt worn untucked and a little tight over the belly, black school
      trousers, indoor school shoes with the heels trodden flat; a worn canvas
      school bag on a strap. Left half: full-body turnaround (front, three-quarter,
      side profile, back), standing relaxed, leaning slightly forward. Right half:
      four head close-ups: an excited open-mouthed grin while talking fast; a
      sheepish apologetic face with one hand raised ("sorry, sorry"); a careful,
      serious face; laughing with his eyes squeezed shut. Detail sketch: his
      hands holding a soft, rolled-up car magazine and a cardboard disposable
      camera. He must look completely different from a lean, sharp-eyed boy
      with long messy hair: short, round, buzz-cut, friendly.

  - id: hotta
    refs:
      - {path: production/runs/ref-src/hotta-ch4.png, use: "two approved panels of HOTTA-SENSEI from chapter 4: copy his face, receding hair, thin build, towel, tie and owl fan exactly"}
      - {path: artwork/character-sheets/nobu.png, use: "an approved sheet of this manga: copy ONLY its layout (turnaround left, expression grid right, one detail panel) and its ink and screentone style; NOT his face or body"}
    description: >-
      Character sheet for HOTTA-SENSEI, a Japanese high-school homeroom and
      English teacher in 1995, late 40s: thin and tired, sunken cheeks, a long
      lined face, heavy-lidded weary eyes, receding black hair, damp and
      slightly messy, combed back. Clothes: a pale short-sleeved shirt with a
      loosened dark tie, grey slacks, plain shoes, a white towel hung round
      his neck. He carries a round flat paper uchiwa fan printed with a
      cartoon owl. Left half: full-body turnaround (front, three-quarter,
      side profile, back), standing slightly stooped, fanning himself. Right
      half: four head close-ups: weary half-closed eyes while talking; a
      level, serious look straight at the viewer; looking sideways out of a
      window; wiping his neck with the towel. Detail sketch: the round owl fan
      held up close. He must match the chapter-4 panels
      exactly and look nothing like the stocky buzz-cut boy on the layout
      sheet.

  - id: okabe
    refs:
      - {path: artwork/character-sheets/nobu.png, use: "Copy ONLY the sheet layout and ink style, not the face or clothes"}
    description: >-
      One character only: OKABE, Japanese tire-shop bookmaker in his forties,
      soft round face, short dark hair, reading glasses pushed up on his forehead,
      plain unmarked polo shirt and ordinary trousers. Tire hands black in the
      finger creases, nails short and clean. Turnaround front, side and back;
      expressions counting, amused, watching over glasses, calling odds. Detail:
      his hands with a grey metal cash box and blue spiral school notebook with
      pencil. Late-1990s seinen manga ink and screentone. No other characters.

  - id: officer
    refs:
      - {path: artwork/character-sheets/okabe.png, use: "an approved sheet of this manga: copy ONLY its layout (turnaround left, expression close-ups right, detail sketches) and its ink and screentone style; NOT his face, body or clothes"}
    description: >-
      One character only: an OLDER Japanese POLICE OFFICER in 1995, late 40s,
      about twenty years older than his young partner. Solid and a little heavy
      in the middle, a broad calm face with a heavy jaw and patient
      heavy-lidded eyes, short black hair going GREY at the temples under his
      peaked police cap. Clothes: 1995 Japanese police summer uniform, a pale
      short-sleeved shirt with two buttoned breast-pocket flaps and shoulder
      straps, a small badge, dark trousers, a black duty belt with a holstered
      revolver, a peaked cap with a badge, polished black shoes. Left half:
      full-body turnaround (front, three-quarter, side profile, back),
      standing still with his hands at his sides. Right half: four head
      close-ups: looking at something far away for a long time, unreadable;
      the cap's brim shadowing his eyes; bending with one hand on his thigh;
      a faint tired half-smile. Detail sketches: his black shoes from behind
      showing the heels worn down on the OUTSIDE edges; his fingers buttoning
      a folded scrap of paper into his breast pocket. Late-1990s seinen manga
      ink and screentone. No other characters.

  # ---- added for chapter 8 (2026-11-18)
  - id: fumie
    refs:
      - {path: artwork/character-sheets/officer.png, use: "an approved sheet of this manga: copy ONLY its layout (turnaround left, expression close-ups right, detail sketches) and its ink and screentone style; NOT his face, body or clothes"}
    description: >-
      One character only: FUMIE TANABE, the owner of a scrapyard in a 1995
      Japanese harbor town, over sixty. Small and SQUARE, short and sturdy,
      about 150 cm. Grey hair cut as short as a man's, a white towel tied round
      her forehead like a headband. A weathered brown face with deep lines, a
      flat nose, sharp amused eyes; a cigarette always stuck in the corner of
      her mouth, her LEFT eye half shut against its smoke. Her hands are
      brown, thick and strong, too big for the rest of her; the LEFT thumbnail
      is black and half grown out. Clothes: a man's navy work jacket (dark
      grey tone), too big for her, with an orange stitched name patch over the
      breast pocket (no readable letters), the sleeves rolled up four times
      into thick cuffs; dark work trousers; scuffed safety boots with the
      steel showing through at the toes. Left half: full-body turnaround
      (front, three-quarter, side profile, back), standing square with her
      fists on her hips. Right half: four head close-ups: a dry sideways look
      with smoke curling up past the half-shut left eye; laughing through her
      nose with two lines of smoke; haggling, one thick finger raised; a
      quiet, faraway look. Detail sketches: her big thick hands (black left
      thumbnail) peeling a pear with a folding knife; one hand in a brown
      leather work glove. Late-1990s seinen manga ink and screentone. No
      other characters, no vehicles.

  # ---- added for chapter 9 (2026-11-18)
  - id: dai-haircut
    refs:
      - {path: artwork/character-sheets/dai.png, use: "this SAME boy, Dai: copy his face, thin build, narrow sharp eyes and the sheet layout and ink style exactly; ONLY his hair is different now (cut short, see the description)"}
    description: >-
      One character only: DAISUKE "DAI" HAYAMA, 17, the same lean, wiry
      Japanese high-school boy as on the reference sheet, same thin face and
      narrow guarded eyes, but with a FRESH SHORT HAIRCUT that his sister just
      gave him: the black hair is short and neat, the sides cut short above
      the ears, the back cut off the collar, and the bangs cut straight across
      a finger's width ABOVE his eyebrows, so his whole forehead and both
      eyebrows are uncovered. Through his LEFT eyebrow (on the image RIGHT when
      he faces us) runs a short pale scar line where no hair grows, about as
      long as a little fingernail. He looks younger and more exposed, like
      "somebody's son". Clothes: a crisp white short-sleeved summer school
      shirt buttoned all the way to the top, tucked into black school
      trousers, beat-up white canvas sneakers with a strip of tape on the
      right one; a clean white bandage wrapped round his LEFT palm and wrist.
      Left half: full-body turnaround (front, three-quarter, side profile,
      back) standing straight, hands at his sides. Right half: four head
      close-ups with the short hair: neutral and guarded; jaw set, staring
      straight ahead; eyes lowered; a large close-up of the forehead and the
      scar through the left eyebrow. Detail sketch: his bandaged left hand
      closed into a fist on his knee. Late-1990s seinen manga ink and
      screentone. No other characters.

  - id: akane-nurse
    refs:
      - {path: artwork/character-sheets/akane.png, use: "this SAME young woman, Akane: copy her face, eyes, earring and the sheet layout and ink style exactly; ONLY her clothes and hair-do are different (see the description)"}
    description: >-
      One character only: AKANE NATSUME, 21, the same tall young Japanese
      woman as on the reference sheet, same calm, unreadable half-lidded eyes
      and small earring, now at work as a night-shift emergency-room nurse in
      a 1995 Japanese city hospital. Her long straight black hair is pinned
      UP off her neck, all of it, in a tight neat bun at the back of the head,
      no loose ponytail. Clothes: a plain WHITE short-sleeved nurse's tunic
      with a small collar and buttons, white straight nurse's trousers, white
      flat nurse's shoes; a small round nurse's watch pinned upside down to
      the front of the tunic on the left breast; a pen in the breast pocket;
      no cap, no gloves. Bare hands with short nails. Left half: full-body
      turnaround (front, three-quarter, side profile, back) standing straight
      with a clipboard held against her chest with one arm. Right half: four
      head close-ups: reading the clipboard, eyes down; looking up straight at
      the viewer, unreadable; a level, tired look; three-quarter view showing
      the tight bun. Detail sketches: the upside-down watch pinned to the
      tunic; her bare hand writing on a clipboard. Late-1990s seinen manga
      ink and screentone. No other characters.

  - id: sugimoto
    refs:
      - {path: artwork/character-sheets/officer.png, use: "an approved sheet of this manga: copy ONLY its layout (turnaround left, expression close-ups right, detail sketches) and its ink and screentone style; NOT his face, body or clothes"}
    description: >-
      One character only: SUGIMOTO, the personnel manager of a Japanese
      brake-parts factory in 1995, about fifty. Medium height, a little soft
      round the middle, neat side-parted black hair thinning at the crown,
      rimless rectangular glasses, a smooth, careful, polite office face with
      tired eyes. Clothes: a plain dark grey suit, white shirt, dark narrow
      tie, a company pin on the lapel. Left half: full-body turnaround
      (front, three-quarter, side profile, back), standing with a folder
      under one arm. Right half: four head close-ups: reading a paper with
      his eyes lowered; looking up over the glasses, waiting; a polite
      neutral nod; clicking a ballpoint pen by his chin. Detail sketches: his
      hand clicking a ballpoint pen over an open folder. Late-1990s seinen
      manga ink and screentone. No other characters.

  - id: line-worker
    refs:
      - {path: artwork/character-sheets/officer.png, use: "an approved sheet of this manga: copy ONLY its layout (turnaround left, expression close-ups right, detail sketches) and its ink and screentone style; NOT his face, body or clothes"}
    description: >-
      One character only: an OLD Japanese factory line worker in 1995, about
      sixty, who sits on an interview panel. Broad and heavy-shouldered, a
      weathered square face with deep lines, grey stubble, grey hair cropped
      very short, small steady eyes under heavy brows. Clothes: a grey
      zip-up factory work jacket (mid-grey tone) with a small plain patch
      over the breast pocket (no letters), a white shirt collar under it,
      grey work trousers. His HANDS are big and heavy with the creases
      stained grey, like pencil. Left half: full-body turnaround (front,
      three-quarter, side profile, back), standing with his big hands loose.
      Right half: four head close-ups: looking at someone steadily without
      blinking; looking down at his hands; speaking slowly, rough; a faint
      nod. Detail sketches: his big grey-creased hands folded on a table,
      then folded the other way round. Late-1990s seinen manga ink and
      screentone. No other characters.
