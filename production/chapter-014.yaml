    cast: [{<<: *dai_night, note: "tiny, asleep"}]
    captions:
    - I DON'T KNOW WHEN I WENT TO SLEEP.
  - pos: bottom, large
    location: bypass-overpass-dawn
    action: "Dawn: Dai waking, hunched and shivering against the railing; the lamp at the top of the stairs still on; behind the harbor cranes the sky pale along the bottom."
    cast: [*dai_night]
    captions:
    - WHEN I WOKE UP I WAS COLD ALL THE WAY THROUGH, AND IT WAS HALF PAST FIVE. BEHIND THE CRANES THE SKY HAD STOPPED BEING BLACK ALONG THE BOTTOM.

- page: 47
  title: Into hours
  location: bypass-overpass-dawn
  time: Sunday 5:30 a.m., first grey dawn, the stair lamp still on
  guards:
  - *night_dai
  - *dry_night
  - *notes_95
  panels:
  - pos: top-right
    action: "Close under the lamp: Dai's hands holding two 10,000-yen notes, one 5,000-yen note, three 1,000-yen notes and a few coins."
    cast: [{<<: *dai_night, note: "only his hands"}]
    captions:
    - TWO 10,000S. A 5,000. THREE 1,000S. 97 YEN IN COINS.
  - pos: top-left
    action: "Dai folding the 5,000 and two 1,000s together small and buttoning them into his shirt pocket."
    cast: [*dai_night]
    captions:
    - THE 5,000 AND TWO 1,000S, FOLDED SMALL, INTO MY SHIRT POCKET. TANABE-SAN'S. KUBO-SAN'S SIX WOULD COME OUT OF A 10,000.
  - pos: middle, wide
    action: "Dai standing at the railing in the grey light, looking down the curve, working it out."
    cast: [*dai_night]
    captions:
    - EIGHTEEN THOUSAND. TWO THOUSAND MORE THAN THE BOY WHO'D DRIVEN. I DID IT IN HOURS, BECAUSE THAT'S WHAT I DO.
    - FIFTY-ONE HOURS AND TWENTY-SIX MINUTES AT THE PUMPS. SIX NIGHTS, AND A PIECE OF A SEVENTH. I'D STOOD ON A BOLLARD FOR ABOUT FOUR MINUTES.
  - pos: lower, large
    action: "BIG wide dawn view from above: the first car of the morning, an ordinary small sedan with its headlights still on, coming round the long left-hand curve of the empty four-lane bypass, not fast, about to pass under the overpass; Dai small at the railing above; pale sky over the factories."
    cast: [{<<: *dai_night, note: "small at the railing"}]
    captions:
    - THE FIRST CAR OF THE MORNING CAME ROUND THE LEFT-HANDER WITH ITS HEADLIGHTS STILL ON, NOT FAST, AND WENT UNDER MY FEET.
  - pos: bottom, wide
    action: "Close on Dai's hand pushing the rest of the folded notes into his jeans pocket; the jacket pocket with the gloves above it."
    cast: [{<<: *dai_night, note: "only his hand"}]
    captions:
    - I PUT THE REST BACK IN MY TROUSER POCKET. NOT IN THE JACKET, WITH THE GLOVES AND SOTA'S LIST AND THE TOOTH.
