# Location registry.
#
# plate:    clean, EMPTY reference plate (no people, no cars) in artwork/locations/.
#           The builder attaches it whenever a page uses this location.
# sources:  approved pages that show the place. Used to generate the plate, and
#           as a fallback reference while the plate does not exist yet (the
#           builder then warns, because those pages contain people and cars).
# guards:   lines added to every prompt that uses this location.
#           The global car-leak guard ("no small roadster or sports car") is
#           added automatically unless the page lists the Roadster.
# default_time: used when a page does not set `time`.

harbor-station-night:
  name: harbor gas station at night
  description: >-
    Small, shabby 24-hour full-service gas station on the harbor road of a
    1990s Japanese port city. A flat concrete canopy with stained, peeling
    pillars and long fluorescent tube lights; two old analog fuel pumps on a
    concrete island; a small office booth with big windows, wooden lower walls,
    an air-conditioner box and posters; chain-link fence; warehouses and stacked
    shipping containers along the dark road; a harbor crane far off; orange
    sodium street lamps receding down the road.
  plate: artwork/locations/harbor-station-night.png
  # sources dropped 2026-11-15: the old ones were rainy or contained the Roadster;
  # the dry plate was redrawn from the previous (wet) plate, see plates.yaml.
  sources: []
  default_time: night

harbor-station-day:
  name: harbor gas station by day
  description: >-
    The same small, shabby full-service gas station on the harbor road in
    daylight: flat concrete canopy on stained pillars, two old analog pumps on a
    concrete island, the small office booth with big windows, oil drums, cracked
    concrete forecourt with weeds; harbor cranes, water and container stacks
    behind a chain-link fence; summer clouds.
  plate: artwork/locations/harbor-station-day.png
  sources:
    - artwork/pages/chapter-002/page-06.png
    - artwork/pages/chapter-002/page-07.png
  default_time: day

harbor-road-night:
  name: harbor road at night
  description: >-
    A wide, empty two-lane road through the harbor district at night: warehouse
    walls and stacked shipping containers on one side, chain-link fence and the
    dark water with cranes on the other, sparse orange sodium street lamps,
    painted lane lines on DRY asphalt.
  plate: artwork/locations/harbor-road-night.png
  sources: []  # the old rainy ch2 pages made every plate wet; redrawn dry 2026-11-15
  default_time: night

harbor-road-day:
  name: harbor road by day
  description: >-
    The harbor road in daylight: trucks, forklifts, warehouse walls, container
    stacks, cranes and gulls, chain-link fence along the water.
  sources:
    - artwork/pages/chapter-002/page-06.png
  default_time: day

bypass-overpass-night:
  name: pedestrian overpass over the Shiomi Bypass at night
  description: >-
    A concrete pedestrian overpass with a tall steel safety railing crossing a
    FOUR-lane bypass (two lanes each way, concrete median barrier) right at a
    long sweeping left-hand curve. Orange sodium street lamps on tall poles
    along the road, factory chimneys and industrial buildings on the horizon,
    dark sky. Seen from the overpass walkway looking down the curve.
  plate: artwork/locations/bypass-overpass-night.png
  sources:
    - artwork/pages/chapter-001/page-06.png
  guards:
    - The road under the overpass has FOUR lanes (two each way) with a median barrier.
    - Anyone on the overpass stays safely on the walkway behind the tall railing.
  default_time: night

hayama-apartment:
  name: Hayama apartment (kitchen and tatami room)
  description: >-
    A cramped, worn 2DK apartment in an aging 1970s concrete danchi block:
    tiny kitchen with an old sink, gas burner and a low table with cushions;
    sliding fusuma doors open onto a tatami room with a folded futon; old CRT
    television, rotary electric fan, laundry hanging indoors on a pole, wall
    calendar, small cabinet with a lace doily; a steel front door with a
    genkan step and a shoe cabinet.
  plate: artwork/locations/hayama-apartment.png
  sources:
    - artwork/pages/chapter-001/page-02.png
    - artwork/pages/chapter-002/page-04.png
  default_time: evening

danchi-walkway:
  name: danchi outdoor walkway and stairs
  description: >-
    The open-air concrete corridor outside the Hayama apartment on an upper
    floor of an old danchi block: a row of steel apartment doors with small
    windows and meter boxes on one side, a waist-high concrete parapet with a
    metal rail on the other, a fluorescent ceiling light, an outdoor concrete
    staircase going down at the end; neighbouring danchi blocks, power lines
    and utility poles beyond.
  plate: artwork/locations/danchi-walkway.png
  sources:
    - artwork/pages/chapter-002/page-29.png
  default_time: dawn

danchi-exterior:
  name: danchi block from outside
  description: >-
    An aging five-storey concrete danchi housing block, balconies with laundry
    and futons hung out, power lines and a utility pole in front, a narrow
    street with a drink vending machine.
  sources:
    - artwork/pages/chapter-002/page-01.png
  default_time: morning

classroom:
  name: Shiomi Higashi High School classroom
  description: >-
    An old 1990s Japanese high-school classroom by day: rows of worn wooden
    desks with steel frames, a big blackboard, a round wall clock above it,
    tall open windows with a view of trees, fluorescent lights, a notice board.
  plate: artwork/locations/classroom.png
  sources:
    - artwork/pages/chapter-001/page-14.png
  default_time: day

roadster-interior-night:
  name: inside Akane's Roadster at night (seen from the passenger seat)
  description: >-
    The tiny cockpit of a 1990 Mazda Eunos Roadster, RIGHT-HAND DRIVE: the
    steering wheel (small three-spoke) and the round analog gauges
    (tachometer, speedometer) are on the RIGHT; the passenger seat is on the
    LEFT; a short gear lever with a round knob on the center tunnel between
    the seats; black soft top close overhead; low black dashboard. Night:
    orange streetlights streak across the windshield.
  plate: artwork/locations/roadster-interior-night.png
  sources:
    - artwork/car-sheets/red-roadster.png
  guards:
    - "Inside the car the steering wheel, pedals and gauges are on the RIGHT (driver: Akane); the passenger seat is on the LEFT (Dai)."
  default_time: night

harbor-pier-lot-night:
  name: empty parking lot at the end of Pier 3, at night
  description: >-
    A wide empty concrete lot at the end of a harbor pier: faded parking
    lines, a low bollard row and a chain at the water's edge, the black sea
    beyond, distant city and factory lights across the bay, harbor cranes
    silhouetted, a single tall lamp post.
  plate: artwork/locations/harbor-pier-lot-night.png
  sources:
    - artwork/locations/harbor-road-night.png
  default_time: night

bypass-overpass-dawn:
  name: pedestrian overpass over the Shiomi Bypass at dawn
  description: >-
    The same concrete pedestrian overpass with a tall steel safety railing
    over the FOUR-lane bypass (two lanes each way, concrete median barrier)
    at the long sweeping left-hand curve, at dawn: grey sky turning pale over
    factory chimneys, street lamps still on but weak, the road empty and
    clean. On the OUTSIDE of the curve a steel guardrail runs along the road;
    ONE section of it, near the foot of the overpass stairs, is visibly NEWER
    than the rest (brighter, clean, bolts not rusted), while the rest is old,
    dull and stained.
  plate: artwork/locations/bypass-overpass-dawn.png
  sources:
    - artwork/locations/bypass-overpass-night.png
  guards:
    - The road under the overpass has FOUR lanes (two each way) with a median barrier.
    - Anyone on the overpass stays safely on the walkway behind the tall railing.
  default_time: dawn

bookstore:
  name: old bookstore in the covered shopping street behind the station
  description: >-
    A long, narrow, dim old bookstore in a covered shopping arcade
    (shotengai): tall wooden shelves of paperbacks down both sides of one
    narrow aisle, a magazine rack by the open sliding glass door, a strip of
    daylight at the entrance, fluorescent tubes, worn linoleum floor, small
    handwritten paper signs taped to shelves, the owner's tiny counter with a
    cash register at the back.
  plate: artwork/locations/bookstore.png
  default_time: day

school-gate:
  name: Shiomi Higashi High School gate
  description: >-
    The front gate of an old 1990s Japanese high school: two square concrete
    gateposts, a low sliding iron gate pushed open, a concrete yard and the
    worn three-storey school building behind, cherry trees in full summer
    leaf, a quiet street outside with utility poles and power lines.
  default_time: noon

school-gym:
  name: Shiomi Higashi High School gym (opening ceremony)
  description: >-
    An old 1990s Japanese school gymnasium: varnished wooden floor with painted
    basketball lines, a raised stage at the front with a dark curtain, a
    wooden podium and a round clock on the wall above the stage, a row of
    small high windows up under the roof propped open, steel roof trusses,
    basketball hoops folded up against the walls.
  plate: artwork/locations/school-gym.png
  default_time: morning

school-corridor:
  name: Shiomi Higashi High School corridor
  description: >-
    A long, worn 1990s school corridor on the third floor: wooden floorboards,
    a row of tall sliding windows standing OPEN along one side with a view down
    onto a dusty sports ground with a baseball backstop, the classroom wall
    with sliding doors and small high windows on the other side, a notice
    board, fluorescent tubes, hard summer sunlight falling across the floor.
  plate: artwork/locations/school-corridor.png
  default_time: noon

school-shoe-lockers:
  name: school entrance with shoe lockers (getabako)
  description: >-
    The ground-floor entrance hall of an old Japanese high school: rows of
    tall grey steel and wooden shoe lockers with small numbered cubbies
    (numbers not readable), a low step where students change from indoor
    shoes to outdoor shoes, a slatted wooden duckboard on the concrete floor,
    glass double doors standing open to a bright yard.
  plate: artwork/locations/school-shoe-lockers.png
  default_time: afternoon

canal-driving-school:
  name: canal footpath past Shiomi Driving School
  description: >-
    A concrete footpath along a straight urban canal with low railings, and
    beside it a tall green chain-link fence around a small driving-school
    practice course: painted lane lines, a little crossroads, a short steep
    practice slope, a crank-shaped narrow lane, a set of real working traffic
    lights on a pole, and a small control tower in the middle with big windows
    and a loudspeaker horn. Summer haze, utility poles, low apartment blocks
    beyond.
  plate: artwork/locations/canal-driving-school.png
  default_time: afternoon

pier-3-night:
  name: Pier 3 harbor lot at night
  description: >-
    A large dry concrete harbor lot covered in overlapping black tire circles.
    Tall sodium lights line one side, one lamp unlit; stacked shipping containers
    three high at the back, bollards and black harbor water on the open side,
    warehouses and the harbor road at the entrance. September 1995.
  plate: artwork/locations/pier-3-night.png
  default_time: dry night under sodium lamps
rail-crossing-night:
  name: freight rail crossing at the end of the harbor straight, at night
  description: >-
    The far end of a dead-flat two-lane harbor road at night, DRY asphalt:
    a single freight railway track crosses the road on a low raised hump of
    asphalt and rails, with one old crossing warning light (a single lamp)
    on a lone pole beside the road and a crossbuck; warehouse walls on the
    LEFT side of the road, a container yard behind a chain-link fence on the
    RIGHT; beyond the crossing the road bends LEFT and disappears behind a
    cluster of tall round concrete grain silos. Sparse orange sodium lamps.
  plate: artwork/locations/rail-crossing-night.png
  sources:
    - artwork/locations/harbor-road-night.png
  default_time: night
silo-sbend-night:
  name: S-bend between the grain silos, at night
  description: >-
    A two-lane harbor road at night, DRY asphalt, snaking through an S-bend
    (first left, then right) between giant round concrete grain silos that
    tower on both sides, linked by conveyor bridges high above the road;
    a few sodium lamps on tall poles throw pools of light; painted center
    line and curbs; dark sky.
  plate: artwork/locations/silo-sbend-night.png
  sources:
    - artwork/locations/harbor-road-night.png
  default_time: night
bypass-onramp-night:
  name: on-ramp up to the Shiomi Bypass, at night
  description: >-
    A curving concrete on-ramp climbing from the harbor road up onto an
    elevated four-lane bypass on concrete pillars, solid concrete parapets,
    orange sodium lamps along the ramp, industrial buildings and factory
    chimneys around, dark sky.
  default_time: night
warehouse-doorway-night:
  name: loading doors on the far side of the Pier 3 lot, at night
  description: >-
    The long corrugated-steel wall of an old harbor warehouse at the far edge
    of the Pier 3 lot: a strip of weeds along its foot, a row of loading
    doors set back into the wall; the first door has a closed roller shutter,
    the SECOND is a plain steel door with one concrete step up, set back in a
    deep recess about a meter deep, completely BLACK inside because the moon
    is behind the building; the moonlit concrete of the lot with black tire
    circles in front of the wall.
  plate: artwork/locations/warehouse-doorway-night.png
  sources:
    - artwork/locations/pier-3-night.png
  default_time: night, moon behind the building
canal-path-night:
  name: canal footpath toward the station, before dawn
  description: >-
    A concrete footpath along a straight urban canal with low metal railings,
    utility poles and power lines, dark low apartment blocks and shuttered
    shops beyond, a few street lamps, the sky black with a moon.
  default_time: about 3:30 a.m.
kawamata-ramen-night:
  name: outside Kawamata Ramen by the station, before dawn
  description: >-
    A small two-storey family ramen shop on a narrow street near the station:
    the steel roller shutter pulled down over the shop front, an unlit red
    paper lantern beside it, a dark window on the upper floor (the family's
    flat), a narrow alley down the side of the building to a back door,
    a street lamp, power lines. No readable signs.
  default_time: ten to four in the morning

# ---- added for chapter 8 (2026-11-18)
tanabe-yard:
  name: Tanabe Auto Dismantling, the scrapyard by the harbor
  description: >-
    A big 1995 Japanese scrapyard on the water side of the harbor, behind a
    two-meter corrugated steel fence: stacks of cars crushed flat, each the
    thickness of a mattress with its paint still on, three and four high;
    rows of engines on wooden pallets; a wall of old tires; oil drums; a big
    yellow (light-grey tone) car crusher, a boxy machine with a heavy hinged
    steel lid; a two-storey grey prefab office by the open gate with an
    outside steel stair; the ground is packed dirt, crushed shells and
    puddles of old oil, and weeds grow everywhere the cars aren't. Gulls,
    harbor cranes far off over the fence.
  plate: artwork/locations/tanabe-yard.png
  guards:
    - No readable signs anywhere except where a panel asks for one.
  default_time: morning
tanabe-weeds:
  name: the weedy strip behind the Corolla stacks in Tanabe's yard
  description: >-
    A neglected strip at the back of the scrapyard, behind a stack of crushed
    white and red Corollas, that the forklift never reaches: waist-high tall
    yellow weeds (goldenrod) and foxtail grass, the corrugated steel fence
    behind, a patch where the weeds have died under a car that has sat there
    for months.
  plate: artwork/locations/tanabe-yard.png
  default_time: morning
tanabe-office:
  name: inside the prefab office of Tanabe Auto Dismantling
  description: >-
    A small cluttered prefab site office: a grey steel desk with a black
    rotary phone, an electric kettle, a small fridge, a transistor radio, a
    sink with a cold tap; one plywood wall covered top to bottom in black
    marker handwriting (names and numbers going back years, most crossed
    through, not readable); above the desk a faded travel poster of a beach
    with palm trees, a small green island off the shore joined by a long
    bridge, and a couple in white walking on the sand with their backs to
    us. A window onto the yard. A broom by the door.
  plate: artwork/locations/tanabe-office.png
  guards:
    - The marker writing on the wall is small scribbled handwriting that cannot be read; the poster has no readable text.
  default_time: daytime
harbor-road-morning:
  name: harbor road toward the silos, early morning
  description: >-
    The harbor road in early morning light: warehouse walls, a few old
    two-storey wooden houses by a concrete-block works with national flags
    out on poles for the holiday, the grain silos ahead, cranes over the
    water, the sun just clear of the cranes, long shadows. Quiet, no traffic.
  default_time: about 6:15 a.m., clear, the sun just up

# ---- added for chapter 9 (2026-11-18)
hayama-kitchen-night:
  name: the Hayama kitchen corner at night (refrigerator, wall clock, phone shelf)
  description: >-
    The same cramped 1970s danchi kitchen as the Hayama apartment, seen from
    the tatami side: a small old white two-door refrigerator with a square
    biscuit tin on top and a sheet of handwritten paper taped to its side;
    a round white wall clock with black hands and numbers over the low
    table; the old sink and gas burner with a single fluorescent tube lit
    over the sink; a small wooden shelf on the wall beside a hanging
    calendar holding an old black ROTARY telephone (dial, curly cord); the
    low table with cushions; the window over the sink black; the sliding
    fusuma doors to the small tatami room where the boys sleep; a steel
    front door with a genkan step at the end.
  plate: artwork/locations/hayama-kitchen-night.png
  guards:
    - The telephone is an old black ROTARY phone with a finger dial (no buttons).
    - The paper on the refrigerator is handwritten lines that cannot be read unless a caption gives the words.
  default_time: night, only the light over the sink on
sanko-interview:
  name: interview room at the Sanko Brake plant
  description: >-
    A plain 1990s Japanese factory office meeting room: pale walls, a
    window with half-closed venetian blinds, grey vinyl floor tiles, a long
    table covered with a GREEN cloth (mid-grey tone) with three chairs
    behind it, and about two meters out in front of it, alone in the middle
    of the empty floor, ONE folding chair facing the table. A door with a
    small window, a wall clock, nothing on the walls but a calendar.
  plate: artwork/locations/sanko-interview.png
  guards:
    - No readable signs or words anywhere; the name card on the table is a blank white card.
  default_time: Tuesday afternoon, daylight through the blinds
sanko-plant:
  name: the Sanko Brake plant (corridors, test room, canteen)
  description: >-
    A 1995 Japanese brake-parts factory where the river comes into the
    harbor: low grey factory sheds with saw-tooth roofs and a chimney, a
    two-storey office block, timber yards along the river, a gate with a
    bus stop. Inside: worn linoleum corridors, a waiting room with folding
    chairs along one wall under a framed photo portrait of an old man (the
    founder), a test room with rows of school-style desks, a factory
    canteen with long tables.
  guards:
    - No readable signs or company names anywhere.
  default_time: Tuesday, a clear September day
er-bay:
  name: Shiomi Municipal Hospital emergency department at night
  description: >-
    A 1995 Japanese city-hospital emergency room: very bright flat
    fluorescent ceiling light, pale polished vinyl floor, white walls with a
    green stripe; treatment bays divided by PALE GREEN curtains hung on rings
    from steel rails in the ceiling, the curtains stopping about thirty
    centimeters above the floor; a row of ORANGE moulded plastic chairs
    along the wall opposite the bays; a round wall clock; automatic glass
    entrance doors at the end; a steel trolley, a wall-mounted oxygen
    outlet. No modern screens.
  plate: artwork/locations/er-bay.png
  guards:
    - No readable signs anywhere.
  default_time: about 1:50 a.m., inside under bright fluorescent light
ambulance-interior:
  name: inside a 1995 Japanese ambulance at night
  description: >-
    The back of a 1990s Japanese high-roof ambulance van: white walls and
    ceiling, a stretcher along one side with its back raised, a padded bench
    along the other side, cabinets and straps, a small black oxygen cylinder,
    frosted rear windows, a red rotating light outside throwing pink light in
    through the frosted glass.
  default_time: about 1:30 a.m., night
# ---- added for chapter 10 (2026-11-19)
er-treatment-bay:
  name: inside a curtained treatment bay of the Shiomi Municipal ER
  description: >-
    A small 1995 Japanese emergency-room treatment bay closed in by PALE
    GREEN curtains (light grey tone) on ceiling rails, the curtains stopping
    about thirty centimeters above the polished floor. A high hospital bed
    with its back raised and side rails; a wheeled over-bed table across it;
    a steel drip stand with a clear bag; on a wall shelf a small GREY BOX
    monitor with a green-digit display window and a cable; the wall behind
    the bed full of oxygen and suction outlets with round dials and flow
    meters; a round steel stool in the corner beside a steel pedal bin; a
    small steel trolley. Very bright flat fluorescent light. No modern
    screens.
  plate: artwork/locations/er-treatment-bay.png
  guards:
    - No readable signs anywhere. The monitor is a small grey box with only a few green digits, never a modern flat screen.
  default_time: about 2 a.m., inside under bright fluorescent light

hospital-night-window:
  name: the hospital's night reception window by the locked main entrance
  description: >-
    The dim main lobby of a 1995 Japanese city hospital at night: the big
    glass main doors locked and dark, the daytime counters shuttered, rows of
    empty benches; in the side wall a small reception HATCH with a sliding
    glass panel and a narrow ledge in front of it, a plain sign board above
    it, and behind the glass a lit little office with a desk, a small radio,
    a tray of rubber stamps and a coin tray. One pool of light round the
    hatch, the rest of the lobby in shadow.
  plate: artwork/locations/hospital-night-window.png
  guards:
    - The sign board over the hatch is plain, with no readable letters (the caption gives its words).
  default_time: about 3 a.m., night; the lobby dark except the lit hatch

hospital-night-entrance:
  name: the corridor by the hospital's night entrance, with the vending machine
  description: >-
    A long 1995 Japanese hospital corridor near the night entrance, half the
    ceiling lights off: polished vinyl floor, white walls with a green stripe;
    against one wall a single tall drinks VENDING MACHINE glowing, its top
    rows of buttons pale and its BOTTOM ROW of buttons dark (red) with small
    white HOT labels, dummy cans behind glass, a can bin beside it; opposite
    it a plain bench with a vinyl seat; at the far end of the corridor the
    double doors to the ER; to one side the glass doors of the night entrance
    with the dark forecourt beyond.
  plate: artwork/locations/hospital-night-entrance.png
  guards:
    - No brand names or logos on the vending machine or the cans; the only words allowed on it are small HOT labels on the bottom-row buttons.
  default_time: about 5 a.m., night still outside, the corridor dim

hospital-bench-dawn:
  name: the bench by the bus stop outside the hospital at dawn
  description: >-
    Outside a big 1990s Japanese city hospital building of pale concrete and
    rows of windows: by the night entrance a plain bench beside a bus-stop
    pole with a timetable board and a small roof; a wide car park with a few
    parked cars beyond, low hedges, tall streetlights still lit; the
    hospital's name in big raised letters on the wall above (not readable);
    a red mailbox at the kerb.
  plate: artwork/locations/hospital-bench-dawn.png
  guards:
    - The hospital name on the wall and the bus timetable are not readable.
  default_time: about 5:20 a.m., grey early dawn, the streetlights still on

childrens-ward:
  name: the six-bed room on the children's ward, fifth floor
  description: >-
    A 1995 Japanese hospital children's ward room: six beds with white metal
    frames and side rails, three along each wall, thin curtains on ceiling
    rails between them; a big window along the end wall with the city below;
    small bedside lockers; plain chairs for parents; oxygen outlets on the
    wall above each bed; children's drawings taped on the wall. Outside in
    the corridor a playroom with paper fish stuck on its windows.
  plate: artwork/locations/childrens-ward.png
  guards:
    - No readable signs anywhere.
  default_time: afternoon, daylight through the big window
# ---- added for chapter 11 (2026-11-19)
tanabe-backlot:
  name: the cleared back lot of Tanabe's scrapyard (the lesson ground)
  description: >-
    An open rectangle of ground about 50 meters long and 25 wide at the back
    of the scrapyard, walled in on all four sides: packed earth with crushed
    white and grey shell rolled into it, soft and dark in the low places
    where the dew has collected, weeds and foxtail grass at the edges; the
    long double stripes of a forklift's tires running back and forth across
    it in the dew. At the FAR end a new wall of crushed-flat sedans stacked
    four high (white and grey and white); down the LEFT long side older
    stacks of crushed vans and sedans three high; down the RIGHT long side
    the yard's tall corrugated steel back fence; at the NEAR end the stacks
    of crushed white Corollas where you come in. From inside you see only
    the stacks, the sky and the tops of harbor cranes far off.
  plate: artwork/locations/tanabe-backlot.png
  guards:
    - "The back lot is walled in: crushed-flat car stacks on three sides (far end, left side, near end) and the corrugated steel fence on the right side. No road, office or gate visible from inside it."
    - "Sunday sunrise, about 6 a.m.: low clear morning sun, long soft shadows, dew on the ground; NOT midday, NOT night."
  default_time: Sunday about 6 a.m., clear sunrise
hardware-shop:
  name: small hardware shop in the covered shopping street behind the station
  description: >-
    A narrow old 1995 Japanese hardware shop opening onto a covered shopping
    arcade: buckets, brooms and coils of rope by the open front, and just
    inside the door a pegboard of work gloves on hooks: stiff yellow leather
    gloves, long black rubber gloves, white cotton work gloves tied in
    bundles of twelve with string, single pairs in small plastic bags, each
    with a small handwritten price card; an old wooden counter with a cash
    register and an old man shopkeeper in a cardigan behind it.
  guards:
    - "Price cards show only the numbers the panel gives; no other readable words."
  default_time: Saturday early afternoon, daylight
okabe-tire:
  name: Okabe Tire, a used-tire shop by the canal
  description: >-
    A long low corrugated-tin shed, open along its whole front, on a road
    beside a straight concrete canal in the old town: between a small welding
    shop (sparks, gas bottles) on one side and a small coffee shop with its
    steel shutter down and a FOR LEASE sign in its window on the other.
    Outside, towers of used tires tied in fours with rope, chalk marks on
    them. Inside it is dark: a two-post car lift, a tire-changing machine,
    a wheel-balancing machine, an air hose on a reel, a pot of tire soap with
    a brush, a wall of tires racked by size, an old desk with a carbon
    receipt pad. Oil-stained concrete floor.
  plate: artwork/locations/okabe-tire.png
  guards:
    - "Tires have plain sidewalls: NO brand names or logos on any tire."
    - "The only readable words: FOR LEASE on the shuttered coffee shop, and OKABE TIRE showing through the paint on the van when the van is in a panel."
  default_time: Sunday late morning, overcast daylight
staff-room:
  name: the teachers' staff room at Shiomi Higashi High School
  description: >-
    A long, crowded 1990s Japanese school staff room: grey steel teachers'
    desks pushed together in islands of six, piled with papers, textbooks,
    tea cups and ashtrays; old wooden chairs and swivel chairs; a big
    blackboard schedule on the wall, a kettle and a stack of tea cups by the
    sink, metal cabinets, fluorescent tubes; tall windows along one side over
    the dusty sports ground with a baseball backstop. Smells of green tea
    and cigarettes.
  plate: artwork/locations/staff-room.png
  guards:
    - "No readable writing on the papers or the blackboard."
  default_time: weekday afternoon, about 3:30 p.m.


# ---- added for manga chapter 13 (2026-11-21)
fujita-hobby:
  name: Fujita's hobby shop, upstairs over the shoe shop
  description: >-
    One long narrow room up a flight of stairs, its street windows painted
    over white so only a dull glow comes through; fluorescent tubes on the
    ceiling; plastic model kits in their boxes on shelves up all the walls
    to the ceiling; at the far end a wooden counter with a small till and a
    roll of tape, and above it rows of little plastic bags of parts hanging
    on pegs, each with a handwritten price sticker; worn carpet tiles. In
    the middle of the floor the TRACK: white plastic on short legs, knee
    high, three lanes side by side with low walls as high as a matchbox,
    running round a long loop with a tight curve at each end; halfway along
    the near straight the lanes climb a short RAMP over a hump (the lane
    change BRIDGE) and come down the other side crossed over. Folding
    stools round it.
  plate: artwork/locations/fujita-hobby.png
  guards:
    - No readable brand names or logos on the kit boxes or anywhere; box art is blurred shapes.
  default_time: Saturday about 2 p.m.
covered-street:
  name: the covered shopping street near the station
  description: >-
    A 1995 Japanese shotengai: a narrow pedestrian street under an arched
    translucent arcade roof on steel ribs, small shops on both sides with
    their goods out front, hanging paper banners with no readable words,
    bicycles parked along the middle; a shoe shop with racks of shoes on
    the pavement and, beside its door, a steep narrow stairway going up to
    the floor above.
  guards:
    - No readable signs or brand names.
  default_time: Saturday afternoon
ishiguro-body-shop:
  name: Ishiguro's body shop between the timber yards
  description: >-
    A small car body shop in a rusty corrugated tin shed on the river road,
    squeezed between two timber yards whose stacks of fresh pale planks show
    over the fences on both sides; a concrete apron with oil stains, a paint
    booth curtain, a compressor, pallets; behind the shed a gravel patch with
    a burned car.
  guards:
    - No readable signs.
  default_time: Monday about 3:30 p.m., clear October afternoon
river-road:
  name: the river road toward the harbor, past the Sanko Brake plant
  description: >-
    A long straight two-lane road beside a wide grey river with a low
    concrete embankment, timber yards, a cement works with a tall silo,
    utility poles; then a long grey fence along a factory with saw-tooth
    roofs and a chimney, and a wide steel gate with a guard hut, over which
    a sign reads SANKO BRAKE INDUSTRIES in red (drawn dark).
  guards:
    - The only readable words are SANKO BRAKE INDUSTRIES over the gate and SANKO on jacket pockets, only where a panel asks.
  default_time: Monday about 4:45 p.m., the sun low and orange
kawamata-ramen:
  name: inside Kawamata Ramen by the station, evening
  description: >-
    A tiny family ramen shop: a worn wooden counter with EIGHT round red
    stools, behind it the open kitchen with big steaming stock pots, a
    flat iron gyoza pan, ladles on hooks, bowls stacked on a shelf; steam
    everywhere; a small TV high in the corner; paper menu strips on the wall
    with no readable words; a sliding glass front door with a short noren
    curtain, dark outside.
  guards:
    - Menu strips and the noren have no readable words.
  default_time: Monday about 7 p.m.

# ---- added for manga chapter 14 (2026-11-27)
hayama-genkan:
  name: the Hayama genkan (front door, chain, shoe cabinet, coat hooks)
  description: >-
    The entrance of the cramped 1970s danchi apartment: a small square of
    bare grey CONCRETE one step lower than the kitchen floor, the grey STEEL
    front door with a peephole, a lever handle and a DOOR CHAIN, a low wooden
    SHOE CABINET with a flat top on the left, two metal coat HOOKS on the
    wall to the right of the door; the kitchen floor and the low table behind.
  plate: artwork/locations/hayama-genkan.png
  default_time: evening, the kitchen tube light on
fish-market-backway-night:
  name: the back way behind the fish-market sheds, at night
  description: >-
    A narrow dark service lane behind long low fish-market sheds in the
    harbor at night: loading docks with stacked wooden pallets and plastic
    fish crates as dark shapes, puddle-free DRY concrete, one bare lamp on a
    pole by a timber sawmill, piles of sawn logs, no moon, black sky.
  default_time: Saturday about 11:20 p.m., no moon, dry
bypass-footpath-night:
  name: footpath along the Shiomi Bypass, at night
  description: >-
    A narrow concrete footpath beside the elevated four-lane bypass behind a
    steel guardrail, orange sodium lamps on tall poles, the road completely
    empty, factory chimneys and cranes beyond, black sky; the steps of the
    pedestrian overpass ahead.
  default_time: about 2:50 a.m., no moon, dry

# ---- added for manga chapter 15 (2026-11-27)
tanabe-tarp-strip:
  name: the weed strip behind the tire wall in Tanabe's yard, with the grey tarp at the end
  description: >-
    A narrow neglected strip about two meters wide at the very back of the
    scrapyard: on one side a tall wall of old tires stacked higher than a
    man, on the other the tall corrugated steel back fence with wooden
    posts; dead weeds, foxtail grass and broken glass on packed dirt. At the
    far end, against the fence, a long low shape under a heavy GREY canvas
    tarp (every other cover in the yard is blue plastic), roped down, an
    old tire on each corner. Where the strip opens out at the other end
    you see the corner of the big yellow car crusher (the press).
  plate: artwork/locations/tanabe-tarp-strip.png
  guards:
    - "The tarp is GREY heavy canvas, never blue plastic."
  default_time: Sunday morning, low clear sun
bypass-foot-dawn:
  name: road level at the foot of the far overpass stairs, by the new guardrail
  description: >-
    At road level on the outside of the long left-hand curve of the
    four-lane Shiomi Bypass, at the bottom of the far stairs of the concrete
    pedestrian overpass: a strip of bare concrete between the stairs and
    the road; the foot of the stairs, a big square grey concrete base (the
    pillar), with a paler scrubbed patch low down on the side facing the
    road; the overpass deck above. Along the outside of the curve a steel
    guardrail whose section by the stairs is visibly NEWER (bright steel,
    bright bolts) than the dull, rust-stained old rail on either side.
    Harbor cranes over the factory roofs to the east.
  plate: artwork/locations/bypass-foot-dawn.png
  guards:
    - "The road has FOUR lanes (two each way) with a median barrier. Dry, no rain."
    - "The new guardrail section by the stairs is clearly brighter and newer than the old rail on either side."
  default_time: Friday about 6:10 a.m., early November, before sunrise
overpass-town-foot:
  name: the town-side foot of the overpass, with a drinks machine by the bus stop
  description: >-
    The bottom of the near (town-side) stairs of the concrete pedestrian
    overpass: a bus stop pole and a small bench, and a 1995 Japanese drinks
    vending machine with rows of can samples behind its glass, a top row
    of HOT drinks with labels under the buttons, a coin slot, a note slot,
    a change tray and a big flap at the bottom where the cans drop out; a
    dent in its side. The bypass behind a guardrail, street lamps.
  guards:
    - "No brand names or logos on the machine or the cans; can labels are plain shapes. The only readable words: HOT and 110 if the panel asks."
  default_time: Friday about 6:10 a.m., before sunrise

# ---- added for manga chapter 16 (2026-11-28)
tanabe-backlot-pm:
  name: the cleared back lot of Tanabe's scrapyard on a November afternoon
  description: >-
    An open rectangle of ground about 50 meters long and 25 wide at the back
    of the scrapyard, walled in on all four sides: packed earth with crushed
    white and grey shell rolled into it, weeds and foxtail grass at the
    edges, forklift tire stripes. At the FAR end a wall of crushed-flat
    Crown sedans stacked four high; down the LEFT long side older stacks of
    crushed vans and sedans three high; down the RIGHT long side the yard's
    tall corrugated steel back fence; at the NEAR end the stacks of crushed
    white Corollas where you come in, with the old forklift parked at their
    corner. Tops of harbor cranes far off over the stacks.
  plate: artwork/locations/tanabe-backlot.png
  guards:
    - "The back lot is walled in: crushed-flat car stacks on three sides and the corrugated steel fence on the right side. No road, office or gate visible from inside it."
    - "A clear, dry November afternoon (about 3:30 p.m.): low sun from the side, long shadows, NOT sunrise, NOT night. Dry ground: no puddles, no dew, no rain."
  default_time: Sunday about 3:30 p.m., clear November afternoon
