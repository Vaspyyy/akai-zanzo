        cast: [nobu, dai:summer_school]
        captions: ["I DIDN'T CALL HIM ANYTHING YET."]

  # ------------------------------------------------------------ bookstore
  - page: 15
    title: Bookstore
    location: bookstore
    time: half past twelve, a hot summer day
    panels:
      - pos: top, wide
        action: >-
          A covered shopping arcade behind the station: Dai in his summer
          uniform walking fast past a pachinko parlor whose glass doors slide
          open on a blast of noise and cold air; rows of machines inside.
          Paper lanterns and shop awnings, no readable signs.
        cast: [dai:summer_school]
        sfx: ["JARARARA"]
      - pos: middle-right
        action: >-
          Inside the narrow bookstore: four middle-aged men standing at the
          magazine rack by the door, each reading a magazine.
        captions: ["THE SIGN SAID NO STANDING READING. FOUR MEN WERE STANDING READING."]
        notes: ["The four men are background customers, not named characters."]
      - pos: middle-left
        action: Dai crouched at the bottom shelf of the aisle, pulling out a thick paperback with a plain white cover.
        cast: [dai:summer_school]
      - pos: bottom-right
        shot: close-up
        action: >-
          Close-up of the open book: a row of six small numbered photos of a
