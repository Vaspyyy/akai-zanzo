          - sota: "WHAT DO THE FEET DO?"
      - pos: middle-left
        action: Dai, lying back down.
        cast: [dai:station]
        dialogue:
          - dai: "FEET ARE NEXT WEEK."
      - pos: bottom-right
        action: Sota lying on his side on his own futon, facing Dai, glasses still on, sleepy and loyal.
        cast: [sota]
        dialogue:
          - sota: "I WON'T TELL MOM."
      - pos: bottom-left
        action: >-
          Dai lying on his back with one arm over his eyes; his LEFT hand
          resting on his stomach is still making small shifting motions.
        cast: [dai:station]
        dialogue:
          - dai: "THERE'S NOTHING TO TELL."
          - {speaker: sota, text: "I WON'T TELL HER ANYWAY.", offpanel: true}
        captions: [{text: "MY LEFT HAND KEPT GOING WITHOUT ME.", box: [24, 1082, 316, 84], draw: true}]

  # ------------------------------------------------------------ remedial English
  - page: 5
    title: Re-test
    location: classroom
    time: about 9 AM, a hot August morning, bright sun
    notes:
      - "Classroom seating: Nobu (buzz cut) sits at the desk directly BEHIND Dai."
      - "Only nine students in the whole room, spread out among forty desks."
    panels:
      - pos: top, wide
        action: >-
          A hot third-floor classroom: only nine students in summer uniforms
          spread out among forty wooden desks, every window open, cherry trees
          outside. Dai sits in the middle of the room; directly behind him a
          stocky boy with a buzz cut. Heat shimmer.
        cast: [dai:summer_school, nobu]
        sfx: ["MIIIN MIN MIN"]
        captions: ["LAST DAY OF SUMMER REMEDIAL ENGLISH."]
      - pos: middle, wide
        action: >-
          Hotta-sensei standing at the blackboard, a towel round his neck,
          fanning himself with a paper fan printed with a cartoon owl, tired
          eyes.
        cast: [hotta]
        dialogue:
          - hotta: "RE-TEST. FIFTY MINUTES. FORTY POINTS IS A PASS."
          - hotta: "I'M NOT ASKING ANYBODY IN THIS ROOM FOR MORE THAN FORTY."
      - pos: bottom-right
        action: Dai bent over his test paper, writing, his white shirt stuck to his back with sweat.
        cast: [dai:summer_school]
        captions: ["ENGLISH WAS A LANGUAGE FOR PEOPLE WHO WANTED THINGS THEY COULDN'T HAVE."]
      - pos: bottom-left
        shot: close-up
        action: Extreme close-up of a pencil point snapping on the paper, a tiny chip of lead flying.
        cast: [{id: dai, outfit: summer_school, note: "only his fingers on the pencil"}]
        sfx: ["SNAP"]

  - page: 6
    title: Heel-and-toe
    location: classroom
    time: a hot August morning
    continue_from: 5
    notes: ["Nobu (buzz cut, round face) sits directly BEHIND Dai."]
    panels:
      - pos: top-right
        action: >-
          From behind, over Dai's shoulder: a fat four-colour ballpoint pen
          (four little sliders on top) held out from the desk behind, tapping
          Dai's shoulder.
        cast: [{id: dai, outfit: summer_school, note: "seen from behind, only his shoulder and the back of his head"}, {id: nobu, note: "only his hand holding the pen"}]
        sfx: [{text: "TAP TAP", note: "small"}]
      - pos: top-left
        action: >-
          Dai takes the pen without turning round, face set. Behind him Nobu,
          the stocky boy with the buzz cut, is already looking down at his own
          test again.
        cast: [dai:summer_school, nobu]
        captions: ["KAWAMATA. THREE WEEKS BEHIND ME. NOT ONE WORD."]
      - pos: middle, wide
        shot: close-up
        action: >-
          Close-up of the last page of Dai's notebook: three car pedals drawn
          in pen as seen past your knees (clutch, brake, gas), a badly drawn
          foot over the brake and gas with an arrow from the heel to the gas
          pedal, several crossed-out lines of scribble (no readable words).
          Dai's hand inking the foot again with the fat pen.
        cast: [{id: dai, outfit: summer_school, note: "only his hand"}]
      - pos: bottom-right
        action: >-
          Nobu leaning far forward over his desk, his round face right beside
          Dai's shoulder, whispering with interest. Dai in the foreground,
          seen from the side.
        cast: [nobu, dai:summer_school]
        dialogue:
          - nobu: "THAT'S HEEL-AND-TOE."
      - pos: bottom-left
        action: Dai slaps his forearm down over the notebook page, glaring sideways.
        cast: [dai:summer_school]
        sfx: ["SLAP"]

  - page: 7
    title: Kawamata
    location: classroom
    time: a hot August morning
    continue_from: 6
    notes: ["Nobu sits directly BEHIND Dai; in shots of Nobu we look at him past Dai's shoulder or from the front."]
    panels:
      - pos: top, large
        action: >-
          Introduction shot of Nobu: the stocky boy with the buzz cut leaning
          over his desk toward the camera, both hands raised in apology, a
          sheepish, friendly grin, round cheeks. Behind him the open windows.
        cast: [nobu]
        dialogue:
          - nobu: "SORRY. SORRY. I WASN'T LOOKING."
          - nobu: "I WAS LOOKING A BIT."
        captions: [{text: "NOBUYUKI KAWAMATA. HE SMELLED OF SOY SAUCE AND PORK BONES. HIS FAMILY HAD A RAMEN SHOP BY THE STATION.", box: [38, 36, 612, 124], draw: true}]
      - pos: middle-right
        action: Nobu, one finger raised, explaining eagerly.
        cast: [nobu]
        dialogue:
          - nobu: {text: "BALL OF THE FOOT ON THE BRAKE, HEEL ON THE GAS. DO YOU DRIVE?", box: [585, 642, 345, 160]}
      - pos: middle-left
        action: Dai, half turned in his seat, flat and guarded.
        cast: [dai:summer_school]
        dialogue:
          - dai: "NO."
      - pos: bottom-right
        action: Nobu, puzzled, head tilted.
        cast: [nobu]
        dialogue:
          - nobu: "THEN WHY ARE YOU DRAWING HEEL-AND-TOE?"
      - pos: bottom-left
        action: Dai, narrowing his eyes at him.
        cast: [dai:summer_school]
        dialogue:
          - dai: "WHY DO YOU KNOW WHAT IT IS?"

  - page: 8
    title: Street Tune
    location: classroom
    time: a hot August morning
    continue_from: 7
    panels:
      - pos: top, wide
        action: >-
          Nobu pulling a soft, rolled-up car magazine out of his canvas school
