# Chapter 4: "Practicing", from scripts/chapter-004.md (novel Vol. 1 Ch. 1).
# Rules for this chapter:
#   - Akane does NOT appear. The red Roadster does NOT appear (the only car shots: the 180SX on p27,
#     the printed GT-R photo on a magazine cover on p8).
#   - Dai shifts with his LEFT hand (right-hand-drive car); heel-and-toe is a downshift.
#   - Nights are DRY and clear (the night plates were redrawn dry on 2026-11-15).
#   - August: summer school uniform (white short-sleeved shirt), not the gakuran.
#   - Classroom seating: Nobu's desk is directly BEHIND Dai's.
#   - Nobody wears shoes indoors on tatami.
chapter: 4
title: Practicing
lettering: empty
defaults:
  orientation: portrait

pages:
  # ------------------------------------------------------------ Friday dawn
  - page: 1
    title: Practicing
    location: hayama-apartment
    time: half past six on a summer morning, bright early daylight through the window (NOT night)
    notes:
      - "Morning: the window shows pale daylight, never a night sky."
      - "Nobody wears shoes indoors: bare feet on the futon and tatami."
      - "LEFT-HAND RULE: whenever Dai or Sota works the invisible gear lever, it is with the LEFT hand, held LOW beside the left hip at the height of a car's center console, fingers curled round a small invisible knob. When a person faces the camera, their LEFT hand is on the IMAGE'S RIGHT side. Never an arm stretched forward, never a punching fist."
    panels:
      - pos: top, wide
        action: >-
          The small tatami room in early morning light: two futons on the floor,
          a floor fan turning its head. Dai sits cross-legged on his futon facing
          us, in his open grey work shirt over a black T-shirt (no cap), eyes shut,
          his right hand resting on his right knee, his LEFT hand (on the image's
          right side) held low beside his left hip, curled round a small gear knob
          that isn't there. Sota is asleep under a
          thin blanket on the other futon, his glasses folded on the windowsill.
        cast: [dai:station, sota]
        captions:
          - {text: "HALF PAST SIX, FRIDAY MORNING. I WAS CHANGING GEAR.", box: [598, 28, 396, 106], draw: true}
          - "THERE WAS NO CAR."
      - pos: middle-right
        shot: close-up
        action: >-
          Close-up from above of Dai's LEFT hand low beside his hip, fingers curled
          round an invisible small gear knob, moving it; small motion arrows forward,
          back, across. Not a fist, not stretched out.
        cast: [{id: dai, outfit: station, note: "only his left hand and rolled grey sleeve"}]
        captions: [{text: "FIRST, FORWARD AND AWAY. SECOND, STRAIGHT BACK. THIRD, ACROSS AND UP.", box: [604, 694, 390, 122], draw: true}]
      - pos: middle-left
        shot: close-up
        action: >-
          Close-up of Dai's bare feet on the futon: the ball of the right foot
          pressed down while its heel rolls over sideways, as if braking and
          blipping the gas at once. Motion lines on the heel.
        cast: [{id: dai, outfit: station, note: "only his bare feet and jeans hems"}]
      - pos: bottom, wide
        action: >-
          Sota sitting up on his futon, his hair flat on one side, sleepily
          putting on his round glasses and looking across at Dai.
        cast: [sota]
        dialogue:
          - sota: "...PRACTICING WHAT?"

  - page: 2
    title: Other hand
    location: hayama-apartment
    time: early summer morning, daylight through the window (NOT night)
    continue_from: 1
    # 2026-11-15: bottom panel redrawn alone (the first take showed no wrong hand); the top
    # three panels are the approved pixels, pasted back after the edit.
    edit:
      source: production/runs/edit-src/ch4-page-02.masked.png
      change: >-
        Redraw ONLY the bottom panel, which is blanked out in flat grey in reference 1: draw it
        fresh as described in PANEL 4. Keep the three top panels exactly as they are.
      keep: the three top panels, their balloons and caption
    notes:
      - "Nobody wears shoes indoors: bare feet on the futon and tatami."
      - "LEFT-HAND RULE: whenever Dai or Sota works the invisible gear lever, it is with the LEFT hand, held LOW beside the left hip at the height of a car's center console, fingers curled round a small invisible knob. When a person faces the camera, their LEFT hand is on the IMAGE'S RIGHT side. Never an arm stretched forward, never a punching fist."
    panels:
      - pos: top-right
        keep: true
        action: Dai on his futon facing us, eyes still closed, his LEFT hand (image's right side) low by his hip on the invisible knob, answering flatly.
        cast: [dai:station]
        dialogue:
          - dai: "SHIFTING."
      - pos: top-left
        keep: true
        action: Sota, glasses on now, squinting at Dai, then hopeful.
        cast: [sota]
        dialogue:
          - sota: "WE DON'T HAVE A CAR."
          - sota: "IS IT FOR THE RED CAR?"
      - pos: middle, wide
        keep: true
        action: >-
          Dai says nothing, eyes shut. Sota's whole face goes wide and bright
          with excitement, leaning toward him on his knees.
        cast: [sota, dai:station]
        dialogue:
          - sota: "DID YOU SEE IT AGAIN? WAS IT FAST?"
        captions: ["TO SOTA, NO ANSWER MEANS YES."]
      - pos: bottom, large
        action: >-
          Medium shot, both brothers cross-legged on the futon, Sota close
          beside Dai on the image's LEFT. Sota eagerly copies him with the
          WRONG hand: he holds up his RIGHT hand (on the image's far left,
          away from Dai) at chest height, fingers curled round an imaginary
          gear knob, clearly raised so we see it. Dai, EYES OPEN, looks down
          sideways at that raised hand with a small patient look; his own LEFT
          hand (image's right side) rests low by his hip, curled round his
          imaginary knob. Leave the upper third of the panel clear for two
          balloons.
        cast: [dai:station, sota]
        dialogue:
          - dai: "OTHER HAND."
          - dai: "IN A JAPANESE CAR YOU SIT ON THE RIGHT. THE LEVER'S IN THE MIDDLE. SO IT'S YOUR LEFT HAND."

  - page: 3
    title: Left-handed
    location: hayama-apartment
    time: early summer morning, daylight through the window (NOT night)
    continue_from: 2
    notes:
      - "Nobody wears shoes indoors."
      - "LEFT-HAND RULE: whenever Dai or Sota works the invisible gear lever, it is with the LEFT hand, held LOW beside the left hip at the height of a car's center console, fingers curled round a small invisible knob. When a person faces the camera, their LEFT hand is on the IMAGE'S RIGHT side. Never an arm stretched forward, never a punching fist."
    panels:
      - pos: top, wide
        shot: close-up
        action: >-
          Close-up: Dai's big fingers wrapped round Sota's very thin LEFT
          wrist, guiding the small hand through a gear pattern in the air
          (arrows of motion: forward, back, across and up).
        cast: [{id: dai, outfit: station, note: "only his hand"}, {id: sota, note: "only his thin wrist and hand"}]
        captions: ["HIS WRIST WAS SO THIN MY FINGERS WENT ROUND IT WITH ROOM TO SPARE."]
      - pos: middle-right
        action: Sota, still shifting with his left hand, looking up at Dai with a question.
        cast: [sota]
        dialogue:
          - sota: "WHY DO WE DRIVE ON THE LEFT?"
      - pos: middle-left
        action: Dai, deadpan, completely serious face.
        cast: [dai:station]
        dialogue:
          - dai: "THE MAN WHO DECIDED WAS LEFT-HANDED."
      - pos: bottom-right
        action: Sota, wide-eyed and impressed.
        cast: [sota]
        dialogue:
          - sota: "REALLY?"
      - pos: bottom-left
        action: Dai, looking away, the corner of his mouth almost smiling.
        cast: [dai:station]
        dialogue:
          - dai: "PROBABLY."

  - page: 4
    title: Next week
    location: hayama-apartment
    time: early summer morning, daylight through the window (NOT night)
    continue_from: 3
    notes:
      - "Nobody wears shoes indoors."
      - "LEFT-HAND RULE: whenever Dai or Sota works the invisible gear lever, it is with the LEFT hand, held LOW beside the left hip at the height of a car's center console, fingers curled round a small invisible knob. When a person faces the camera, their LEFT hand is on the IMAGE'S RIGHT side. Never an arm stretched forward, never a punching fist."
    panels:
