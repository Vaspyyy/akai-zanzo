    cast: [{id: roadster, view: interior, camera: "close on the tachometer through the wheel"}]
  - pos: middle-left
    action: Ground-level close on a silver 7-spoke wheel beginning to roll forward over the white crushed shell, the shell crunching under the tread. Only the wheel, the tire and the ground.
    sfx: [JARI...]
  - pos: lower, large
    action: "BIG panel: the red car rolling smoothly forward across the open lot toward us, no hop, no jump; behind it the long empty lot, the stacks of Corollas at the far end, the forklift small at the corner with a tiny figure standing by it."
    cast:
    - {id: roadster, view: front34, state: headlights_down, camera: "HIGH from on top of the wall of crushed sedans at the far end of the lot, looking back down the lot: the car rolls toward the camera, seen from above its front, its whole roof and hood visible, the lot stretching away behind it"}
    sfx: [JARI JARI JARI]
    captions:
    - WE MOVED. NOT A JUMP, NOT A HOP. WE ROLLED FORWARD OFF THE SPOT WHERE WE'D BEEN FOR TWENTY MINUTES, AND THE ENGINE'S NOTE WENT WITH US INSTEAD OF DYING UNDER US.
  - pos: bottom, wide
    action: Dai's face, astonished and open, as the car rolls.
    cast: [*dai_gl]
    dialogue:
    - {speaker: akane, text: "STEER.", offpanel: true}

