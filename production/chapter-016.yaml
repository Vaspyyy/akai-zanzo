chapter: 16
title: Flowers on a Dead Tree
lettering: empty

# Adapts novel Vol. 1 Ch. 12 "Ignition", scenes 1-3 (Sat 4 Nov: trunk, taillights, top, plate;
# Sun 5 Nov: battery, fuse, headlight, fuel, plugs, the click and the first start; Sota's laps, "Again.").
# Chapter 17 starts at scene 4 (novel line 272: "At four, when Kubo-san had gone up the lane on the Cub...").

x-cast:
  dai_sat: &dai_sat {id: dai_cut, outfit: "black gakuran winter school jacket worn OPEN over a white shirt, black school trousers, white cotton work gloves, beat-up white canvas sneakers (the right one held together with silver tape)"}
  dai_sun: &dai_sun {id: dai_cut, outfit: "a plain grey zip-up jacket with NO name tag, open over a faded dark flannel shirt, worn jeans, beat-up white canvas sneakers (the right one held together with silver tape)"}
  fumie_coat: &fumie_coat {id: fumie, outfit: "an old padded dark work coat over her navy work jacket, dark work trousers, scuffed safety boots"}
  kubo_own: &kubo_own {id: kubo, outfit: own}
  sota_jacket: &sota_jacket {id: sota, outfit: "Ken's NAVY padded winter jacket with a hood (dark tone), a little too big, ZIPPED UP to the chin, over shorts, socks, sneakers, round glasses"}
  nobu_sun: &nobu_sun {id: nobu, outfit: "a dark padded jacket over a sweater, jeans, sneakers, a worn canvas shoulder bag"}
  mom_home: &mom_home {id: michiko, outfit: "a worn cardigan over a plain blouse, loose trousers, socks"}
  sat_dai: &sat_dai "Dai: SHORT black hair (forehead uncovered), black gakuran jacket OPEN over a white shirt, black school trousers, white cotton work gloves."
  sun_dai: &sun_dai "Dai: SHORT black hair (forehead uncovered), plain grey zip-up jacket with NO name tag over a dark flannel shirt, jeans."
  fumie_g: &fumie_g "Fumie (over sixty): small and square, short grey hair, white towel round her forehead, cigarette in the corner of her mouth, LEFT eye half shut, an old padded dark work coat."
  kubo_g: &kubo_g "Kubo (late 50s): OLD, thin, deeply lined face, grey cap, his own faded light work jacket over a buttoned grey shirt; bad knee; few words, never smiles."
  sota_g: &sota_g "Sota (11): small and thin, round glasses, bowl cut, a navy padded hooded jacket a little too big, ZIPPED UP; his blue inhaler is in the jacket's inside pocket."
  nobu_g: &nobu_g "Nobu (17): stocky and soft, round face, very short buzz cut, no glasses, dark padded jacket, his canvas bag held in front of him in both arms."
  car_before: &car_before "Dai's car on Saturday BEFORE the work: faded grey-blue Roadster, WHITE left front fender, grey primer hood, the RIGHT pop-up headlight stuck HALF UP, the rear crushed with the trunk lid buckled into a peak, both taillight holes empty, the OLD GREY soft top torn above the LEFT seat; it stands on four inflated tires on plain steel wheels in waist-high yellow weeds. Right-hand drive. It has NOT run since March: no exhaust, no smoke."
  car_sun: &car_sun "Dai's car on Sunday: faded grey-blue Roadster, WHITE left front fender, grey primer hood, a whole BLACK soft top with a clear rear window, the rear crushed (trunk lid peaked and wired shut), two taillights (the left one sitting a little proud), plain steel wheels, in the yellow weeds behind the stacks of crushed white Corollas. Right-hand drive: the steering wheel on the RIGHT."
  not_running: &not_running "The engine is NOT running on this page: no exhaust smoke, no vibration lines, no engine sound effects."
  seats: &seats "SEATS: Dai drives from the RIGHT seat, behind the steering wheel; Sota sits in the LEFT passenger seat with NO wheel in front of him. Seen from in front through the windshield, Dai is on the IMAGE LEFT; seen from behind the seats, Dai is on the IMAGE RIGHT."
  sat_light: &sat_light "Saturday 4 November 1995, early afternoon: clear and dry, cool, a pale November sun. No rain, no puddles, no wet ground."
  sun_light: &sun_light "Sunday 5 November 1995, afternoon: clear and dry, low November sun from the side, long shadows. No rain, no puddles, no wet ground."
  notes_95: &notes_95 "Banknotes are 1995 Japanese notes only: the 1,000-yen note is a small blue-grey note with a portrait of a man with a moustache. No other designs, no foreign money."

defaults:
  orientation: portrait
  time: early November 1995, afternoon
  notes:
  - Right-to-left panel order. One speaker per panel. All cars are Japanese models sold by 1995, right-hand drive.
  - No brand logos, no maker badges, no stickers, no readable signs or printed words anywhere unless a panel asks for them. No Japanese characters. No banknotes unless a panel asks for them.
  - DRY weather in every scene of this chapter. No rain, NO puddles anywhere on the ground (ignore any puddles in the location plate).
  - Roomy panels with breathing space; vary shot sizes and poses; no two panels on the page may look alike.

pages:
# ================================================================== Sat 4 Nov: the trunk, the lights, the top
- page: 1
  title: You took your time
  location: tanabe-weeds
  time: Saturday about 1:15 p.m., clear pale November sun
  guards: [*sat_light, *sat_dai, *fumie_g, *car_before, *not_running]
  panels:
  - pos: top, wide (a third of the page)
    action: "Establishing, wide and high: the scrapyard by the harbor on a clear November Saturday, the crane tops far off, gulls; the stacks of crushed cars; at the back, behind a stack of crushed white Corollas, the waist-high yellow weeds with a small faded grey-blue Roadster sitting in them; a small square old woman standing at the crushed back of it holding a long steel bar."
    cast: [{id: bluecar, view: old, state: before, camera: "high and far, from above the yard, rear three-quarter from behind-RIGHT, the car small in the weeds"}, {id: fumie_far, note: "tiny, at the back of the car, holding a long steel bar"}]
    captions:
    - SATURDAY. 4 NOVEMBER.
    - ON SATURDAY THERE WAS SCHOOL TILL HALF PAST TWELVE. I WENT TO IT FROM THE PUMPS, AND FROM IT TO TANABE'S.
  - pos: middle-right
    action: "Dai in his gakuran coming round the end of the stack of crushed white Corollas, his school bag over his shoulder, stopping at what he sees."
    cast: [*dai_sat]
    captions:
    - "WHEN I CAME ROUND THE END OF THE COROLLA STACKS AT A QUARTER PAST ONE..."
  - pos: middle-left
    action: "Fumie standing at the crushed back end of the car, a steel bar as long as a man's leg held upright beside her like a staff, cigarette in her mouth, not moving."
    cast: [*fumie_coat]
    captions:
    - "...TANABE-SAN WAS STANDING AT THE BACK OF MY CAR WITH A STEEL BAR AS LONG AS MY LEG."
  - pos: bottom-right
    action: "Fumie, deadpan, the cigarette bobbing as she talks."
    cast: [*fumie_coat]
    dialogue:
    - fumie: YOU TOOK YOUR TIME.
  - pos: bottom-left, large
    action: "Close on the car's dusty faded roof (the old grey torn soft top): on a spread sheet of newspaper (no readable print) lie two used one-piece car taillights, red and amber and clear in one long piece each, rubber seal round the edge, four studs sticking out of the back of each; one has a scratch across the red."
    cast: [{id: bluecar, view: parts, camera: "close, slightly from above, on the roof"}]
    captions:
    - ON THE ROOF OF THE CAR, ON A SHEET OF NEWSPAPER, LAY TWO TAILLIGHTS.

- page: 2
  title: Two thousand
  location: tanabe-weeds
  time: Saturday about 1:15 p.m., clear pale November sun
  guards: [*sat_light, *sat_dai, *fumie_g, *car_before, *not_running, *notes_95]
  panels:
  - pos: top-right
    action: "Close on Dai's gloveless hand turning one taillight over: the four studs on its back, the scratch across the red."
    cast: [{<<: *dai_sat, note: "only his hands"}]
    captions:
    - THEY WEREN'T NEW. THEY'D BEEN ON A CAR. ONE HAD A SCRATCH ACROSS THE RED.
  - pos: top-left
    action: "Fumie, the bar leaning against her shoulder, nodding at the lights."
    cast: [*fumie_coat]
    dialogue:
    - fumie: ISHIGURO CAME BY ON THURSDAY. THOSE WERE IN HIS VAN. OFF THE WHITE ONE. THE FRONT'S BURNED, THE BACK'S FINE.
  - pos: middle-right
    action: "Fumie, the smallest dry twist of her mouth round the cigarette."
    cast: [*fumie_coat]
    dialogue:
    - fumie: TWO THOUSAND. HE SAYS NOW HE OWES ME NOTHING. HE SAID THAT LAST TIME.
  - pos: middle-left
    action: "Close: Dai's hand holding out two small blue-grey 1,000-yen notes; Fumie's thick brown hand taking them and folding them into the pocket of her coat without looking at them."
    cast: [{<<: *dai_sat, note: "only his hand"}, {<<: *fumie_coat, note: "only her hand"}]
    captions:
    - I GAVE HER TWO 1,000S OUT OF MY POCKET. SHE FOLDED THEM INTO HER COAT WITHOUT LOOKING.
  - pos: bottom, wide
    action: "Fumie turning toward the car's open driver's door, jerking her chin at the floor inside."
    cast: [*fumie_coat, {id: bluecar, view: old, state: before, camera: "eye level, close at the open driver's door on the RIGHT side, the door edge and the seat only"}]
    dialogue:
    - fumie: LEVER.

- page: 3
  title: Not before
  location: tanabe-weeds
  time: Saturday about 1:20 p.m., clear pale November sun
  guards: [*sat_light, *sat_dai, *fumie_g, *car_before, *not_running]
  panels:
  - pos: top-right
    action: "Close inside the car, on the floor beside the driver's seat on the RIGHT: two small levers side by side (the trunk release and the fuel flap); Dai's hand pulling one up; it comes up loose and floppy, with nothing on the other end of it."
    cast: [{id: bluecar, view: interior, camera: "close on the floor beside the driver's seat, from above"}, {<<: *dai_sat, note: "only his hand"}]
    captions:
    - "I'D PULLED IT IN SEPTEMBER AND NOTHING HAD HAPPENED. I PULLED IT NOW. IT CAME UP LOOSE, AND NOTHING HAPPENED AGAIN."
    sfx: [{text: "kaku", note: small}]
  - pos: top-left
    action: "Fumie at the crushed rear, fitting the flat end of the steel bar under the edge of the buckled trunk lid at the corner where the peak is worst."
    cast: [*fumie_coat, {id: bluecar, view: old, state: before, camera: "close on the crushed rear corner from behind-LEFT, low"}]
    dialogue:
    - fumie: THOUGHT SO.
  - pos: middle, wide
    action: "Fumie handing Dai the end of the bar, pointing a thick finger at him."
    cast: [*fumie_coat, *dai_sat]
    dialogue:
    - fumie: LEAN ON THAT. WHEN I SAY. NOT BEFORE.
  - pos: bottom-right
    action: "Dai leaning his weight on the long bar, teeth set, the trunk lid creaking; the bar slipping, effort lines."
    cast: [*dai_sat]
    sfx: [GIII...]
  - pos: bottom-left
    action: "Close on the bar biting again under the buckled lid edge, the metal groaning."
    sfx: [GIGIGI...]
    captions:
    - THE CREAK WENT UP INTO A GROAN.

- page: 4
  title: Bang
  location: tanabe-weeds
  time: Saturday about 1:25 p.m., clear pale November sun
  guards: [*sat_light, *sat_dai, *car_before, *not_running]
  panels:
  - pos: top, large (half the page)
    action: "HALF-PAGE: on the third go something inside lets go: the buckled trunk lid jumps open a hand's width and stops there, crooked; Dai stumbling with the bar, a burst of rust flakes and dust; impact lines."
    cast: [*dai_sat, {id: bluecar, view: old, state: before, camera: "low and close, straight at the crushed rear from behind at bumper height"}]
    sfx: [BANG!]
    captions:
    - ON THE THIRD GO SOMETHING INSIDE LET GO.
  - pos: middle-right
    action: "The big striped cat with half a tail leaping off the car and away over the stack of crushed Corollas, a blur."
    cast: [cat]
    sfx: [{text: "zaza", note: small}]
  - pos: middle-left
    action: "Close: Dai lifting the crooked lid: inside, a small damp carpeted trunk, the spare wheel in its round well on the left, and on the right in a plastic tray the old black battery with a white powdery crust round both posts, a dark dried ring in the carpet under it."
    cast: [{id: bluecar, view: parts, camera: "from behind and above, looking down into the open trunk"}]
    captions:
    - INSIDE IT SMELLED OF DAMP CARPET AND SOMETHING SOUR.
  - pos: bottom, wide
    action: "Close in the corner of the trunk by the spare wheel: a crumpled plastic carrier bag, inside it a hard old car-wash sponge and a bottle of car wax a third full (no readable label)."
    captions:
    - IN THE CORNER BY THE SPARE THERE WAS A CARRIER BAG. A CAR-WASH SPONGE GONE HARD, AND A BOTTLE OF WAX WITH A THIRD LEFT.

- page: 5
  title: The lead's worth something
  location: tanabe-weeds
  time: Saturday about 1:40 p.m., clear pale November sun
  guards: [*sat_light, *sat_dai, *fumie_g, *not_running]
  panels:
  - pos: top-right
    action: "Fumie lifting the old crusted black battery out of the trunk by its handle."
    cast: [*fumie_coat]
  - pos: top-left
    action: "Fumie walking away toward the prefab office in the distance carrying the battery against her hip, not looking back."
    cast: [*fumie_coat]
    dialogue:
    - fumie: THAT'S MINE. THE LEAD'S WORTH SOMETHING.
  - pos: middle-right
    action: "Dai setting the carrier bag down carefully on the outside step of the grey prefab office."
    location: tanabe-yard
    cast: [*dai_sat]
    captions:
    - I PUT THE CARRIER BAG ON THE STEP OF THE OFFICE. IT WASN'T MINE TO THROW AWAY.
  - pos: middle-left
    action: "Close inside the trunk at the back panel: a ragged empty taillight hole, the old bulb socket hanging out of it on its wires, bits of broken red plastic caught in the edges; Dai's gloved fingers picking them out."
    cast: [{<<: *dai_sat, note: "only his hands"}]
    captions:
    - EACH SOCKET HUNG ON ITS WIRE, WHOLE, WITH ITS BULBS IN.
  - pos: bottom, wide
    action: "From inside the open trunk: Dai's gloved hand doing up a small nut on a stud with a 10-millimeter spanner; the back of the RIGHT taillight sitting flush in its hole; the bulb socket twisted into its back."
    cast: [{<<: *dai_sat, note: "only his hands"}]
    captions:
    - THE RIGHT LIGHT WENT IN THE WAY IT WAS MEANT TO. FOUR STUDS THROUGH FOUR HOLES, AND FROM THE INSIDE FOUR NUTS. TEN MILLIMETER.
    sfx: [{text: "kiri kiri", note: small}]

- page: 6
  title: You're asking it
  location: tanabe-weeds
  time: Saturday about 2:15 p.m., clear pale November sun
  guards: [*sat_light, *sat_dai, *fumie_g, *not_running]
  panels:
  - pos: top-right
    action: "Close outside on the crushed LEFT rear corner of the car: the left taillight sitting crooked in the pushed-in panel, one corner standing out, two studs that won't meet their holes."
    cast: [{id: bluecar, view: rear, camera: "close at the LEFT rear corner, from the side, eye level"}]
    captions:
    - THE LEFT ONE DIDN'T. THE FISH TRUCK HAD COME IN AT THAT CORNER.
  - pos: top-left
    action: "Fumie coming back through the weeds with a lump hammer and a block of wood."
    cast: [*fumie_coat]
  - pos: middle, wide
    action: "Inside the open trunk: Fumie's thick hand holding a block of wood against the inside of the bent panel; Dai swinging the lump hammer onto the wood."
    cast: [{<<: *fumie_coat, note: "her hands and arm"}, {<<: *dai_sat, note: "his arm and the hammer"}]
    sfx: [GON!]
  - pos: bottom-right
    action: "Fumie, eyes on the panel, flat."
    cast: [*fumie_coat]
    dialogue:
    - fumie: YOU'RE NOT KILLING IT. YOU'RE ASKING IT.
  - pos: bottom-left
    action: "Close outside: the left taillight in place now, its outer corner standing a finger's width proud of the body."
    cast: [{id: bluecar, view: rear, camera: "close, straight on at the left taillight"}]
    captions:
    - TEN MINUTES. THE LEFT LIGHT WENT IN WITH ITS OUTER CORNER A FINGER'S WIDTH PROUD, AND STAYED.

- page: 7
  title: Open to the sky
  location: tanabe-weeds
  time: Saturday, from about 3 p.m. to sunset at 4:40, the light going golden and then low
  guards: [*sat_light, *sat_dai, *fumie_g, *not_running]
  panels:
  - pos: top, wide
    action: "The car with NO roof at all: the old grey torn top lifted away and lying split in the weeds; the open cockpit full of cat hair and dead leaves, the bare top frame bolts behind the seats; Dai kneeling on the seat with a screwdriver."
    cast: [*dai_sat, {id: bluecar, view: old, state: half_up, camera: "high, from above the front-RIGHT corner, looking down into the open cockpit", note: "NO soft top on it at all: open to the sky, the windshield frame bare"}]
    captions:
    - THE OLD TOP CAME AWAY GREY AND SPLIT, AND FOR A MINUTE THE CAR WAS OPEN TO THE SKY.
  - pos: middle-right
    action: "Dai and Fumie lifting a folded BLACK soft top, frame and all, out of an old blue tarp tied with string (the tarp drawn in mid-grey tone)."
    cast: [*fumie_coat, *dai_sat]
  - pos: middle-left
    action: "Fumie on the far side of the car holding the black top's frame up with both arms, swearing, her cigarette jutting."
    cast: [*fumie_coat]
    sfx: [{text: "kuso...", note: small}]
    captions:
    - "IT TOOK THE TWO OF US, HER ON THE FAR SIDE HOLDING AND SWEARING, ME WITH THE SCREWDRIVER..."
  - pos: bottom-right
    action: "Low golden late sun going down behind the stacks on the town side of the yard; long shadows over the weeds; the car's shape dark."
    captions:
    - "...UNTIL THE SUN WAS DOWN ON THE TOWN SIDE OF THE YARD."
  - pos: bottom-left
    action: "Inside the car from the driver's seat (on the RIGHT), looking BACK over the seats: the new black top tight overhead, and through its CLEAR plastic rear window the stacks of crushed white Corollas in the dusk."
    cast: [{id: bluecar, view: interior, camera: "from the driver's seat looking back through the clear rear window"}]
    captions:
    - IT WAS TIGHT. THROUGH THE CLEAR BACK WINDOW YOU COULD SEE THE COROLLAS.

- page: 8
  title: A white fender, a grey hood
  location: tanabe-weeds
  time: Saturday about 4:45 p.m., just after sunset, dusk
  guards: ["Saturday dusk just after a clear November sunset: dim even light, the sky pale over the cranes, dry ground.", *sat_dai, *not_running]
  panels:
  - pos: top-right
    action: "Close at the crushed rear: Dai holding the block of wood behind the bent number plate and beating it flat with the hammer."
    cast: [{<<: *dai_sat, note: "his hands and the hammer"}]
    sfx: [GAN GAN]
    captions:
    - THE REAR PLATE WAS BENT INTO A V. I BEAT IT FLAT WHERE IT WAS, OR NEARLY.
  - pos: top-left
    action: "Close: the white rear number plate nearly flat, one crease across its middle (no readable characters)."
    captions:
    - A CREASE WENT ACROSS THE NUMBERS.
  - pos: middle, wide
    action: "Close: pliers twisting the ends of a steel wire tied twice round, from the hole where the trunk catch was to a bracket underneath, holding the peaked trunk lid shut."
    cast: [{<<: *dai_sat, note: "only his hands"}]
    sfx: [{text: "giri", note: small}]
    captions:
    - THE TRUNK LID WOULDN'T SHUT ANY MORE. I TIED IT DOWN WITH WIRE, TWICE ROUND.
  - pos: bottom, large (half the page)
    action: "HALF-PAGE, silent and wide: Dai standing just ahead of the car's front-LEFT corner in the dusk, tools in hand, looking back down its whole length: the WHITE left front fender nearest, the grey primer hood, the faded grey-blue door, the whole BLACK top up, and at the far end the two taillights, the left one sitting a little proud; the stacks of crushed Corollas dark behind."
    cast: [*dai_sat, {id: bluecar, view: front34, state: half_up, camera: "eye level from just ahead of the front-LEFT corner, looking back down the LEFT flank"}]
    captions:
    - A WHITE FENDER, A GREY HOOD, BLUE IN BETWEEN. A BLACK TOP. AT THE BACK, TWO TAILLIGHTS, ONE SITTING A LITTLE PROUD.

- page: 9
  title: The door
  location: tanabe-weeds
  time: Saturday about 4:55 p.m., dusk
  guards: ["Saturday dusk after a clear November sunset: dim even light, dry ground.", *sat_dai, *not_running]
  panels:
  - pos: top, wide
    action: "The big striped cat with half a tail coming back through the weeds toward the car while Dai, small, puts tools in the red toolbox."
    cast: [cat, {<<: *dai_sat, note: "small, in the background"}]
    captions:
    - THE CAT CAME BACK WHILE I WAS PUTTING THE TOOLS AWAY.
  - pos: middle-right
    action: "The cat standing on its back legs with its front paws on the LEFT (passenger) door, looking up at the new black top where the old tear used to be."
    cast: [cat, {id: bluecar, view: front34, state: half_up, camera: "eye level, close at the LEFT (passenger) door, the black top above"}]
  - pos: middle-left
    action: "The cat sitting down in the weeds by the door and looking straight at Dai (off-panel), unimpressed."
    cast: [cat]
  - pos: bottom-right
    action: "Dai opening the passenger door for it, holding it wide."
    cast: [*dai_sat]
  - pos: bottom-left
    action: "Through the open passenger door: the cat lying down on the LEFT passenger seat, eyes half shut."
    cast: [cat]
    captions:
    - IT WOULD HAVE TO USE THE DOOR FROM NOW ON.

# ================================================================== Sun 5 Nov: the walk
- page: 10
  title: I know you know
  location: hayama-apartment
  time: Sunday morning to noon, clear
  guards: [*sun_dai, *sota_g]
  panels:
  - pos: top-right
    action: "In the small danchi kitchen: Sota sitting at the low table already wearing his navy jacket, swinging his legs; a wall clock showing ten o'clock."
    cast: [*sota_jacket]
    captions:
    - "ON SUNDAY SOTA HAD HIS JACKET ON BY TEN. KUBO-SAN HAD SAID TWO."
  - pos: upper-middle, small
    action: "Small inset: at eight in the morning, Sota in pajamas breathing in from his inhaler while Dai holds up ten fingers, counting."
    cast: [{id: sota, outfit: pajamas}]
    captions:
    - HE'D DONE HIS MORNING INHALER AT EIGHT, WITH ME COUNTING TEN AND TEN.
  - pos: top-left
    action: "Small memory inset, soft grey border: Saturday night, Mom in the genkan with her shopping bag, turning to say it over her shoulder."
    cast: [*mom_home]
    dialogue:
    - michiko: TAKE THE BLUE ONE AS WELL.
    captions:
    - I'D TOLD MOM I WAS TAKING HIM TO THE HARBOR TO LOOK AT THE SHIPS.
  - pos: middle, wide
    action: "Close: Dai's hands putting the small blue asthma inhaler into the inside pocket of the navy jacket and zipping the little pocket shut."
    cast: [{<<: *dai_sun, note: "only his hands"}, {<<: *sota_jacket, note: "only the jacket"}]
    captions:
    - AT TWELVE I PUT THE BLUE ONE IN THE INSIDE POCKET OF KEN'S JACKET AND DID THE ZIP UP MYSELF.
    sfx: [{text: "jiii", note: small}]
  - pos: bottom-right
    action: "Sota looking up at Dai, a little offended."
    cast: [*sota_jacket]
    dialogue:
    - sota: I KNOW WHERE IT IS.
  - pos: bottom-left
    action: "Dai doing the jacket's main zip up to Sota's chin, not looking at his face."
    cast: [*dai_sun]
    dialogue:
    - dai_cut: I KNOW YOU KNOW.

- page: 11
  title: Nii-chan says you talk
  location: tanabe-yard
  time: Sunday about 1:45 p.m., clear, dry
  guards: [*sun_light, *sun_dai, *sota_g, *nobu_g]
  panels:
  - pos: top, wide
    action: "A steep street of small houses and power lines on the hill behind the station: Dai walking slowly beside little Sota, matching his small steps; harbor glimpsed below."
    cast: [*dai_sun, *sota_jacket]
    captions:
    - I WENT AT HIS SPEED, WHICH ON THE HILL BEHIND THE STATION IS SLOW. HE ASKED ELEVEN QUESTIONS ON THE WAY. I ANSWERED FOUR.
  - pos: middle-right
    action: "At the top of the lane of crushed shells that leads to the scrapyard: Nobu sitting on the curb with his canvas bag on his knees, standing up as he sees them."
    cast: [*nobu_sun]
  - pos: middle-left
    action: "Nobu and Sota bowing to each other, very formally, a little stiff."
    cast: [*nobu_sun, *sota_jacket]
  - pos: lower-right
    action: "Nobu, straightening up, earnest."
    cast: [*nobu_sun]
    dialogue:
    - nobu: KAWAMATA. FROM SCHOOL.
  - pos: lower-left
    action: "Sota looking up at Nobu through his round glasses, matter-of-fact."
    cast: [*sota_jacket]
    dialogue:
    - sota: I KNOW. NII-CHAN SAYS YOU TALK.
  - pos: bottom, wide
    action: "Nobu turning to look at Dai; Dai looking away down the lane, deadpan."
    cast: [*nobu_sun, *dai_sun]
    captions:
    - NOBU LOOKED AT ME. I LOOKED AT THE LANE.

- page: 12
  title: Hm
  location: tanabe-yard
  time: Sunday about 2 p.m., clear, dry
  guards: [*sun_light, *kubo_g, *fumie_g]
  panels:
  - pos: top, wide
    action: "By the grey prefab office: Kubo's old green step-through Super Cub parked, the red steel toolbox on its rack, a cardboard box roped on top of the toolbox and a red ten-liter jerrycan roped on top of that; Kubo and Fumie standing at the office door side by side, not talking."
    cast: [{id: supercub, camera: "eye level, three-quarter from the rear-left, parked on its stand"}, {id: kubo_far, note: "standing at the office door"}, {id: fumie_far, note: "beside him, not talking"}]
    captions:
