chapter: 15
title: You Promised, Kid
lettering: empty

# Reusable cast entries (YAML anchors). Free-text outfits use the character's default sheet.
x-cast:
  dai_sun: &dai_sun {id: dai_cut, outfit: "a plain grey zip-up jacket with NO name tag, open over a faded dark flannel shirt with a BUTTONED breast pocket, worn jeans with grey grit ground into the KNEES, beat-up white canvas sneakers (the right one held together with silver tape)"}
  dai_work: &dai_work {id: dai_cut, outfit: "a plain grey zip-up jacket with NO name tag over a faded dark flannel shirt, worn jeans, white cotton work gloves, beat-up white canvas sneakers (the right one held together with silver tape)"}
  dai_home: &dai_home {id: dai_cut, outfit: "an old faded white long-sleeved T-shirt, worn jeans, white socks indoors"}
  dai_gak: &dai_gak {id: dai_cut, outfit: "black gakuran winter school uniform (stand collar open, worn carelessly), black trousers"}
  dai_stn: &dai_stn {id: dai_cut, outfit: "grey zip-up gas-station work jacket half zipped over a black T-shirt, a small white NAME TAG on the chest, worn jeans, white canvas sneakers; BAREHEADED, no cap"}
  akane: &akane {id: akane, outfit: "a dark jacket zipped up to the chin, black jeans, black leather driving gloves with the knuckles cut open, thin flat canvas shoes"}
  akane_bare: &akane_bare {id: akane, outfit: "a dark jacket zipped up to the chin, black jeans, thin flat canvas shoes; BARE hands, no gloves"}
  fumie_coat: &fumie_coat {id: fumie, outfit: "an old padded dark work coat over her navy work jacket, dark work trousers, scuffed safety boots"}
  fumie: &fumie {id: fumie, outfit: work}
  kubo_own: &kubo_own {id: kubo, outfit: own}
  kubo_stn: &kubo_stn {id: kubo, outfit: station}
  mom_apron: &mom_apron {id: michiko, outfit: "a worn cardigan with the sleeves pushed up and a plain apron over loose trousers, socks"}
  sota_jacket: &sota_jacket {id: sota, outfit: "Ken's NAVY padded winter jacket with a hood (dark tone), a little too big, the zip UNDONE, over a striped T-shirt and shorts, socks, round glasses"}
  sun_dai: &sun_dai "Dai: SHORT black hair (forehead uncovered), plain grey zip-up jacket with NO name tag over a dark flannel shirt, jeans."
  stn_dai: &stn_dai "Dai: SHORT black hair (forehead uncovered), BAREHEADED, grey station jacket with a small white name tag."
  akane_g: &akane_g "Akane (22 this week): long black hair in a LOW ponytail, dark jacket zipped to the chin, black fingerless driving gloves; short and flat, no smile."
  fumie_g: &fumie_g "Fumie (over sixty): small and square, short grey hair, white towel round her forehead, cigarette in the corner of her mouth, LEFT eye half shut, navy work jacket."
  kubo_g: &kubo_g "Kubo (late 50s): OLD, thin, deeply lined face, grey cap, his own faded light work jacket over a buttoned grey shirt; bad knee, gets down and up slowly."
  seats: &seats "SEATS: Dai drives the red Roadster from the RIGHT seat (behind the steering wheel); Akane sits in the LEFT passenger seat with NO wheel in front of her."
  dawn_sun: &dawn_sun "Sunday sunrise at the end of October: clear, low sun, long soft shadows, cold, breath shows. DRY: no rain, no puddles."
  notes_95: &notes_95 "Banknotes are 1995 Japanese notes only: the 10,000-yen note is a large light-toned note with an oval portrait of an older man with swept-back hair; the 5,000-yen note is middle-sized with a portrait of a man with round glasses; the 1,000-yen note is smaller, blue-grey tone, with a portrait of a man with a moustache. No other designs, no foreign money."
  mr2_g: &mr2_g "The car under the tarp: a wrecked BLACK first-generation MR2 (small low wedge-shaped mid-engine coupe, fixed roof, grille-less blunt nose, pop-up lids shut), dull with grey dust. Only its RIGHT side and nose are seen. Nothing stands in the folded door; no blood, no stains, no people inside."
  wreck_g: &wreck_g "Dai's car: the blue Roadster wreck (faded grey paint, WHITE left front fender, matte primer hood, RIGHT pop-up headlight stuck half up, crushed rear, the old grey soft top torn above the LEFT seat), standing level on plain rusty STEEL wheels in the yellow weeds. Right-hand drive."
  engine_g: &engine_g "The front of the engine with its black plastic timing-belt covers OFF: low down the crankshaft's small TOOTHED wheel with a big bolt in its middle; higher up two plain round idler/tensioner pulleys; at the top two big TOOTHED cam pulleys side by side, each as big as a saucer; the water pump at the back between them. Grimy, dusty, real mechanical detail."

defaults:
  orientation: portrait
  time: late October 1995
  notes:
  - Right-to-left panel order. One speaker per panel. All cars are Japanese models sold by 1995, right-hand drive.
  - No brand logos, no maker badges, no stickers, no readable signs or printed words anywhere unless a panel asks for them. No Japanese characters. No banknotes unless a panel asks for them.
  - DRY weather in every scene of this chapter. No rain.
  - Roomy panels with breathing space; vary shot sizes and poses; no two panels on the page may look alike.

pages:

# ================================================================== Sun 29 Oct, 5:57 a.m.: paying Fumie
- page: 1
  title: Three minutes to six
  location: tanabe-yard
  time: Sunday 5:57 a.m. at the end of October, grey first light before sunrise, the sky pale over the cranes, the office window lit
  guards:
  - *sun_dai
  - *fumie_g
  panels:
  - pos: top, wide
    action: "Establishing: the scrapyard in grey first light, the stacks of crushed cars dark, the two-storey prefab office by the open gate with ONE lit window; Dai small, walking in through the gate down the lane of crushed shells, hands in his jacket pockets."
    cast: [{<<: *dai_sun, note: "small, from behind"}]
    captions:
    - SUNDAY. 5:57 A.M.
    - I GOT TO TANABE'S AT THREE MINUTES TO SIX WITH MY SHIRT POCKET STILL BUTTONED.
  - pos: upper-right
    location: tanabe-office
    action: "Inside the cramped office under the tube light: Fumie sitting at the steel desk in her coat, an electric kettle ticking on behind her, an UNLIT cigarette in her mouth."
    cast: [*fumie_coat]
    captions:
    - THE OFFICE LIGHT WAS ON. TANABE-SAN SAT AT THE DESK IN HER COAT, WITH THE FIRST CIGARETTE OF THE DAY IN HER MOUTH, NOT LIT YET.
  - pos: upper-left
    location: tanabe-office
    action: "Close on Dai's fingers unbuttoning the breast pocket of his flannel shirt under the open grey jacket."
    cast: [{<<: *dai_sun, note: "only his chest and hands"}]
    captions:
    - I DIDN'T KNOCK. I UNBUTTONED THE POCKET.
  - pos: middle, wide
    location: tanabe-office
    action: "Close on the grey steel desk top: Dai's hand putting down three small folded banknotes, one 5,000-yen note and two 1,000-yen notes, folded small, in front of Fumie's big brown hands."
    cast: [{<<: *dai_sun, note: "only his hand"}]
    notes: [*notes_95]
    captions:
    - A 5,000 AND TWO 1,000S, FOLDED SMALL, STILL WARM FROM BEING AGAINST ME ALL NIGHT.
  - pos: bottom, wide
    location: tanabe-office
    action: "Fumie not touching the notes, looking UP and DOWN at Dai across the desk, her eyes on his jacket and the knees of his jeans; the unlit cigarette."
    cast: [*fumie_coat]
    captions:
    - SHE DIDN'T UNFOLD THEM. SHE LOOKED AT ME INSTEAD.

- page: 2
  title: That's October
  location: tanabe-office
  time: Sunday about 5:58 a.m., grey dawn at the window, the tube light on
  guards:
  - *sun_dai
  - *fumie_g
  panels:
  - pos: top-right
    action: "Close on the knees of Dai's jeans: grey grit from a concrete deck ground into the cloth."
    cast: [{<<: *dai_sun, note: "only his knees"}]
    captions:
    - AT MY JACKET AND THE KNEES OF MY JEANS, WHERE THE GRIT OFF THE OVERPASS DECK HAD GONE INTO THE CLOTH.
  - pos: top-left
    action: "Fumie at the desk, deadpan, the unlit cigarette bobbing as she talks."
    cast: [*fumie_coat]
    dialogue:
    - fumie: YOU LOOK LIKE SOMETHING THEY'D PAY ME TO TAKE AWAY.
  - pos: middle, large
    action: "Fumie standing at the plywood wall covered in old crossed-out marker writing, a black marker taken off its nail by the beach poster, writing a new line in square capitals UNDER two older lines. Readable, in black marker, top to bottom: HAYAMA. ROADSTER. 60,000. / MINUS 20,000. 17 SEP. / and the new line MINUS 7,000. 29 OCT. Everything else on the wall is small unreadable scribble."
    cast: [*fumie_coat]
    captions:
    - SHE TOOK THE MARKER OFF ITS NAIL AND WROTE ON THE WALL UNDER THE LINE FROM SEPTEMBER, IN THE SAME SQUARE CAPITALS.
  - pos: lower-right
    action: "Close on Fumie's thick hand sliding the folded notes into the desk drawer without counting them."
    cast: [{<<: *fumie_coat, note: "only her hand"}]
    notes: [*notes_95]
  - pos: lower-left
    action: "Fumie lighting the cigarette with a cheap lighter, smoke rising, eyes half shut."
    cast: [*fumie_coat]
    sfx: [shuk]
    dialogue:
    - fumie: THAT'S OCTOBER.

# ================================================================== 6 a.m.: the lesson
- page: 3
  title: You haven't slept
  location: tanabe-yard
  time: Sunday 6:00 a.m., the sky going pale, the sun not up yet, cold
  guards:
  - *sun_dai
  - *akane_g
  - *seats
  panels:
  - pos: top, wide
    action: "The red Roadster coming down the lane of crushed white shells toward the yard with its pop-ups DOWN, past the big yellow car crusher, shells cracking under its tires."
    cast: [{id: roadster, view: front34, state: headlights_down, camera: "far and high from the office stair, front three-quarter of its RIGHT flank, coming down the lane toward us"}]
    sfx: [paki paki]
    captions:
    - THE RED CAR CAME DOWN THE LANE AT SIX WITH ITS POP-UPS DOWN, THE SHELLS CRACKING UNDER ITS TIRES.
  - pos: middle-right
    location: tanabe-backlot
    action: "Akane standing by her car in the back lot, looking hard at Dai's FACE, not at his shoes."
    cast: [*akane]
    captions:
    - SHE GOT OUT AND LOOKED AT ME. NOT AT MY SHOES THIS TIME. AT MY FACE.
  - pos: middle-left
    location: tanabe-backlot
    action: "Close on Akane, flat, eyes on his face."
    cast: [*akane]
    dialogue:
    - akane: YOU HAVEN'T SLEPT.
  - pos: lower-right
    location: tanabe-backlot
    action: "Dai, tired eyes, shadows under them, looking aside."
    cast: [*dai_sun]
    dialogue:
    - dai_cut: SOME.
  - pos: lower-left
    location: tanabe-backlot
    action: "Akane walking round the front of the car to the LEFT (passenger) door and getting in; Dai at the open right door."
    cast: [{<<: *akane, note: "at the passenger door, the car's LEFT side"}]
    captions:
    - SHE GOT IN ON THE LEFT.

- page: 4
  title: A beat behind
  location: tanabe-backlot
  time: Sunday about 6:05 a.m., pale dawn, the first sun on the tops of the stacks
  guards:
  - *seats
  - *dawn_sun
  - "The old tire stands on its edge against the corrugated fence halfway along the lot."
  panels:
  - pos: top-right
    action: "Inside the car: Dai's hand at the side of the driver's seat pulling the seat lever; the rear-view mirror in the corner."
    cast: [{<<: *dai_sun, note: "his hand and shoulder only"}, {id: roadster, view: interior, camera: "close on the side of the driver's seat from the open door"}]
    sfx: [kachi kachi kachi]
    captions:
    - I SET THE SEAT, THREE CLICKS, AND THE MIRRORS, AND THE BELT.
  - pos: top-left
    action: "Close in the footwell: the ball of Dai's taped right sneaker on the brake pedal, the side of the foot rolling toward the gas pedal."
    cast: [{<<: *dai_sun, note: "only his right foot"}]
    captions:
    - I DID THE BRAKE AND THE ROLL OF THE HEEL TWENTY TIMES WITH THE ENGINE OFF BEFORE SHE COULD TELL ME TO.
  - pos: middle, wide
    action: "The lot from high above the far end: the small red Roadster coming along the tall corrugated fence in the dew toward the old tire standing against the fence halfway along; tire tracks."
    cast: [{id: roadster, view: front34, state: headlights_down, camera: "high from on top of the far-end stack, straight head-on, the car small, coming toward us along the fence"}]
    captions:
    - "THEN WE DID THE FENCE: FIRST, SECOND AT THE CORNER, TWENTY ALONG THE FENCE, BRAKE LEVEL WITH THE OLD TIRE, CLUTCH, BLIP, LEVER, CLUTCH UP."
  - pos: lower-right
    action: "Close in the footwell, motion lines: the right foot rolling onto the gas a fraction LATE, the left foot on the clutch."
    cast: [{<<: *dai_sun, note: "only his feet"}]
    captions:
    - MY FEET KNEW THE ORDER. THEY DID IT A BEAT BEHIND, EVERY TIME, LIKE A TAPE ON A CHEAP PLAYER WHEN THE BATTERIES ARE GOING.
  - pos: lower-left
    action: "Inside from behind the seats: both heads jerking forward together, motion lines; Dai on the IMAGE RIGHT behind the wheel, Akane on the IMAGE LEFT."
    cast: [{<<: *dai_sun, note: "from behind"}, {<<: *akane, note: "from behind"}]
    sfx: [GAKUN]
    captions:
    - THE FIRST THREE RUNS JERKED.

- page: 5
  title: Again
  location: tanabe-backlot
  time: Sunday about 6:10 a.m., low clear sun just over the stacks
  guards:
  - *seats
  - *dawn_sun
  panels:
  - pos: top, wide
    action: "The red Roadster slowing smoothly past the old tire against the fence, level and calm, its long shadow on the dew."
    cast: [{id: roadster, view: front34, state: headlights_down, camera: "low, ground level from the middle of the lot, side view of its RIGHT flank with the FRONT pointing RIGHT, the fence behind it"}]
    captions:
    - THE FOURTH DIDN'T, AND THE FIFTH DIDN'T.
  - pos: upper-right
    action: "Akane in the passenger seat, eyes front, no reaction."
    cast: [*akane]
    dialogue:
    - akane: AGAIN.
    captions:
    - SHE SAID "AGAIN" AFTER BOTH OF THEM, THE SAME AS AFTER THE BAD ONES.
  - pos: upper-left, large
    action: "Over Dai's shoulder from behind the seats: his gloveless hands snapping the steering wheel to the RIGHT to catch it; through the windshield the car's nose swinging LEFT, away from the fence, the stacks sliding."
    cast: [{<<: *dai_sun, note: "from behind, on the IMAGE RIGHT, behind the wheel"}, {id: roadster, view: interior, camera: "from behind the driver's seat over his shoulder, looking out through the windshield"}]
    captions:
    - ON THE SIXTH, WHEN I BRAKED, THE NOSE WENT LEFT.
    - NOT MUCH. A HAND'S WIDTH, AWAY FROM THE FENCE.
  - pos: middle-right
    action: "Close on the short gear lever under Dai's left hand going into first with a jolt, motion lines."
    cast: [{<<: *dai_sun, note: "only his left hand"}, {id: roadster, view: interior, camera: "close on the gear lever and console"}]
    sfx: [GAKUN]
    captions:
    - I CAUGHT IT WITH THE WHEEL AND FINISHED THE DOWNSHIFT, AND IT JERKED, BECAUSE I'D BEEN THINKING ABOUT THE WHEEL.
  - pos: middle-left
    action: "Akane in profile against her side window, looking straight ahead."
    cast: [*akane]
    dialogue:
    - akane: AGAIN.

  - pos: bottom, wide
    action: "Close on Dai's hands on the steering wheel, knuckles tight, holding it straight against a pull to the left; his forearms tense."
    cast: [{<<: *dai_sun, note: "only his hands and forearms"}, {id: roadster, view: interior, camera: "close on the steering wheel from the passenger side"}]
    captions:
    - ALONG THE FENCE IN SECOND THE WHEEL WAS HEAVIER THAN IT SHOULD HAVE BEEN AT TWENTY. IT WANTED TO GO LEFT, A LITTLE, ALL THE TIME.
- page: 6
  title: It's pulling
  location: tanabe-backlot
  time: Sunday about 6:15 a.m., low clear sun
  guards:
  - *seats
  - *dawn_sun
  panels:
  - pos: top-right
    action: "The red Roadster braking by the old tire, its nose dipped and pointing off to the side, away from the fence."
    cast: [{id: roadster, view: front34, state: headlights_down, camera: "low straight head-on at bumper height, the nose dipped under braking and angled toward the IMAGE RIGHT"}]
    captions:
    - AT THE TIRE I BRAKED, AND THE NOSE WENT LEFT AGAIN, FURTHER.
  - pos: top-left
    action: "Dai behind the wheel turning his head to Akane, frowning, sure of it."
    cast: [*dai_sun]
    dialogue:
    - dai_cut: IT'S PULLING. LEFT. WHEN I BRAKE. AND THE WHEEL'S HEAVY.
  - pos: middle, wide
    action: "Akane turning to look at him, a long flat look. Silent."
    cast: [*akane]
  - pos: lower-right
    action: "Akane already opening her door to get out."
    cast: [*akane]
    dialogue:
    - akane: STOP.

  - pos: lower-left, large
    action: "Akane crouched by the car's front LEFT wheel, her gloved hand laid flat on top of the tire."
    cast: [*akane, {id: roadster, view: front34, state: headlights_down, camera: "ground level, close, from in front of the front-LEFT corner, the left front wheel big"}]
    captions:
    - SHE WENT ROUND TO THE FRONT LEFT AND CROUCHED BY IT, WITH HER GLOVED HAND FLAT ON TOP OF THE TIRE.
  - pos: bottom, wide
    action: "Close on Akane's gloved fingers taking a slim steel tire-pressure gauge, the size of a fat pencil with a pocket clip, out of her jacket pocket."
    cast: [{<<: *akane, note: "only her hands"}]
    captions:
    - OUT OF HER JACKET POCKET CAME HER GAUGE, A STEEL THING THE SIZE OF A FAT PENCIL, WITH A CLIP ON IT.
- page: 7
  title: Made of those
  location: tanabe-backlot
  time: Sunday about 6:18 a.m., low clear sun
  guards:
  - *akane_g
  - *fumie_g
  panels:
  - pos: top-right
    action: "Close on the gauge pressed onto the tire's valve, its little white stem pushed out; Akane's eyes on it."
    cast: [{<<: *akane, note: "her eyes and hand"}]
    captions:
    - SHE PUT IT ON THE VALVE AND READ IT, AND READ IT AGAIN.
  - pos: top-left
    action: "Akane still crouched, not looking up, one word to the car."
    cast: [*akane]
    dialogue:
    - akane: FORWARD. THE LENGTH OF YOUR ARM.
  - pos: middle-right
    action: "Dai behind the wheel letting the car creep, careful, his eyes on her crouched figure past the hood."
    cast: [*dai_sun]
    captions:
    - I LET IT CREEP FORWARD IN FIRST, ABOUT THAT FAR, AND STOPPED IT WITHOUT A JERK, WHICH NOBODY NOTICED.

  - pos: middle-left
    action: "Close on Akane's gloved thumb pressing on something small and bright in the tread of the tire."
    cast: [{<<: *akane, note: "only her hand"}]
  - pos: lower-right
    action: "Dai standing, leaning to look over Akane's shoulder as she crouches at the tire."
    cast: [*dai_sun]
    captions:
    - I GOT OUT AND LOOKED OVER HER SHOULDER.
  - pos: lower-left, large
    action: "BIG close-up of the tire tread: the bright round head of a screw with a CROSS cut in it, sitting in the groove between two blocks of tread."
    captions:
    - A SCREW. JUST THE HEAD OF IT, BRIGHT, WITH A CROSS CUT IN IT, SITTING IN THE GROOVE BETWEEN TWO BLOCKS OF TREAD.
- page: 8
  title: The trolley jack
  location: tanabe-backlot
  time: Sunday about 6:20 a.m., low clear sun
  guards:
  - *fumie_g
  - *akane_g
  - *sun_dai
  panels:
  - pos: top-right
    action: "Fumie sitting up on the seat of her old forklift at the corner of the lot with a cup of coffee, cigarette in her mouth."
    cast: [*fumie, {id: forklift, camera: "low side-on from the lot, the forklift at the corner"}]
    dialogue:
    - fumie: THAT'S MY YARD.
    - fumie: MY YARD'S MADE OF THOSE. I'M NOT PAYING FOR IT.
    captions:
    - SHE'D BEEN SITTING UP THERE WITH HER COFFEE THE WHOLE TIME.
  - pos: top-left
    action: "Akane standing up, looking at the ground, the crushed shells, not at anyone."
    cast: [*akane]
    dialogue:
    - akane: NOT ON THE SHELL.

  - pos: middle-right
    location: tanabe-backlot
    action: "Close on Fumie putting her coffee cup down on the floor of the forklift by her boots."
    cast: [{<<: *fumie, note: "her hand and boots"}]
    dialogue:
    - fumie: CONCRETE IN FRONT OF THE OFFICE.
  - pos: middle-left
    location: tanabe-backlot
    action: "Fumie up on the forklift pointing with her chin and cigarette toward the back of the yard."
    cast: [*fumie]
    dialogue:
    - fumie: BOY. THE TROLLEY JACK. BEHIND THE TIRE WALL, BY THE BACK FENCE. BRING IT ROUND.
  - pos: lower, wide
    action: "Out in the main yard, between the big yellow car crusher and the end of a tall wall of stacked old tires: Dai walking ahead on foot; behind him the red Roadster creeping along at walking pace."
    cast: [{<<: *dai_sun, note: "walking ahead, small"}, {id: roadster, view: rear, state: headlights_down, camera: "high rear three-quarter from behind-RIGHT, the car creeping, Dai small ahead of it"}]
    captions:
    - I WENT ON FOOT, ROUND THE COROLLAS AND THEN THE SHORT WAY, BETWEEN THE PRESS AND THE END OF THE TIRE WALL.
  - pos: bottom, wide
    action: "Close at ground level on the car's soft front LEFT tire rolling slowly over crushed shells, squashed flat and bulging at the bottom."
    captions:
    - BEHIND ME SHE BROUGHT THE CAR OUT IN FIRST, AT WALKING PACE, WITH THE SOFT TIRE PRESSED FLAT AT THE BOTTOM.

# ================================================================== behind the tire wall: the tarp
- page: 9
  title: The strip
  location: tanabe-tarp-strip
  time: Sunday about 6:28 a.m., low clear sun, long shadows, a cold wind off the harbor
  guards:
  - *sun_dai
  - "The tarp is heavy GREY canvas, never blue plastic."
  - *mr2_g
  panels:
  - pos: top, large
    action: "Establishing: the narrow strip of weeds and broken glass between the tall tire wall (left) and the corrugated back fence (right), running away; at the far end against the fence, the long low shape under the grey canvas tarp, a tire on each corner; Dai small at the near end. In the foreground, lying on its side against the bottom row of tires, an old low trolley jack with a long handle, dark (red) paint, dead leaves in its little wheels."
    cast: [{<<: *dai_sun, note: "small, from behind"}]
    captions:
    - BEHIND THE TIRE WALL THERE'S A STRIP OF WEEDS AND BROKEN GLASS ALONG THE BACK FENCE, TWO METERS WIDE, WHERE NOBODY GOES BUT ME AND THE BROOM.
    - THE TROLLEY JACK LAY ON ITS SIDE AGAINST THE BOTTOM ROW OF TIRES, RED, WITH A LONG HANDLE AND DEAD LEAVES IN ITS WHEELS.
  - pos: middle-right
    action: "The corner of the grey canvas tarp lifting in the wind: its rope hanging loose, the old tire that held the corner down slid half off onto the weeds."
    sfx: [BAFU]
    captions:
    - THE WIND OFF THE HARBOR HAD GOT UNDER ONE CORNER. THE ROPE ON THAT SIDE HAD WORKED LOOSE, AND THE TIRE THAT HELD THE CORNER DOWN HAD SLID HALF OFF.
  - pos: middle-left
    action: "Low close under the lifted edge of the canvas: dull black paint under grey dust, and the edge of a pop-up headlight lid shut down flat into a blunt nose."
    cast: [{id: mr2, view: front34, camera: "extreme close-up under the lifted canvas edge, only a strip of the nose and the shut headlight lid"}]
    captions:
    - EACH TIME IT LIFTED THERE WAS BLACK PAINT UNDER IT, DULL WITH DUST, AND THE EDGE OF A HEADLIGHT LID, SHUT DOWN FLAT INTO THE NOSE.

  - pos: lower-right
    action: "Dai standing the trolley jack up on its wheels and taking hold of its long handle."
    cast: [*dai_sun]
    captions:
    - I STOOD THE JACK UP ON ITS WHEELS AND TOOK HOLD OF THE HANDLE. THEN I LET GO OF IT.
  - pos: lower-left
    action: "The old tire tossed into the weeds; close on Dai's two hands gripping the stiff edge of the grey canvas."
    cast: [{<<: *dai_sun, note: "only his hands"}]
    captions:
    - AND WENT TO THE CORNER, AND LIFTED THE TIRE OFF AND PUT IT IN THE WEEDS, AND TOOK THE CANVAS IN BOTH HANDS.
  - pos: bottom, wide
    action: "Dai walking backward along the strip pulling the heavy grey canvas up and back; it folds over on itself; under it the front of a low black car begins to show."
    cast: [*dai_sun, {id: mr2, view: front34, camera: "eye-level from the strip, the front third of the car only, half under the canvas"}]
    captions:
    - IT WAS HEAVY, AND STIFF WITH DAMP ALONG THE BOTTOM, AND UNDER IT THE AIR SMELLED OF WET CANVAS AND OLD OIL.

- page: 10
  title: An MR2
  location: tanabe-tarp-strip
  time: Sunday about 6:30 a.m., low clear sun
  guards:
  - *sun_dai
  - *mr2_g
  panels:
  - pos: top, large (half the page)
    action: "HALF-PAGE: the canvas folded back over the roof, and the front of the black car revealed: low and wedge-shaped, a blunt sharp-edged nose with NO grille, the two pop-up headlight lids shut flat, dust over the black; Dai at the edge of the panel holding the canvas up over his head."
    cast: [{id: mr2, view: front34, camera: "low front three-quarter of the RIGHT front corner, from the strip, the nose big"}, {<<: *dai_sun, note: "at the edge, arms up holding the canvas"}]
    captions:
    - I KNEW THE CAR BEFORE I HAD THE CANVAS PAST THE FRONT WHEEL.
