      - pos: bottom-right
        action: Nobu walking off, turning back over his shoulder with a grin.
        cast: [nobu]
        dialogue:
          - nobu: "CALL ME NOBU. EVERYBODY DOES."
          - nobu: "WELL. MY FATHER DOES."
      - pos: bottom-left
        action: >-
          Wide: Nobu trotting off down the street toward the station, his bag
          banging on his back; Dai standing alone at the school gate in the
