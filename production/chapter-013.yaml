  - pos: bottom, wide
    action: "Dai at the window counting the change into the young man's open hand; the young man counting it again after him with one finger."
    cast: [*dai_bare, {id: typer_driver, note: "his hand and sweater sleeve in the window"}]
    captions:
    - I COUNTED THE CHANGE INTO HIS HAND. 5,905. HE COUNTED IT AGAIN AFTER ME, WITH ONE FINGER.

- page: 45
  title: Hayama-kun
  location: harbor-station-night
  time: Friday about 4:05 a.m., night under the canopy lights
  guards:
  - "Dai: SHORT black hair, BAREHEADED, grey station jacket with a small white NAME TAG reading HAYAMA in black marker."
  - "The young man (about 22): neat SHORT side-parted hair, calm polite face, grey V-neck sweater over a white collar. He sits in the RIGHT-hand driver's seat of the white coupe."
  panels:
  - pos: top-right
    action: "Close past the young man's hands on the wheel: the round rev counter, its red zone starting only past 8."
    captions:
    - I LOOKED AT THE REV COUNTER. THE RED DIDN'T START UNTIL PAST EIGHT.
  - pos: top-left
    action: "The young man in the window, a small pleasant smile; he has seen where Dai is looking."
    cast: [typer_driver]
    dialogue:
    - typer_driver: I CAN'T SHOW YOU. IT'S BEING RUN IN. THE BOOK SAYS KEEP IT UNDER FOUR THOUSAND FOR THE FIRST THOUSAND KILOMETERS.
    - typer_driver: IT'S DONE FOUR HUNDRED AND TWELVE.
  - pos: middle-right
    action: "Dai at the window, not knowing what to say."
    cast: [*dai_bare]
    captions:
    - I DIDN'T KNOW WHAT YOU SAID TO THAT.
  - pos: middle-left, large
    action: "The young man, hands back at nine and three, turning his head to Dai, courteous and precise."
    cast: [typer_driver]
    dialogue:
    - typer_driver: EXCUSE ME. I'VE BEEN ASKING AT ALL THE STATIONS BETWEEN HERE AND THE BYPASS.
    - typer_driver: DOES A RED ROADSTER FILL UP HERE? AN NA. RED, ON SILVER SEVEN-SPOKE WHEELS. AT NIGHT, I'M TOLD.
  - pos: lower-right
    action: "Close on Dai's face, the answer out before he has thought."
    cast: [*dai_bare]
    dialogue:
    - dai_cut: "NO."
    captions:
    - IT CAME OUT BEFORE I'D THOUGHT ABOUT IT AT ALL.
  - pos: bottom-left
    action: "Close on the white name tag on Dai's grey jacket: HAYAMA handwritten in black marker; the reflection of the young man's glance."
    cast: [{<<: *dai_bare, note: "only his chest and the name tag"}]
    captions:
    - HIS EYES WENT DOWN TO MY CHEST, TO THE NAME TAG KUBO-SAN HAD WRITTEN THE NIGHT HE HIRED ME.

- page: 46
  title: A bad liar
  location: harbor-station-night
  time: Friday about 4:06 a.m., night, the road empty
  guards:
  - "The young man (about 22): neat SHORT side-parted hair, calm polite face, grey V-neck sweater over a white collar, in the RIGHT-hand driver's seat."
