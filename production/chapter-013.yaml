    - AND WHILE THE NEEDLE WAS STILL UP I PUT THE LEVER INTO FIRST, AND IT WENT IN, ALL THE WAY HOME.
  - pos: top-left, large
    action: "BIG: the red Roadster level and calm, slowing past the old tire against the fence, morning sun on it."
    cast: [{id: roadster, view: front34, state: headlights_down, camera: "ground level by the fence, front three-quarter of its RIGHT flank, the old tire big in the foreground"}]
    captions:
    - AND THE CAR DIDN'T JERK. IT GAVE A LITTLE SHRUG, THAT WAS ALL, AND WENT ON SLOWING IN FIRST WITH THE ENGINE HUMMING.
  - pos: middle, wide
    action: "Dai behind the wheel holding his breath, eyes fixed ahead, very still, not looking at her."
    cast: [*dai_gloves]
    captions:
    - I DIDN'T BREATHE. I DIDN'T LOOK AT HER.
  - pos: lower-right
    action: "Akane, eyes ahead, the faintest nothing on her face."
    cast: [akane]
    dialogue:
    - akane: AGAIN.
  - pos: lower-left
    action: "Close on the rear-view mirror jolting on its stalk, motion lines."
    cast: [{id: roadster, view: interior, camera: "close on the rear-view mirror against the windshield"}]
    sfx: [GAKUN]
    captions:
    - THE NEXT ONE JERKED. SO DID THE ONE AFTER THAT.
  - pos: bottom, wide
    action: "Akane looking at her wristwatch."
    cast: [akane]
    dialogue:
    - akane: ENOUGH.
    captions:
    - AT A QUARTER TO SEVEN.

- page: 27
  title: Then you're a customer
  location: tanabe-yard
  time: Sunday about 6:50 a.m., low clear morning sun
  guards:
  - "Fumie (over sixty): short grey hair, white towel round her forehead, cigarette in the corner of her mouth, LEFT eye half shut, navy work jacket."
  panels:
  - pos: top-right
    action: "Inside the red car, stopped by the crushed-car stacks of the back lot: Dai behind the wheel rubbing the outside of his right foot, wincing."
    cast: [*dai_gloves]
    captions:
    - MY RIGHT FOOT ACHED ALONG THE OUTSIDE, FROM THE LITTLE TOE TO THE HEEL. I HADN'T KNOWN YOU HAD MUSCLES THERE.
  - pos: top-left
    action: "Akane back in the driver's seat of the red car with the door still open, looking down at Dai's silver-taped sneaker as he stands outside by the door; only the door edge and seat show."
    cast: [akane, {<<: *dai_gloves, note: "only his legs and taped sneaker"}]
    captions:
    - WE CHANGED SIDES. SHE LOOKED AT MY FEET AGAIN, AT THE SILVER TAPE, AND SHUT THE DOOR, AND WENT.
  - pos: middle, wide
    action: "The yard: the red Roadster small, going out through the open gate; in the foreground Fumie climbing down off her forklift."
    cast: [{id: roadster, view: rear, camera: "far, straight behind, small in the gateway"}, fumie]
    captions:
    - WHEN THE RED CAR HAD GONE THROUGH THE GATE, TANABE-SAN GOT DOWN OFF THE FORKLIFT AND LOOKED AT THE PLYWOOD WALL THROUGH THE OFFICE WINDOW.
  - pos: lower-right
    action: "Fumie by the office window, cigarette, not going in."
    cast: [fumie]
    dialogue:
    - fumie: SIX.
    - fumie: ONE MORE SUNDAY. THEN YOU'RE A CUSTOMER.
  - pos: lower-left
    action: "Dai, hands in pockets."
    cast: [*dai_gloves]
    dialogue:
    - dai_cut: I'M STILL PAYING YOU AFTER THAT.
  - pos: bottom, wide
    action: "Fumie tipping back the last of her can of coffee."
    cast: [fumie]
    dialogue:
    - fumie: CUSTOMERS PAY. THAT'S WHAT MAKES THEM CUSTOMERS.

- page: 28
  title: You've got legs
  location: tanabe-yard
  time: Sunday about 6:55 a.m., low clear morning sun
  guards:
  - "Fumie (over sixty): short grey hair, white towel round her forehead, cigarette, navy work jacket."
  - *wreck_note
  panels:
  - pos: top, wide
    action: "Fumie on the office step, the empty coffee can in her hand."
    cast: [fumie]
    dialogue:
    - fumie: ISHIGURO RANG. BY THE TIMBER YARDS. HE'S GOT A ROADSTER IN WITH THE FRONT BURNED OUT. ENGINE'S GONE, THE ROOF'S GOOD. FRAME AND ALL.
    - fumie: HE'LL DO IT FOR FIVE THOUSAND, BECAUSE HE OWES ME.
  - pos: middle, large
    location: tanabe-weeds
    action: "Through a narrow gap between two stacks of crushed white Corollas: the blue wreck sitting in the yellow weeds, its old grey soft top with the big tear; a striped cat's head poking out of the tear."
    cast: [{id: wreck, view: rear, camera: "far, through the gap in the stacks, rear three-quarter from behind-LEFT"}, cat]
    captions:
    - I LOOKED THROUGH THE GAP IN THE COROLLA STACKS AT THE GREY VINYL OVER THE WEEDS, AND THE TEAR THE CAT USED FOR A DOOR.
  - pos: lower-right
    action: "Dai turning back to her, eager."
    cast: [*dai_gloves]
    dialogue:
    - dai_cut: WHEN?
  - pos: lower-left
    action: "Fumie, squinting through her smoke."
    cast: [fumie]
    dialogue:
    - fumie: HE KEEPS IT TILL MONDAY. AFTER THAT HE'LL SELL IT TO THE FIRST MAN WITH SIX.
  - pos: bottom, wide
    action: "Fumie lobbing the empty can into an oil drum by the office step, already turning away."
    cast: [fumie]
    dialogue:
    - fumie: I'M NOT DRIVING TO ISHIGURO'S FOR A ROOF. YOU'VE GOT LEGS.
    sfx: [KAN]

# ================================================================== Sunday night: Kubo's bill
