# Clean location plates: empty reference backgrounds (no people, no vehicles).
# Generated with:  production/az run --chapter plates --pages <id>
# Each plate's location (and its approved source pages) is in locations.yaml.
title: Location plates
output_dir: artwork/locations
defaults:
  kind: plate
  orientation: landscape

pages:
  - id: harbor-station-night
    location: harbor-station-night
    weather: dry, clear night
    refs:
      - {path: production/runs/ref-src/harbor-station-night.wet.png, use: "the previous plate of this station: copy its architecture, pumps, office booth and composition exactly, but make the ground DRY"}
    time: about 2 AM, night
    description: >-
      Wide eye-level view of the empty gas station forecourt under the canopy:
      the two old analog pumps on their island in the foreground left, the
      lit office booth on the right, fluorescent tubes under the canopy, the
      dark harbor road running away into the night past warehouses and
      container stacks, a crane silhouette far away. DRY concrete and dry
      asphalt (a dry, clear night: no puddles, no rain, no wet reflections).
      Heavy solid blacks in the night sky, a few stars.

  - id: harbor-station-day
    location: harbor-station-day
    time: early afternoon, bright summer day
    description: >-
      Wide eye-level view of the same empty gas station in daylight: canopy on
      stained pillars, two old analog pumps on the island, the office booth
      with big windows, oil drums, the cracked concrete forecourt with weeds,
      harbor cranes and container stacks behind a chain-link fence, summer
      clouds.

  - id: bypass-overpass-night
    location: bypass-overpass-night
    time: about 2 AM, night
    description: >-
      View from the walkway of the pedestrian overpass, looking along the
      four-lane bypass as it sweeps into a long left-hand curve: the overpass
      railing and concrete walkway in the foreground, the empty four-lane road
      below (two lanes each way, concrete median barrier, dashed lane lines),
      tall orange sodium lamps in a row, factory chimneys and industrial
      buildings on the horizon, black night sky.

  - id: hayama-apartment
    location: hayama-apartment
    time: evening, warm indoor light from a ceiling lamp
    description: >-
      Interior view from the kitchen: the tiny kitchen with sink and gas
      burner on one side and the low table with cushions in the middle, the
      sliding fusuma doors open onto the tatami room behind with a folded
      futon, old CRT television, rotary electric fan, laundry hanging indoors,
      wall calendar, the steel front door and genkan step visible at the edge.
      Cramped, worn, lived-in.

  - id: danchi-walkway
    location: danchi-walkway
    time: dawn, pale sky, the concrete still wet from night rain
    description: >-
      View along the open-air upper-floor corridor of the old danchi block: a
      row of steel apartment doors on the left with meter boxes and small
      windows, the concrete parapet with a metal rail on the right, a
      fluorescent ceiling light, the outdoor concrete staircase going down at
      the far end, neighbouring danchi blocks, power lines and a utility pole
      beyond.

  - id: classroom
    location: classroom
    time: afternoon, summer daylight through open windows
    description: >-
      View across the empty classroom from the back corner: rows of worn
      wooden desks with chairs pushed in, the big blackboard with chalk
      smudges, a round wall clock above it, tall open windows on the left with
      trees outside, fluorescent lights, a notice board.

  - id: harbor-road-night
    location: harbor-road-night
    weather: dry, clear night
    refs:
      - {path: production/runs/ref-src/harbor-road-night.wet.png, use: "the previous plate of this road: copy its architecture and composition exactly, but make the asphalt DRY"}
    time: about 2 AM, dry clear night
    description: >-
      Low wide view down the empty harbor road at night: DRY asphalt (no
      puddles, no rain, no wet reflections) with painted lane lines lit by
      the orange sodium lamps, warehouse walls and
      stacked shipping containers on one side, chain-link fence and dark water
      with crane silhouettes on the other, the road vanishing into darkness.

  - id: roadster-interior-night
    location: roadster-interior-night
    time: night, driving
    refs:
      - {path: artwork/car-sheets/red-roadster.png, use: "the car; its small interior view shows the right-hand-drive cockpit"}
    description: >-
      View from the LEFT passenger seat across the tiny right-hand-drive
      cockpit: the empty driver's seat and the small three-spoke steering
      wheel on the RIGHT, round analog gauges behind it, the short gear lever
      on the center tunnel, the low dashboard, the black soft top close
      overhead, through the windshield an empty night road with orange
      streetlights. No people at all.

  - id: harbor-pier-lot-night
    location: harbor-pier-lot-night
    time: about 3 AM, clear night
    description: >-
      Wide eye-level view of the empty concrete lot at the end of the pier:
      faded parking lines, low bollards and a hanging chain at the water's
      edge, the black sea, distant city lights across the bay reflecting on
      the water, harbor cranes, one tall lamp post casting a pool of light.

  - id: bypass-overpass-dawn
    location: bypass-overpass-dawn
    time: just after dawn, about 5:30 AM, grey sky turning pale
    description: >-
      View from the overpass walkway, looking down along the four-lane bypass
      as it sweeps into the long left-hand curve: the railing and concrete
      walkway in the foreground, the empty, clean road below, a page of
      newspaper lying on the asphalt. On the outside of the curve the steel
      guardrail: one section near the foot of the overpass stairs is clearly
      NEWER than the rest (bright, clean, unrusted bolts), the rest dull and
      stained. Factory chimneys on the horizon, pale dawn sky, street lamps
      still faintly on. Light screentone, no heavy night blacks.

  - id: bookstore
    location: bookstore
    refs:
      - {path: artwork/locations/classroom.png, use: "another plate of this manga: copy ONLY its art style, line weight and screentone, not the room"}
    time: early afternoon, summer
    description: >-
      View down the single narrow aisle of the dim old bookstore from just
      inside the door: tall wooden shelves crammed with paperbacks on both
      sides, the two lowest shelves full of car and hobby books, a magazine
      rack by the door, fluorescent tubes, worn linoleum, small paper signs
      (no readable words), the owner's tiny counter with an old cash register
      at the far end, a strip of daylight from the arcade behind the camera.

  # ---- added for chapter 5 (2026-11-16)
  - id: school-gym
    location: school-gym
    refs:
      - {path: artwork/locations/classroom.png, use: "another plate of this manga: copy ONLY its art style, line weight and screentone, not the room"}
    time: morning, hot late-summer day
    description: >-
      Wide view from the back of the empty gym toward the stage: the varnished
      floor with painted basketball lines, the stage with a dark curtain, an
      empty wooden podium, a big round wall clock above the stage, the row of
      small high windows under the roof propped open with bright sky, steel
      trusses, folded basketball hoops. Completely empty, no people.

  - id: school-corridor
    location: school-corridor
    refs:
      - {path: artwork/locations/classroom.png, use: "a classroom plate of the same school: copy its windows, wood, art style and screentone"}
    time: early afternoon, hot late summer
    description: >-
      Eye-level view down the long empty corridor: the row of tall windows
      on the LEFT standing open, through them the sunny sports ground below
      with a baseball backstop; the classroom wall with a sliding door on the
      right; wooden floorboards with bars of hard sunlight; fluorescent tubes;
      a notice board. No people.

  - id: school-shoe-lockers
    location: school-shoe-lockers
    refs:
      - {path: artwork/locations/classroom.png, use: "a classroom plate of the same school: copy ONLY its art style and screentone"}
    time: afternoon, hot late summer
    description: >-
      Eye-level view along a row of tall shoe lockers in the school entrance
      hall: grey steel locker banks with many small cubbies, a few pairs of
      white indoor shoes and sneakers in them, the low step and a slatted
      duckboard on the concrete floor, the open glass doors at the end with a
      bright sunny yard outside. No people.

  - id: canal-driving-school
    location: canal-driving-school
    refs:
      - {path: artwork/locations/bypass-overpass-dawn.png, use: "another plate of this manga: copy ONLY its art style, line weight and screentone"}
    time: mid-afternoon, white summer heat
    description: >-
      Eye-level view from the canal footpath through a tall chain-link fence
      onto a small empty driving-school practice course: painted lane lines,
      a little crossroads, a short steep practice slope, a working traffic
      light on a pole, and a small control tower with big windows and a
      loudspeaker horn in the middle. The canal with its low railing on the
      left edge, hazy summer sky, utility poles and low apartment blocks in
      the distance. No people and NO vehicles.

  - id: pier-3-night
    location: pier-3-night
    refs:
      - {path: artwork/locations/harbor-road-night.png, use: "Copy the harbor's dry night atmosphere and ink style only"}
    time: dry September night
    description: >-
      Wide elevated view of an empty concrete lot at Pier 3, the size of a
      school sports ground, dry pavement with hundreds of overlapping dark tire
      circles. Tall sodium light poles down one side, one unlit; shipping
      containers stacked three high along the back, bollards and dark water
      reflecting a broken moon on the open side, warehouse road at entrance.
      Completely empty of people and vehicles. No cars, no vans, no Roadster.

  - id: rail-crossing-night
    location: rail-crossing-night
    weather: dry, clear night
    time: about 1:30 AM
    description: >-
      Eye-level view from the middle of the road looking along the end of the
      dead-flat harbor straight toward the freight crossing: the single rail
      track crossing the road on a low hump in the middle distance, one crossing
      warning lamp on its lone pole at the roadside, warehouse walls on the LEFT,
      the chain-link fence and stacked containers of a container yard on the
      RIGHT; beyond the crossing the road bends LEFT and vanishes behind tall
      round concrete grain silos. Dry asphalt, black sky.

  - id: silo-sbend-night
    location: silo-sbend-night
    weather: dry, clear night
    time: about 1:30 AM
    description: >-
      High view from the top of a silo looking down onto the S-bend: the
      two-lane road curving LEFT then RIGHT between the giant round grain silos,
      conveyor bridges crossing high above the road, pools of sodium light on the
      dry asphalt, curbs and a center line. Heavy blacks, dark sky.

  - id: warehouse-doorway-night
    location: warehouse-doorway-night
    weather: dry, clear night
    time: about 1:45 AM, moon behind the building
    description: >-
      Eye-level view across the moonlit concrete of the lot toward the long
      corrugated warehouse wall: a strip of weeds along its foot, a row of
      loading doors; the first has a closed roller shutter, the second is a deep
      recessed doorway about a meter deep with one step, pitch BLACK inside.
      Black tire circles on the concrete in the foreground, an empty can lying
      on its side. The moon is hidden behind the building, so the wall is in
      shadow and the open concrete is pale.

  # ---- added for chapter 8 (2026-11-18)
  - id: tanabe-yard
    location: tanabe-yard
    time: morning, clear late-summer day, the sky going white
    refs:
      - {path: artwork/locations/harbor-station-day.png, use: "another plate of this manga: copy ONLY its art style, line weight and screentone, not the place"}
    guards:
      - "Crushed flat car slabs stacked like mattresses are scrap metal and ARE allowed. No intact cars, no forklift, no trucks."
    description: >-
      Wide eye-level view across the scrapyard from just inside the open
      gate: on the left the two-storey grey prefab office with an outside
      steel stair and a window; in the middle distance stacks of crushed flat
      cars three and four high in rows, a wall of old tires, rows of engine
      blocks on pallets, oil drums; on the right the big boxy car crusher with
      its heavy hinged steel lid raised; at the back a strip of waist-high
      weeds against the corrugated steel fence; harbor cranes over the fence;
      packed dirt and crushed shells with oil puddles in the foreground.
  - id: tanabe-office
    location: tanabe-office
    time: daytime, light from the window
    refs:
      - {path: artwork/locations/hayama-apartment.png, use: "another interior plate of this manga: copy ONLY its art style, line weight and screentone, not the room"}
    description: >-
      Eye-level view into the small prefab site office from the doorway: the
      grey steel desk on the right with a black rotary phone, a transistor
      radio and an ashtray; above the desk the faded travel poster (beach,
      palm trees, a small green island joined to the shore by a long bridge, a
      couple in white walking on the sand, backs to us, no text); the plywood
      wall on the left covered in rows of small black marker scribbles, most
      crossed out, unreadable; an electric kettle and a small fridge, a little
      sink with a cold tap; a window onto the yard with stacks of scrap
      outside; a broom leaning by the door; a round blue cookie tin under the
      desk.

  # ---- added for chapter 9 (2026-11-18)
  - id: hayama-kitchen-night
    location: hayama-kitchen-night
    time: about 1 a.m., night; only the fluorescent tube over the sink is lit
    refs:
      - {path: artwork/locations/hayama-apartment.png, use: "this SAME apartment: copy its kitchen, sink, gas burner, fusuma, tatami, low table, materials and art style exactly; this plate looks at the other wall of the kitchen"}
    description: >-
      Eye-level view across the dim kitchen at night from the tatami-room
      doorway. On the left the old white two-door refrigerator with a square
      tin box on top and a sheet of paper with handwritten lines taped to its
      SIDE facing us; next to it the sink and gas burner under the window,
      the single fluorescent tube over the sink lit, the window black. On the
      right wall a hanging calendar and beside it a small wooden wall shelf
      with an old black ROTARY telephone on it (finger dial, curly cord).
      High on the wall in the middle a round white wall clock with black
      numbers and hands. The low table with cushions in the foreground, the
      steel front door and genkan step at the far end. Heavy shadows outside
      the pool of light.

  - id: sanko-interview
    location: sanko-interview
    time: Tuesday early afternoon, daylight through half-closed blinds
    refs:
      - {path: artwork/locations/classroom.png, use: "another plate of this manga: copy ONLY its art style, line weight and screentone, not the room"}
    description: >-
      Wide eye-level view of the plain interview room from just inside the
      door: a long table covered with a green cloth (mid-grey tone) across
      the far side of the room with three empty chairs behind it, a blank
      white name card and a closed folder on the cloth; about two meters in
      front of the table, alone in the middle of the bare grey floor, ONE
      empty folding chair facing the table. A window with half-closed
      venetian blinds on the left throwing stripes of light, pale walls, a
      wall clock, a calendar. Bare and exposed.

  - id: er-bay
    location: er-bay
    time: about 1:50 a.m., inside under bright fluorescent light, black night outside the glass doors
    refs:
      - {path: artwork/locations/school-corridor.png, use: "another interior plate of this manga: copy ONLY its art style, line weight and screentone, not the place"}
    description: >-
      Eye-level view along the emergency-room corridor: on the left a row
      of treatment bays closed by PALE GREEN curtains (light grey tone) on
      rings hanging from steel ceiling rails, the curtains stopping about
      thirty centimeters above the polished floor so you can see under them;
      on the right a row of five ORANGE moulded plastic chairs (mid-grey tone)
      against the white wall under a round wall clock; at the far end the
      automatic glass entrance doors with the black night outside; a steel
      trolley, a wall oxygen outlet with a dial. Flat, very bright light,
      reflections on the floor.
