chapter: 9
title: Before Anything Breaks
lettering: empty
defaults:
  orientation: portrait
  time: late September 1995
  notes:
  - Right-to-left panel order. One speaker per panel. All cars are Japanese models sold by September 1995, right-hand drive.
  - No brand logos, no stickers, no readable signs or printed words anywhere unless a panel asks for them. No Japanese characters.
  - Vary shot sizes and poses; no two panels on the page may look alike.

pages:
# ------------------------------------------------------------------ Sunday night, the station
- page: 1
  title: Like a can lid
  location: harbor-station-night
  time: Sunday 10:10 p.m., night, dry; canopy lights
  guards:
  - "Dai still has his OLD long messy hair falling over his eyes on this page (the haircut comes later). His LEFT hand is wrapped in a white gauze bandage round the palm and wrist."
  - Dai and Kubo both stand the whole page.
  - No whole car anywhere on this page.
  panels:
  - pos: top, wide
    action: Night under the canopy lights. Dai at the pump island lifts the fuel nozzle off the pump with his RIGHT hand and keeps his bandaged LEFT hand pressed flat against the front of his grey jacket; behind him the lit office booth with Kubo in its doorway. Only the glow of headlights at the panel edge, no car drawn.
    cast: [dai:station_jacket, kubo]
    captions:
    - KUBO-SAN SAW THE BANDAGE AT TEN PAST TEN ON SUNDAY NIGHT. I KEPT THE LEFT HAND AGAINST MY JACKET.
  - pos: middle-right
    action: Kubo standing by the pump, holding out one hand palm up toward Dai, waiting, his face patient and unreadable.
    cast: [kubo]
    captions:
    - HE DIDN'T SAY ANYTHING UNTIL THE CAR HAD GONE.
  - pos: middle-left
    shot: close-up
    action: Close-up of Kubo's old lined hands turning Dai's bandaged left hand over, looking at the gauze, the tape and where the bandage goes round the wrist. Silent.
  - pos: lower-right
    action: Kubo looking at the hand, eyes narrowed.
    cast: [kubo]
    dialogue:
    - kubo: TANABE'S?
  - pos: lower-left
    action: Dai, looking off to the side.
    cast: [dai:station_jacket]
    dialogue:
    - dai: WINDOW MOTOR. COROLLA.
  - pos: bottom-right
    action: Kubo handing the hand back, already turning away toward the office.
    cast: [kubo]
    dialogue:
    - kubo: THEY ALL DO THAT. THE HOLE'S GOT AN EDGE ON IT LIKE A CAN LID.
  - pos: bottom-center
    action: Kubo standing in the office doorway with his back half turned, looking out at the dark road.
    cast: [kubo]
    dialogue:
    - kubo: {text: "SHE'S GOT YOU ON SUNDAYS, THEN.", box: [345, 1205, 182, 182], draw: true, tail: [530, 1330]}
  - pos: bottom-left
    action: Dai alone at the pump island, looking at the ground.
    cast: [dai:station_jacket]
    dialogue:
    - dai: SEVEN OF THEM.

# ------------------------------------------------------------------ Monday evening, the haircut
- page: 2
  title: Under the light
  location: hayama-apartment
  time: Monday about 8 p.m., night outside, the round fluorescent ceiling light on
  guards:
  - "Dai still has his OLD long messy hair on this whole page (the cut has not started). His LEFT hand is bandaged white."
  - Dai lies on the tatami in panel 1, then sits on a plain kitchen chair on the newspaper from panel 3 on; Aya kneels in panel 1, then stands.
  panels:
  - pos: top, wide
    action: Monday night at home. Dai wakes up lying on the tatami of the small kitchen in his rumpled white school shirt; above him Aya kneels, spreading sheets of newspaper flat over the floor. The window is black.
    cast: [dai:summer_school, aya:home]
    captions:
    - {text: "WHEN I WOKE, MOM HAD GONE TO WORK, AND AYA WAS SPREADING NEWSPAPER ON THE FLOOR."}
  - pos: top-right
    action: Aya standing over the newspaper, pointing at the floor with one finger, bossy.
    cast: [aya:home]
    dialogue:
    - aya: SIT. NOT THERE. UNDER THE LIGHT.
  - pos: top-left
    action: A plain kitchen chair set in the middle of the spread newspaper, right under the round fluorescent ring light on the ceiling; Dai sitting down on it, wary.
    cast: [dai:summer_school]
  - pos: middle-right
    action: Aya behind the chair holding up a black plastic garbage bag with a hole cut in the bottom.
    cast: [aya:home]
    dialogue:
    - aya: {text: "HEAD THROUGH.", box: [815, 800, 185, 150], draw: true, tail: [790, 860]}
  - pos: middle-left
    action: Dai on the chair with his head through the black garbage bag, the bag hanging over his shoulders and arms like a cape; Aya tucks it into his collar at the back with two fingers, tight.
    cast: [dai:summer_school, aya:home]
    sfx: [KASA KASA]
    captions:
    - IT CRACKLED EVERY TIME I BREATHED.
  - pos: lower, wide
    action: On the low table, Aya unties a long cloth tool roll, the kind carpenters keep chisels in; inside are two combs, a row of black hair clips, an old spray bottle of water and a pair of long, narrow, silver hairdresser's scissors with a little finger hook on one handle.
    cast: [aya:home]
    captions:
    - A CLOTH ROLL, THE KIND CARPENTERS KEEP CHISELS IN.
  - pos: bottom-right
    shot: close-up
    action: Close-up of the long silver scissors lying on the cloth roll, gleaming, nothing like anything else in the shabby room.
    captions:
    - THEY DIDN'T LOOK LIKE ANYTHING WE OWNED.
  - pos: bottom-left
    action: Aya picking up the scissors, not looking at Dai.
    cast: [aya:home]
    dialogue:
    - aya: {text: "DON'T TOUCH THEM. THEY COST MORE THAN YOUR SHOES.", box: [20, 1336, 215, 210], draw: true, tail: [228, 1420]}

- page: 3
  title: Snip snip snip
  location: hayama-apartment
  time: Monday night, the round fluorescent ceiling light on, the window black
  continue_from: 2
  guards:
  - "Dai's hair is still LONG on this page (it is being cut). He sits on the chair in the black garbage-bag cape; his LEFT hand is bandaged white."
  - Aya never speaks on this page. She stands behind him until the last panel, where she crouches in front of him.
  panels:
  - pos: top-right
    action: Aya sprays water on Dai's head from the old spray bottle; water runs down behind his ears.
    cast: [dai:summer_school, aya:home]
    sfx: [SHU SHU]
  - pos: top-left
    action: Dai's wet hair combed straight down over his whole face like a curtain; he looks down at the newspaper through his own hair.
    cast: [dai:summer_school]
    captions:
    - SHE COMBED IT ALL STRAIGHT DOWN, SO I WAS LOOKING AT THE NEWSPAPER THROUGH MY OWN HAIR.
  - pos: middle, wide
    action: Close-up of Aya's fingers lifting a lock of wet black hair, the long scissors cutting along the edge of her fingers in quick small bites.
    sfx: [SNIP SNIP SNIP]
    captions:
    - THEN SHE STARTED, AND SHE DIDN'T SAY ANYTHING ELSE FOR A LONG TIME.
  - pos: lower-right
    action: Wet clippings of black hair sliding down the garbage bag and falling on the newspaper, onto a printed photo of a grey-haired politician in a suit (anonymous face).
    captions:
    - AYA ALWAYS SAYS SOMETHING. SHE TALKS WHILE SHE EATS AND WHILE SHE BRUSHES HER TEETH.
  - pos: lower-left
    action: "The black window over the sink at night works as a mirror: reflected in it, Aya standing behind Dai with her mouth shut tight and her eyes narrowed, one foot turned out like a model, scissors raised; Dai in his garbage-bag cape in front."
    cast: [aya:home, dai:summer_school]
    captions:
    - I WATCHED HER IN THE DARK WINDOW. SHE STOOD WITH ONE FOOT TURNED OUT, LIKE THE GIRLS IN HER HAIR MAGAZINE.
  - pos: bottom-right
    action: Aya pulling the garbage bag down over Dai's knees; his bandaged left hand lies on his knee and she sees it.
    cast: [dai:summer_school, aya:home]
    captions:
    - SHE SAW THE BANDAGE. SHE LOOKED AT IT FOR A SECOND, AND WENT BACK TO MY EAR.
  - pos: bottom-left
    action: Aya crouched in front of the chair, combing Dai's long wet bangs straight UP off his forehead with the comb to see where they fall.
    cast: [aya:home, dai:summer_school]

- page: 4
  title: They want eyebrows
  location: hayama-apartment
  time: Monday night, the round fluorescent ceiling light on
  continue_from: 3
  guards:
  - "Until panel 6 Dai's bangs are still LONG. In panel 6 Aya cuts them straight across; from panel 6 on his hair is SHORT, the bangs a finger's width above his eyebrows, the forehead uncovered."
  - "The scar: a short pale line through Dai's LEFT eyebrow (on the image RIGHT when he faces us)."
  - Aya crouches in front of Dai on this page, then stands for the last panel.
  panels:
  - pos: top, wide
    action: Close-up of the comb holding Dai's wet bangs straight up, stopped still.
    captions:
    - THE COMB STOPPED.
  - pos: upper, large
    shot: extreme close-up
    action: "Dai's uncovered forehead and eyes, his wet hair held up by the comb: a short PALE scar line through his LEFT eyebrow (image right), where the hair doesn't grow, about as long as a little fingernail. His eyes look away."
    cast: [dai:summer_school]
    captions:
    - A LINE THROUGH MY LEFT EYEBROW, PALE, WHERE THE HAIR DOESN'T GROW.
    - I'D HAD BANGS OVER IT SINCE I WAS FOURTEEN. MOM HAD SEEN IT ONCE, THE DAY I CAME HOME.
  - pos: middle-right
    action: Aya crouched in front of him, looking at the scar for one second, her face flat. Then she lets the bangs fall back down.
    cast: [aya:home]
    dialogue:
    - aya: THIS IS COMING OFF. THEY WANT EYEBROWS.
  - pos: middle-left
    action: Dai, his long wet bangs back over his eyes, low voice.
    cast: [dai:summer_school]
    dialogue:
    - dai: LEAVE SOME.
  - pos: lower-right
    action: Aya, one eyebrow up, already lifting the scissors.
    cast: [aya:home]
    dialogue:
    - aya: DID I ASK YOU?
  - pos: lower-left
    action: Close-up of the scissors cutting straight across Dai's bangs a little above his eyebrows; the cut hair falls away and his forehead is in the open.
    cast: [dai_cut:summer_school]
    sfx: [JAKIN]
    captions:
    - I FELT THE AIR COME IN ON MY FOREHEAD, COOL, WHERE THERE HADN'T BEEN ANY AIR FOR THREE YEARS.
  - pos: bottom, wide
    action: Aya standing beside the chair combing his new short bangs flat, deadpan; Dai sitting stiffly with his forehead uncovered.
    cast: [aya:home, dai_cut:summer_school]
    dialogue:
    - aya: {text: "NOBODY'S GOING TO LOOK AT YOUR EYEBROW. THEY'LL BE WATCHING YOUR MOUTH, IN CASE SOMETHING STUPID COMES OUT OF IT.", box: [18, 1206, 318, 300], draw: true, tail: [352, 1285]}

- page: 5
  title: Somebody's son
  location: hayama-apartment
  time: Monday night, the round fluorescent ceiling light on
  continue_from: 4
  guards:
  - "Dai's hair is SHORT on the whole page: short sides, back off the collar, bangs a finger's width above the eyebrows, the scar through his LEFT eyebrow visible in close shots. The garbage bag is off; he wears his rumpled white school shirt."
  - Dai sits the whole page; Aya stands and walks off.
  panels:
  - pos: top, wide, large
    action: Dai on the chair holding a small round hand mirror up to his face under the fluorescent ring, seeing his new short haircut; we see his face from slightly beside the mirror, surprised and young.
    cast: [dai_cut:summer_school]
    captions:
    - I LOOKED LIKE SOMEBODY'S SON.
  - pos: middle-right
    shot: close-up
    action: Close-up of the little hand mirror showing his left eyebrow with the pale scar line through it.
    captions:
    - IT DIDN'T LOOK LIKE MUCH. IT LOOKED LIKE A SCAR.
  - pos: middle-left
    action: Aya folding the newspaper up with the cut hair inside it.
    cast: [aya:home]
    dialogue:
    - aya: AT THE PLACE BY THE STATION, THAT'S THREE THOUSAND YEN. WITH A WASH.
  - pos: lower-right
    action: Dai looking up from the mirror.
    cast: [dai_cut:summer_school]
    dialogue:
    - dai_cut: WHICH PLACE?
  - pos: lower-left
    action: Aya tipping the hair out of the folded newspaper into a kitchen bin.
    cast: [aya:home]
    dialogue:
    - aya: DOESN'T MATTER WHICH PLACE. YOU OWE ME THREE THOUSAND YEN.
  - pos: bottom-right
    action: Dai, flat.
    cast: [dai_cut:summer_school]
    dialogue:
    - dai_cut: I'LL PAY YOU.
  - pos: bottom-center
    action: Aya walking away toward a sliding door with the cloth roll under her arm, not turning round.
    cast: [aya:home]
    dialogue:
    - aya: YOU WON'T.
  - pos: bottom-left
    action: Dai alone at the low table with a covered bowl of rice and stew, an egg on top; a closed sliding door behind him. Aya's voice comes from behind the door.
    cast: [dai_cut:summer_school]
    dialogue:
    - aya: {text: "AND EAT WHAT MOM LEFT YOU. SHE PUT AN EGG IN IT.", offpanel: true}

# ------------------------------------------------------------------ Tuesday 5 a.m., the iron
- page: 6
  title: Hot cotton
  location: hayama-kitchen-night
  time: Tuesday 5 a.m., grey pre-dawn light at the window, only the light over the sink on
  guards:
  - "The window is pale GREY (just before dawn), not black night and not bright day."
  - "Dai has SHORT hair now (bangs above the eyebrows); he wears a black T-shirt and sweatpants. Mom kneels at a low ironing board on the kitchen floor the whole page."
  panels:
  - pos: top, wide
    action: Dai lying on his futon in the small tatami room with his eyes open in the grey dawn light; through the half-open fusuma, the dim kitchen and a wisp of steam.
    cast: [dai_cut:casual]
    captions:
    - THE IRON WOKE ME. NOT THE SOUND OF IT. THE SMELL.
    - HOT COTTON, AND THE STARCH SPRAY MOM KEEPS FOR NEW YEAR AND FUNERALS.
  - pos: middle-right
    action: Mom kneeling at a low ironing board on the kitchen floor, in her factory smock with her hair already up in a bun; only the light over the sink is on; a white short-sleeved shirt on the board.
    cast: [michiko:factory]
  - pos: middle-left
    shot: close-up
    action: Close-up of the iron's tip pressing a white shirt collar point from the tip inwards.
    captions:
    - SHE DID THE COLLAR POINTS FROM THE TIP INWARDS, SO THE IRON WOULDN'T PUSH A CREASE INTO THEM.
  - pos: lower-right
    action: Dai sitting in the doorway on the floor, his back against the door frame, knees up, watching. Mom's voice comes from off panel; she has not turned round.
    cast: [dai_cut:casual]
    dialogue:
    - michiko: {text: "IT'S FIVE. GO BACK TO SLEEP.", offpanel: true}
  - pos: lower-left
    action: The ironed white shirt on a wire hanger hooked over the top of the fusuma frame, stirring a little in the air from the window.
    captions:
    - I DIDN'T.
  - pos: bottom, wide
    action: Mom lays a wet wrung-out cotton towel over a pair of black school trousers on the board and presses the iron down on it; steam billows up round her hands.
    cast: [michiko:factory]
    sfx: [JUWAA]
    captions:
    - YOU DO IT THROUGH A CLOTH, OR THE BLACK GOES SHINY. I HADN'T KNOWN THAT.

- page: 7
  title: What's that
  location: hayama-kitchen-night
  time: Tuesday 5 a.m., grey pre-dawn light, only the light over the sink on
  continue_from: 6
  guards:
  - "The window is pale GREY (just before dawn)."
  - "Dai has SHORT hair, a black T-shirt; his LEFT hand is wrapped in a GREYISH, dirty gauze bandage. Mom kneels at the ironing board the whole page; Dai sits in the doorway, then stands to take the hanger in panel 4 and stays standing."
  panels:
  - pos: top-right
    action: Mom lifting the cloth off the trousers and looking at the crease, not at Dai.
    cast: [michiko:factory]
    dialogue:
    - michiko: NEXT MONDAY I'M AT THE STORE ALL NIGHT. THE STOCKTAKING. EIGHT TILL FIVE.
  - pos: top-left
    action: Mom in profile, folding the trousers over the hanger.
    cast: [michiko:factory]
    dialogue:
    - michiko: AYA'S HOME AFTER NINE. YOU'RE OFF MONDAYS.
  - pos: middle-right
    action: Dai in the doorway, nodding.
    cast: [dai_cut:casual]
    dialogue:
    - dai_cut: "YES."
  - pos: middle-left
    action: Mom holding the hanger with the shirt and trousers up to Dai; Dai standing, reaching for it with his LEFT hand, the dirty bandage in plain view.
    cast: [michiko:factory, dai_cut:casual]
    dialogue:
    - michiko: GOOD.
  - pos: lower, wide
    action: Close-up of the iron being set down on its heel on the board; Mom's eyes fixed on Dai's bandaged hand.
    cast: [michiko:factory]
    sfx: [KOTO]
    dialogue:
    - michiko: WHAT'S THAT.
  - pos: bottom-right
    action: Dai standing, holding the hanger, eyes down.
    cast: [dai_cut:casual]
    dialogue:
    - dai_cut: WORK.
  - pos: bottom-center
    action: Mom, still kneeling, looking up at him.
    cast: [michiko:factory]
    dialogue:
    - michiko: WORK WHAT.
  - pos: bottom-left
    action: Dai looking away at the window.
    cast: [dai_cut:casual]
    dialogue:
    - dai_cut: {text: "THE SIGN OUT BY THE ROAD. YOU CHANGE THE NUMBERS BY HAND. THEY'VE GOT METAL EDGES.", box: [20, 1200, 335, 200], draw: true, tail: [330, 1310]}

- page: 8
  title: A dirty bandage
  location: hayama-kitchen-night
  time: Tuesday about 5:15 a.m., grey dawn light at the window
  continue_from: 7
  guards:
  - "The window is pale GREY (dawn)."
  - "Dai has SHORT hair. Mom stands up in panel 4 and stays standing."
  - "The square tin box lives on top of the refrigerator; a paper with handwritten lines is taped to the refrigerator (unreadable)."
  panels:
  - pos: top-right
    shot: close-up
    action: Close-up of Dai's left hand in the gauze bandage, gone grey round the thumb, a small brown stain near the wrist.
    captions:
    - IT HAD BEEN WHITE ON SUNDAY.
  - pos: top-left
    action: Mom looking from the bandage to his face.
    cast: [michiko:factory]
    dialogue:
    - michiko: IS IT CLEAN UNDER THERE?
  - pos: middle-right
    action: Dai, steady.
    cast: [dai_cut:casual]
    dialogue:
    - dai_cut: "YES."
  - pos: middle-left
    action: Mom standing at the old refrigerator, reaching up to take down a square biscuit tin from the top; on the refrigerator is a taped paper with handwritten lines.
    cast: [michiko:factory]
    captions:
    - THE MEDICINE BOX. A SQUARE TIN THAT HAD RICE CRACKERS IN IT ONCE, AND NOW HAS SOTA'S THINGS IN IT.
  - pos: lower, wide
    shot: close-up
    action: Close-up of Mom's worn hands putting a new roll of bandage, still in its wrapper, into Dai's right hand and carefully closing his fingers round it.
    cast: [michiko:factory]
    dialogue:
    - michiko: PUT A CLEAN ONE ON BEFORE YOU GO. A DIRTY BANDAGE, PEOPLE THINK YOU'VE BEEN FIGHTING.
  - pos: bottom-right
    action: Mom at the genkan step stepping down into her shoes, her bag on her shoulder.
    cast: [michiko:factory]
    dialogue:
    - michiko: THEY'LL GIVE YOU LUNCH. EAT IT, EVEN IF IT'S BAD.
  - pos: bottom-left
    action: Mom at the half-open steel front door, looking back over her shoulder at the white shirt on its hanger.
    cast: [michiko:factory]
    captions:
    - SHE LOOKED BACK AT THE SHIRT THE WAY YOU LOOK BACK AT A STOVE TO CHECK YOU TURNED IT OFF.

# ------------------------------------------------------------------ Tuesday, Sanko Brake
- page: 9
  title: Eleven of us
  location: sanko-plant
  time: Tuesday morning, clear September day
  guards:
  - "Dai has SHORT hair, the scar through his LEFT eyebrow showing; a crisp white shirt buttoned to the TOP; a NEW, very white bandage on his left hand."
  - Everybody waiting sits on folding chairs.
  panels:
  - pos: top-right
    location: hayama-kitchen-night
    action: At home in the grey dawn, Dai buttoning the ironed white shirt all the way to the top, the stiff collar standing up against his neck.
    cast: [dai_cut:interview]
    captions:
    - THE SHIRT WAS STILL WARM WHEN I PUT IT ON. I DID THE BUTTONS UP, ALL OF THEM, TO THE TOP.
  - pos: top-left
    action: Dai at the sink tearing a strip of tape with his teeth, winding a fresh white bandage round his left palm with his right hand.
    cast: [dai_cut:interview]
    captions:
    - THE NEW BANDAGE WAS VERY WHITE.
  - pos: middle, wide
    action: "The factory by the river mouth in morning sun, seen from the gate road: low grey sheds with saw-tooth roofs, a chimney, a two-storey office block, timber yards along the river, a bus stop sign by the gate; Dai small, walking in."
    cast: [dai_cut:interview]
    captions:
    - THE SANKO BRAKE PLANT, TWENTY MINUTES ON THE BUS, WHERE THE RIVER COMES INTO THE HARBOR. 160 YEN. I PAID IT MYSELF.
  - pos: lower, wide
    action: A waiting room with a row of folding chairs along one wall under a framed photo portrait of an old man; eleven high-school boys in white summer shirts and different school trousers sit stiffly, collars buttoned, hair short; Dai among them.
    cast: [dai_cut:interview]
    captions:
    - ELEVEN OF US, FROM FIVE SCHOOLS. EVERYBODY'S HAIR WAS SHORT. EVERYBODY'S COLLAR WAS DONE UP.
  - pos: bottom-right
    action: A boy across the room with a square Band-Aid on his chin, looking straight back at the viewer, unfriendly.
    cast: [chin_boy]
    captions:
    - ONE BOY HAD A BAND-AID ON HIS CHIN. I LOOKED AT IT AND FELT BETTER. THEN HE CAUGHT ME LOOKING.
  - pos: bottom-left
    action: Dai on his folding chair, faint wavy smell lines in the air round him, his nose lifted a little.
    cast: [dai_cut:interview]
    captions:
    - THE WHOLE BUILDING SMELLED OF HOT BRAKES. THE LAST TIME I'D SMELLED IT WAS ACROSS THE PIER 3 LOT.

- page: 10
  title: Next
  location: sanko-plant
  time: Tuesday late morning, daylight through factory windows
  guards:
  - "Dai has SHORT hair, white shirt buttoned to the top, a clean white bandage on his left hand. He sits at a school-style desk until panel 6, then sits in the canteen."
  - The test sheets show only rows of small single digits, not readable words.
  panels:
  - pos: top-right
    action: A test room with rows of school-style desks; boys in white shirts bent over papers; Dai writing, frowning.
    cast: [dai_cut:interview]
    captions:
    - {text: "KANJI, HALF OF WHICH I KNEW. FRACTIONS, WHICH I DID BADLY.", box: [521, 30, 488, 89], draw: true}
  - pos: top-left
    action: The examiner in a grey work jacket walking along the desks handing out sheets, a silver stopwatch in his other hand.
    cast: [examiner]
    dialogue:
    - examiner: {text: "ADD EACH NUMBER TO THE ONE NEXT TO IT.", box: [39, 35, 249, 241]}
  - pos: middle-right
    action: The examiner at the front holding the stopwatch up, thumb on the button.
    cast: [examiner]
    dialogue:
    - examiner: {text: "WRITE ONLY THE LAST FIGURE OF THE ANSWER, IN THE GAP. WHEN I SAY NEXT, GO TO THE NEXT LINE. DON'T GO BACK.", box: [668, 475, 347, 303], draw: true, tail: [640, 640]}
  - pos: middle-left
    shot: close-up
    action: Close-up of the test sheet, rows and rows of small single printed digits; a pencil writing tiny digits in the gaps between them.
    captions:
    - {text: "SEVEN AND EIGHT, FIVE. EIGHT AND SIX, FOUR. SIX AND NINE, FIVE.", box: [8, 523, 565, 85], draw: true}
  - pos: lower, wide
    action: Dai working fast, his bandaged left hand holding the paper flat on the desk, eyes sharp; at the next desk a boy moving his lips as he adds, falling behind.
    cast: [dai_cut:interview]
    captions:
    - {text: "I WAS GOOD AT IT. IT WAS THE ONLY THING ALL DAY THAT FELT LIKE THE PUMPS.", box: [11, 889, 460, 108], draw: true}
  - pos: bottom-right
    action: Close-up of the stopwatch in the examiner's hand and his mouth opening.
    cast: [examiner]
    dialogue:
    - examiner: {text: "NEXT.", box: [763, 1220, 253, 228], draw: true, tail: [745, 1370]}
  - pos: bottom-left
    shot: close-up
    action: Close-up of Dai's mouth pressed shut, the pencil moving below.
    cast: [dai_cut:interview]
    captions:
    - {text: "THE BOY NEXT TO ME WAS MOVING HIS LIPS. I KEPT MINE SHUT.", box: [24, 1227, 255, 151], draw: true}

- page: 11
  title: One chair
  location: sanko-plant
  time: Tuesday, noon to 1 p.m.
  guards:
  - "Dai has SHORT hair, white shirt buttoned to the top, a clean white bandage on his left hand."
  - "From panel 5 on: the interview room (long table with a green cloth, three men behind it, ONE lone chair two meters out in the middle of the floor)."
  panels:
  - pos: top-right
    action: A big factory canteen; line workers in grey jackets eat fast at long tables with their heads down; at the far end of one table the boys in white shirts with plates of curry rice.
    captions:
    - LUNCH WAS CURRY RICE IN THE FACTORY CANTEEN.
  - pos: top-left
    shot: close-up
    action: Close-up of a line worker's big hand holding a spoon, the creases of his fingers stained grey.
    captions:
