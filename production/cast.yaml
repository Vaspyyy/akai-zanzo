# Cast registry: every character and car that can appear on a page.
#
# The prompt builder copies `traits` (and the chosen outfit) into the image
# prompt for ONLY the characters a page lists, and attaches ONLY their sheets.
# `tell` is the one-line "unmistakable" description used inside panels so the
# model can tell people apart (age, hair, how clothes are worn). Keep it short.
# Sheets must show ONE character each (see prompts/art-direction.md).
#
# Outfit fields: desc (what they wear), ref (sheet path), ref_note (what to
# look at on that sheet). A page can also give a free-text outfit override.

characters:
  dai:
    name: DAI
    full_name: Daisuke "Dai" Hayama
    traits: >-
      17-year-old boy, 172 cm, lean and wiry, slight slouch, often hands in
      pockets. Messy black hair, the fringe falls over his eyes, a bit long at
      the back. Narrow, sharp, guarded eyes; thin face. A small scar through
      the left eyebrow, hidden by the fringe (draw it only in big close-ups).
    tell: "the YOUNG one, 17, messy black hair falling over his eyes"
    default_outfit: casual
    outfits:
      casual:
        desc: faded plain black T-shirt, worn straight-leg blue jeans, beat-up white canvas low-top sneakers
        ref: artwork/character-sheets/dai.png
      school:
        desc: standard black gakuran school uniform with the collar open, worn carelessly
        ref: artwork/character-sheets/dai.png
        ref_note: the face and hair; the gakuran close-up is at the bottom right of the sheet
      summer_school:
        desc: >-
          summer school uniform: white short-sleeved button shirt, untucked,
          top button open, black school trousers, beat-up white canvas sneakers
        ref: artwork/character-sheets/dai.png
        ref_note: the face and hair only (the sheet shows other clothes)
      station:
        desc: >-
          gas-station uniform: grey work shirt worn OPEN and untucked over a
          black T-shirt, sleeves rolled up, small white name tag; worn jeans;
          white canvas sneakers; grey work cap (on his head or in his hand)
        ref: artwork/character-sheets/dai-uniform.png

  kubo:
    name: KUBO
    full_name: Kubo (night attendant, harbor gas station)
    traits: >-
      Man in his late 50s, thin, deeply lined weathered face, sunken cheeks,
      tired half-closed eyes, short greying hair under a grey work cap.
      Unhurried, a cigarette often tucked behind his ear.
    tell: "the OLD man, late 50s, deeply lined face, grey cap, shirt buttoned up"
    default_outfit: station
    outfits:
      station:
        desc: grey work shirt BUTTONED UP and tucked in, name tag on the chest pocket, sleeves rolled, dark work trousers with a belt, work boots, grey work cap
        ref: artwork/character-sheets/kubo.png

  akane:
    name: AKANE
    full_name: Akane Natsume (driver of the red Roadster)
    traits: >-
      21-year-old woman, tall. Long straight black hair, center-parted with a
      few loose strands framing her face, tied in a LOW ponytail. Calm,
      unreadable, half-lidded eyes; small earring. Looks nothing like Dai.
    tell: "the young WOMAN with long black hair in a low ponytail"
    default_outfit: casual
    outfits:
      casual:
        desc: dark bomber jacket over a white T-shirt, black jeans, black sneakers, black leather driving gloves with the knuckles cut open
        ref: artwork/character-sheets/akane.png

  michiko:
    name: MICHIKO
    full_name: Michiko Hayama (Dai's mother, 41)
    traits: >-
      Small, tired woman of 41 who looks older. Black hair with some grey in a
      low loose bun, strands falling out. Fine lines around the eyes.
    tell: "the tired MOTHER, 41, hair in a loose low bun"
    default_outfit: factory
    outfits:
      factory:
        desc: light-blue factory smock (drawn in light grey tone) with a name tag, loose trousers, sneakers
        ref: artwork/character-sheets/michiko.png
      home:
        desc: worn cardigan over a plain top, loose trousers
        ref: artwork/character-sheets/michiko.png
      summer_home:
        desc: plain faded T-shirt, loose trousers, an apron
        ref: artwork/character-sheets/michiko.png
        ref_note: the face and hair only
      supermarket:
        desc: plain supermarket work vest (dark tone) over a T-shirt, loose trousers
        ref: artwork/character-sheets/michiko.png
        ref_note: the face and hair only

  aya:
    name: AYA
    full_name: Aya Hayama (older sister, 20)
    traits: >-
      20-year-old woman, chin-length black bob, the same sharp eyes as Dai,
      blunt and dry expression.
    tell: "the older SISTER, 20, chin-length black bob"
    default_outfit: home
    outfits:
      home:
        desc: grey tank top, long cardigan, shorts, barefoot indoors
        ref: artwork/character-sheets/aya.png
      work:
        desc: supermarket cashier vest over a blouse, dark skirt or trousers
        ref: artwork/character-sheets/aya.png
      blouse:
        desc: plain short-sleeved blouse and dark trousers
        ref: artwork/character-sheets/aya.png
        ref_note: the face and hair only
      tanktop:
        desc: grey tank top and shorts (no cardigan), barefoot, hair flat on one side from sleeping
        ref: artwork/character-sheets/aya.png
        ref_note: the face and hair only

  sota:
    name: SOTA
    full_name: Sota Hayama (younger brother, 11)
    traits: >-
      11-year-old boy, small and thin for his age, round glasses, bowl-cut
      black hair. Often holds a blue asthma inhaler.
    tell: "the little BROTHER, 11, round glasses, bowl cut"
    default_outfit: home
    outfits:
      home:
        desc: plain T-shirt, shorts, socks or sneakers
        ref: artwork/character-sheets/sota.png
      undershirt:
        desc: sleeveless white undershirt and shorts, barefoot
        ref: artwork/character-sheets/sota.png
      pajamas:
        desc: thin striped cotton summer pajamas (short sleeves, shorts), barefoot
        ref: artwork/character-sheets/sota.png
        ref_note: the face, glasses and hair only
      school:
        desc: white short-sleeved shirt, navy shorts, a yellow-covered elementary-school cap in hand, a square leather randoseru school backpack
        ref: artwork/character-sheets/sota.png
        ref_note: the face, glasses and hair only

  nobu:
    name: NOBU
    full_name: Nobuyuki "Nobu" Kawamata (classmate, ramen-shop son, 17)
    traits: >-
      17-year-old boy, about 165 cm, stocky and soft, round full face with
      chubby cheeks, very short BUZZ-CUT black hair (forehead fully visible),
      thick straight eyebrows, small bright eyes that go wide when excited,
      a big expressive mouth that is usually talking or grinning. Leans
      forward, restless. No glasses. Looks nothing like Dai.
    tell: "the round-faced, stocky boy with a BUZZ CUT"
    default_outfit: summer_school
    outfits:
      summer_school:
        desc: >-
          summer school uniform: white short-sleeved button shirt, untucked
          and a little tight over his belly, black school trousers, indoor
          shoes with the heels trodden flat; a canvas school bag
        ref: artwork/character-sheets/nobu.png
      meet:
        desc: white short-sleeved shirt buttoned to throat, track pants, oversized black kitchen sandals, canvas shoulder bag
        ref: artwork/character-sheets/nobu.png
        ref_note: face and build only; use the described meet clothes

  okabe:
    name: OKABE
    full_name: Okabe, tire-shop bookmaker
    traits: Man in his forties with a soft round face, short dark hair, reading glasses on forehead, tire-blackened finger creases and clean short nails.
    tell: the round-faced bookmaker with reading glasses on his forehead
    default_outfit: work
    outfits:
      work:
        desc: plain unmarked polo shirt and ordinary trousers
        ref: artwork/character-sheets/okabe.png

  tetsu:
    name: TETSU
    full_name: Tetsu, Goto's companion
    traits: Skinny nineteen-year-old man with short dark hair and satin jacket.
    tell: the skinny young man in a satin jacket
    default_outfit: casual
    outfits:
      casual:
        desc: plain satin jacket and trousers

  chaser_driver:
    name: CHASER DRIVER
    full_name: Chaser driver
    traits: Man about twenty-two with a perm, white loafers and no socks.
    tell: the young man with a perm and white loafers
    default_outfit: casual
    outfits:
      casual:
        desc: casual shirt and trousers, white loafers, no socks

  caller:
    name: CALLER
    full_name: an unseen person at the meet
    traits: A voice in the crowd, off panel.
    tell: an unseen person
    default_outfit: casual
    outfits:
      casual:
        desc: ordinary 1995 casual clothes

  hotta:
    name: HOTTA-SENSEI
    full_name: Hotta-sensei (homeroom and English teacher)
    traits: >-
      Thin, tired male teacher in his late 40s, receding black hair, sunken
      cheeks, a white towel round his neck, fans himself with a flat paper
      fan printed with a cartoon owl.
    tell: "the thin, tired TEACHER with a towel round his neck"
    default_outfit: teacher
    outfits:
      teacher:
        desc: short-sleeved pale shirt, loosened dark tie, grey slacks, white towel round the neck
        ref: artwork/character-sheets/hotta.png

  shop_owner:
    name: OWNER
    full_name: the bookstore owner
    traits: >-
      Small, wrinkled old man in his 70s, bald on top with white hair at the
      sides, round reading glasses, a stern little mouth. Carries a feather
      duster.
    tell: "the tiny OLD bookstore owner with a feather duster"
    default_outfit: cardigan
    outfits:
      cardigan:
        desc: a buttoned grey cardigan (in August) over a shirt, dark trousers, slippers

  goto:
    name: GOTO
    full_name: Goto (street racer, mid-20s)
    traits: >-
      Man in his mid-20s, bleached short spiky hair, thin eyebrows, a
      cigarette nearly always in his mouth, cocky expression.
    tell: "the bleached spiky-haired racer with a cigarette"
    default_outfit: tracksuit
    outfits:
      tracksuit:
        desc: shiny dark tracksuit jacket with white side stripes open over a white tank top, matching track pants, gold chain, sneakers
        ref: artwork/character-sheets/goto.png

  principal:
    name: PRINCIPAL
    full_name: the school principal
    traits: >-
      Portly man in his early 60s, thinning grey hair combed over, round
      glasses, a heavy, solemn face.
    tell: "the portly old PRINCIPAL with round glasses at the podium"
    default_outfit: suit
    outfits:
      suit:
        desc: dark grey suit, white shirt, dark tie

  okuda:
    name: OKUDA
    full_name: Okuda (classmate who sits next to Dai)
    traits: >-
      Skinny 17-year-old boy with a long face, a short neat side-parted
      haircut and a sour, undecided mouth. Looks nothing like Dai or Nobu.
    tell: "the skinny long-faced boy with a neat side part"
    default_outfit: summer_school
    outfits:
      summer_school:
        desc: white short-sleeved school shirt tucked in, black trousers

  bank_girl:
    name: GIRL
    full_name: the girl who sits in front of Dai
    traits: >-
      17-year-old schoolgirl with two short braids and a pleased, proud smile.
    tell: "the schoolgirl with two short braids"
    default_outfit: summer_school
    outfits:
      summer_school:
        desc: white short-sleeved sailor-style summer blouse with a dark collar and scarf, dark pleated skirt

  learner:
    name: LEARNER
    full_name: a learner driver at the driving school
    traits: >-
      Young woman of about 18 with a ponytail and big round glasses, panicking
      at the wheel. Clearly NOT Akane: round glasses, round soft face.
    tell: "the young learner with big round glasses"
    default_outfit: casual
    outfits:
      casual:
        desc: plain blouse

  instructor:
    name: INSTRUCTOR
    full_name: the driving-school instructor
    traits: >-
      Middle-aged man with a crew cut and a completely calm, bored face.
    tell: "the bored middle-aged INSTRUCTOR with a crew cut"
    default_outfit: uniform
    outfits:
      uniform:
        desc: pale short-sleeved uniform shirt with a dark tie, a clipboard on his knee

cars:
  meet_cars:
    name: the parked meet cars
    full_name: 1995 Japanese street cars in a distant crowd
    traits: Period-correct Japanese coupes and sedans, no Eunos Roadster.
    rules:
      - Right-hand drive, no car newer than September 1995.

  skyline:
    name: dark blue 1992 Nissan Skyline R32
    full_name: Japanese-market dark blue 1992 Nissan Skyline R32
    traits: dark blue 1992 Nissan Skyline R32, right-hand drive, Japanese market, period correct.
    ref: artwork/car-sheets/skyline-rx7-crops.png
    views:
      view:
        ref: artwork/car-sheets/skyline-rx7-crops.png
        note: left-hand rear-view crop; use for details, draw requested camera angle
    rules:
      - Right-hand drive. In a near-side driver window view the front points right.

  rx7:
    name: white 1990 Mazda RX-7 FC
    full_name: Japanese-market white 1990 Mazda RX-7 FC
    traits: white 1990 Mazda RX-7 FC, right-hand drive, Japanese market, period correct.
    ref: artwork/car-sheets/skyline-rx7-crops.png
    views:
      view:
        ref: artwork/car-sheets/skyline-rx7-crops.png
        note: right-hand front-view crop; use for details, draw requested camera angle
    rules:
      - Right-hand drive. In a near-side driver window view the front points right.

  cefiro:
    name: lowered 1991 Nissan Cefiro A31
    full_name: Japanese-market lowered 1991 Nissan Cefiro A31
    traits: lowered 1991 Nissan Cefiro A31, right-hand drive, Japanese market, period correct.
    ref: artwork/car-sheets/cefiro-a31-view.png
    views:
      view:
        ref: artwork/car-sheets/cefiro-a31-view.png
        note: front three-quarter crop; use for details, draw requested camera angle
    rules:
      - Right-hand drive. In a near-side driver window view the front points right.

  supra:
    name: black 1994 Toyota Supra A80
    full_name: Japanese-market black 1994 Toyota Supra A80
    traits: black 1994 Toyota Supra A80, right-hand drive, Japanese market, period correct.
    ref: artwork/car-sheets/supra-a80-view.png
    views:
      view:
        ref: artwork/car-sheets/supra-a80-view.png
        note: front three-quarter crop; use for details, draw requested camera angle
    rules:
      - Right-hand drive. In a near-side driver window view the front points right.

  starlet:
    name: white 1991 Toyota Starlet EP82 GT Turbo
    full_name: Japanese-market white 1991 Toyota Starlet EP82 GT Turbo
    traits: white 1991 Toyota Starlet EP82 GT Turbo, right-hand drive, Japanese market, period correct.
    ref: artwork/car-sheets/starlet-p80-view.png
    views:
      view:
        ref: artwork/car-sheets/starlet-p80-view.png
        note: front three-quarter crop; use for details, draw requested camera angle
    rules:
      - Right-hand drive. In a near-side driver window view the front points right.

  chaser:
    name: grey 1993 Toyota Chaser JZX90 Tourer V
    full_name: Japanese-market grey 1993 Toyota Chaser JZX90 Tourer V
    traits: grey 1993 Toyota Chaser JZX90 Tourer V, right-hand drive, Japanese market, period correct.
    ref: artwork/car-sheets/chaser-x90-view.png
    views:
      view:
        ref: artwork/car-sheets/chaser-x90-view.png
        note: rear crop; use for details, draw requested camera angle
    rules:
      - Right-hand drive. In a near-side driver window view the front points right.

  school_sedan:
    name: the driving-school sedan
    full_name: white 1990s Toyota Corona four-door sedan, Shiomi Driving School car
    traits: >-
      Plain white boxy early-1990s Japanese four-door sedan (Toyota Corona
      type), a small square sign on the roof, the driving school's name painted
      on the front doors as an unreadable stripe. NOT a sports car, NOT a
      roadster.
    rules:
      - "RIGHT-HAND DRIVE: the learner sits on the car's right, the instructor on the left with his own brake pedal."

  roadster:
    name: the red Roadster
    full_name: 1990 Mazda Eunos Roadster (NA, Japanese market), Akane's car
    traits: >-
      Small two-seat convertible, 1990 Mazda Eunos Roadster (NA). Black soft
      top UP. Round pop-up headlights. Silver 14-inch 7-spoke alloy wheels.
      Slightly lowered, otherwise stock: no wing, no body kit, no stickers.
      White Japanese number plate, characters not legible. Immaculate paint
      (drawn in mid-grey screentone, the page is black and white).
    ref: artwork/car-sheets/red-roadster.png
    # Angle-specific crops of the sheet (cast entry `view: front34`). The model copies car poses
    # from its references, so a panel that needs another angle should not get the full sheet with
    # its flat side views. Crop boxes on red-roadster.png (1536x1024):
    #   front34  = 856x430+680+594 (front three-quarter, LEFT flank) stacked over 790x290+0+5 (front, pop-ups up/down)
    #   rear     = 440x305+115+300 (straight rear view; the sheet has no rear three-quarter)
    #   interior = 640x392+0+632 (dashboard from the back seat)
    views:
      front34:
        ref: artwork/car-sheets/red-roadster-front34.png
        note: "front three-quarter and front views only; the three-quarter view shows the LEFT flank, so for a right-flank view draw its mirror angle but keep the steering wheel on the car's RIGHT"
      rear:
        ref: artwork/car-sheets/red-roadster-rear.png
        note: "rear view only: taillights, plate, exhaust, soft top from behind"
      interior:
        ref: artwork/car-sheets/red-roadster-interior.png
        note: "interior only: right-hand-drive dashboard, wheel, gauges, gear lever"
    rules:
      - "RIGHT-HAND DRIVE (Japanese market): the steering wheel and the driver are on the car's RIGHT side."
      - "In every side view where the driver's side is visible, the car's FRONT points to the RIGHT edge of the panel, so we see its right (driver) side."
      - "The fuel door is on the right rear quarter."
    states:
      headlights_up: pop-up headlights UP and lit
      headlights_down: pop-up headlights DOWN (closed, flush with the hood)

  sx180:
    name: the silver 180SX
    full_name: Nissan 180SX (a customer's car, ch4)
    traits: >-
      Silver Nissan 180SX hatchback coupe (early 1990s), POP-UP headlights,
      long sloping nose, fastback hatch, rust bubbling at the rear wheel
      arches, plain stock wheels. Right-hand drive. NOT a Roadster: a bigger
      four-seat coupe.
    rules:
      - "RIGHT-HAND DRIVE: the driver sits on the car's right side."

  magazine_gtr:
    name: the magazine-cover GT-R
    full_name: printed photo of a black Skyline GT-R (R32) on a magazine cover
    traits: >-
      A small PRINTED PHOTO on a magazine cover: a black R32 Skyline GT-R shot
      from low on the ground, a flame spitting from its exhaust.

  silvia:
    name: Goto's Silvia
    full_name: Nissan Silvia S13, Goto's car
    traits: >-
      White Nissan Silvia S13 coupe, slightly dirty. FIXED slim headlights
      (NOT pop-ups; it is not a 180SX). Big aftermarket rear wing, black
      multi-spoke wheels, loud exhaust.
    ref: artwork/car-sheets/silvia-s13.png
    views:
      front34:
        ref: artwork/car-sheets/silvia-s13-front34.png
        note: front three-quarter crop for detail only; draw the specified camera angle
      rear:
        ref: artwork/car-sheets/silvia-s13-rear.png
        note: rear crop for detail only; draw the specified camera angle
    rules:
      - "RIGHT-HAND DRIVE: the driver sits on the car's right side."
