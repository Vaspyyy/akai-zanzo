chapter: 14
title: Ten Pays Thirty
lettering: empty

# Reusable cast entries (YAML anchors). Free-text outfits use the character's default sheet.
x-cast:
  dai_gak: &dai_gak {id: dai_cut, outfit: "black gakuran winter school uniform (stand collar open, worn carelessly), black trousers, white canvas sneakers, a worn canvas school bag on his shoulder; BAREHEADED"}
  dai_tee: &dai_tee {id: dai_cut, outfit: "a plain white T-shirt and black school uniform trousers, white socks"}
  dai_home: &dai_home {id: dai_cut, outfit: "an old faded white long-sleeved T-shirt, worn jeans, white socks indoors"}
  dai_night: &dai_night {id: dai_cut, outfit: "a plain grey zip-up jacket with NO name tag, open over a faded dark flannel shirt with a BUTTONED breast pocket, worn jeans, beat-up white canvas sneakers (the right one held together with silver tape); white cotton work gloves poking out of a jacket pocket"}
  kubo: &kubo {id: kubo, outfit: station}
  mom_apron: &mom_apron {id: michiko, outfit: "a worn cardigan with the sleeves pushed up and a plain apron over loose trousers, socks"}
  mom_factory: &mom_factory {id: michiko, outfit: factory}
  mom_vest: &mom_vest {id: michiko, outfit: vest}
  kazue: &kazue {id: ward_mother, outfit: "a BEIGE knee-length coat open over a brown knitted cardigan and a pale blouse, dark slacks, flat shoes, a shoulder handbag"}
  sota_home: &sota_home {id: sota, outfit: "a long-sleeved striped T-shirt and shorts, socks, round glasses"}
  sota_jacket: &sota_jacket {id: sota, outfit: "Ken's NAVY padded winter jacket with a HOOD (dark tone), a little too big, over shorts, socks, round glasses"}
  okabe: &okabe {id: okabe, outfit: "a dark padded jacket zipped half up over a sweater, ordinary trousers, reading glasses pushed up into his hair"}
  sboy: &sboy {id: starlet_boy, outfit: "a cheap thin windbreaker open over a white T-shirt with a breast pocket, jeans, cheap sneakers"}
  owner: &owner {id: supra_owner, outfit: leather}
  night_dai: &night_dai "Dai: SHORT black hair (forehead uncovered), plain grey zip-up jacket with NO name tag over a dark flannel shirt, jeans."
  dry_night: &dry_night "DRY night, NO moon, black sky: no rain, no wet ground, no puddles, no reflections on the asphalt."
  notes_95: &notes_95 "Banknotes are 1995 Japanese notes only: the 10,000-yen note is a large light-toned note with an oval portrait of an older man with swept-back hair; the 1,000-yen note is smaller, blue-grey tone, with a portrait of a man with a moustache; the 5,000-yen note is in between, with a portrait of a man with round glasses. No other designs, no holograms, no foreign money."
  supra_marks: &supra_marks "The black Supra: a round, low, glossy BLACK sports coupe with four round headlamps in two pairs, a tall rear wing on struts and round taillights; NO maker badges or lettering. Right-hand drive."
  starlet_marks: &starlet_marks "The white Starlet: a small boxy WHITE three-door hatchback with a hood scoop and a small roof spoiler; NO maker badges or lettering. Right-hand drive."
  geography: &geography "Race geography: from the lot the cars run AWAY down a dead-flat 1 km straight with warehouse walls on the LEFT and the container yard and water on the RIGHT, to a rail crossing with one light on a pole, then the road bends LEFT behind tall round grain silos. The Starlet starts in the LEFT lane (warehouse side), the Supra in the RIGHT lane."

defaults:
  orientation: portrait
  time: October 1995
  notes:
  - Right-to-left panel order. One speaker per panel. All cars are Japanese models sold by October 1995, right-hand drive.
  - No brand logos, no maker badges, no stickers, no readable signs or printed words anywhere unless a panel asks for them. No Japanese characters. No banknotes unless a panel asks for them.
  - DRY weather in every scene of this chapter. No rain.
  - Roomy panels with breathing space; vary shot sizes and poses; no two panels on the page may look alike.

pages:

# ================================================================== Fri 27 Oct, 6 a.m.: the station
- page: 1
  title: Six o'clock
  location: harbor-station-night
  time: Friday 6 a.m. in late October, the sky just going grey before sunrise, the canopy tube lights still on
  guards:
  - "Dai: SHORT black hair, BAREHEADED, black school gakuran, a canvas bag on his shoulder."
  - "Kubo: the OLD man, late 50s, grey cap, grey work shirt buttoned up."
  panels:
  - pos: top, wide
    action: "Establishing: the small shabby gas station on the empty harbor road at first light, the sky pale grey over the warehouses and cranes, the canopy tubes still lit, nobody at the pumps."
    captions:
    - FRIDAY. 6 A.M.
  - pos: upper-right
    action: "Close on a navy work cap lying on the office counter beside an old cash till, its strap band done up tight."
    captions:
    - AT SIX MY CAP WAS STILL ON THE OFFICE COUNTER BY THE TILL, WHERE I'D PUT IT AT TWO, WITH THE BAND ON THE TIGHTEST HOLE. I LEFT IT THERE.
  - pos: upper-left
    action: "Dai in his school gakuran, bag on his shoulder, halfway out of the office door, his back to the room."
    cast: [*dai_gak]
  - pos: middle, wide
    action: "Inside the cramped office: Kubo behind the counter folding a newspaper into four with his weathered hands, not looking up."
    cast: [*kubo]
    dialogue:
    - kubo: WHEN THE WHEELS WERE OFF.
  - pos: lower-right
    action: "Dai stopped in the doorway, looking back over his shoulder, grey dawn behind him. Silent."
    cast: [*dai_gak]
  - pos: lower-left
    action: "Closer on Kubo, eyes up from the folded paper under the brim of his cap."
    cast: [*kubo]
    dialogue:
    - kubo: AT TANABE'S.
    - kubo: WHAT WAS BEHIND THEM?

- page: 2
  title: What was behind them
  location: harbor-station-night
  time: Friday 6 a.m., grey first light outside, office lights on
  guards:
  - "Dai: SHORT black hair, BAREHEADED, black gakuran. Memory panels have a soft grey border and are in daylight."
  panels:
  - pos: top, wide
    location: tanabe-yard
    action: "Memory inset with a soft grey border, daylight in a scrapyard: the front of a small red open sports car lifted off the ground on the forks of a forklift; Dai crouching at the front LEFT wheel, pulling the wheel off toward himself."
    cast: [{<<: *dai_gak, outfit: "grey zip-up jacket, jeans, white cotton work gloves"}, {id: roadster, view: front34, camera: "low front three-quarter of the LEFT flank, the nose lifted high on forklift forks, the left front wheel coming off"}]
    captions:
    - I HADN'T THOUGHT ABOUT IT SINCE. BUT I'D SEEN IT, THE WAY YOU SEE THINGS YOU DON'T KNOW THE NAMES OF YET.
  - pos: middle-right, large
    action: "Memory close-up with a soft grey border: behind the removed wheel, a steel brake disc standing on its edge, big as a dinner plate, brown with rust all over except a smooth worn band round the outside with fine grooves in it and a raised lip at the very edge; a lump of iron (the caliper) sitting over the top of it."
    dialogue:
    - {speaker: dai_cut, text: "A ROUND PLATE. RUSTY. SMOOTH IN A RING ROUND THE OUTSIDE, WITH GROOVES IN THE RING.", offpanel: true}
  - pos: middle-left
    action: "Dai in the office doorway, thinking it through, eyes on nothing."
    cast: [*dai_gak]
    dialogue:
    - dai_cut: AND A RIDGE RIGHT AT THE EDGE, STICKING UP. A LIP.
  - pos: lower-right
    action: "Kubo behind the counter, waiting, saying nothing, the folded newspaper under his hand."
    cast: [*kubo]
  - pos: lower-left
    action: "Memory close-up with a soft grey border, looking down into the iron caliper: a thin black brake pad on a steel backing plate pressed against the disc, thinner than a coin."
    dialogue:
    - {speaker: dai_cut, text: "THE IRON THING ON TOP. THERE WAS A BLACK PIECE IN THERE AGAINST THE PLATE, ON A STEEL BACK. THINNER THAN A 10-YEN COIN.", offpanel: true}
  - pos: bottom, wide
    action: "Dai in the doorway, frowning slightly, sure of it."
    cast: [*dai_gak]
    dialogue:
    - dai_cut: ON THE LEFT ONE THE STEEL WAS NEARLY ON THE PLATE.

- page: 3
  title: Pads
  location: harbor-station-night
  time: Friday about 6 a.m., grey dawn outside, office lights on
  guards:
  - "Dai: SHORT black hair, BAREHEADED, black gakuran. Kubo: OLD, grey cap."
  panels:
  - pos: top-right
    action: "Kubo sliding the folded newspaper under the counter."
    cast: [*kubo]
    dialogue:
    - kubo: PADS. THE FRONTS. THE DISCS, WE'LL SEE WHEN THEY'RE OFF.
  - pos: top-left
    action: "From behind Kubo: he looks out through the office window past the two pumps at the harbor road, which is only just going grey."
    cast: [{<<: *kubo, note: "from behind, head turned to the window"}]
    dialogue:
    - kubo: AFTER SUNDAY IT'LL ROLL. THEN IT'LL WANT TO STOP.
  - pos: middle-right
    action: "Dai in the doorway, the bag strap in his fist."
    cast: [*dai_gak]
    dialogue:
    - dai_cut: HOW MUCH?
  - pos: middle-left
    action: "Kubo, flat, not looking at him."
    cast: [*kubo]
    dialogue:
    - kubo: SIX THOUSAND. ABOUT. I'LL GET THEM SATURDAY.
  - pos: lower-right
    action: "Close on Dai, quick, decided."
    cast: [*dai_gak]
    dialogue:
    - dai_cut: I'LL BRING IT SUNDAY.
  - pos: bottom-left
    action: "Kubo nodding once, taking a coffee mug off a shelf and drinking from it, a small grimace."
    cast: [*kubo]
    captions:
    - HE TOOK HIS COFFEE OFF THE SHELF, FOUND IT WAS COLD, AND DRANK IT ANYWAY.

- page: 4
  title: School
  location: harbor-station-night
  time: Friday 6 a.m. dawn at the station (top), then school by day
  guards:
  - "Dai: SHORT black hair, BAREHEADED, black gakuran."
  - "Hotta-sensei: thin tired teacher in a grey cardigan and loosened tie, no towel."
  panels:
  - pos: top-right
    action: "Kubo with the mug at his mouth, speaking into the cup."
    cast: [*kubo]
    dialogue:
    - kubo: THE HONDA. AT FOUR.
  - pos: top-left
    action: "Dai in the doorway, face blank."
    cast: [*dai_gak]
    dialogue:
    - dai_cut: HIGH-OCTANE. FULL.
    captions:
    - THAT WAS TRUE.
  - pos: middle-right
    action: "Kubo looking at Dai over the rim of the mug; behind him a balding day attendant pats his shirt pockets for a pen. Silent."
    cast: [*kubo, day_man]
    captions:
    - HE LOOKED AT ME OVER THE CUP FOR AS LONG AS IT TOOK THE DAY MAN TO FIND A PEN.
  - pos: middle-left
    action: "Close on Kubo lowering the mug, one word."
    cast: [*kubo]
    dialogue:
    - kubo: SCHOOL.
  - pos: lower, wide
    location: classroom
    action: "The classroom by day, wooden desks, autumn light: Hotta-sensei at the front reading names off a list, not looking up from it."
    cast: [{id: hotta, outfit: cardigan}]
    dialogue:
    - hotta: TUESDAY, HAYAMA. DON'T MAKE ME COME TO YOUR HOUSE.
    captions:
    - IN HOMEROOM HOTTA-SENSEI READ OUT THE NAMES WHOSE COMPANY FORMS HADN'T COME IN. MINE WAS THE LAST.
  - pos: bottom, wide
    location: classroom
    action: "Dai at a desk by the window, chin propped on his fist, fighting to keep his eyes open."
    cast: [*dai_gak]
    captions:
    - I STAYED AWAKE UNTIL SIXTH PERIOD, AND THEN ONLY LOST A BIT OF IT.

# ================================================================== Fri evening: Ken's jacket
- page: 5
  title: The knock
  location: hayama-apartment
  time: Friday afternoon, then 6:40 p.m., dark outside
  panels:
  - pos: top, wide
    action: "Daytime: Dai walking home alone along a straight concrete canal, school bag on his shoulder, low autumn sun, small in the frame."
    cast: [*dai_gak]
    captions:
    - I WENT HOME ALONG THE CANAL AND LAY DOWN ON MY FUTON AT A QUARTER PAST FOUR IN MY UNIFORM TROUSERS.
  - pos: upper-right
    action: "Dai asleep on his back on a futon in the small tatami room, white T-shirt and black uniform trousers, one arm over his eyes."
    cast: [*dai_tee]
  - pos: upper-left
    action: "Establishing at dusk: an aging concrete danchi block, lit stairwell lamps on each landing, a few lit kitchen windows."
    captions:
    - THE KNOCK CAME AT TWENTY TO SEVEN.
  - pos: middle, wide
    location: hayama-genkan
    action: "The grey steel front door seen from inside, the chain hanging; two knocks."
    sfx: [KON KON]
    dialogue:
    - {speaker: ward_mother, text: "HAYAMA-SAN? IT'S SASAKI. MAI'S MOTHER.", offpanel: true, at: "tail pointing at the door"}
  - pos: bottom, wide
    action: "Dai's view through a narrow gap between two sliding fusuma doors: a vertical strip of the kitchen, the tired mother at the gas stove frying, her back to us, and beyond her the genkan and the steel door."
    cast: [{<<: *mom_apron, note: "small, from behind, at the stove"}]
    captions:
    - THE FUSUMA BETWEEN MY FUTON AND THE KITCHEN HASN'T SHUT ALL THE WAY SINCE SOTA RAN INTO IT WHEN HE WAS SEVEN.

- page: 6
  title: Sasaki-san
  location: hayama-genkan
  time: Friday 6:40 p.m., the kitchen tube light on, the stair lamp lit outside
  guards:
  - "Kazue: thick curly permed shoulder-length hair, BEIGE coat over a brown cardigan, red knuckles. Mom: small, tired, low loose bun, apron."
  - "The jacket: a child's NAVY padded winter jacket with a hood, on a wire hanger, inside a CLEAR plastic dry-cleaner's cover with a small paper tag stapled at the top."
  panels:
  - pos: top-right
    action: "Close on Mom's hands turning the gas knob off and wiping on her apron."
    cast: [{<<: *mom_apron, note: "only her hands and apron"}]
    sfx: [{text: kachi, note: small}]
    captions:
    - THE FRYING STOPPED.
  - pos: top-left
    action: "Mom opening the steel door a few centimeters on its chain; a woman's warm face with curly permed hair in the gap, lit by the stair lamp."
    cast: [*mom_apron, {<<: *kazue, note: "only her face in the gap"}]
  - pos: middle-right
    action: "Close on Mom's fingers sliding the door chain out of its slot."
    cast: [{<<: *mom_apron, note: "only her hand"}]
    sfx: [{text: chara, note: small}]
    captions:
    - THEN SHE SHUT IT, AND SLID THE CHAIN OFF, AND OPENED IT AGAIN PROPERLY.
  - pos: middle-left, large
    action: "The door open properly: Kazue on the concrete landing under the stair lamp, holding up a wire hanger by its hook; on it, in a clear plastic cleaner's cover with a paper tag, a child's navy padded jacket with a hood. Apologetic smile."
    cast: [*kazue]
    dialogue:
    - ward_mother: I'M SORRY, AT DINNERTIME.
  - pos: bottom, wide
    action: "Kazue, chatty, laughing at herself, the hanger still up."
    cast: [*kazue]
    dialogue:
    - ward_mother: YOU NEVER RANG, SO I THOUGHT, WELL, I'LL JUST GO ROUND.
    - ward_mother: THE LADY ON THE THIRD FLOOR TOLD ME WHICH DOOR. THROUGH HER CHAIN.

- page: 7
  title: Ken's jacket
  location: hayama-genkan
  time: Friday 6:40 p.m., kitchen tube light, stair lamp outside
  continue_from: 6
  guards:
  - "Kazue stands OUTSIDE on the landing; Mom stands INSIDE on the genkan concrete. Keep them on the same sides as the previous page."
  - "The jacket: child's NAVY padded jacket with a hood in a CLEAR plastic cleaner's cover with a paper tag."
  panels:
  - pos: top-right
    action: "Kazue holding the hanger out a little toward Mom."
    cast: [*kazue]
    dialogue:
    - ward_mother: THIS IS KEN'S. HE GREW OUT OF IT OVER THE SUMMER, ALL AT ONCE. THEY DO THAT.
  - pos: top-left
    action: "Close on the jacket in its clear cover on the hanger, the paper tag at the top."
    dialogue:
    - {speaker: ward_mother, text: "I THOUGHT, SOTA-KUN.", offpanel: true}
  - pos: middle-right
    action: "Mom, both hands up a little, palms out, shaking her head."
    cast: [*mom_apron]
    dialogue:
    - michiko: OH, NO. WE COULDN'T.
  - pos: middle-left
    action: "Kazue lifting the hanger a little so the paper tag turns in the stair light."
    cast: [*kazue]
    dialogue:
    - ward_mother: {text: "IT'S ONLY HAD THE ONE WINTER. THE ZIP'S GOOD. I HAD IT CLEANED.", box: [267, 553, 269, 180]}
    - ward_mother: {text: "IT'S NO USE TO ANYBODY IN MY CUPBOARD.", box: [34, 562, 222, 176], draw: true, tail: [150, 740]}
  - pos: lower-right
    action: "Mom, eyes lowered, quiet."
    cast: [*mom_apron]
    dialogue:
    - michiko: SOTA HAS A COAT.
  - pos: bottom-left
    action: "Behind Mom in the kitchen: the small boy in socks and round glasses staring at the jacket with his mouth open."
    cast: [*sota_home]
    captions:
    - SOTA HAD COME UP BEHIND HER, IN HIS SOCKS, WITH HIS GLASSES ON, AND WAS LOOKING AT THE JACKET WITH HIS MOUTH OPEN.

- page: 8
  title: The third time
  location: hayama-genkan
  time: Friday 6:45 p.m., kitchen tube light, stair lamp outside
  continue_from: 7
  panels:
  - pos: top-right
    action: "Close on a small GREEN child's coat hanging on a metal hook by the door, its sleeves short and worn."
    captions:
    - HIS COAT WAS THE GREEN ONE FROM TWO WINTERS AGO.
  - pos: top-left
    action: "Memory inset with a soft grey border, morning: Sota on the outdoor concrete stairs of the danchi in the green coat, tugging the sleeves down over his thin wrists."
    cast: [{<<: *sota_home, outfit: "a small GREEN coat too short in the sleeves, a school backpack, round glasses"}]
    captions:
    - IN THE MORNINGS, ON THE STAIRS, HE PULLED THE SLEEVES DOWN OVER HIS WRISTS, AND THEY CAME BACK UP.
  - pos: middle, wide
    action: "Kazue on the landing, kind and practical, the hanger lowered."
    cast: [*kazue]
    dialogue:
    - ward_mother: I'M SURE HE HAS. IT'S ONLY THAT IT'LL HANG THERE, AND THE MOTHS WILL HAVE IT, AND I'LL FEEL BAD EVERY TIME I OPEN THE DOOR.
  - pos: lower-right
    action: "Close on Kazue, earnest, a little smile."
    cast: [*kazue]
    dialogue:
    - ward_mother: YOU'D BE DOING ME A FAVOR, HAYAMA-SAN. HONESTLY.
  - pos: bottom, large
    action: "Kazue holding the jacket out the third time: no longer up by the hook but laid FLAT across both her forearms, offered like a tray, toward Mom's side of the doorway."
    cast: [*kazue]
    captions:
    - SHE HELD IT OUT THE THIRD TIME. NOT UP BY THE HOOK NOW. FLAT, ACROSS BOTH HER ARMS.

- page: 9
  title: Thank you very much
  location: hayama-genkan
  time: Friday 6:45 p.m., kitchen tube light, stair lamp outside
  continue_from: 8
  panels:
  - pos: top-right
    action: "Close on Mom's tired face looking down at the jacket, very still. Silent."
    cast: [*mom_apron]
    captions:
    - MOM LOOKED AT IT FOR A LONG TIME.
  - pos: top-left
    action: "Close on Mom's work-worn hands sliding underneath the jacket on Kazue's forearms and taking it."
    cast: [{<<: *mom_apron, note: "only her hands"}, {<<: *kazue, note: "only her forearms"}]
  - pos: middle-right
    action: "Mom holding the jacket against her front, bowing her head slightly."
    cast: [*mom_apron]
    dialogue:
    - michiko: THANK YOU. THANK YOU VERY MUCH.
  - pos: middle-left
    action: "Kazue brightening, hands free now."
    cast: [*kazue]
    dialogue:
    - ward_mother: {text: "MAI SAYS HELLO TO SOTA-KUN. SHE SAYS IT EVERY DAY.", box: [292, 626, 262, 186], draw: true, tail: [262, 700]}
    - ward_mother: {text: "AND KEN SAYS FUJITA'S TOMORROW, TWO O'CLOCK, AND BRING THE ONE WITH THE COINS ON.", box: [206, 826, 300, 256], draw: true, tail: [200, 900]}
  - pos: lower-right
    action: "Kazue leaning to smile past Mom at the boy."
    cast: [*kazue]
    dialogue:
    - ward_mother: HE WON'T SAY IT HIMSELF. HE'S ELEVEN.
  - pos: bottom-left
    action: "Sota beside Mom's elbow, nodding hard, glasses glinting."
    cast: [*sota_home]
    dialogue:
    - sota: I'LL BRING IT.

- page: 10
  title: The bow
  location: hayama-genkan
  time: Friday about 6:50 p.m., kitchen tube light, stair lamp outside
  continue_from: 9
  panels:
  - pos: top-right
    action: "Mom with the jacket in her arms, to Kazue at the door."
    cast: [*mom_apron]
    dialogue:
    - michiko: THANK YOU FOR COMING ALL THIS WAY.
  - pos: top-left
    action: "Kazue already turning toward the stairs, looking back over her shoulder, waving it off."
    cast: [*kazue]
    dialogue:
    - ward_mother: IT'S ON MY WAY HOME. GO ON, YOUR OIL'S GETTING COLD.
  - pos: middle, wide
    action: "The steel door shut. Mom standing on the genkan concrete with the jacket in its cover held against her front, her back to us."
    cast: [{<<: *mom_apron, note: "from behind"}]
    sfx: [{text: tan tan tan, note: small, at: "by the door"}]
    captions:
    - SASAKI-SAN'S SHOES WENT DOWN THE STAIRS, QUICK, A LANDING, ANOTHER LANDING.
  - pos: bottom, large (half the page)
    action: "HALF-PAGE, silent: Mom bowing deeply to the closed steel door, a real bow from the waist, the jacket held in both arms against her; seen from the side, a little behind, from the kitchen; the chain hanging; the tube light on her back."
    cast: [*mom_apron]
    captions:
    - THEN MOM BOWED TO THE DOOR.

- page: 11
  title: After you've eaten
  location: hayama-apartment
  time: Friday about 6:50 p.m. and 9:15 p.m., dark outside, kitchen tube light on
  panels:
  - pos: top-right
    location: hayama-genkan
    action: "Close on the wire hanger with the jacket in its clear cover hung on the hook by the door, over the small green coat."
    captions:
    - SHE HUNG IT ON THE HOOK BY THE DOOR, OVER SOTA'S GREEN COAT, AND WENT BACK TO THE STOVE AND LIT THE GAS.
    sfx: [{text: bo, note: small}]
  - pos: top-left
    action: "Sota at Mom's elbow by the stove, looking up at her."
    cast: [*sota_home]
    dialogue:
    - sota: CAN I TRY IT ON?
  - pos: middle-right
    action: "Mom at the stove from behind, frying again, not turning round."
    cast: [{<<: *mom_apron, note: "from behind"}]
    dialogue:
    - michiko: AFTER YOU'VE EATEN.
  - pos: middle-left
    action: "Sota sitting at the low table, chin on his hands, staring across the room toward the hook by the door. Silent."
    cast: [*sota_home]
  - pos: lower-right
    action: "Dark tatami room: Dai lying back down on the futon, eyes open, the strip of kitchen light across him."
    cast: [*dai_tee]
    captions:
    - I LAY BACK DOWN.
  - pos: bottom-left
    action: "A round wall clock reading a quarter past nine over the empty stove."
    captions:
    - WHEN I GOT UP AT A QUARTER PAST NINE, SHE'D GONE TO THE SUPERMARKET.

- page: 12
  title: Nothing written yet
  location: hayama-apartment
  time: Friday 9:15 p.m., dark outside, kitchen tube light on
  guards:
  - "Sota now wears Ken's NAVY padded jacket with a HOOD, the cleaner's cover off, a little too big."
  panels:
  - pos: top, large
    action: "Sota standing at the dark kitchen window in the navy padded jacket, zipped up to his chin, hood up, his hands lost inside the long sleeves, beaming."
    cast: [{<<: *sota_jacket, note: "hood UP, zipped to the chin, hands hidden in the sleeves"}]
    captions:
    - SOTA WAS STANDING AT THE KITCHEN WINDOW IN IT, ZIPPED UP TO HIS CHIN WITH THE HOOD UP AND HIS HANDS LOST SOMEWHERE INSIDE THE SLEEVES.
  - pos: middle-right
    action: "Close on Sota inside the hood, delighted."
    cast: [*sota_jacket]
    dialogue:
    - sota: {text: "IT'S WARM, NII-CHAN. IT'S WARM ALREADY. THERE'S A POCKET ON THE INSIDE. WITH A ZIP.", box: [494, 566, 240, 400], draw: true, tail: [740, 760]}
  - pos: middle-left
    action: "Dai in the fusuma doorway in his white T-shirt, leaning on the frame."
    cast: [*dai_tee]
    dialogue:
    - dai_cut: DOES IT FIT?
  - pos: lower-right
    action: "Sota turning round to show the back of the jacket, pushing the hood down with a sleeve."
    cast: [{<<: *sota_jacket, note: "from behind, pushing the hood down"}]
    dialogue:
    - sota: IT WILL.
  - pos: bottom, wide
    action: "BIG close-up inside the jacket's collar: the name SASAKI written in black marker, and stuck over it a neat strip of WHITE tape cut square at both ends, the marker letters showing faintly through the tape; nothing written on the tape."
    captions:
    - INSIDE THE COLLAR SOMEONE HAD WRITTEN SASAKI IN BLACK MARKER. OVER IT SOMEBODY ELSE HAD STUCK A STRIP OF WHITE TAPE, NEAT, CUT SQUARE AT BOTH ENDS.
    - THERE WAS NOTHING WRITTEN ON THE TAPE YET.

