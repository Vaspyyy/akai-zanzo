  wreck:
    name: the blue Roadster wreck
    full_name: 1989 Mazda Eunos Roadster (NA), faded Mariner Blue, a wreck in Tanabe's yard
    traits: >-
      A WRECKED small two-seat convertible, 1989 Mazda Eunos Roadster (NA),
      the same body shape as a red Roadster but NOT the red one. Its marks,
      always all drawn: faded Mariner Blue paint shown as a MID-GREY tone,
      chalky and nearly white on the tops of the doors and fenders; the LEFT
      front fender is plain WHITE (unpainted, off another car) with a wide gap
      at the door; the hood is flat matte primer grey; the RIGHT pop-up
      headlight is stuck HALF UP, the left one is down; the REAR is CRUSHED by
      a truck (bumper split and folded under, trunk lid buckled up into a
      peak, both taillights missing, rear plate bent into a V, creases in both
      rear fenders); the black vinyl soft top, gone grey, is UP and TORN open
      above the passenger (left) seat; the plastic rear window is yellowed
      and cracked; grimy stock wheels, two tires flat to the rims. No
      stickers, no logos.
    ref: artwork/car-sheets/blue-roadster-wreck.png
    views:
      front34:
        ref: artwork/car-sheets/blue-roadster-wreck-front34.png
        note: "front three-quarter crop (white left fender, primer hood, right headlight half up); details only, draw the requested camera angle"
      side:
        ref: artwork/car-sheets/blue-roadster-wreck-side.png
        note: "side crop for body details only; never copy this flat pose, draw the requested camera angle"
      rear:
        ref: artwork/car-sheets/blue-roadster-wreck-rear.png
        note: "rear crop showing the crushed back end; details only, draw the requested camera angle"
      interior:
        ref: artwork/car-sheets/red-roadster-interior.png
        note: "interior LAYOUT only (same model): right-hand-drive dashboard, wheel, gauges, gear lever; this car's interior is old, moldy and worn"
      engine:
        ref: artwork/car-sheets/blue-roadster-wreck-engine.png
        note: "the engine bay only: dusty long low four-cylinder, leaves and cat hair, the black plastic timing-belt cover at the FRONT of the engine behind the radiator; details only, draw the requested camera angle"
    rules:
      - "RIGHT-HAND DRIVE (Japanese market): the steering wheel and the driver's seat are on the car's RIGHT side; the torn roof is above the LEFT (passenger) seat."
      - "In every side view that shows the driver's door, the car's FRONT points to the RIGHT edge of the panel."
      - "It is a dead wreck sitting in waist-high weeds: never shiny, never moving, never red and never undamaged."

