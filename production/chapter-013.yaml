  - pos: upper-left
    action: "Ishiguro straightening up, dry."
    cast: [ishiguro]
    dialogue:
    - ishiguro: WIRING FIRE. UNDER THE DASH. THE MAN GOT OUT ALL RIGHT.
  - pos: middle, wide
    action: "Ishiguro counting a folded banknote with his thumb, a pencil behind each ear."
    cast: [ishiguro]
    dialogue:
