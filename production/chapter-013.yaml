    - akane: NOW IT MOVES. FIRST. THEN SECOND, ALONG THE FENCE. TWENTY. WHEN YOU'RE LEVEL WITH THE TIRE, BRAKE.

- page: 24
  title: Blip
  location: tanabe-backlot
  time: Sunday about 6:15 a.m., pale dawn, the first sun on the tops of the stacks
  guards:
  - "SEATS: Dai in the RIGHT (driver's) seat, Akane in the LEFT passenger seat. From behind the seats: Dai on the IMAGE RIGHT, Akane on the IMAGE LEFT."
  panels:
  - pos: top-right
    action: "Akane, eyes front again, listing it."
    cast: [akane]
    dialogue:
    - akane: CLUTCH IN. BLIP. INTO FIRST. CLUTCH UP.
    - akane: ON THE BYPASS IT'S FOUR TO THREE. HERE IT'S TWO TO ONE. THE FEET ARE THE SAME.
  - pos: top-left, large
    action: "Bird's-eye of the back lot: an old tire standing on its edge against the tall corrugated fence halfway along; the small red Roadster running along the fence toward it, tracks in the dew."
    cast: [{id: roadster, view: front34, state: headlights_down, camera: "bird's-eye from high above the left-side stacks, the car small, running along the fence from right to left"}]
    captions:
    - SHE'D MOVED LAST WEEK'S OLD TIRE TO THE FENCE, HALFWAY ALONG. I PULLED AWAY, CLEAN, AND WENT INTO SECOND AT THE CORNER.
  - pos: middle-right
    action: "Inside from behind the seats: both heads jerking forward together, motion lines."
    cast: [{<<: *dai_gloves, note: "from behind, on the IMAGE RIGHT behind the wheel"}, {id: akane, note: "from behind, on the IMAGE LEFT"}]
    sfx: [GAKUN]
    captions:
    - I'D FORGOTTEN THE BLIP. THE CAR LURCHED WHEN THE CLUTCH CAME UP, AND BOTH OUR HEADS WENT FORWARD.
  - pos: middle-left
    action: "Akane, one word, not looking at him."
    cast: [akane]
    dialogue:
    - akane: BLIP.
  - pos: lower-right
    action: "Dai gritting his teeth behind the wheel."
    cast: [*dai_gloves]
    dialogue:
    - dai_cut: I KNOW.
  - pos: bottom-left
    action: "Close in the footwell: the side of the foot rolling onto the gas, and the ball of the foot LIFTING off the brake pedal at the same time (a gap under it)."
    cast: [{<<: *dai_gloves, note: "only his right foot"}]
    captions:
    - THE THIRD TIME I GOT THE ORDER RIGHT, AND THE BLIP TOOK MY FOOT OFF THE BRAKE. I FELT THE NOSE RISE AND DIP AGAIN.

- page: 25
  title: You nodded
  location: tanabe-backlot
  time: Sunday about 6:25 a.m., the sun coming up over the crushed cars
  guards:
  - "SEATS: Dai in the RIGHT (driver's) seat, Akane in the LEFT passenger seat."
  - "Fumie (over sixty): short grey hair, white towel round her forehead, cigarette, navy work jacket; she sits on the old yellow forklift."
  panels:
  - pos: top-right
    action: "Akane, straight ahead."
    cast: [akane]
    dialogue:
    - akane: YOU NODDED.
  - pos: top-left
    action: "Dai turning his head, lost."
    cast: [*dai_gloves]
    dialogue:
    - dai_cut: WHAT?
  - pos: middle, wide
    action: "Akane in profile against her side window, looking straight ahead through the windshield, explaining in her flat voice."
    cast: [akane]
    dialogue:
    - akane: THE CAR. IT NODDED. YOUR BRAKE CAME OFF WHEN YOU BLIPPED.
    - akane: THE BRAKE DOESN'T MOVE. ONLY THE SIDE OF THE FOOT.
  - pos: lower-right
    action: "Fumie sitting sideways on the seat of her old forklift at the corner of the lot with a can of coffee, watching, saying nothing."
    cast: [fumie, {id: forklift, camera: "side-on from inside the car across the lot, the forklift small at the corner"}]
    captions:
    - AFTER THAT THE CAR TOLD ME THROUGH THE SEAT BEFORE SHE DID. TANABE-SAN SAT ON THE FORKLIFT WITH HER COFFEE AND DIDN'T SAY ANYTHING THIS TIME.
  - pos: lower-left
    action: "From inside the car past Dai's shoulder: low sun coming up over a stack of crushed sedans straight into the windshield, glare."
    cast: [{<<: *dai_gloves, note: "his shoulder and squinting eye only"}]
    captions:
    - THE SUN GOT UP OVER THE CROWNS, INTO MY EYES ON EVERY RUN ALONG THE FENCE.
  - pos: bottom, wide
    action: "Close in the footwell: the ball of the foot pressing the brake, and the side of the foot rolling onto the gas in one short hard roll."
    cast: [{<<: *dai_gloves, note: "only his right foot"}]
    captions:
    - NEAR THE END, ON A RUN I DIDN'T COUNT, I BRAKED LEVEL WITH THE TIRE AND ROLLED THE SIDE OF MY FOOT ONTO THE GAS, A SHORT HARD ROLL,

- page: 26
  title: All the way home
  location: tanabe-backlot
  time: Sunday about 6:40 a.m., low clear morning sun
  guards:
  - "SEATS: Dai in the RIGHT (driver's) seat, Akane in the LEFT passenger seat."
