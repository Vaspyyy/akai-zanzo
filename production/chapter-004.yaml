        cast: [{id: nobu, note: "only his hand"}]
        captions: ["KAWAMATA N. (17), SHIOMI."]
      - pos: middle-left
        action: Nobu, beaming with pride, holding the magazine.
        cast: [nobu]
        dialogue:
          - nobu: "JUNE. THEY DIDN'T ANSWER IT. BUT THEY PRINTED IT."
      - pos: bottom, wide
        action: >-
          Hotta-sensei at the teacher's desk, marking papers with a red pen
          and fanning himself with the owl fan, not looking up at all.
        cast: [hotta]
        dialogue:
          - hotta: "KAWAMATA. WORKSHEET."

  - page: 9
    title: Honest means slow
    location: classroom
    time: a hot August morning
    continue_from: 8
    panels:
      - pos: top-right
        action: Nobu leaning forward over his desk again, whispering.
        cast: [nobu]
        dialogue:
          - nobu: "SO WHO DID YOU SEE DO IT?"
      - pos: top-left
        action: Dai, eyes on his notebook, answering without turning.
        cast: [dai:summer_school]
        dialogue:
          - dai: "SOMEBODY IN A ROADSTER."
      - pos: middle, wide
        action: >-
          Nobu nearly coming over his desk with excitement, eyes wide, hands
          gripping the desk edge, talking fast.
        cast: [nobu]
        dialogue:
          - nobu: "A EUNOS? 120 PS. THE MAGAZINE SAYS IT'S THE MOST HONEST CAR IN JAPAN."
          - nobu: "HONEST MEANS SLOW."
      - pos: bottom-right
        action: Dai, turning his head a little, quietly certain.
        cast: [dai:summer_school]
        dialogue:
          - dai: "IT BEAT A SILVIA."
      - pos: bottom-left
        action: Nobu counting on his fingers, smug.
        cast: [nobu]
        dialogue:
          - nobu: "A K'S HAS 205 PS. SO EITHER YOU'RE LYING OR..."

  - page: 10
    title: The ghost Roadster
    location: classroom
    time: a hot August morning
    continue_from: 9
    panels:
      - pos: top, wide
        action: >-
          Nobu stops dead mid-sentence, mouth open, staring at Dai as if
          something impossible just happened. Dai in the foreground, back of
          his head.
        cast: [nobu, {id: dai, outfit: summer_school, note: "back of his head only"}]
        dialogue:
          - nobu: "THE HARBOR ONE. THE GHOST ROADSTER."
        captions: ["HE LOOKED AT ME LIKE A VENDING MACHINE THAT HAD JUST DROPPED TWO CANS."]
      - pos: middle, wide
        shot: close-up
        action: Close-up of Dai's face, quiet and serious, eyes under the fringe.
        cast: [dai:summer_school]
        dialogue:
          - dai: "THE AKAI ZANZO."
      - pos: bottom, wide
        action: Nobu grabbing the edge of Dai's desk with both hands, leaning in, thrilled.
        cast: [nobu]
        dialogue:
          - nobu: "A TRUCK DRIVER TOLD MY FATHER. IT BEAT A GT-R ON THE BYPASS,"
          - nobu: "AND UNDER THE BRIDGE THERE WAS NOBODY IN THE DRIVER'S SEAT."

  - page: 11
    title: On the bridge
    location: classroom
    time: a hot August morning
    continue_from: 10
    panels:
      - pos: top-right
        action: Dai, matter-of-fact.
        cast: [dai:summer_school]
        dialogue:
          - dai: "IT WAS A SILVIA. A WHITE S13. AND SOMEBODY WAS DRIVING."
      - pos: top-left
        action: Nobu, challenging.
        cast: [nobu]
        dialogue:
          - nobu: "HOW DO YOU KNOW?"
      - pos: middle, wide
        action: Low angle on Dai, turned in his seat to face Nobu, calm and certain.
        cast: [dai:summer_school]
        dialogue:
          - dai: "I WAS ON THE BRIDGE."
      - pos: bottom-right
        action: Nobu's eyes narrowing, sceptical, arms folded.
        cast: [nobu]
        dialogue:
          - nobu: "EVERYBODY WAS ON THE BRIDGE."
      - pos: bottom-left
        action: Dai, looking straight at him.
        cast: [dai:summer_school]
        dialogue:
          - dai: "I RODE IN IT. LAST NIGHT."

  - page: 12
    title: Funny
    location: classroom
    time: a hot August morning
    continue_from: 11
    panels:
      - pos: top-right
        action: Nobu bursting out laughing, impressed, not believing a word.
        cast: [nobu]
        dialogue:
          - nobu: "OKAY."
      - pos: top-left
        action: Dai, stubborn.
        cast: [dai:summer_school]
        dialogue:
          - dai: "I DID."
      - pos: middle, wide
        action: Nobu grinning, leaning on his elbows.
        cast: [nobu]
        dialogue:
          - nobu: "SURE. WHO DRIVES IT?"
      - pos: bottom-right
        shot: close-up
        action: Close-up of Dai, his mouth half open, then shutting it, eyes sliding away, ears going red.
        cast: [dai:summer_school]
        captions: ["SHE WOULDN'T WANT HER NAME GOING ROUND A RAMEN SHOP WITH THE GYOZA."]
        dialogue:
          - dai: "I'M NOT TELLING YOU THAT."
      - pos: bottom-left
        action: Nobu, delighted, pointing a finger at Dai.
        cast: [nobu]
        dialogue:
          - nobu: "SEE? HAYAMA-KUN. I DIDN'T KNOW YOU WERE FUNNY."

  - page: 13
    title: Come awake
    location: classroom
    time: ten to twelve, a hot August day
    continue_from: 12
    panels:
      - pos: top, wide
        action: >-
          Hotta-sensei at the front reading out marks from a list, towel round
