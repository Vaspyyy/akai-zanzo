# ------------------------------------------------------------------ the roll
- page: 27
  title: We moved
  location: tanabe-backlot
  time: Sunday about 6:44 a.m., clear morning sun
  guards:
  - "INSIDE the red Roadster (right-hand drive): Dai in the RIGHT seat behind the wheel, Akane in the LEFT seat."
  - "Dai: SHORT black hair, grey zip-up jacket, grey-palmed WHITE cotton work gloves. Akane: dark jacket zipped to the chin, black fingerless gloves, low ponytail."
  - "The red Roadster outside: soft top UP, pop-ups DOWN."
  panels:
  - pos: top-right
    action: Dai opening his eyes; beyond the windshield the wall of crushed sedans exactly where it was.
    cast: [*dai_gl]
    captions:
    - THE STACK WAS WHERE IT HAD BEEN. THE CAR WAS LEANING ON MY FOOT, WAITING.
  - pos: top-left
    action: Akane, eyes ahead.
    cast: [*aka]
    dialogue:
    - akane: A LITTLE GAS. UP TO TWO.
    - akane: THEN LET IT UP. SLOWLY.
  - pos: middle-right
