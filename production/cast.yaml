  school_sedan:
    name: the driving-school sedan
    full_name: white 1990s Toyota Corona four-door sedan, Shiomi Driving School car
    traits: >-
      Plain white boxy early-1990s Japanese four-door sedan (Toyota Corona
      type), a small square sign on the roof, the driving school's name painted
      on the front doors as an unreadable stripe. NOT a sports car, NOT a
      roadster.
    rules:
      - "RIGHT-HAND DRIVE: the learner sits on the car's right, the instructor on the left with his own brake pedal."

  roadster:
    name: the red Roadster
    full_name: 1990 Mazda Eunos Roadster (NA, Japanese market), Akane's car
    traits: >-
      Small two-seat convertible, 1990 Mazda Eunos Roadster (NA). Black soft
      top UP. Round pop-up headlights. Silver 14-inch 7-spoke alloy wheels.
      Slightly lowered, otherwise stock: no wing, no body kit, no stickers.
      White Japanese number plate, characters not legible. Immaculate paint
      (drawn in mid-grey screentone, the page is black and white).
    ref: artwork/car-sheets/red-roadster.png
    # Angle-specific crops of the sheet (cast entry `view: front34`). The model copies car poses
    # from its references, so a panel that needs another angle should not get the full sheet with
    # its flat side views. Crop boxes on red-roadster.png (1536x1024):
    #   front34  = 856x430+680+594 (front three-quarter, LEFT flank) stacked over 790x290+0+5 (front, pop-ups up/down)
    #   rear     = 440x305+115+300 (straight rear view; the sheet has no rear three-quarter)
    #   interior = 640x392+0+632 (dashboard from the back seat)
    views:
      front34:
        ref: artwork/car-sheets/red-roadster-front34.png
        note: "front three-quarter and front views only; the three-quarter view shows the LEFT flank, so for a right-flank view draw its mirror angle but keep the steering wheel on the car's RIGHT"
      rear:
        ref: artwork/car-sheets/red-roadster-rear.png
        note: "rear view only: taillights, plate, exhaust, soft top from behind"
      interior:
        ref: artwork/car-sheets/red-roadster-interior.png
        note: "interior only: right-hand-drive dashboard, wheel, gauges, gear lever"
    rules:
      - "RIGHT-HAND DRIVE (Japanese market): the steering wheel and the driver are on the car's RIGHT side."
      - "In every side view where the driver's side is visible, the car's FRONT points to the RIGHT edge of the panel, so we see its right (driver) side."
      - "The fuel door is on the right rear quarter."
    states:
      headlights_up: pop-up headlights UP and lit
      headlights_down: pop-up headlights DOWN (closed, flush with the hood)

  sx180:
    name: the silver 180SX
    full_name: Nissan 180SX (a customer's car, ch4)
    traits: >-
      Silver Nissan 180SX hatchback coupe (early 1990s), POP-UP headlights,
      long sloping nose, fastback hatch, rust bubbling at the rear wheel
      arches, plain stock wheels. Right-hand drive. NOT a Roadster: a bigger
