  - "The young man (about 22): neat SHORT side-parted hair, calm polite face, grey V-neck sweater over a white collar, a metal watch. He sits in the RIGHT-hand driver's seat."
  - "No logos or lettering anywhere on the white car; the floor mat is a plain white paper sheet."
  panels:
  - pos: top-right
    action: "The driver's window of the white coupe down; the neat young man looking up, polite."
    cast: [typer_driver, {id: integra, view: side, camera: "close on the open driver's window from outside, the car's right side"}]
    dialogue:
    - typer_driver: GOOD EVENING. HIGH-OCTANE, PLEASE. FULL.
  - pos: top-left
    action: "Dai at the rear of the car with the nozzle in, looking along the flawless flank to the tall wing."
    cast: [*dai_bare, {id: integra, view: rear, camera: "close rear three-quarter from behind-RIGHT, the tall wing and taillights, Dai at the filler"}]
    captions:
    - NOT A CHIP ON THE PAINT, NOT EVEN ALONG THE NOSE. AT THE BACK, IN RED, TYPE R.
  - pos: middle, wide
    action: "Inside the car, low in the driver's footwell: a sheet of plain white paper still lying on the new carpet under the pedals, scuffed grey at the heel where his right foot rests."
    captions:
