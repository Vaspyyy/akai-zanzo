    - NOBU DIDN'T SAY ANYTHING. THAT WAS HOW I KNEW. I'D NEVER HEARD HIM NOT SAY ANYTHING FOR THIS LONG.
  - pos: upper-right
    action: "Looking down through the big tear in the grey soft top: the striped cat on the passenger seat staring straight up at us."
    cast: [cat]
    captions:
    - HE LOOKED IN THROUGH THE TEAR IN THE TOP. THE CAT LOOKED BACK AT HIM FROM THE PASSENGER SEAT.
  - pos: upper-left, large
    action: "Nobu crouched by the driver's door rubbing the faded paint with his thumb, the color coming back darker for a moment, his face reverent."
    cast: [*nobu_gak]
