- page: 39
  title: Where's the top?
  location: kawamata-ramen
  time: Monday about 7:30 p.m., then 8 p.m. on the canal, then Tuesday morning at school
  continue_from: 38
  guards:
  - "Nobu (17): round face, BUZZ CUT, stocky; black gakuran."
  panels:
  - pos: top-right
    action: "Nobu opening a math textbook on the counter between the bowls, at a page with a hump-shaped curve drawn on it."
    cast: [*nobu_gak]
    dialogue:
    - nobu: MIDTERM TOMORROW. FIRST THING. YOU DON'T KNOW ANY OF IT. HALF OF IT'S THE PARABOLA.
  - pos: top-left
    action: "Nobu drawing an arc in the air with a chopstick, enthusiastic."
    cast: [*nobu_gak]
    dialogue:
    - nobu: IT'S A CAR COMING OFF A JUMP. IT GOES UP, IT STOPS GOING UP AT THE TOP, AND IT COMES DOWN THE SAME WAY. ALL YOU HAVE TO FIND IS WHERE THE TOP IS.
  - pos: middle-right
    action: "Dai frowning at the curve in the book."
    cast: [*dai_gak]
    dialogue:
    - dai_cut: WHERE'S THE TOP?
  - pos: middle-left
    action: "Close on a chopstick wrapper and Dai's notebook on the counter covered in little parabolas; the father's cloth wiping the counter round them."
    captions:
    - HE SHOWED ME FOUR TIMES WHILE HIS FATHER WIPED THE COUNTER ROUND US. THE FIFTH TIME I FOUND THE TOP MYSELF.
  - pos: lower, wide
    location: canal-path-night
    action: "Night: Dai walking home alone along the canal path under the street lamps, looking at his red palms."
    cast: [*dai_gak]
    captions:
    - AT EIGHT I WALKED HOME ALONG THE CANAL WITH MY PALMS STILL RED FROM THE FRAME.
  - pos: bottom, wide
    location: classroom
    action: "Tuesday morning, the classroom in exam silence: rows of students bent over test papers; close on Dai's paper with a parabola on it, the top marked, his pencil stopped."
    cast: [*dai_gak]
    captions:
    - THE MIDTERMS WERE TUESDAY TO THURSDAY. IN MATH THERE WAS A PARABOLA ON THE SECOND PAGE. I FOUND THE TOP. I DIDN'T FIND WHERE IT LANDED.

# ================================================================== Thursday 26 Oct: Aya; Friday 2:05 a.m.: the paperback
