# Chapter 5: "Second Term", from scripts/chapter-005.md (novel Vol. 1 Ch. 2).
# Rules for this chapter:
#   - September 1995, still hot: summer school uniform (white short-sleeved shirt), not the gakuran.
#   - Nobody wears shoes indoors on tatami.
#   - Nights are DRY and clear, except p17 (Tuesday midnight: warm rain blowing sideways).
#   - The red Roadster appears only on p23-p30 (Thursday night). Right-hand drive: Akane sits on the
#     car's RIGHT; the fuel door is on the RIGHT rear fender; the gear lever is to her LEFT.
#     The camera stays on the car's RIGHT (driver's) side: Dai on the image LEFT looking right,
#     Akane in the driver's window on the image RIGHT; side views: the car's FRONT points RIGHT.
#   - Every exterior car shot has its own camera angle (table at the end of the script); no car page
#     passes another page with an exterior car shot as a reference.
#   - Dai and Sota shift with the LEFT hand, held low by the hip.
chapter: 5
title: Second Term
lettering: empty
defaults:
  orientation: portrait

pages:
  # ------------------------------------------------------------ Fri 1 Sep: ceremony
  - page: 1
    title: Second Term
    location: school-gym
    time: a quarter to nine on a hot September morning, bright daylight
    notes:
      - "September heat: every student in white short-sleeved summer uniform shirts, sweat-darkened at the back."
    panels:
      - pos: top, wide
        action: >-
          Wide view from the back of the gym: about 800 high-school students
          standing in long straight rows on the basketball lines, all in white
          short-sleeved summer shirts (boys) and white sailor blouses (girls),
          seen from behind. On the stage far away the principal at the
          wooden podium; a big round clock on the wall above the stage; the
          small high windows under the roof propped open on a white-hot sky.
        cast: [principal]
        sfx: [{text: "MIIIN MIN MIN", note: "cicadas, coming in through the high windows"}]
        captions:
          - "SECOND TERM. THE PRINCIPAL TALKED FOR TWENTY-TWO MINUTES."
          - "I KNOW BECAUSE THE CLOCK ABOVE THE STAGE WAS THE ONLY THING I COULD LOOK AT WITHOUT MY EYES CLOSING."
      - pos: middle-right
        action: >-
          In the rows, a schoolgirl has sat down on the floor without meaning
          to, dazed by the heat; two male teachers in short sleeves lift her by
          the elbows and walk her out between the rows. Background students
          only.
      - pos: middle-left
        action: >-
          Dai standing in his row among other boys, eyes half shut, head
          drooping, his white summer shirt stuck to his back with sweat.
        cast: [dai:summer_school]
        captions: ["I'D HAD AN HOUR'S SLEEP. AN HOUR AND FIVE MINUTES, IF YOU COUNT THE PART WHERE I LAY ON MY FUTON DOING THIRD GEAR."]
      - pos: bottom-right
        action: The principal at the wooden podium on the stage, solemn, one finger raised, speaking into a microphone.
        cast: [principal]
        dialogue:
          - principal: "THE EARTHQUAKE IN JANUARY. THE GAS ON THE SUBWAY IN MARCH. A LIFE CAN CHANGE IN ONE MORNING."
          - principal: "THIRD-YEARS, THINK HARD ABOUT WHERE YOU WILL BE STANDING NEXT SEPTEMBER."
      - pos: bottom-left
        action: >-
          Dai sways forward in his row, half asleep, and catches himself up on
          his toes, eyes snapping open; small motion lines. Behind his head, a
          faint dream-like inset (no border) of a steel road guardrail with
          clean new bolts.
        cast: [dai:summer_school]
        captions: ["I THOUGHT ABOUT THE PUMP ISLAND. THEN ABOUT THE OVERPASS, AND THE NEW GUARDRAIL WITH ITS CLEAN BOLTS."]

  - page: 2
    title: Sheets
    location: classroom
    time: late morning, hot September day, bright daylight
    notes:
      - "September heat: summer uniforms, open windows."
    panels:
      - pos: top, wide
        location: school-gym
        action: >-
          In the gym, at the side wall: Hotta-sensei standing with a few other
          teachers (background figures), towel round his neck, owl fan in his
          hand but not moving, just looking steadily across the rows at
          someone off-panel. Rows of students' backs in the foreground.
        cast: [hotta]
        captions: ["HOTTA-SENSEI DIDN'T DO ANYTHING. HE JUST LOOKED AT ME UNTIL I STOOD UP STRAIGHT."]
      - pos: middle, wide
        action: >-
          The classroom: Hotta-sensei sitting at the teacher's desk at the
          front, behind several piles of printed company sheets held with
          paper clips, talking to the class, fanning his neck with the owl fan.
        cast: [hotta]
        dialogue:
          - hotta: "THESE CAME TO THE SCHOOL IN JULY. THE COMPANIES SEND THEM. READ THEM WITH YOUR PARENTS."
          - hotta: "APPLICATIONS GO IN ON TUESDAY. THE FIRST EXAMS ARE ON THE SIXTEENTH."
      - pos: bottom-right
        action: Okuda at his desk holding two printed sheets side by side, one in each hand, looking from one to the other with a sour, undecided face.
        cast: [okuda]
        captions: ["OKUDA GOT A SUPERMARKET AND A BAKERY, AND COULDN'T DECIDE WHICH ONE HE HATED LESS."]
      - pos: bottom-left
        action: The girl with two short braids has turned round in her seat and proudly shows a sheet with a big red stamp to her friend behind her, holding it up with both hands.
        cast: [bank_girl]
        captions: ["THE GIRL IN FRONT GOT A BANK. A BIG ONE. YOU COULD TELL FROM THE STAMP."]

  - page: 3
    title: "148,000"
    location: classroom
    time: late morning, hot September day
    continue_from: 2
    panels:
      - pos: top-right
        action: Hotta-sensei at his desk holding out ONE sheet with a small slip of paper clipped to its corner, saying a name without looking up.
        cast: [hotta]
        dialogue:
          - hotta: "HAYAMA."
      - pos: top-left
        shot: close-up
        action: >-
          Close-up of a single typed company sheet in Dai's hands: neat typed
          lines (shapes only, no readable words), a red company stamp at the
          bottom (drawn as a dark round seal), a small paper slip clipped to
          the corner.
        cast: [{id: dai, outfit: summer_school, note: "only his hands"}]
        captions:
          - "SANKO BRAKE INDUSTRIES, LTD. SHIOMI PLANT. PRODUCTION LINE (BRAKE LININGS)."
          - "STARTING PAY: 148,000 YEN PER MONTH. DORMITORY: YES. START: 1 APRIL 1996."
      - pos: middle-right
        shot: extreme close-up
        action: Extreme close-up of Dai's narrow eyes under his fringe, reading.
        cast: [dai:summer_school]
        captions: ["I READ THE NUMBER TWICE."]
      - pos: middle-left
        shot: close-up
        action: Close-up of Dai's fingers on the desk, counting, the sheet under his other hand.
        cast: [{id: dai, outfit: summer_school, note: "only his hands"}]
        captions: ["KUBO-SAN PAID ME 5,600 A NIGHT. I DID THE DIVISION BEFORE I'D DECIDED TO."]
      - pos: bottom-right
        action: Dai sitting at his desk, sheet in hand, face completely flat, looking at nothing.
        cast: [dai:summer_school]
        captions: ["TWENTY-SIX NIGHTS AND A BIT. I'D NEVER WORKED TWENTY-SIX NIGHTS IN A MONTH. NOBODY HAS."]
      - pos: bottom-left
        action: >-
          The bell: students with bags streaming out of the classroom door,
          going round Dai, who stands by his desk; Hotta-sensei at the
          teacher's desk calls to him.
        cast: [hotta, dai:summer_school]
        dialogue:
          - hotta: "HAYAMA. A MINUTE."
        sfx: [{text: "DING DONG", note: "the school chime, small, near the top"}]

  - page: 4
    title: Your mother did
    location: school-corridor
    time: midday, hard September sun
    notes:
      - "Hotta-sensei and Dai stand by the OPEN corridor window: keep Hotta on the image RIGHT and Dai on the image LEFT in every panel of this page and the next."
    panels:
      - pos: top, wide
        action: >-
          The corridor by an open window. Through it, below, the baseball team
          running laps on the dusty sports ground in the heat with their caps
          on, the coach shouting. Hotta-sensei (right) and Dai (left) small at
          the window, seen from behind.
        cast: [hotta, dai:summer_school]
        sfx: [{text: "ONE! TWO!", note: "small, the coach's shouting from far below"}]
      - pos: middle-right
        action: Hotta-sensei leaning on the window sill, fanning his neck with the owl fan, looking down at the sports ground.
        cast: [hotta]
        dialogue:
          - hotta: "SANKO TAKES FOUR OR FIVE FROM US MOST YEARS. IT'S HOT AND IT'S LOUD, AND THEY PAY ON THE 25TH."
          - hotta: "THE TEST'S ON THE NINETEENTH. WRITTEN IN THE MORNING, INTERVIEW AFTER LUNCH."
      - pos: middle-left
        action: Dai beside the window, the sheet in his hand, guarded.
        cast: [dai:summer_school]
        dialogue:
          - dai: "I DIDN'T SAY I WANTED IT."
      - pos: bottom-right
        shot: close-up
        action: Close on Hotta-sensei, not looking at him, eyes on the sports ground.
        cast: [hotta]
        dialogue:
          - hotta: "NO. YOUR MOTHER DID."
      - pos: bottom-left
        action: Dai turns his head sharply and looks at him; Hotta (at the right edge) just fans his neck. A silent beat.
        cast: [dai:summer_school, hotta]

  - page: 5
    title: Come awake
    location: school-corridor
    time: midday, hard September sun
    continue_from: 4
    notes:
      - "Keep Hotta-sensei on the image RIGHT and Dai on the image LEFT in every panel."
    panels:
      - pos: top-right
        action: Hotta-sensei at the window, fan going.
        cast: [hotta]
        dialogue:
          - hotta: "I PHONED YOUR HOUSE ON WEDNESDAY AFTERNOON. SHE SAID YOU WERE ASLEEP."
      - pos: top-left
        action: Dai, flat.
        cast: [dai:summer_school]
        dialogue:
          - dai: "I WORK NIGHTS."
      - pos: middle, wide
        action: Hotta-sensei lowers the owl fan, then raises it again, looking at Dai levelly.
        cast: [hotta]
        dialogue:
          - hotta: "SHE TOLD ME. SHE ASKED WHAT THEY'D WANT TO KNOW. WHAT YOU SHOULD WEAR."
          - hotta: "I TOLD HER THE TRUTH. YOUR GRADES ARE BAD. YOUR ATTENDANCE IS GOOD, WHICH SURPRISED ME."
      - pos: lower-right
        action: Dai, lower voice, looking away.
        cast: [dai:summer_school]
        dialogue:
          - dai: "AND IF THEY DON'T WANT ME?"
      - pos: lower-left
        action: Hotta-sensei looking out of the window at the sports ground, tired.
        cast: [hotta]
        dialogue:
          - hotta: "THEN THERE'S A CARDBOARD FACTORY ON THE FOURTH OF OCTOBER."
          - hotta: "SOME BOYS COME BACK TO THE GATE IN THE SUMMER AND ASK IF ANYTHING'S COME IN. BY THEN THERE'S NOTHING."
      - pos: bottom, wide
        shot: close-up
        action: >-
          Close-up: the edge of the round owl fan tapping, once, the typed sheet
          held in Dai's hand. Hotta-sensei's face partly visible at the right
          edge, Dai's hand and shirt at the left.
        cast: [hotta, {id: dai, outfit: summer_school, note: "only his hand and shirt"}]
        dialogue:
          - hotta: "COME AWAKE FOR THE NINETEENTH. THAT'S ALL I'M ASKING."
        sfx: [{text: "TAP", note: "small, at the fan's edge"}]

  - page: 6
    title: Thanks, Nobu
    location: school-shoe-lockers
    time: early afternoon, hot September day
    panels:
      - pos: top, wide
        action: >-
          At the shoe lockers: Dai sitting on the low step, changing from indoor
          shoes into his beat-up white canvas sneakers; Nobu standing over him,
          head tilted, reading the Sanko sheet upside down in Dai's lap,
          talking fast.
        cast: [nobu, dai:summer_school]
        dialogue:
          - nobu: "SANKO. BRAKE LININGS. FOR TRUCKS AND DELIVERY VANS. NOBODY PUTS SANKO ON A GT-R."
          - nobu: "BUT EVERY KEI TRUCK IN THIS CITY STOPS BECAUSE OF SANKO."
      - pos: middle-right
        action: Nobu, one finger raised, explaining, eyes bright.
        cast: [nobu]
        dialogue:
          - nobu: "NOBODY WRITES ABOUT IT. THAT'S HOW YOU KNOW IT'S A REAL COMPANY. MY FATHER BUYS THEIR LININGS FOR THE DELIVERY SCOOTER."
      - pos: middle-left
        shot: close-up
        action: Close-up of Dai's hand holding out a fat four-color ballpoint pen.
        cast: [{id: dai, outfit: summer_school, note: "only his hand and wrist"}]
        captions: ["I GAVE HIM HIS PEN BACK. I'D CARRIED IT FOR A WEEK."]
      - pos: bottom-right
        action: Dai, not looking at him, tying a sneaker.
        cast: [dai:summer_school]
        dialogue:
          - dai: "THANKS, NOBU."
      - pos: bottom-left
        action: Nobu frozen with his hand halfway out for the pen, mouth open, staring at Dai, surprised and touched.
        cast: [nobu]
        captions: ["IT CAME OUT BEFORE I'D DECIDED ANYTHING."]

  - page: 7
    title: The knives
    location: school-shoe-lockers
    time: early afternoon, hot September day
    continue_from: 6
    panels:
      - pos: top-right
        action: Nobu holding the pen, looking down at it instead of at Dai, a little embarrassed.
        cast: [nobu]
        dialogue:
          - nobu: "YOU CAN KEEP IT."
      - pos: top-left
        action: Dai standing up, bag on his shoulder.
        cast: [dai:summer_school]
        dialogue:
          - dai: "IT'S YOURS."
      - pos: middle, wide
        action: Nobu tucks the four-color pen into his shirt pocket and pats it, grinning.
        cast: [nobu]
        dialogue:
          - nobu: "I KNOW. IT'S MY ONLY ONE WITH GREEN."
        captions: ["HIS FATHER HAD DECIDED NOBU WAS GOING INTO THE SHOP. NOBU HAD DECIDED HE WAS GOING TO WRITE FOR STREET TUNE IN TOKYO."]
      - pos: bottom-right
        action: Dai walking toward the open glass doors.
        cast: [dai:summer_school]
        dialogue:
          - dai: "WHO WINS?"
      - pos: bottom-left
        action: Nobu holding one of the glass doors open for Dai, the bright yard behind, grinning cheerfully.
        cast: [nobu]
        dialogue:
          - nobu: "MY FATHER. HE'S GOT THE KNIVES."
          - nobu: "BUT THEY PRINTED MY LETTER."

  - page: 8
    title: Driving school
    location: canal-driving-school
    time: mid-afternoon, white summer heat
    notes:
      - "The driving-school cars are plain white boxy four-door sedans. There is NO small roadster or sports car anywhere."
    panels:
      - pos: top, wide
        action: >-
          The concrete footpath along the canal in the white heat: Dai walking
          alone, bag over his shoulder, the loose sole of his right sneaker
          flapping at the toe; heat shimmer.
        cast: [dai:summer_school]
        sfx: [{text: "SLAP", note: "small, at the flapping sole"}]
        captions: ["I WALKED HOME ALONG THE CANAL. THE BUS WAS 160 YEN."]
      - pos: middle, wide
        action: >-
          View through the chain-link fence onto the small practice course:
          painted lane lines, a little crossroads, the short steep slope, the
          working traffic light, the control tower in the middle; four small
          white sedans creeping round the course.
        cast: [{id: school_sedan, camera: "far and high, looking over the fence: four identical sedans tiny on the course, seen from different sides", note: "four of them, all small in the distance"}]
        captions: ["SHIOMI DRIVING SCHOOL. I'D WALKED PAST IT FOR THREE YEARS WITHOUT LOOKING AT IT ONCE."]
      - pos: lower-right
        action: >-
          One white sedan stopped on the steep slope with its hazard lights
          blinking, rolling backward a little, a jolt.
        cast: [{id: school_sedan, camera: "low rear three-quarter view from the foot of the slope, the car above us rolling back toward the camera, its rear and right flank visible, the nose pointing up the slope to the upper left", note: "hazard lights blinking"}]
        sfx: [{text: "KLUNK", note: "the stall"}]
      - pos: lower-left
        action: >-
          Through the sedan's windshield, straight on: the learner at the wheel
          on the RIGHT side of the car (image LEFT) with both hands up by her
          face in panic; the instructor in the left seat (image RIGHT)
          completely still, bored.
        cast:
          - learner
          - instructor
          - {id: school_sedan, camera: "straight-on front view at windshield height, close, the windshield filling the panel", note: "only the windshield, wipers and hood edge"}
      - pos: bottom-right
        shot: close-up
        action: "Close-up inside the car's passenger footwell: the instructor's shoe pressing down on a second brake pedal fitted on the passenger side."
        cast:
          - {id: instructor, note: "only his trouser leg and shoe"}
          - {id: school_sedan, camera: "interior close-up of the passenger-side footwell", note: "only the floor and the extra pedal"}
        captions: ["HE HAD A BRAKE PEDAL OF HIS OWN."]
      - pos: bottom-left
        action: Dai standing at the chain-link fence, fingers hooked in the wire, watching, quietly absorbed.
        cast: [dai:summer_school]
        captions: ["I STOOD THERE UNTIL SHE GOT UP THE HILL. IT TOOK HER FIVE TRIES."]

  # ------------------------------------------------------------ Fri evening: karaage
  - page: 9
    title: Hot oil
    location: hayama-apartment
    time: half past five on a hot September evening, late golden light through the window
    notes:
      - "Nobody wears shoes indoors: bare feet or socks on the tatami."
      - "Mom fries karaage in a deep pot of oil on the gas burner; the kitchen is steamy and hot."
    panels:
      - pos: top, wide
        action: >-
          Dai asleep face-down on the tatami in his white school shirt and
          trousers, one cheek on the mat, his bag beside him; in the
          background the kitchen with steam rising from the stove.
        cast: [dai:summer_school]
        sfx: [{text: "CHIRI CHIRI", note: "oil spitting, from the kitchen"}]
        captions: ["THE SMELL OF HOT OIL WOKE ME AT HALF PAST FIVE. WE DIDN'T FRY THINGS. FRYING MEANT A WHOLE BOTTLE OF OIL AND THE KITCHEN AT FORTY DEGREES."]
      - pos: middle-right
        action: >-
          Mom at the stove with a towel over her shoulder, wet strands of hair
          coming out of her bun, long cooking chopsticks in the bubbling pot.
          In the foreground Sota kneeling at the low table, hands in his lap,
          eyes fixed on the stove.
        cast: [michiko:summer_home, sota]
      - pos: middle-left
        shot: close-up
        action: Close-up of a plate lined with newspaper, piled high with brown, rough, fist-sized pieces of fried chicken (karaage), steam rising.
        captions: ["REAL KARAAGE, BROWN AND ROUGH, THE SIZE OF SOTA'S FIST."]
      - pos: lower-right
        action: Mom pointing the long chopsticks at Dai's school bag; Dai in the doorway, still creased from sleep.
        cast: [michiko:summer_home]
        dialogue:
          - michiko: "HOTTA-SENSEI SAID THERE'D BE A SHEET."
      - pos: lower-left
        action: Mom reading a typed sheet (folded in four, creased) standing at the stove, holding it in one hand and the chopsticks in the other, the oil bubbling behind her, her lips moving.
        cast: [michiko:summer_home]
        captions: ["IT WASN'T A QUESTION. SHE READ THE WHOLE THING. THEN SHE READ IT AGAIN, AND I WATCHED HER LIPS MOVE ON THE NUMBER."]
      - pos: bottom-right
        shot: close-up
        action: Close-up of Mom's hand laying the sheet flat on top of the refrigerator, carefully, where nothing will spill on it.
        cast: [{id: michiko, outfit: summer_home, note: "her hand and part of her face in profile"}]
        dialogue:
          - michiko: {text: "SANKO.", style: small}
      - pos: bottom-left
        action: Mom drops four more pieces into the oil and steps back from the roar, her face turned away.
        cast: [michiko:summer_home]
        sfx: [{text: "JWAAAA", note: "the oil roaring"}]

  - page: 10
    title: Who died?
    location: hayama-apartment
    time: a quarter to six on a hot September evening, late light
    continue_from: 9
    notes:
      - "Nobody wears shoes indoors."
    panels:
      - pos: top, wide
        action: >-
          Aya just in from her shift, a name badge still pinned to her blouse,
          holding an empty styrofoam chicken tray up to the light between two
          fingers by the kitchen bin, eyebrows up.
        cast: [aya:work]
        dialogue:
          - aya: "812 YEN. NO STICKER."
          - aya: "WHO DIED?"
      - pos: middle-right
        action: Mom at the stove, not turning round.
        cast: [michiko:summer_home]
        dialogue:
          - michiko: "NOBODY DIED. WASH YOUR HANDS."
      - pos: middle-left
        action: Sota at the low table, bursting with news, hands on the table.
        cast: [sota]
        dialogue:
          - sota: "SHE SAID MY CICADA BOARD WAS VERY HONEST. NOBODY ELSE HAD ANY I DON'T KNOWS."
      - pos: lower-right
        action: Aya at the sink drying her hands, dry.
        cast: [aya:work]
        dialogue:
          - aya: "EVERYBODY ELSE GUESSED."
      - pos: lower-left
        action: Sota, pleased, nodding.
        cast: [sota]
        dialogue:
          - sota: "THAT'S WHAT SHE SAID."
      - pos: bottom, wide
        action: >-
          The family round the low table, knees touching: bowls of rice, the
          newspaper-lined plate of karaage in the middle, everyone eating;
          the small CRT TV on low shows a weather map with a white typhoon
          spiral south of Japan.
        cast: [michiko:summer_home, aya:work, sota, dai:summer_school]
        captions:
          - "NOBODY REACHED FOR IT. THEN SOTA DID, AND EVERYBODY ELSE DID."
          - "THERE WAS GINGER IN IT. I'D NEVER ASKED WHERE SHE LEARNED ANYTHING."

  - page: 11
    title: Not a company
    location: hayama-apartment
    time: evening, dinner
    continue_from: 10
    notes:
      - "Dinner at the low table: Mom and Dai face each other across it. Keep Mom on the image RIGHT and Dai on the image LEFT in the single shots."
    panels:
      - pos: top-right
        action: Mom, looking down at her rice bowl, saying it to the bowl.
        cast: [michiko:summer_home]
        dialogue:
          - michiko: "148,000."
      - pos: top-left
        action: Mom counting on the tabletop with one finger, the way she counts the bills, looking at Dai.
        cast: [michiko:summer_home]
        dialogue:
          - michiko: "EVERY MONTH. ON THE SAME DAY. WHEN YOU'RE SICK THEY STILL PAY YOU. TWICE A YEAR A BONUS."
          - michiko: "IT'S TWENTY MINUTES ON THE BUS. YOU'D BE HOME BY SIX."
      - pos: middle, wide
        action: Dai not looking up from his bowl, chopsticks still.
        cast: [dai:summer_school]
        dialogue:
          - dai: "I'VE GOT A JOB."
      - pos: bottom-right
        action: Mom putting her chopsticks down on the table, tired and firm.
        cast: [michiko:summer_home]
        dialogue:
          - michiko: "YOU'VE GOT A JOB AT NIGHT THAT PAYS YOU IN AN ENVELOPE. WHEN YOU'RE FORTY IT'LL STILL PAY YOU IN AN ENVELOPE."
          - michiko: "KUBO-SAN IS A GOOD MAN. HE'S NOT A COMPANY."
      - pos: bottom-left
        action: Dai, sullen.
        cast: [dai:summer_school]
        dialogue:
          - dai: "IT'S A TEST. I'M BAD AT TESTS."

  - page: 12
    title: You think I don't know
    location: hayama-apartment
    time: evening, dinner
    continue_from: 11
    notes:
      - "Keep Mom on the image RIGHT and Dai on the image LEFT in the single shots."
    panels:
      - pos: top-right
        action: Mom.
        cast: [michiko:summer_home]
        dialogue:
          - michiko: "YOU PASSED ENGLISH."
      - pos: top-left
        action: Dai.
        cast: [dai:summer_school]
        dialogue:
          - dai: "WITH FORTY-FOUR."
      - pos: middle, wide
        action: Mom looking straight across the table at Dai, quiet and steady, her tired eyes sharp.
        cast: [michiko:summer_home]
        dialogue:
          - michiko: "FORTY IS A PASS. YOU'LL WEAR YOUR UNIFORM. THEY DON'T WANT CLEVER. THEY WANT SOMEONE WHO COMES EVERY DAY."
          - michiko: "FOUR MORNINGS A WEEK YOU COME HOME WITH NO SLEEP AND GO STRAIGHT OUT TO SCHOOL, AND YOU'VE NEVER ONCE BEEN LATE. YOU THINK I DON'T KNOW."
      - pos: bottom-right
        action: Aya with her chopsticks stopped in the air, watching Dai; Sota beside her watching Mom. Silent.
        cast: [aya:work, sota]
      - pos: bottom-left
        shot: close-up
        action: "Close-up on the newspaper on the plate: one last small piece of karaage, burnt dark on one side."

  - page: 13
    title: One week
    location: hayama-apartment
    time: evening, after dinner
    continue_from: 12
    notes:
      - "The wall calendar hangs by the black telephone on a small shelf."
    panels:
      - pos: top-right
        action: Dai, looking down at the table, quiet.
        cast: [dai:summer_school]
        dialogue:
          - dai: "I'LL SIT IT."
      - pos: top-left
        shot: close-up
        action: Close-up of Mom's chopsticks placing the last small burnt piece of karaage in Dai's rice bowl, on top of the rice.
        cast: [{id: michiko, outfit: summer_home, note: "only her hand"}]
      - pos: middle, wide
        action: >-
          Mom at a rice-shop wall calendar beside the phone, writing in one
          date square with a felt pen, her back half turned.
        cast: [michiko:summer_home]
