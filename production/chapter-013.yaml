    - typer_driver: YOU'RE A BAD LIAR, HAYAMA-KUN.
  - pos: middle, wide
    action: "The white coupe pulling out from under the canopy onto the dark harbor road toward the bypass, the wing a sharp shape against the street lamps."
    cast: [{id: integra, view: rear, camera: "high rear three-quarter from behind-LEFT, pulling away onto the road, taillights glowing"}]
