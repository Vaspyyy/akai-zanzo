chapter: 10
title: Nobody Waits Up
lettering: empty
defaults:
  orientation: portrait
  time: late September 1995
  notes:
  - Right-to-left panel order. One speaker per panel. All cars are Japanese models sold by September 1995, right-hand drive.
  - No brand logos, no stickers, no readable signs or printed words anywhere unless a panel asks for them. No Japanese characters.
  - Vary shot sizes and poses; no two panels on the page may look alike.

pages:
# ------------------------------------------------------------------ the ER bay, Tue 26 Sep, 1:54 a.m.
- page: 1
  title: Come in, please
  location: er-bay
  time: Tuesday 1:54 a.m., inside under bright fluorescent light, black night outside the glass doors
  guards:
  - "Dai's FEET: he wears his white canvas SNEAKERS (never socks only, never slippers)."
  - "THE MASK: Sota's mask is a CLEAR, see-through soft PLASTIC nebulizer mask (shaped like an oxygen mask, we see his nose and mouth through it) held by a thin elastic strap, with a small plastic cup hanging under the chin and small holes in the sides that puff thin WHITE MIST; a clear tube runs from it. It is NEVER a paper, cloth or surgical face mask."
  - "The monitor is a small grey box with a little window of green digits; the digits read exactly the number the panel gives (93, 94 or 96), never 888."
  - "Dai has SHORT hair (forehead uncovered), a rumpled white short-sleeved school shirt untucked with a pair of small round glasses folded in the breast pocket, black trousers, white canvas sneakers with the laces UNDONE; a square Band-Aid on the heel of his LEFT palm."
  - "The nurse is Akane (21): white nurse's tunic and trousers, a small watch pinned upside down on her chest, a pen in the breast pocket, her long hair pinned UP in a tight bun, no cap. She is calm and unreadable."
  - "Sota (11) is calm and clinical: a clear plastic nebulizer mask with white mist coming out of its side holes, a clear tube from the mask to the wall, a clip on one finger with a cable; NO glasses on his face. Nothing graphic."
  - The wall clock reads 1:54 (hour hand just short of 2, minute hand on the 11).
  panels:
  - pos: top-right
    action: Close on the nurse standing in the gap of the pale green curtain, her calm eyes on the viewer for a second, then dropping back to the clipboard against her chest, her pen making a small mark.
    cast: [akane:nurse]
    captions:
    - {text: "SHE LOOKED AT ME FOR ABOUT A SECOND. THEN SHE LOOKED BACK DOWN AT THE CLIPBOARD, AND HER PEN MADE A SMALL MARK ON IT.", box: [507, 20, 305, 200], draw: true}
  - pos: top-left
    shot: close-up
    action: "The round white wall clock high on the wall over the row of orange plastic chairs, showing 1:54: the hour hand just short of the 2, the minute hand on the 11."
    captions:
    - THE CLOCK OVER THE ORANGE CHAIRS SAID 1:54.
  - pos: middle-right
    action: The nurse at the curtain gap, flat, looking at the viewer.
    cast: [akane:nurse]
    dialogue:
    - akane: ARE YOU THE FAMILY?
  - pos: middle-left
    action: Dai getting up off the end orange chair, half standing, eyes fixed ahead.
    cast: [dai_cut:summer_school]
    dialogue:
    - dai_cut: HIS BROTHER.
  - pos: lower-right
    action: The nurse holding the green curtain open with one hand, already turning in.
    cast: [akane:nurse]
    dialogue:
    - akane: COME IN, PLEASE.
  - pos: lower-left
    shot: close-up
    action: Dai's legs walking across the shiny floor toward the curtain, his white sneakers with the laces undone and trailing.
    captions:
    - PLEASE. MY LEGS HAD STOPPED SHAKING SOMEWHERE BETWEEN MY BROTHER'S NAME AND THE CLIPBOARD. I ONLY FOUND OUT WHEN I WAS WALKING ON THEM.
  - pos: bottom, wide
    location: er-treatment-bay
    action: "Inside the curtained bay: a high bed with its back raised; a steel stand with a clear bag hanging, not connected yet; a small grey box with a green-digit window on a wall shelf, a cable running to a clip on the boy's finger; the wall behind the bed full of outlets and dials; a clear tube from the wall to a clear plastic nebulizer mask on Sota, who sits folded forward over a pillow on a wheeled table pushed across the bed, arms crossed on the pillow, chin on his arms; thin white mist curling out of the mask's side holes past his ears."
    cast: [sota_ng:pajamas]
    sfx: [SHUUUU]
    captions:
    - BEHIND THE CURTAIN IT WAS SMALLER THAN IT HAD SOUNDED.
  - pos: bottom-left
    location: er-treatment-bay
    action: Sota lifting his head off his arms, trying to sit up; the nurse bending to him with one hand resting lightly on his back, her face gentle.
    cast: [akane:nurse, sota_ng:pajamas]
    dialogue:
    - akane: STAY LIKE THAT. THAT'S THE BEST WAY.

- page: 2
  title: Sit there
  location: er-treatment-bay
  time: about 1:56 a.m., inside under bright fluorescent light
  continue_from: 1
  guards:
  - "Dai's FEET: he wears his white canvas SNEAKERS (never socks only, never slippers)."
  - "THE MASK: Sota's mask is a CLEAR, see-through soft PLASTIC nebulizer mask (shaped like an oxygen mask, we see his nose and mouth through it) held by a thin elastic strap, with a small plastic cup hanging under the chin and small holes in the sides that puff thin WHITE MIST; a clear tube runs from it. It is NEVER a paper, cloth or surgical face mask."
  - "Dai: SHORT hair, rumpled white school shirt with the folded glasses in the breast pocket, laces undone. He stands just inside the curtain until the last panel, where he sits on the round steel stool in the corner."
  - "Akane: white nurse's uniform, upside-down watch, hair pinned up in a tight bun."
  - "The doctor is a tall young man in a white coat, hair flattened at the back from sleeping; he looks nothing like Dai."
  panels:
  - pos: top-right
    action: Dai standing just inside the curtain, staring at the nurse's back as she bends over the bed.
    cast: [dai_cut:summer_school]
    captions:
    - IT WAS TO HIM, NOT ME. IT WAS HER VOICE, BUT SLOWER, AND LOWER, WITH THE ENDS OF THE WORDS LEFT SOFT.
  - pos: top-left
    action: The young doctor at the end of the bed holding up a strip of tablets in a blister pack; an open square biscuit tin full of medicine packets sits on the end of the bed.
    cast: [young_doctor]
    dialogue:
    - young_doctor: THESE. EVERY DAY?
  - pos: middle-right
    action: Dai answering quickly.
    cast: [dai_cut:summer_school]
    dialogue:
    - dai_cut: MORNING AND NIGHT.
  - pos: middle-left
    action: The doctor glancing up from the tablets.
    cast: [young_doctor]
    dialogue:
    - young_doctor: THE LAST ONE?
  - pos: lower-right
    action: Dai, thinking back, precise.
    cast: [dai_cut:summer_school]
    dialogue:
    - dai_cut: {text: "AFTER DINNER. MOM SAID HE'D HAD IT, WHEN SHE LEFT. HALF PAST SEVEN.", box: [563, 785, 225, 290], draw: true, tail: [790, 950]}
  - pos: lower-left
    action: The nurse writing on her clipboard without looking at her hand, while her other hand turns a round dial on the oxygen outlet in the wall.
    cast: [akane:nurse]
    captions:
    - SHE WROTE IT DOWN WITHOUT LOOKING AT HER OWN HAND. THE HISS WENT DOWN HALF A NOTE.
  - pos: bottom-right
    action: Dai, quietly, a step toward her.
    cast: [dai_cut:summer_school]
    dialogue:
    - dai_cut: NATSUME-SAN.
  - pos: bottom-left
    action: The nurse not looking at him, pointing her pen at a round steel stool in the corner beside a steel pedal bin; Dai sitting down on the stool.
    cast: [akane:nurse, dai_cut:summer_school]
    dialogue:
    - akane: SIT THERE, PLEASE.

- page: 3
  title: Eleven
  location: er-treatment-bay
  time: about 2 a.m., inside under bright fluorescent light
  continue_from: 2
  guards:
  - "Dai's FEET: he wears his white canvas SNEAKERS (never socks only, never slippers)."
  - "THE MASK: Sota's mask is a CLEAR, see-through soft PLASTIC nebulizer mask (shaped like an oxygen mask, we see his nose and mouth through it) held by a thin elastic strap, with a small plastic cup hanging under the chin and small holes in the sides that puff thin WHITE MIST; a clear tube runs from it. It is NEVER a paper, cloth or surgical face mask."
  - "Sota sits folded forward over the pillow on the table across the bed, clear plastic nebulizer mask with mist, NO glasses. Calm and clinical."
  - "Akane crouches beside the bed with her face level with Sota's, close, gentle. Hair pinned up, white uniform, the upside-down watch."
  panels:
  - pos: top-right
    shot: extreme close-up
    action: A small round nurse's watch pinned UPSIDE DOWN to the front of a white tunic, beside a pen in the breast pocket.
    captions:
    - SHE HAD A WATCH PINNED TO HER UNIFORM UPSIDE DOWN, SO SHE COULD READ IT LOOKING DOWN.
  - pos: top-left
    action: The nurse crouched by the bed with her face level with Sota's, close, so he doesn't have to turn his head.
    cast: [akane:nurse]
    dialogue:
    - akane: SOTA-KUN. YOU KNOW BIRTHDAY CANDLES?
  - pos: middle-right
    action: The nurse, soft, one finger raised as if holding a candle.
    cast: [akane:nurse]
    dialogue:
    - akane: {text: "BREATHE OUT LIKE YOU'RE BLOWING THEM OUT. SLOWLY. ALL OF THEM, ONE AFTER THE OTHER.", box: [503, 537, 278, 250], draw: true, tail: [785, 640]}
  - pos: middle-left
    shot: close-up
    action: Close on Sota's bare eyes over the misty mask, moving toward her, his lips moving inside the mask.
    cast: [sota_ng:pajamas]
    dialogue:
    - sota_ng: {text: "HOW... MANY?", style: small}
  - pos: lower, wide, large
    shot: close-up
    action: The nurse's face close to the boy's, gentle and calm, the kindest look she has.
    cast: [akane:nurse]
    dialogue:
    - akane: ELEVEN.
  - pos: bottom-right
    action: Sota breathing out slowly; a puff of white mist from the mask's side holes.
    cast: [sota_ng:pajamas]
    sfx: [FUUUU]
  - pos: bottom-left
    action: The nurse's eyes on the upside-down watch on her chest.
    cast: [akane:nurse]
    dialogue:
    - akane: GOOD. AGAIN.

- page: 4
  title: Glasses
  location: er-treatment-bay
  time: about 2:05 a.m., inside under bright fluorescent light
  continue_from: 3
  guards:
  - "Dai's FEET: he wears his white canvas SNEAKERS (never socks only, never slippers)."
  - "THE MASK: Sota's mask is a CLEAR, see-through soft PLASTIC nebulizer mask (shaped like an oxygen mask, we see his nose and mouth through it) held by a thin elastic strap, with a small plastic cup hanging under the chin and small holes in the sides that puff thin WHITE MIST; a clear tube runs from it. It is NEVER a paper, cloth or surgical face mask."
  - "The monitor is a small grey box with a little window of green digits; the digits read exactly the number the panel gives (93, 94 or 96), never 888."
  - "Sota has NO glasses in panels 1-3; from panel 4 on he WEARS his round glasses, the lenses fogged white by the mist from the mask."
  - "Dai sits on the round steel stool in the corner; SHORT hair, white school shirt."
  - "The grey box is a small grey monitor on a wall shelf with a small window of green digits: it reads 94."
  panels:
  - pos: top-right
    shot: close-up
    action: Close-up of the nurse's bare hands with short nails holding the boy's thin wrist, her fingertips on the inside of it.
    captions:
    - I'D SEEN HER HANDS DO HEEL-AND-TOE, TWO IN THE MORNING ON THE BYPASS. NOW THEY WERE BARE. SHORT NAILS.
  - pos: top-left
    action: Dai on the round stool in the corner, elbows on his knees, watching the nurse count with her lips shut.
    cast: [dai_cut:summer_school]
    captions:
    - SHE'D HAD A SHIFT. THE THURSDAY SHE DIDN'T COME. THIS WAS THE JOB.
  - pos: middle-right
    action: Sota turning his head on the pillow, finding Dai in the corner.
    cast: [sota_ng:pajamas]
    dialogue:
    - sota_ng: NII-CHAN. GLASSES.
  - pos: middle-left
    action: Dai leaning over the bed, carefully putting the small round glasses on Sota's face over the elastic strap of the mask.
    cast: [dai_cut:summer_school, sota:pajamas]
    captions:
    - I PUT THEM ON HIM, CAREFULLY, OVER THE ELASTIC OF THE MASK.
  - pos: lower-right
    shot: close-up
    action: Close-up of Sota's face in the mask with his round glasses on, both lenses gone WHITE with mist, turned toward the viewer.
    cast: [sota:pajamas]
    captions:
    - THE LENSES WENT WHITE AT ONCE. HE TURNED THEM TOWARD ME ANYWAY.
  - pos: lower-left
    action: The nurse at the wall outlet, not turning round, as Dai's hand reaches toward the glasses.
    cast: [akane:nurse]
    dialogue:
    - akane: LEAVE THEM.
  - pos: bottom, wide
    shot: close-up
    action: "The small grey monitor box on the wall shelf, its little window showing green digits 94; a thin cable runs down to a clip on a small finger."
    sfx: [PI]
    captions:
    - THE GREEN NUMBERS SAID 93. IN THE AMBULANCE IT HAD BEEN 89, THEN 90.
    - WHEN THE NUMBER WENT UP, THE BEEP WENT UP. I HEARD IT CLIMB, AND LOOKED, AND IT SAID 94.

- page: 5
  title: Look at me
  location: er-treatment-bay
  time: about 2:10 a.m., inside under bright fluorescent light
  continue_from: 4
  guards:
  - "Dai's FEET: he wears his white canvas SNEAKERS (never socks only, never slippers)."
  - "THE MASK: Sota's mask is a CLEAR, see-through soft PLASTIC nebulizer mask (shaped like an oxygen mask, we see his nose and mouth through it) held by a thin elastic strap, with a small plastic cup hanging under the chin and small holes in the sides that puff thin WHITE MIST; a clear tube runs from it. It is NEVER a paper, cloth or surgical face mask."
  - "Sota wears his round glasses, lenses fogged white, the clear plastic nebulizer mask on. His LEFT hand is laid flat on a small padded board on this page. Calm and clinical: show hands, the board, a rubber strap, faces. NO needle drawn, NO blood."
  - "The doctor: tall young man in a white coat with a stethoscope, hair flattened at the back."
  panels:
  - pos: top-right
    action: The doctor coming back through the curtain with a small steel tray and a little board the size of a ruler wrapped in white gauze.
    cast: [young_doctor]
    dialogue:
    - young_doctor: A DRIP. IN THE BACK OF YOUR HAND. IT'LL STING, AND THEN IT WON'T.
  - pos: top-left
    shot: close-up
    action: Close-up of the nurse's two hands laying the boy's LEFT hand flat, palm down, on the small gauze-wrapped board.
  - pos: middle-right
    action: The nurse with her face down beside Sota's, close, calm, holding his attention.
    cast: [akane:nurse]
    dialogue:
    - akane: CANDLES. LOOK AT ME, NOT HIM.
  - pos: middle-left
    shot: close-up
    action: Close on the small hand on the board with a rubber strap round the wrist; the doctor's fingers tapping the back of the hand. No needle visible.
    sfx: [{text: "PAN PAN", note: small}]
    captions:
    - THE DOCTOR PUT A RUBBER STRAP ROUND SOTA'S WRIST, SLAPPED THE BACK OF HIS HAND TWICE, AND WENT IN.
  - pos: lower-right
    action: Sota's whole body tight over the pillow, eyes squeezed shut behind the fogged glasses, silent.
    cast: [sota:pajamas]
    captions:
    - SOTA'S WHOLE BODY WENT TIGHT. HE DIDN'T MAKE ANY NOISE.
  - pos: lower-left
    action: The doctor frowning, pressing a small cotton ball on the back of the left hand.
    cast: [young_doctor]
    dialogue:
    - young_doctor: HM.
  - pos: bottom-right
    action: Sota, small, into the mask, eyes down.
    cast: [sota:pajamas]
    dialogue:
    - sota: {text: "SORRY.", style: small}
  - pos: bottom-left
    action: The doctor, matter-of-fact, already reaching for a new strap.
    cast: [young_doctor]
    dialogue:
    - young_doctor: OTHER HAND.

- page: 6
  title: Good boy
  location: er-treatment-bay
  time: about 2:15 a.m., inside under bright fluorescent light
  continue_from: 5
  guards:
  - "Dai's FEET: he wears his white canvas SNEAKERS (never socks only, never slippers)."
  - "THE MASK: Sota's mask is a CLEAR, see-through soft PLASTIC nebulizer mask (shaped like an oxygen mask, we see his nose and mouth through it) held by a thin elastic strap, with a small plastic cup hanging under the chin and small holes in the sides that puff thin WHITE MIST; a clear tube runs from it. It is NEVER a paper, cloth or surgical face mask."
  - "Sota's RIGHT hand now lies taped flat to the small board (the drip goes in the back of the RIGHT hand); his LEFT hand is free, with a small cotton ball taped on its back. Calm and clinical: no needle, no blood."
  - "Sota wears his round glasses, lenses fogged white, the clear plastic nebulizer mask on."
  panels:
  - pos: top-right
    shot: close-up
    action: Close-up of the nurse's hands holding the boy's RIGHT hand flat, palm down, on the board.
    captions:
    - SHE LET GO OF THE LEFT HAND ONLY WHEN SHE HAD THE RIGHT ONE FLAT ON THE BOARD. THE SECOND TIME IT WENT IN.
  - pos: top-left
    action: The nurse writing small labels on three little capped sample tubes standing in a rack, fast.
    cast: [akane:nurse]
    captions:
    - THREE SMALL TUBES. SHE LABELLED THEM FASTER THAN I COULD READ WHAT SHE WROTE.
  - pos: middle, wide
    shot: close-up
    action: "Close-up: the nurse's fingers tearing a strip of white tape off a roll with two fingers and taping the small RIGHT hand flat to the board, a thin clear tube taped along it; at the top of the panel the clear drip chamber under the bag with one drop falling."
    sfx: [{text: "pito", note: small}]
    captions:
    - EVERY STRIP THE SAME LENGTH. ONE DROP. ONE DROP.
  - pos: lower-right
    action: The nurse close to Sota's face, gentle.
    cast: [akane:nurse]
    dialogue:
    - akane: DID YOU BLOW THEM ALL OUT?
  - pos: lower-left
    action: Sota holding up his free LEFT hand, all five fingers spread, a small cotton ball taped on its back; his right hand taped to the board on the pillow.
    cast: [sota:pajamas]
    captions:
    - ALL FIVE FINGERS, AND THEN AGAIN, AND THEN ONE.
  - pos: bottom-right
    action: The nurse, the faintest softening at her mouth.
    cast: [akane:nurse]
    dialogue:
    - akane: GOOD BOY.
  - pos: bottom-left
    action: The nurse, straight-backed and businesslike again, walking past Dai's stool and out through the curtain with the little tubes, not looking at him; Dai on the stool watching her go.
    cast: [akane:nurse, dai_cut:summer_school]
    captions:
    - THEN SHE STOOD UP AND WAS SOMEONE ELSE AGAIN, AND WENT PAST ME, AND DIDN'T LOOK AT ME, ANY MORE THAN SHE LOOKED AT THE BIN.

- page: 7
  title: The next bay
  location: er-treatment-bay
  time: about 2:15 a.m., inside under bright fluorescent light
  continue_from: 6
  guards:
  - "Dai's FEET: he wears his white canvas SNEAKERS (never socks only, never slippers)."
  - "THE MASK: Sota's mask is a CLEAR, see-through soft PLASTIC nebulizer mask (shaped like an oxygen mask, we see his nose and mouth through it) held by a thin elastic strap, with a small plastic cup hanging under the chin and small holes in the sides that puff thin WHITE MIST; a clear tube runs from it. It is NEVER a paper, cloth or surgical face mask."
  - "Dai sits on the round steel stool the whole page; SHORT hair, white school shirt."
  - "Sota wears his round glasses fogged white, the clear plastic nebulizer mask on, his RIGHT hand taped to the board."
  - "The next bay is only seen as shoes and feet under the curtain's bottom edge; no other faces."
  panels:
  - pos: top, wide
    action: Quiet wide view of the bay; Sota folded over the pillow with the mist going up, Dai small on the stool in the corner; nobody else.
    cast: [sota:pajamas, dai_cut:summer_school]
    sfx: [SHUUUU]
    captions:
    - FOR A WHILE THEN IT WAS ONLY SOTA AND ME AND THE HISS.
  - pos: upper-right
    action: Low view under the bottom edge of the green curtain into the next bay; a man's feet on a bed step, one black business shoe on, the other off, a dark sock with a hole in the heel.
    captions:
    - IN THE NEXT BAY A MAN WAS SINGING TWO LINES OF AN ENKA ABOUT A HARBOR IN THE RAIN, OVER AND OVER. HE KEPT LOSING THE THIRD.
  - pos: upper-left
    action: The same low view under the curtain; a pair of plain, polished black shoes walks in and stands beside the man's feet.
    sfx: [{text: "ZZT", note: small}]
    captions:
    - THEN OTHER SHOES CAME. BLACK, PLAIN, POLISHED. A RADIO ON SOMEBODY'S BELT CRACKLED AND SAID A NUMBER.
  - pos: middle-right
    action: Dai on the stool, his back suddenly bolt upright, eyes wide, staring at the curtain.
    cast: [dai_cut:summer_school]
    captions:
    - MY BACK HAD GONE STRAIGHT BEFORE I'D THOUGHT ANYTHING. PIER 3, THE CHIT, THE DOORWAY.
    - A BORED YOUNG VOICE ASKED HIS NAME. HE GAVE THE NAME OF A SHIP. I MADE MY BACK GO ROUND AGAIN. IT TOOK A WHILE.
  - pos: middle-left
    action: The doctor with his stethoscope disc on Sota's back through the pajamas, listening.
    cast: [young_doctor]
    dialogue:
    - young_doctor: OUT. OUT. OUT.
  - pos: lower-right
    shot: close-up
    action: Close-up of the nurse's thumb snapping the top off a small plastic ampoule over the little cup under the mask; mist thickening.
    sfx: [PAKI]
    dialogue:
    - young_doctor: {text: "MOVING AIR.", offpanel: true}
  - pos: lower-left
    action: Sota turning his head on the pillow toward Dai, mist going up past his white lenses.
    cast: [sota:pajamas]
    dialogue:
    - sota: DID IT... HAVE THE SIREN ON? THE AMBULANCE.
  - pos: bottom-right
    action: Dai on the stool, leaning in.
    cast: [dai_cut:summer_school]
    dialogue:
    - dai_cut: ALL THE WAY.
  - pos: bottom-left
    action: Sota, small and wet-voiced in the mask.
    cast: [sota:pajamas]
    dialogue:
    - sota: {text: "I DIDN'T... HEAR IT.", style: small}

- page: 8
  title: I missed it
  location: er-treatment-bay
  time: about 2:20 a.m., inside under bright fluorescent light
  guards:
  - "Dai's FEET: he wears his white canvas SNEAKERS (never socks only, never slippers)."
  - "THE MASK: Sota's mask is a CLEAR, see-through soft PLASTIC nebulizer mask (shaped like an oxygen mask, we see his nose and mouth through it) held by a thin elastic strap, with a small plastic cup hanging under the chin and small holes in the sides that puff thin WHITE MIST; a clear tube runs from it. It is NEVER a paper, cloth or surgical face mask."
  - "Dai: SHORT hair, rumpled white school shirt (no glasses in the pocket now), laces undone. He sits on the stool in panel 1, then stands at the phone."
  - "Sota wears his round glasses fogged white, the clear plastic nebulizer mask on, RIGHT hand taped to the board."
  - "Aya (20, chin-length bob) is at home in the dim kitchen at night in a grey tank top and long cardigan, holding the receiver of an old black rotary phone."
  panels:
  - pos: top, wide
    action: Dai on the stool, leaning toward the bed, gentle.
    cast: [dai_cut:summer_school]
    dialogue:
    - dai_cut: IT WAS LOUD.
  - pos: upper, large
    action: Big quiet panel of Sota on the pillow, his face in the clear plastic nebulizer mask, the mist going up past his white-fogged round glasses, thinking.
    cast: [sota:pajamas]
    dialogue:
    - sota: I MISSED IT.
  - pos: middle-right
    action: Two men in pale tunics wheeling a mobile X-ray machine with an arm into the bay.
    cast: [xray_tech]
    dialogue:
    - xray_tech: X-RAY. FAMILY OUTSIDE, PLEASE.
    captions:
    - AT ABOUT 2:20.
  - pos: middle-left
    location: er-bay
    action: Dai in the bright corridor in front of a GREEN public payphone fixed on the wall past the orange chairs.
    cast: [dai_cut:summer_school]
    captions:
    - I WAS STANDING IN FRONT OF THE GREEN PHONE BEFORE I KNEW WHY. THEN I KNEW WHY. NOBODY HAD TOLD AYA WHERE.
  - pos: lower-right
    shot: close-up
    action: Close-up of a bronze 10-yen coin going into the coin slot of the green payphone.
    sfx: [CHARIN]
    captions:
    - I HAD 757 YEN. I PUT IN A 10-YEN COIN AND DIALED.
  - pos: lower-left
    location: er-bay
    action: Dai at the green payphone with the receiver at his ear.
    cast: [dai_cut:summer_school]
    dialogue:
    - dai_cut: IT'S ME.
  - pos: bottom-right
    action: Aya at home in the dim night kitchen holding the receiver of an old black rotary phone to her ear, tense.
    cast: [aya:home]
    dialogue:
    - aya: WHERE ARE YOU?
  - pos: bottom-left
    location: er-bay
    action: Dai at the payphone, his forehead almost on the phone.
    cast: [dai_cut:summer_school]
    dialogue:
    - dai_cut: MUNICIPAL.

- page: 9
  title: More
  location: er-bay
  time: about 2:22 a.m.; the ER bright, the Hayama kitchen dim at night
  continue_from: 8
  guards:
  - "Dai's FEET: he wears his white canvas SNEAKERS (never socks only, never slippers)."
  - "Alternating panels: Dai at the GREEN payphone in the bright hospital corridor, and Aya at home in the dim night kitchen at the old black rotary phone. Each panel has only ONE of them."
  - "Dai: SHORT hair, rumpled white school shirt, sneakers with the laces UNDONE. Aya: chin-length bob, grey tank top, long cardigan."
  panels:
  - pos: top-right
    location: hayama-kitchen-night
    action: Aya at the rotary phone on its wall shelf, holding the receiver, her other hand pressed to her chest.
    cast: [aya:home]
    dialogue:
    - aya: I KNOW. MOM RANG THE FIRE DEPARTMENT. SHE'S IN A TAXI. ...IS HE...
  - pos: top-left
