  - pos: middle-right
    action: "Close on Dai's fingertip drawing a streak through the grey dust on the black paint: the dust coming off as a grey film on his finger, the black underneath deep and glossy."
    cast: [{<<: *dai_sun, note: "only his hand"}]
    captions:
    - AN MR2. BLACK. THE DUST CAME OFF ON MY FINGERS IN A GREY FILM, AND UNDER IT THE BLACK WENT DEEP.
  - pos: middle-left
    action: "Dai walking the canvas back along the side of the car that faces him, his face starting to change."
    cast: [*dai_sun]
    captions:
    - I WALKED THE CANVAS BACK ALONG THE SIDE THAT FACED ME. THE RIGHT SIDE. THE DRIVER'S SIDE.
  - pos: bottom, wide
    action: "Close at ground level on the front RIGHT wheel pushed back into its arch and turned in the wrong way, the tire flat and cracked grey; above it the fender creased in two places."
    cast: [{id: mr2, view: front34, camera: "ground-level close on the front RIGHT wheel and fender, from the side"}]
    captions:
