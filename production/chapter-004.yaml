        cast: [nobu, dai:summer_school, {id: magazine_gtr, camera: "printed on the cover: low front three-quarter from the ground, flame from the exhaust", note: "a small printed photo on the magazine cover, not a real car"}]
        dialogue:
          - nobu: "EVERY ISSUE SINCE I WAS THIRTEEN."
        notes: ["The magazine cover has NO readable title text."]
      - pos: middle-right
        shot: close-up
        action: >-
          Close-up: the magazine open near the back at a page of tiny
          unreadable print in columns; Nobu's stubby finger underlines four
