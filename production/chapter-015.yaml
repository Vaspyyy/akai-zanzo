    cast: [{id: mr2, view: side, camera: "eye-level, a flat side view of the RIGHT flank with the FRONT pointing RIGHT, the whole car in frame"}, {<<: *dai_sun, note: "small at the edge, holding the canvas up"}]
    captions:
    - IT WASN'T A DOOR ANY MORE.
    - SOMETHING UPRIGHT, NOT MUCH WIDER THAN ME, HAD GONE INTO THE MIDDLE OF IT, AND THE WHOLE SIDE HAD FOLDED ROUND THAT INTO A DEEP U, FROM THE SILL TO THE ROOF.
  - pos: bottom-right
    action: "Close from slightly above on the bottom of the U fold: the crumpled metal deep enough for an arm up to the elbow, and the sill under it bent up off the ground, weeds underneath."
    cast: [{id: mr2, view: side, camera: "close from slightly above, the bottom of the folded door and the bent sill"}]
    captions:
    - I COULD HAVE PUT MY ARM INTO THE BOTTOM OF THE U UP TO THE ELBOW. THE SILL UNDER IT WAS BENT UP OFF THE GROUND.
  - pos: bottom-left
    action: "Close on the empty window frame: only a fringe of tiny cubes of broken safety glass left in the rubber strip along the bottom; above it the roof kinked."
    cast: [{id: mr2, view: side, camera: "close on the empty window opening, eye-level"}]
    captions:
    - THE WINDOW WAS GONE. ONLY A FRINGE OF LITTLE CUBES OF GLASS WAS LEFT IN THE RUBBER ALONG THE BOTTOM, GREEN AT THE EDGES WHERE THEY'D BROKEN.

- page: 12
  title: The middle of the seat
