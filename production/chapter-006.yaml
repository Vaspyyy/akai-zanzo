    action: Saturday, four a.m. Dai hoses the station forecourt; Kubo sits by the oil rack with coffee.
    cast:
    - dai:station
    - kubo
    captions:
    - AT FOUR ON SATURDAY MORNING THE STATION WAS SO QUIET I COULD HEAR THE PRICE SIGN TICKING AS IT COOLED.
  - pos: middle-right
    action: Water runs toward the drain.
    sfx:
    - HSSSS
  - pos: middle-left
    action: Dai closes the hose tap.
    cast:
    - dai:station
    sfx:
    - KLIK
  - pos: bottom-right
    action: Dai.
    cast:
    - dai:station
    dialogue:
    - dai: KUBO-SAN. THE CARS FROM THE BYPASS. THE SILVIA AND THOSE. WHERE DO THEY GO ON SATURDAYS?
  - pos: bottom-left
    action: Kubo watches the drain.
    cast:
    - kubo
    dialogue:
    - kubo: WHO WANTS TO KNOW.
