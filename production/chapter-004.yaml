        cast: [dai:summer_school]
        sfx: [{text: "SQUEAK", note: "small, at his shoe"}]
        captions: ["SO THAT WAS WHERE NEUTRAL WENT."]

  - page: 16
    title: Feather duster
    location: bookstore
    time: early afternoon
