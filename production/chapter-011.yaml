chapter: 11
title: Eleven
lettering: empty

# Reusable cast entries (YAML anchors). Free-text outfits use the character's default sheet.
x-cast:
  dai_sun: &dai_sun {id: dai_cut, outfit: "grey zip-up jacket half zipped over an old faded white gym T-shirt, worn jeans, beat-up white canvas sneakers; BARE hands"}
  dai_gl: &dai_gl {id: dai_cut, outfit: "grey zip-up jacket half zipped over an old faded white gym T-shirt, worn jeans, beat-up white canvas sneakers; thin WHITE cotton work gloves on both hands"}
  aka: &aka {id: akane, outfit: "dark bomber jacket ZIPPED UP TO THE CHIN, black jeans, flat thin-soled black canvas shoes, black leather driving gloves with the knuckles cut open; long black hair tied back LOW in a ponytail"}
  sota: &sota {id: sota, outfit: "thin striped pajamas with TWO cardigans on top (his own, and a bigger old girl's cardigan with the sleeves turned back), socks, round glasses"}

defaults:
  orientation: portrait
  time: late September 1995
  notes:
  - Right-to-left panel order. One speaker per panel. All cars are Japanese models sold by September 1995, right-hand drive.
  - No brand logos, no stickers, no readable signs or printed words anywhere unless a panel asks for them. No Japanese characters. No banknotes.
  - Vary shot sizes and poses; no two panels on the page may look alike.

pages:
# ------------------------------------------------------------------ Friday 2:15 a.m., the station office
- page: 1
  title: Boys who don't go, ask
  location: harbor-station-night
  time: Friday 2:15 a.m., NIGHT, dry; the small office booth lit by a fluorescent tube, black night outside
  guards:
  - "Dai: SHORT freshly cut black hair (forehead uncovered), grey zip-up station jacket over a black T-shirt, jeans. His LEFT palm has a thin pink healing line, NO bandage, NO Band-Aid."
  - "Kubo: the OLD night attendant with a grey cap and his shirt buttoned up. Inside the office booth: a counter, a ledger sheet, a pencil, an empty coffee can, a small radio."
  panels:
  - pos: top, wide
    action: Inside the small lit office booth at night. Kubo, behind the counter, stands an empty coffee can upright on it. Dai stands in the open office doorway, his hands in his jacket pockets, waiting. Beyond the glass, the dark empty forecourt.
    cast: [kubo, dai_cut:station_jacket]
    dialogue:
    - dai_cut: GLOVES FOR WHAT?
    captions:
    - {text: "A QUARTER PAST TWO ON FRIDAY MORNING. KUBO-SAN FINISHED THE COLD COFFEE, AND I WAS STILL IN THE OFFICE DOOR, WAITING FOR THE REST OF IT.", box: [18, 20, 470, 168], draw: true}
  - pos: upper-right
    action: Kubo behind the counter, not looking up, his face patient and unreadable.
    cast: [kubo]
    dialogue:
    - kubo: SHE DIDN'T SAY.
  - pos: upper-left
    action: Dai in the doorway, frowning.
    cast: [dai_cut:station_jacket]
    dialogue:
    - dai_cut: WHAT DID YOU TELL HER?
  - pos: middle-right
    action: Kubo dropping the empty coffee can into the bin under the counter.
    cast: [kubo]
    dialogue:
    - kubo: WHAT SHE ASKED.
    - kubo: WHERE YOU GO ON SUNDAYS.
  - pos: middle-left
    action: Dai, guarded.
    cast: [dai_cut:station_jacket]
    dialogue:
    - dai_cut: SHE DOESN'T KNOW TANABE'S.
  - pos: lower, wide
    action: Kubo looking straight at Dai for the first time, old lined face, calm eyes under the grey cap.
    cast: [kubo]
    dialogue:
    - kubo: EVERYBODY ROUND HERE WITH A BROKEN CAR KNOWS TANABE'S.
  - pos: lower-right
    action: Dai, quieter, looking at the floor.
    cast: [dai_cut:station_jacket]
    dialogue:
    - dai_cut: DID YOU TELL HER ABOUT PIER 3?
  - pos: lower-left
    action: "Close on Kubo's old hand writing on the ledger sheet with a short pencil: the number 15,000 and a line drawn under it."
    cast: [{id: kubo, note: "only his hand and sleeve, the face out of frame"}]
    dialogue:
    - kubo: YOU ASKED ME WHERE IT WAS.
    - kubo: {text: "THEN YOU NEVER ASKED ME ANYTHING ABOUT IT AGAIN.", box: [16, 1068, 236, 190], draw: true, tail: [200, 1280]}
  - pos: bottom, wide
    action: Kubo putting the pencil down on the counter and looking at Dai, unhurried, almost kind.
    cast: [kubo]
    dialogue:
    - kubo: BOYS WHO DON'T GO, ASK.

# ------------------------------------------------------------------ Friday to Saturday: the 98-yen gloves
- page: 2
  title: 98 yen
  location: harbor-station-night
  time: Friday 2:15 a.m. (top), before dawn (middle), then Saturday 12:30 p.m. in daylight (bottom)
  guards:
  - "Dai: SHORT freshly cut black hair (forehead uncovered). At the station: grey zip-up station jacket. On Saturday: white short-sleeved summer school shirt, untucked, black trousers. His LEFT palm has a thin pink healing line under the thumb, NO bandage, NO Band-Aid."
  - "No banknotes anywhere; only one 100-yen coin."
  panels:
  - pos: top-right
    action: Dai in the office doorway, thinking, not angry.
    cast: [dai_cut:station_jacket]
    dialogue:
    - dai_cut: IS SHE GOING TO TEACH ME?
    captions:
    - SO THAT WAS THE SIX MINUTES BY THE AIR PUMP. I WAITED TO BE ANGRY WITH HIM. IT DIDN'T COME.
  - pos: top-left
    action: Kubo walking away into the back room of the office, his back to us, the radio glowing on a shelf.
    cast: [kubo]
    dialogue:
    - kubo: I DON'T KNOW.
  - pos: middle, wide
    action: "Before dawn under the canopy lights, the sky going grey: Dai alone by the pump island looking down at his open LEFT palm. Close enough to see a thin pink healing line across the heel of the palm under the thumb, a little brown crust at the thumb end; no bandage."
    cast: [dai_cut:station_jacket]
    captions:
    - THE BAND-AID HAD COME OFF IN THE BATH ON WEDNESDAY. THERE WAS A PINK LINE NOW. WHEN I MADE A FIST IT PULLED. BUT IT CLOSED.
  - pos: lower-right
    location: hardware-shop
    action: "Saturday daylight in a covered shopping arcade: Dai in his white summer school shirt walking into the open front of a small old hardware shop (buckets and brooms outside)."
    cast: [dai_cut:summer_school]
    captions:
    - {text: "SATURDAY. SHE'D SAID BRING GLOVES. TANABE-SAN HAD A BOX OF FIFTY, AND I DIDN'T WANT TO TURN UP IN HERS.", box: [668, 1050, 337, 162], draw: true}
  - pos: lower-left
    location: hardware-shop
    action: "The pegboard of work gloves inside the door: stiff yellow leather gloves with a small card reading 780, long black rubber gloves, white cotton work gloves tied in bundles of twelve with string, and next to the bundle ONE pair alone in a small plastic bag with a card reading 98."
    captions:
    - YELLOW LEATHER, 780 YEN. AND NEXT TO THE BUNDLE, ONE PAIR ON ITS OWN IN A PLASTIC BAG. 98 YEN.
  - pos: bottom-right
    action: "Memory inset with a soft dark border, night: a woman's hand in a black leather driving glove with the knuckles cut open, resting on a car's round gear knob. Only the gloved hand and the knob."
    captions:
    - {text: "I THOUGHT ABOUT HERS. BLACK, WITH THE KNUCKLES CUT OUT, GONE SOFT AND SHAPED TO HER FINGERS ON THE LEVER.", box: [554, 1392, 452, 130], draw: true}
  - pos: bottom-left
    location: hardware-shop
    action: "Close on the old wooden shop counter: Dai's hand putting down one silver 100-yen coin; the old shopkeeper's wrinkled hand pushing the little plastic bag of white cotton gloves across to him."
    cast: [{id: dai_cut, outfit: summer_school, note: "only his hand and white shirt cuff"}]
    captions:
    - I BOUGHT THE WHITE ONES. 98 YEN, 100 WITH THE TAX. 487 LEFT.

# ------------------------------------------------------------------ Saturday afternoon at home
- page: 3
  title: How much the bus was
  location: hayama-apartment
  time: Saturday about 1 p.m., daylight through the window
  guards:
  - "Dai: SHORT black hair, white short-sleeved summer school shirt untucked, black trousers, white socks indoors."
  - "Mom (41): tired, hair in a loose low bun, a worn cardigan. Sota (11): round glasses, bowl cut, pajamas with two cardigans on top."
  - "Sota's new inhaler: a small blue inhaler that fits into one end of a long CLEAR plastic spacer tube (about the size of a small bottle) with a mouthpiece at the other end."
  - "The hospital envelope: a long white envelope with a band of printing across the top (not readable)."
  panels:
  - pos: top, wide
    location: danchi-exterior
    action: "Looking up at the old concrete danchi block in afternoon sun: on a fourth-floor balcony a child's blue futon printed with little trains hangs over the rail, airing. Dai small at the bottom by the stairwell, looking up."
    cast: [dai_cut:summer_school]
    captions:
    - I KNEW SOTA WAS HOME BEFORE I GOT TO THE STAIRS. MOM DOES THAT AFTER ANYBODY'S BEEN SICK.
  - pos: upper-right
    action: Mom kneeling at the low table with her household notebook open and a long white hospital envelope beside it; she closes the notebook over the envelope as she looks up at Dai coming in.
    cast: [michiko:home]
    dialogue:
    - michiko: WASH YOUR HANDS. BEFORE YOU GO NEAR HIM.
  - pos: upper-left
    action: Through the open fusuma, in the tatami room, Sota sitting on a cushion by the window in pajamas and two cardigans, small and pale, smiling a little; on the windowsill the blue inhaler in its clear spacer tube and a glasses case, lined up straight.
    cast: [*sota]
    dialogue:
    - sota: NII-CHAN. I'M HOME.
  - pos: middle-right
    action: Dai drying his hands on a towel, standing over the low table, looking down at his mother.
    cast: [dai_cut:summer_school]
    dialogue:
    - dai_cut: HOW MUCH WAS IT?
  - pos: middle-left
    action: Close on Mom's hands doing up the clasp of her worn handbag, the notebook inside it.
    cast: [{id: michiko, outfit: home, note: "only her hands and cardigan sleeves"}]
    dialogue:
    - michiko: IT'S PAID.
  - pos: lower, wide
    action: Mom looking through the open fusuma at Sota, who reads a comic with his lips moving; she keeps her voice down.
    cast: [michiko:home]
    dialogue:
    - michiko: {text: "HE ASKED ME ON THE BUS", box: [562, 1074, 188, 136], draw: true, tail: [640, 1165]}
    - michiko: {text: "IF THE HOSPITAL WAS FREE. HE SAID YOU TOLD HIM IT WAS.", box: [334, 1066, 236, 178], draw: true, tail: [556, 1140]}
  - pos: lower-right
    action: Dai standing with the towel in his hands, silent, looking at the floor.
    cast: [dai_cut:summer_school]
    captions:
    - {text: "SHE KEPT HER VOICE DOWN.", box: [785, 1078, 215, 62], draw: true}
  - pos: lower-left
    action: Mom getting up from the low table with one hand on it, tired.
    cast: [michiko:home]
    dialogue:
    - michiko: I SAID YES.
  - pos: bottom, wide
    action: Close on Mom's tired face, half turned away toward the fusuma, eyes down.
    cast: [michiko:home]
    dialogue:
    - michiko: THEN HE ASKED HOW MUCH THE BUS WAS.

# ------------------------------------------------------------------ Saturday 7 p.m., the inhaler
- page: 4
  title: You can count
  location: hayama-apartment
  time: Saturday 7 p.m., evening, dark outside the window, the ceiling light on
  guards:
  - "Dai: SHORT black hair, rumpled white short-sleeved summer school shirt, black trousers, one sock half off."
  - "Sota (11): round glasses, bowl cut, pajamas with two cardigans on top."
  - "THE INHALER: a small blue inhaler canister that fits into one end of a long CLEAR plastic spacer tube (about the size of a small bottle, two clear halves) with a mouthpiece at the other end. Nothing graphic, calm and ordinary."
  panels:
  - pos: top, wide
    action: Dai asleep on his back on the kitchen tatami in his school clothes, one sock half off; Sota kneeling next to his head, waiting patiently, holding the inhaler and the clear tube in his lap.
    cast: [dai_cut:summer_school, *sota]
    captions:
    - I WAS GONE BEFORE I'D TAKEN THE SECOND SOCK OFF. AT SEVEN SOTA WOKE ME BY SITTING NEXT TO MY HEAD AND WAITING.
  - pos: upper-right
    action: Sota holding up the inhaler and the clear spacer tube, very serious.
    cast: [*sota]
    dialogue:
    - sota: {text: "I HAVE TO DO IT NOW. MORNING AND NIGHT. EVEN WHEN I'M FINE.", box: [770, 436, 232, 215], draw: true, tail: [800, 600]}
  - pos: upper-left
    action: Dai propped up on one elbow on the tatami, sleepy.
    cast: [dai_cut:summer_school]
    dialogue:
    - dai_cut: I KNOW.
  - pos: middle-right
    action: Sota, matter-of-fact.
    cast: [*sota]
    dialogue:
    - sota: YOU CAN COUNT.
  - pos: middle-left
    action: Close on Sota's small hands shaking the blue inhaler hard.
    cast: [{<<: *sota, note: "only his small hands and cardigan cuffs"}]
    sfx: [SHAKA SHAKA]
  - pos: lower-right
    action: Sota with his lips round the mouthpiece of the clear spacer tube, pressing the inhaler on the far end once, breathing in slowly, his eyes on his brother; a tiny flap inside the tube.
    cast: [*sota]
    sfx: [{text: TIK, note: small}]
  - pos: lower-left
    action: Close on Dai's hand held up where Sota can see it, all ten fingers counted out (both hands open).
    cast: [{id: dai_cut, outfit: summer_school, note: "only his two hands and shirt cuffs"}]
    captions:
    - I COUNTED ON MY FINGERS, WHERE HE COULD SEE THEM. HE GOT TO TEN.
  - pos: bottom, wide
    action: Sota breathing out through his nose, already shaking the inhaler again; Dai sitting up beside him.
    cast: [*sota, dai_cut:summer_school]
    dialogue:
    - sota: AGAIN.

# ------------------------------------------------------------------ Saturday night: the cat's names
- page: 5
  title: Its name
  location: hayama-apartment
  time: Saturday evening, ceiling light on (last panel deep night, dark)
  guards:
  - "Dai: SHORT black hair. Sota (11): round glasses, bowl cut, pajamas with two cardigans on top."
  - "The card: a small hospital menu card with a little cartoon drawing of a smiling rice ball at the top."
  panels:
  - pos: top-right
    action: Sota at the kitchen sink, carefully spitting into the middle of the sink after rinsing his mouth, a cup in his hand.
    cast: [*sota]
    dialogue:
    - sota: YOU HAVE TO RINSE. OR YOU GET MOLD IN YOUR MOUTH. THE NURSE SAID.
  - pos: top-left
    action: Sota, sitting back down next to Dai on the tatami, holding out a folded menu card he has taken from his cardigan pocket; the little smiling rice ball drawn at its top.
    cast: [*sota]
    captions:
    - A MENU CARD FROM THE WARD. ON THE BACK, IN PENCIL, IN HIS CAREFUL SQUARE WRITING, THERE WAS A LIST.
  - pos: middle, wide
    action: "Close on the back of the card in Dai's hands: four short lines of careful pencil handwriting, too small to read. A caption box is laid over the writing."
    captions:
    - TORA. CHAIRO. MARU. HANBUN (BECAUSE OF THE TAIL).
  - pos: lower-right
    action: Sota, earnest.
    cast: [*sota]
    dialogue:
    - sota: FOR THE CAT. YOU CAN'T KEEP CALLING IT "THE CAT."
  - pos: lower-left
    action: Dai looking at the card.
    cast: [dai_cut:summer_school]
    dialogue:
    - dai_cut: I DON'T CALL IT ANYTHING.
  - pos: bottom-right
    action: Sota running one finger down the four names on the card in Dai's hand.
    cast: [*sota]
    dialogue:
    - sota: {text: "YOU HAVE TO ASK IT, THOUGH. IT'S ITS NAME.", box: [828, 1102, 178, 240], draw: true, tail: [820, 1250]}
  - pos: bottom-center
    action: Close on Dai's hand putting the folded card into the pocket of a grey zip-up jacket hanging on a hook, next to a small plastic bag of white cotton gloves.
    captions:
    - I PUT IT IN MY JACKET, IN THE POCKET WITH THE GLOVES.
  - pos: bottom-left
    action: Deep night, the dark kitchen; Dai lying on his futon with his eyes open, the refrigerator a dark shape with a faint glow.
    cast: [dai_cut:casual]
    captions:
    - AT THREE I WAS STILL LISTENING TO THE REFRIGERATOR. AT HALF PAST FOUR MOM'S ALARM WENT, AND I WAS ALREADY DRESSED.
    sfx: [{text: JIRIRIRI, note: small, from behind the sliding door}]

# ------------------------------------------------------------------ Sunday 4:30 a.m. to sunrise
- page: 6
  title: Kawamata's?
  location: hayama-apartment
  time: Sunday 4:30 a.m. (dark, kitchen light on) to about 5:45 a.m. sunrise
  guards:
  - "Dai: SHORT black hair, grey zip-up jacket over an old white gym T-shirt, jeans, white sneakers."
  - "Mom: tired, a cardigan, her hair HALF UP, a hair clip."
  panels:
  - pos: top-right
    action: The dark genkan by the steel front door, lit from the kitchen; Dai sitting on the step tying his sneakers; Mom in the kitchen doorway with her hair half up, holding a hair clip.
    cast: [*dai_sun, {id: michiko, outfit: "a worn cardigan over a plain top, loose trousers, her hair HALF pinned up"}]
    dialogue:
    - michiko: {text: "KAWAMATA'S?", box: [662, 22, 205, 112], draw: true, tail: [650, 95]}
  - pos: top-left
    action: Dai not looking up from his laces.
    cast: [*dai_sun]
    dialogue:
    - dai_cut: HIS FATHER DOES THE STOCK EARLY.
  - pos: middle-right
    action: Mom holding the hair clip between her teeth, looking at him a moment longer, talking round it.
    cast: [{id: michiko, outfit: "a worn cardigan over a plain top, her hair HALF pinned up, a hair clip held in her teeth"}]
    dialogue:
    - michiko: TAKE YOUR JACKET.
    - michiko: IT'S GONE COLD.
  - pos: middle-left
    action: Grey-blue first light, no sun yet. Dai walking fast with his hands in his jacket pockets along a narrow lane behind long corrugated fish-market sheds, stacked fish crates.
    cast: [*dai_sun]
    captions:
    - I WENT THE BACK WAY, BEHIND THE FISH-MARKET SHEDS, SO I WOULDN'T PASS KUBO-SAN'S STATION.
  - pos: lower, wide
    action: The tall round grain silos by the harbor; beyond them the sun coming up out of the sea, a bright line on the water; Dai small, walking past at the bottom of the panel.
    cast: [{<<: *dai_sun, note: "tiny figure in the distance"}]
    captions:
    - AT THE SILOS THE SUN CAME UP OUT OF THE WATER.
  - pos: bottom-right
    location: tanabe-yard
    action: Early sun in the scrapyard. Fumie sitting on an upturned crate outside the grey prefab office with a can of coffee, cigarette in her mouth; through the open door behind her a small radio.
    cast: [fumie:work]
    dialogue:
    - fumie: EARLY.
  - pos: bottom-center
    location: tanabe-yard
    action: Dai standing in the yard, a little out of breath.
    cast: [*dai_sun]
    dialogue:
    - dai_cut: {text: "IS SHE HERE?", box: [504, 1160, 142, 132], draw: true, tail: [560, 1300]}
  - pos: bottom-left
    location: tanabe-yard
    action: Fumie drinking from the coffee can, the cigarette moved to the other corner of her mouth to let the can in.
    cast: [fumie:work]
    dialogue:
    - fumie: {text: "IS WHO HERE?", box: [228, 1160, 138, 132], draw: true, tail: [250, 1290]}
    - fumie: {text: "SIT DOWN. THERE'S COFFEE IN THE OFFICE.", box: [14, 1156, 222, 184], draw: true, tail: [150, 1345]}

# ------------------------------------------------------------------ Sunday about 6:00, the cleared back lot
- page: 7
  title: Somebody had cleared it
  location: tanabe-yard
  time: Sunday about 5:55 a.m., clear early morning, low sun, long shadows, dew
  guards:
  - "Dai: SHORT black hair, grey zip-up jacket over an old white gym T-shirt, jeans, white sneakers, hands in his pockets."
  - "No cars on this page except crushed-flat car slabs in stacks."
  panels:
  - pos: top-right
    action: Dai walking past the end of a stack of crushed-flat white sedans, about to look round its corner.
    cast: [*dai_sun]
    captions:
    - {text: "I DIDN'T SIT DOWN. I WALKED AS FAR AS THE END OF THE COROLLA STACKS AND LOOKED ROUND THE CORNER.", box: [655, 14, 358, 128], draw: true}
  - pos: upper, large
    location: tanabe-backlot
    action: "BIG panel: the cleared back lot seen from its near corner, Dai small in the left foreground from behind: the open ground of packed earth and white crushed shell, the long double forklift stripes in the dew; at the far end a new straight wall of crushed-flat sedans four high, white and grey and white; older stacks down the left; the corrugated steel fence down the right; harbor cranes far off against a pale morning sky."
    cast: [{<<: *dai_sun, note: "small, seen from behind in the foreground"}]
    captions:
    - {text: "IT HAD CHANGED SINCE LAST SUNDAY. A WALL OF THEM AT THE FAR END, FOUR HIGH, WHITE AND GREY AND WHITE.", box: [278, 24, 384, 118], draw: true}
  - pos: middle-right
    location: tanabe-backlot
    action: "Low close on the ground, eye level with the weeds: the long double stripes of forklift tires pressed through the dew on the weeds and crushed shell, drops of dew shining."
    captions:
    - {text: "SOMEBODY HAD CLEARED IT. NOT THIS MORNING. THE DEW WAS ON THE STRIPES TOO.", box: [596, 541, 419, 100], draw: true}
  - pos: middle-left
    action: Dai looking back over his shoulder toward the office, puzzled.
    cast: [*dai_sun]
    captions:
    - {text: "I LOOKED AT TANABE-SAN.", box: [8, 546, 243, 89], draw: true}
  - pos: lower-right
    action: Fumie on her crate by the office with her coffee can, not looking at Dai, looking away toward the open yard gate.
    cast: [fumie:work]
    captions:
    - {text: "SHE WAS LOOKING AT THE GATE.", box: [722, 871, 293, 94], draw: true}
  - pos: lower-left
    location: tanabe-office
    action: Close on a small old transistor radio on the office windowsill, its speaker grille.
    sfx: [PI PI PI POOON]
    captions:
    - {text: "AT SIX THE RADIO IN THE OFFICE GAVE THE TIME SIGNAL. ON THE LONG ONE I HEARD IT IN THE LANE.", box: [8, 876, 520, 99]}
  - pos: bottom, wide
    action: The empty lane outside the open yard gate in early sun, white shells and potholes, a long corrugated fence; nothing in it yet, only a faint sound coming.
    sfx: [{text: brrrrrm, note: small and far away}]
    captions:
    - {text: "IT DIDN'T SOUND THE SAME IN DAYLIGHT. IT SOUNDED SMALLER.", box: [8, 1267, 422, 92]}

# ------------------------------------------------------------------ the red car arrives
- page: 8
  title: White on red
  location: tanabe-yard
  time: Sunday 6:00 a.m., clear early morning, low sun, long shadows
  guards:
  - "The red Roadster: right-hand drive, black soft top UP, pop-up headlights DOWN (closed). Each car shot has its own camera angle."
  - "Dai: SHORT black hair, grey zip-up jacket over an old white gym T-shirt, jeans, white sneakers, hands in his pockets."
  panels:
  - pos: top-right
    action: "Ground-level close in the lane outside the gate: a silver 7-spoke alloy wheel of the red car rolling slowly over white shells and potholes, little stones popping out from under the tire. Only the wheel, the tire and the bottom of the red fender."
    sfx: [PACHI PACHI]
    captions:
    - COMING SLOWLY OVER THE SHELLS AND THE POTHOLES, IN FIRST GEAR.
  - pos: upper, wide
    action: The red Roadster coming slowly through the open yard gate in first gear, a little white dust behind it; the yellow crusher and the tire wall beside its path.
    cast:
    - {id: roadster, view: front34, state: headlights_down, camera: "eye level from inside the yard, mid distance, a front three-quarter view of the car's LEFT flank as it rolls through the gate toward us; its nose points toward the lower RIGHT of the panel"}
  - pos: middle-right
    action: The car stopped beside the grey prefab office, engine just switched off.
    cast:
    - {id: roadster, view: front34, state: headlights_down, camera: "HIGH, from the office's outside steel stair, looking steeply down at the car beside the office: we see the black soft-top roof, the windshield and the long hood from above; its nose points toward the lower LEFT corner"}
    sfx: [{text: TIK... TIK, note: small}]
  - pos: middle-left
    action: Close on the car's lower door and sill (the red paint shown as smooth mid-grey tone), a fine film of WHITE dust settling on it.
    captions:
    - THE DUST IT HAD BROUGHT IN OFF THE LANE SETTLED ON ITS SILLS, WHITE ON RED. I WANTED TO WIPE IT OFF.
  - pos: lower-right
    action: Dai standing by the stack of crushed Corollas with his hands pushed deep in his jacket pockets, staring at the car.
    cast: [*dai_sun]
    captions:
    - I KEPT MY HANDS IN MY POCKETS.
  - pos: bottom, wide
    action: "Low close: the car's RIGHT-side (driver's) door swinging open, and a flat thin-soled black canvas shoe stepping down onto the white shells. Only the door, the shoe and the bottom of a black jeans leg."
    cast: [{<<: *aka, note: "only her foot, shoe and jeans leg; face not shown"}]
    captions:
    - SHE GOT OUT.

# ------------------------------------------------------------------ Two years, girl
- page: 9
  title: Two years, girl
  location: tanabe-yard
  time: Sunday 6:00 a.m., clear early morning sun
  guards:
  - "Akane (21): the young WOMAN, long black hair tied back LOW, calm half-lidded eyes; dark bomber jacket ZIPPED to the chin, black jeans, flat black canvas shoes, black fingerless driving gloves."
  - "Fumie (over 60): small, square, white towel round her forehead, cigarette, navy work jacket with rolled sleeves."
  panels:
  - pos: top, large
